function exportCardStats() {
    const stats = loadCardStats();
    const buildModeBucket = (modeBucket) => {
        const out = {};
        Object.entries(modeBucket || {}).forEach(([id, s]) => {
            if (!s || !s.plays) return;
            const def = CARD_DB.find(d => d.id === id);
            out[id] = {
                name: def ? def.name : id,
                cardId: def ? def.cardId : '?',
                faction: def ? def.faction : '?',
                cost: def ? def.cost : null,
                power: def ? def.power : null,
                plays: s.plays,
                wins: s.wins,
                losses: s.plays - s.wins,
                winRate: s.plays > 0 ? +( (s.wins / s.plays) * 100 ).toFixed(2) : null
            };
        });
        return out;
    };
    const buildBucket = (bucket) => {
        const out = {};
        Object.keys(bucket || {}).forEach(modeKey => {
            out[modeKey] = buildModeBucket(bucket[modeKey]);
        });
        return out;
    };
    const payload = {
        exportedAt: new Date().toISOString(),
        version: 2,
        description: '三國風雲 — 卡片勝率統計匯出（依模式分組）',
        note: 'winRate 單位為 %；plays = 出場次數；wins = 該牌打出的陣營贏得該輪的次數。'
            + '結構：{ ai: { "all": {...}, "1v1": {...}, ... }, player: {...} }',
        ai: buildBucket(stats.ai),
        player: buildBucket(stats.player)
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-cardstats-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function copyCardFullText(id) {
    const def = CARD_DB.find(d => d.id === id);
    if (!def) return;
    const text =
        `【三國風雲】${def.name}${def.title ? ' · ' + def.title : ''}\n` +
        `陣營：${FACTION_INFO[def.faction].name}\n` +
        `糧草：${def.cost} ｜ 戰力：${def.power}` +
        (def.count ? ` ｜ 張數：${def.count}` : '') + '\n' +
        `技能：${(def.skills || []).join('、') || '無'}\n` +
        (def.isGeneral ? '★ 上將\n' : '') +
        '──────────────\n' +
        def.desc;

    // 優先使用現代 Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            showCopyToast('✅ 已複製到剪貼簿');
        }).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

/* iOS / 舊瀏覽器備援：用隱藏 textarea + execCommand */
function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        const ok = document.execCommand('copy');
        showCopyToast(ok ? '✅ 已複製到剪貼簿' : '⚠️ 複製失敗，請手動長按選取');
    } catch (e) {
        showCopyToast('⚠️ 複製失敗，請手動長按選取');
    }
    document.body.removeChild(ta);
}

/* 複製成功的小提示 */
function showCopyToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText =
        'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
        'background:rgba(0,0,0,.92);color:#7cff7c;padding:14px 26px;' +
        'border:2px solid #44ff88;border-radius:30px;font-size:15px;' +
        'font-weight:bold;z-index:99999;pointer-events:none;' +
        'box-shadow:0 0 28px rgba(68,255,136,.6);' +
        'animation:copyToastPop .35s ease-out;';
    document.body.appendChild(t);
    setTimeout(() => { try { t.remove(); } catch(e){} }, 1800);
}

/* ==================================================================== */
const NET_ACTION_METHODS = [
    'selectCard','selectField','doPlay','doPass','preEndAct','handoff','nextRound',
    'revealFlip','beginBattle',
    'mulliganRedraw','mulliganSkip','mulliganConfirm',
    'scryToggle','scryConfirm','scrySkip',
    'qhToggle','qhConfirm','qhCancel',
    'lySelect','lyConfirm','lyCancel',
    'jxGuess','jxConfirm','jxSkip',
    'guanyuSelect','guanyuConfirm','guanyuSkip',
    'xunyuSelect','xunyuSelectDest','xunyuConfirm','xunyuSkip',
    'activateJiushi',
    'voteRematch'
];
NET_ACTION_METHODS.forEach(name => {
    const orig = Game.prototype[name];
    if (typeof orig !== 'function') return;
    Game.prototype[name] = function (...args) {
        if (this.netMode && this.role === 'guest' && !this._applyingRemote) {
            if (this._sendAction) this._sendAction({ action: name, args });
            return;
        }
        return orig.apply(this, args);
    };
});

/* ============ Auto-advance turn in net mode ============ */
const _origStartCountdown = Game.prototype.startCountdown;
Game.prototype.startCountdown = function (onDone) {
    if (this.netMode) {
        const wrapped = () => {
            try { onDone(); } catch (e) { console.error(e); }
            if (this.phase === 'turn' && this.state === 'battle') {
                this.advanceTurn();
            }
        };
        _origStartCountdown.call(this, wrapped);
        return;
    }
    return _origStartCountdown.apply(this, arguments);
};

/* ============ Render override: broadcast (host) + wait screen (guest) ============ */
const _origRender = Game.prototype.render;
Game.prototype.render = function () {
    if (this.netMode) this.cover = false;

    // Guest 且還沒收到任何狀態 → 顯示等待
    if (this.netMode && this.role === 'guest' && !this._hasReceivedState && this.state !== 'gameover') {
        if (window.__lobby && window.__lobby.active) {
            renderLobbyOnly();
            return;
        }
        const app = document.getElementById('app');
        if (app) app.innerHTML = `<div class="lobby-screen">
            <h1>三 國 風 雲</h1>
            <div class="sub">線上對戰 — 連線中</div>
            <div class="lobby-waiting"><span class="dot"></span>正在等待房主開始遊戲…</div>
            <button class="btn btn-red" onclick="cancelNet()">取消</button>
        </div>`;
        return;
    }

    // Host 且大廳尚未開始 → 顯示大廳
    if (this.netMode && this.role === 'host' && window.__lobby && !window.__lobby.started) {
        renderLobbyOnly();
        return;
    }

    const r = _origRender.apply(this, arguments);

    // Host 端：每次 render 後，將遊戲狀態廣播給所有 guest
    if (this.netMode && this.role === 'host') {
        if (this._broadcastTimer) clearTimeout(this._broadcastTimer);
        this._broadcastTimer = setTimeout(() => {
            this._broadcastTimer = null;
            try { broadcastGameState(); } catch (e) { console.error(e); }
        }, 40);
    }
    return r;
};

// 大廳狀態（Host 權威）
window.__lobby = null;
// Host 端的所有 peer 連線
window.__peerConns = [];   // [{ conn, peerId, seatIndex, name }]
// Guest 端自己的座位
window.__mySeat = null;
// Guest 端自己的 peer id
window.__myPeerId = null;

function getModeNumPlayers(mode) {
    return (GAME_MODE_DEFS[mode] && GAME_MODE_DEFS[mode].numPlayers) || 2;
}

function initLobby(mode) {
    const n = getModeNumPlayers(mode);
    const slots = [];
    for (let i = 0; i < n; i++) {
        if (i === 0) {
            slots.push({
                type: 'host',
                name: window.__myName || '房主',
                difficulty: null,
                ready: true,
                peerId: peer ? peer.id : null
            });
        } else {
            slots.push({
                type: 'empty',
                name: '空位',
                difficulty: null,
                ready: false,
                peerId: null
            });
        }
    }
    window.__lobby = {
        active: true,
        gameMode: mode,
        chatEnabled: true,
        emojiEnabled: true,
        started: false,
        slots
    };
}

function broadcastLobby() {
    if (!window.__lobby) return;
    const payload = JSON.stringify(window.__lobby);
    window.__peerConns.forEach(pc => {
        if (pc.conn && pc.conn.open) {
            try { pc.conn.send({ type: 'LOBBY_STATE', state: payload }); }
            catch (e) { console.error('[lobby] broadcast fail', e); }
        }
    });
}

/* ---------- Host 操作 ---------- */
function hostChangeMode(mode) {
    if (!window.__lobby) return;
    // Only allowed if all non-host slots are empty
    if (window.__lobby.slots.some((s,i)=>i>0 && s.type !== 'empty')) return;
    const n = getModeNumPlayers(mode);
    const slots = [];
    slots.push({ type: 'host', name: window.__myName || '房主', difficulty: null, ready: true, peerId: peer ? peer.id : null });
    for (let i = 1; i < n; i++) {
        slots.push({ type: 'empty', name: '空位', difficulty: null, ready: false, peerId: null });
    }
    window.__lobby.gameMode = mode;
    window.__lobby.slots = slots;
    broadcastLobby();
    renderLobbyOnly();
}
function hostToggleOption(key, val) {
    if (!window.__lobby) return;
    window.__lobby[key] = !!val;
    broadcastLobby();
    renderLobbyOnly();
}
function hostAddBot(idx, difficulty) {
    if (!window.__lobby || !window.__lobby.slots[idx]) return;
    if (window.__lobby.slots[idx].type !== 'empty') return;
    window.__lobby.slots[idx] = {
        type: 'bot',
        name: '電腦' + (idx + 1),
        difficulty: difficulty || 'medium',
        ready: true,
        peerId: null
    };
    broadcastLobby();
    renderLobbyOnly();
}
function hostSetBotDifficulty(idx, diff) {
    if (!window.__lobby) return;
    const s = window.__lobby.slots[idx];
    if (!s || s.type !== 'bot') return;
    s.difficulty = diff;
    broadcastLobby();
    renderLobbyOnly();
}
function hostClearSlot(idx) {
    if (!window.__lobby) return;
    const s = window.__lobby.slots[idx];
    if (!s || s.type !== 'bot') return;
    window.__lobby.slots[idx] = { type: 'empty', name: '空位', difficulty: null, ready: false, peerId: null };
    broadcastLobby();
    renderLobbyOnly();
}
function hostKickGuest(idx) {
    if (!window.__lobby) return;
    const s = window.__lobby.slots[idx];
    if (!s || s.type !== 'human') return;
    const pc = window.__peerConns.find(x => x.seatIndex === idx);
    if (pc && pc.conn && pc.conn.open) {
        try { pc.conn.send({ type: 'KICKED' }); } catch (e) {}
        try { pc.conn.close(); } catch (e) {}
    }
    window.__peerConns = window.__peerConns.filter(x => x.seatIndex !== idx);
    window.__lobby.slots[idx] = { type: 'empty', name: '空位', difficulty: null, ready: false, peerId: null };
    broadcastLobby();
    renderLobbyOnly();
}

/* ---------- Guest 操作 ---------- */
function guestToggleReady() {
    if (!window.__lobby || window.__mySeat === null) return;
    const s = window.__lobby.slots[window.__mySeat];
    if (!s || s.type !== 'human') return;
    const newReady = !s.ready;
    s.ready = newReady;
    // 通知 host
    if (conn && conn.open) {
        try { conn.send({ type: 'SET_READY', ready: newReady }); } catch (e) {}
    }
    renderLobbyOnly();
}

/* ---------- 渲染大廳 ---------- */
function renderLobbyOnly() {
    const app = document.getElementById('app');
    if (!app) return;
    if (!window.__lobby || !window.__lobby.active) return;
    const isHost = window.__netState && window.__netState.role === 'host';
    // ★ Guest 還沒被分派座位時，先顯示「等待大廳資料…」
    if (!isHost && (window.__mySeat === null || window.__mySeat === undefined)) {
        app.innerHTML = `<div class="lobby-screen" style="text-align:center;">
            <h1>房間邀請中</h1>
            <div class="lobby-waiting"><span class="dot"></span>正在同步房間資訊…</div>
        </div><div id="modal-slot"></div>`;
        return;
    }
    app.innerHTML = (isHost ? renderLobbyHost() : renderLobbyGuest()) + '<div id="modal-slot"></div>';
}

/* ---------- Host 開始遊戲 ---------- */
function hostStartGame() {
    const L = window.__lobby;
    if (!L) return;
    const srcCfg = window.__hostCfg || {};
    // Build playerConfigs
    const playerConfigs = L.slots.map(s => {
        if (s.type === 'host' || s.type === 'human') return { type: 'human' };
        if (s.type === 'bot') return { type: s.difficulty || 'medium' };
        return { type: 'human' };
    });
    const playerNames = L.slots.map(s => s.name || '玩家');

    L.started = true;
    broadcastLobby();

    const hostCfg = {
        mode: 'pvp',
        gameMode: L.gameMode,
        playerConfigs,
        playerNames,
        seed: srcCfg.seed || '',
        cardSets: srcCfg.cardSets || {
            vanilla:  { shu:true, wei:true, wu:true, qun:true },
            extended: { shu:true, wei:true, wu:true, qun:true }
        },
        sendToBottom: !!srcCfg.sendToBottom,
        initialFood : srcCfg.initialFood  ?? 7,
        winBonus    : srcCfg.winBonus     ?? 1,
        baseRefill  : srcCfg.baseRefill   ?? 6,
        initialCards: srcCfg.initialCards ?? 4,
        maxFood     : srcCfg.maxFood      ?? 12,
        aiTrashTalk : false,
        chatEnabled : !!L.chatEnabled,
        emojiEnabled: !!L.emojiEnabled,
        autoExport  : false,
        autoRestart : false,
        netMode: true,
        role: 'host',
        localPlayerIdx: 0
    };

    window.game = new Game(hostCfg);
    setTimeout(() => {
        try { broadcastGameState(); } catch (e) { console.error(e); }
    }, 50);
}

/* 將目前遊戲狀態廣播給所有 guest（依據每個 guest 的座位客製化） */
function broadcastGameState() {
    if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
    window.__peerConns.forEach(pc => {
        if (pc.conn && pc.conn.open && pc.seatIndex !== null && pc.seatIndex !== undefined) {
            try {
                const state = window.game.serializeForPlayer(pc.seatIndex);
                pc.conn.send({ type: 'STATE', state });
            } catch (e) { console.error('[broadcast state]', e); }
        }
    });
}
let peer = null;
let conn = null;

function makeRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
}

function confirmMyName() {
    const input = document.getElementById('cfg-myName');
    const name = (input.value || '').trim();
    if (!name) { alert('請先輸入名稱'); input.focus(); return; }
    window.__myName = name;
    try { localStorage.setItem('sanguo_myname', name); } catch (e) {}
    const status = document.getElementById('cfg-myName-status');
    if (status) status.innerHTML = `<span class="status-ok">✅ 已設定名稱為「${name}」</span>`;
}

function copyRoomCode(code) {
    const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); alert('✅ 已複製房間代碼：' + code); }
        catch (e) { alert('複製失敗，請手動複製：' + code); }
        document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => alert('✅ 已複製房間代碼：' + code)).catch(fallback);
    } else fallback();
}

function readCfgFromSetup() {
    const num = (id, dft) => {
        const el = document.getElementById(id);
        if (!el) return dft;
        const v = parseInt(el.value, 10);
        return isNaN(v) ? dft : v;
    };
    const seedEl = document.getElementById('cfg-seed');
    const seed = seedEl ? (seedEl.value || '').trim() : '';
    const cfg = {
        mode: 'pvp', seed,
        cardSets: readCardSetConfig(),
        sendToBottom: !!(document.getElementById('cfg-sendToBottom') || {}).checked,
        initialFood : num('cfg-initialFood', 7),
        winBonus    : num('cfg-winBonus', 1),
        baseRefill  : num('cfg-baseRefill', 6),
        initialCards: num('cfg-initialCards', 4),
        maxFood     : num('cfg-maxFood', 12),
        aiTrashTalk : document.getElementById('cfg-aiTrashTalk') ? document.getElementById('cfg-aiTrashTalk').checked : true,
        chatEnabled : document.getElementById('cfg-chatEnabled') ? document.getElementById('cfg-chatEnabled').checked : true,
        autoExport  : false,
        autoRestart : false
    };
    if (!validateCardSets(cfg.cardSets)) return null;
    return cfg;
}

function validateCardSets(sets) {
    const hasAny = ['vanilla','extended'].some(s =>
        ['shu','wei','wu','qun'].some(f => sets[s][f])
    );
    if (!hasAny) { alert('至少勾選一張要加入牌庫的卡牌'); return false; }
    return true;
}

function showNetStatus(html) {
    document.getElementById('app').innerHTML = `
        <div class="setup" style="text-align:center;max-width:640px;">
            <h1>三 國 風 雲</h1>
            <div class="sub">線上對戰</div>
            <div style="padding:30px 20px;font-size:15px;line-height:2;color:#e0c080;">${html}</div>
            <button class="btn btn-red" onclick="cancelNet()">取消</button>
        </div>`;
}

function cancelNet() {
    // 若是 guest，禮貌性通知 host
    if (window.__netState && window.__netState.role === 'guest' && conn && conn.open) {
        try { conn.send({ type: 'LEAVE' }); } catch (e) {}
    }
    window.__netState = null;
    window.__lobby = null;
    window.__mySeat = null;
    window.__myPeerId = null;
    window.__peerConns = [];
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    window.game = null;
    showSetup();
}

function rejoinRoom() {
    let info = null;
    try { info = JSON.parse(sessionStorage.getItem('sanguo_rejoin') || 'null'); } catch (e) {}
    if (!info || !info.roomCode) { alert('沒有可重新加入的對戰'); return; }
    const code = info.roomCode;
    window.__netState = { roomCode: code, role: 'guest' };
    showNetStatus(`正在重新連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);
    peer = new Peer({
        debug: 2,
        config: ICE_SERVERS_CONFIG
    });
    peer.on('open', () => { connectToHost(code); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', (err) => {
        console.error(err);
        alert('重新連線失敗：' + err.message + '\n\n（房主可能已經離開，或房間已關閉）');
        cancelNet();
    });
}

function clearRejoinInfo() {
    try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
    showSetup();
}

function createOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const cfg = readCfgFromSetup();
    if (!cfg) return;

    const code = makeRoomCode();
    const peerId = 'sanguo-flash-' + code;
    window.__netState = { roomCode: code, role: 'host' };
    window.__hostCfg = cfg;   // ★ 記住房主的設定，供 hostStartGame 使用
    window.__peerConns = [];

    showNetStatus(`正在建立房間…`);

    peer = new Peer(peerId, { debug: 2, config: ICE_SERVERS_CONFIG });

    peer.on('open', (id) => {
        window.__myPeerId = id;
        // 依照 setup 時選擇的模式初始化大廳
        const initialMode = selectedGameMode || '1v1';
        initLobby(initialMode);
        renderLobbyOnly();
    });
    peer.on('error', (err) => {
        console.error('[net] host error:', err);
        alert('建立房間失敗：' + (err.message || err.type));
        cancelNet();
    });
    peer.on('connection', (c) => {
        attachHostHandlersMulti(c);
    });
    peer.on('disconnected', () => {
        try { peer.reconnect(); } catch (e) {}
    });
}

function joinOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const raw = prompt('請輸入房間代碼：');
    if (!raw) return;
    const code = raw.trim().toUpperCase();
    if (!code) return;
    window.__netState = { roomCode: code, role: 'guest' };
    window.__mySeat = null;

    showNetStatus(`正在連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);

    let connected = false;
    const timeoutId = setTimeout(() => {
        if (connected) return;
        if (window.__lobby && window.__lobby.active) return;
        cancelNet();
        alert('❌ 連線超時（45 秒）\n\n可能原因：房間代碼錯誤、房主已離開、或網路問題。');
    }, 45000);

    peer = new Peer({ debug: 2, config: ICE_SERVERS_CONFIG });
    peer.on('open', (id) => {
        window.__myPeerId = id;
        connectToHost(code);
        connected = true;
        clearTimeout(timeoutId);
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', (err) => {
        clearTimeout(timeoutId);
        const msg = err.type === 'peer-unavailable'
            ? `找不到房間「${code}」`
            : `連線失敗：${err.message || err.type}`;
        cancelNet();
        alert('❌ ' + msg);
    });
}

function attachHostHandlersMulti(c) {
    c.on('open', () => {
        // Guest 已連線，發送歡迎 + 目前大廳狀態
        try { c.send({ type: 'WELCOME' }); } catch (e) {}
        // 立即推大廳狀態
        if (window.__lobby) {
            try { c.send({ type: 'LOBBY_STATE', state: JSON.stringify(window.__lobby) }); } catch (e) {}
        }
    });

    c.on('data', (data) => {
        if (!data || typeof data !== 'object') return;

        if (data.type === 'HELLO') {
            const name = String(data.name || '玩家').slice(0, 12);
            // 找第一個空位
            if (!window.__lobby) {
                try { c.send({ type: 'ROOM_FULL' }); c.close(); } catch (e) {}
                return;
            }
            const idx = window.__lobby.slots.findIndex((s, i) => i > 0 && s.type === 'empty');
            if (idx === -1) {
                try { c.send({ type: 'ROOM_FULL' }); c.close(); } catch (e) {}
                return;
            }
            // 分配座位
            window.__lobby.slots[idx] = {
                type: 'human',
                name,
                difficulty: null,
                ready: false,
                peerId: c.peer
            };
            window.__peerConns.push({ conn: c, peerId: c.peer, seatIndex: idx, name });
            try { c.send({ type: 'YOUR_SEAT', seat: idx }); } catch (e) {}
            broadcastLobby();
            renderLobbyOnly();
            return;
        }

        if (data.type === 'SET_READY') {
            const pc = window.__peerConns.find(x => x.conn === c);
            if (!pc) return;
            const slot = window.__lobby.slots[pc.seatIndex];
            if (!slot || slot.type !== 'human') return;
            slot.ready = !!data.ready;
            broadcastLobby();
            renderLobbyOnly();
            return;
        }

		if (data.type === 'CHAT') {
			const senderSeat = window.__lobby.slots.findIndex(s => s.peerId === c.peer);
			showChatBubble(senderSeat, data.text);
			window.__peerConns.forEach(pc => {
				if (pc.conn !== c && pc.conn.open) {
					try { pc.conn.send({ 
						type: 'CHAT', 
						text: data.text, 
						fromSeat: senderSeat    // ⚠️ 錯！這是收件人的 seat
					}); } catch (e) {}
				}
			});
			return;
		}

        if (data.type === 'ACTION') {
            if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
            const pc = window.__peerConns.find(x => x.conn === c);
            if (!pc) return;
            const g = window.game;
            g._applyingRemote = true;
            g._remotePlayerIdx = pc.seatIndex;
            try {
                const fn = g[data.action];
                if (typeof fn === 'function') fn.apply(g, data.args || []);
            } catch (e) { console.error('Action error:', e); }
            finally { g._applyingRemote = false; g._remotePlayerIdx = undefined; }
            return;
        }

        if (data.type === 'LEAVE') {
            const pc = window.__peerConns.find(x => x.conn === c);
            if (pc && window.__lobby) {
                window.__lobby.slots[pc.seatIndex] = { type: 'empty', name: '空位', difficulty: null, ready: false, peerId: null };
                window.__peerConns = window.__peerConns.filter(x => x !== pc);
                broadcastLobby();
                renderLobbyOnly();
            }
            return;
        }
    });

    c.on('close', () => {
        const pc = window.__peerConns.find(x => x.conn === c);
        if (pc && window.__lobby && !window.__lobby.started) {
            window.__lobby.slots[pc.seatIndex] = { type: 'empty', name: '空位', difficulty: null, ready: false, peerId: null };
            window.__peerConns = window.__peerConns.filter(x => x !== pc);
            broadcastLobby();
            renderLobbyOnly();
        } else if (pc && window.__lobby && window.__lobby.started) {
            // 遊戲中斷線：記錄訊息
            if (window.game) {
                window.game.addLog('sys', `⚠️ ${pc.name} 已離線（該席位改由電腦接管）`);
                // 該席位改為 bot（Host 會自動控制）
                if (window.game.players[pc.seatIndex]) {
                    window.game.players[pc.seatIndex].botType = 'hard';
                }
                window.game.render();
            }
            window.__peerConns = window.__peerConns.filter(x => x !== pc);
        }
    });

    c.on('error', (err) => console.error('Conn error:', err));
}

// 相容舊呼叫
function attachHostHandlers(c, cfg) {
    attachHostHandlersMulti(c);
}

function connectToHost(code) {
    if (!peer || peer.destroyed) return;
    const connOptions = { reliable: true };
    const ua = navigator.userAgent;
    if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) {
        connOptions.serialization = 'json';
    }
    conn = peer.connect('sanguo-flash-' + code, connOptions);

    const connTimeoutId = setTimeout(() => {
        if (!conn || !conn.open) {
            try { if (conn) conn.close(); } catch (e) {}
        }
    }, 15000);

    conn.on('open', () => {
        clearTimeout(connTimeoutId);
        // 送出 HELLO，等待房主分派座位
        try { conn.send({ type: 'HELLO', name: window.__myName || null }); } catch (e) {}
    });
    conn.on('data', handleHostToGuest);
    conn.on('close', () => {
        clearTimeout(connTimeoutId);
        conn = null;
        if (window.game && window.game.netMode && window.__lobby && window.__lobby.started) {
            try {
                window.game.addLog('sys', '⚠️ 與房主連線中斷，嘗試重新連線…');
                window.game.render();
            } catch (e) {}
        }
    });
    conn.on('error', (err) => {
        clearTimeout(connTimeoutId);
        console.error('[net] conn error:', err);
    });
}

function handleGuestToHost(data) {
	// v3.2: 若 game 還沒建立，先暫存名字
	if (data && data.type === 'HELLO' && data.name) {
		window.__guestName = String(data.name).slice(0, 12);
	}
    if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'HELLO') {
        // Guest just (re)connected — update their name if supplied
        if (data.name && window.game && window.game.players[1]) {
            window.game.players[1].name = String(data.name).slice(0, 12);
        }
        // Force sync
        try {
            if (window.game._broadcast) window.game._broadcast(window.game.serializeForPlayer(1));
        } catch (e) { console.error(e); }
        return;
    }
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'ACTION') {
        const g = window.game;
        g._applyingRemote = true;
        g._remotePlayerIdx = 1 - g.localPlayerIdx;   // 1v1: the other side
        try {
            const fn = g[data.action];
            if (typeof fn === 'function') fn.apply(g, data.args || []);
            else console.warn('Unknown action:', data.action);
        } catch (e) { console.error('Action error:', e); }
        finally { g._applyingRemote = false; g._remotePlayerIdx = undefined; }
    }
}

function handleHostToGuest(data) {
    if (!data || typeof data !== 'object') return;

    if (data.type === 'WELCOME') return;

    if (data.type === 'ROOM_FULL') {
        alert('❌ 房間已滿（或所有席位已被佔用）');
        cancelNet();
        return;
    }

    if (data.type === 'KICKED') {
        alert('⚠️ 你已被房主移出房間');
        cancelNet();
        return;
    }

    if (data.type === 'YOUR_SEAT') {
        window.__mySeat = data.seat;
        return;
    }

    if (data.type === 'LOBBY_STATE') {
        try {
            window.__lobby = JSON.parse(data.state);
            renderLobbyOnly();
        } catch (e) { console.error('parse lobby fail', e); }
        return;
    }

    if (data.type === 'CHAT') {
        showChatBubble(data.fromSeat ?? 1, data.text);
        return;
    }

    if (data.type === 'STATE') {
        try {
            if (data.state && data.state.state === 'gameover') {
                try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
            }
            if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
                // 首次收到 STATE → 建立 Guest 端 Game 殼
                const mySeat = data.state.forPlayer ?? window.__mySeat ?? 1;
				const shell = {
					mode: 'pvp',
					gameMode: (window.__lobby && window.__lobby.gameMode) || '1v1',
					playerConfigs: [],
					playerNames: [],
					netMode: true,
					role: 'guest',
					localPlayerIdx: mySeat,
					cardSets: {                           // ← 用安全的預設值
						vanilla:  { shu:true, wei:true, wu:true, qun:true },
						extended: { shu:true, wei:true, wu:true, qun:true }
					},
					sendToBottom: true,
					initialFood: 7, winBonus: 1, baseRefill: 6,
					initialCards: 4, maxFood: 12,
					aiTrashTalk: false,
					chatEnabled: (window.__lobby && window.__lobby.chatEnabled) !== false,
					emojiEnabled: (window.__lobby && window.__lobby.emojiEnabled) !== false,
					autoExport: false, autoRestart: false,
					seed: data.state.seed || ''
				};
                shell._sendAction = (action) => {
                    if (conn && conn.open) {
                        try { conn.send({ type: 'ACTION', ...action }); } catch (e) {}
                    }
                };
                window.game = new Game(shell);
            }
            window.game.applyState(data.state);
        } catch (e) {
            console.error('applyState failed', e);
        }
        return;
    }
}

/* ============ Quick Chat module ===================================== */
/* ==================================================================== */
let chatCooldownUntil = 0;
let chatCooldownTimer = null;

function showChatBubble(pi, text) {
    if (!text) return;
    const posMap = ['blue', 'red', 'green', 'purple'];
    const pos = posMap[pi % posMap.length] || 'blue';
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble chat-bubble-${pos}`;
    bubble.textContent = text;
    document.body.appendChild(bubble);
    setTimeout(() => {
        try { bubble.remove(); } catch (e) {}
    }, 4000);
}

function sendChat(text) {
    if (!window.game) return;
    if (Date.now() < chatCooldownUntil) return;
    const g = window.game;
    if (g.netMode) {
        if (!conn || !conn.open) return;
        const me = g.localPlayerIdx;
        try { conn.send({ type: 'CHAT', text }); } catch (e) { console.error(e); }
        showChatBubble(me, text);
    } else {
        const pi = g.current;
        if (!g.players[pi]) return;
        if (g.isAI(pi)) return;
        showChatBubble(pi, text);
        // 觸發 AI 回應（PvAI 模式）
        g.maybeAIChatResponse(pi, text);
    }
    chatCooldownUntil = Date.now() + 5000;
    updateChatCooldownUI();
}

function updateChatCooldownUI() {
    const btns = document.querySelectorAll('[data-qc]');
    const rem = Math.max(0, Math.ceil((chatCooldownUntil - Date.now()) / 1000));
    const indicator = document.getElementById('qc-cooldown');
    if (rem > 0) {
        btns.forEach(b => { b.disabled = true; });
        if (indicator) indicator.textContent = `⏳ ${rem}s`;
        if (chatCooldownTimer) clearTimeout(chatCooldownTimer);
        chatCooldownTimer = setTimeout(updateChatCooldownUI, 250);
    } else {
        btns.forEach(b => { b.disabled = false; });
        if (indicator) indicator.textContent = '';
        chatCooldownTimer = null;
    }
}

/* Reset cooldown on rematch */
const _origDoRematch = Game.prototype._doRematch;
Game.prototype._doRematch = function () {
    chatCooldownUntil = 0;

/* ============ v3.6: 鍵盤快捷鍵 ================================= */
/* ================================================================ */
(function() {
    function isTyping() {
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }
    function hasBlockingModal() {
        // 卡片檢視 / 觀星 / 權衡 等 modal 開著時禁用快捷鍵
        // 遊戲選單（game-menu-overlay）不算，因為它不阻擋動作
        const overlays = document.querySelectorAll('.overlay');
        for (const o of overlays) {
            if (o.classList.contains('game-menu-overlay')) continue;
            return true;
        }
        return false;
    }
    document.addEventListener('keydown', e => {
        if (isTyping()) return;
        const g = window.game;
        if (!g || g._destroyed) return;
        if (g.state !== 'battle') return;

        // 有 modal 開著：僅允許 Escape 關閉
        if (hasBlockingModal()) {
            if (e.key === 'Escape') {
                const el = document.querySelector('.overlay:not(.game-menu-overlay)');
                if (el) el.remove();
                if (g.inspectCard) g.closeInspect();
            }
            return;
        }

        // ---- preend 階段：Q 放棄、Space 出牌、E 埋伏 ----
        if (g.phase === 'preend') {
            const pep = g.preEndTurn;
            if (pep === undefined || pep === null) return;
            if (g.isAI(pep)) return;
            if (g.preEndPassed && g.preEndPassed[pep]) return;
            if (g.netMode && pep !== g.localPlayerIdx) return;
            if (g.cover || g.countdown !== null) return;
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                g.preEndAct();
                return;
            }
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (g.selected) g.doPlay(false);
                return;
            }
            if (e.key === 'e' || e.key === 'E') {
                if (g.selected) {
                    const pp = g.players[pep];
                    const inst = pp.hand.find(c => c.uid === g.selected);
                    if (inst && g.isPreEndPlayable(inst) && g.canPlayAmbush(inst, pep)) g.doPlay(true);
                }
            }
            return;
        }

        // ---- turn 階段 ----
        if (g.phase !== 'turn') return;
        const pi = g.current;
        if (g.isAI(pi)) return;
        if (g.netMode && pi !== g.localPlayerIdx) return;
        if (g.cover || g.countdown !== null) return;
        const p = g.players[pi];
        if (!p || p.passed) return;

        const playable = p.hand.filter(c => g.canPlayNormally(c, pi) || g.canPlayAmbush(c, pi));

        function navigateCard(dir) {
            if (playable.length === 0) return;
            const curIdx = playable.findIndex(c => c.uid === g.selected);
            let newIdx;
            if (curIdx === -1) newIdx = dir > 0 ? 0 : playable.length - 1;
            else newIdx = curIdx + dir;
            newIdx = ((newIdx % playable.length) + playable.length) % playable.length;
            g.selectCard(playable[newIdx].uid);
        }
        function navigateField(dir) {
            if (!g.selected) return;
            const inst = p.hand.find(c => c.uid === g.selected);
            if (!inst) return;
            const allowed = g.getPlayableFields(inst, pi);
            if (allowed.length <= 1) return;
            const cur = (g.selectedField !== null) ? g.selectedField : g.currentBfIndex;
            const curIdx = allowed.indexOf(cur);
            let newIdx = (curIdx === -1 ? 0 : curIdx + dir);
            newIdx = ((newIdx % allowed.length) + allowed.length) % allowed.length;
            const target = allowed[newIdx];
            g.selectedField = (target === g.currentBfIndex) ? null : target;
            g.render();
        }

        const k = e.key;
        const code = e.code;

        if (code === 'Space' || k === ' ') {
            e.preventDefault();
            if (g.selected) g.doPlay(false);
            return;
        }
        if (k === 'e' || k === 'E') {
            if (g.selected) {
                const inst = p.hand.find(c => c.uid === g.selected);
                if (inst && g.canPlayAmbush(inst, pi)) g.doPlay(true);
            }
            return;
        }
        if (k === 'q' || k === 'Q') {
            e.preventDefault();
            g.doPass();
            return;
        }
        if (k === 'w' || k === 'W' || code === 'ArrowUp') {
            e.preventDefault();
            navigateCard(-1);
            return;
        }
        if (k === 's' || k === 'S' || code === 'ArrowDown') {
            e.preventDefault();
            navigateCard(1);
            return;
        }
        if (k === 'a' || k === 'A' || code === 'ArrowLeft') {
            e.preventDefault();
            navigateField(-1);
            return;
        }
        if (k === 'd' || k === 'D' || code === 'ArrowRight') {
            e.preventDefault();
            navigateField(1);
            return;
        }
    });
})();

            layer.id = LAYER_ID;
            layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;';
            document.body.appendChild(layer);
        }
        return layer;
    }

    function clearParticles() {
        const layer = document.getElementById(LAYER_ID);
        if (layer) layer.innerHTML = '';
        if (currentStyleEl) { currentStyleEl.remove(); currentStyleEl = null; }
    }

    function spawnParticlesForTheme(theme) {
        const cfg = getParticleConfig(theme);
        if (!cfg) { clearParticles(); currentTheme = null; return; }

        clearParticles();
        const layer = ensureLayer();

        // Inject keyframes for this theme only
        const style = document.createElement('style');
        style.textContent = cfg.css;
        document.head.appendChild(style);
        currentStyleEl = style;

        // Spawn all particles in one batch for performance
        const frag = document.createDocumentFragment();
        for (let i = 0; i < cfg.count; i++) {
            const p = document.createElement('span');
            cfg.spawn(p);
            frag.appendChild(p);
        }
        layer.appendChild(frag);
        currentTheme = theme;
    }

    /* ---------- Public refresh ---------- */
    window.__refreshParticles = function () {
        const reduced = document.body.hasAttribute('data-reduced-motion');
        const off = document.body.getAttribute('data-particles') === 'off';
        if (reduced || off) {
            clearParticles();
            currentTheme = null;
            return;
        }
        const t = document.body.getAttribute('data-theme') || 'xuanwu';
        const active = ['red', 'moon', 'bamboo', 'sand'].includes(t) ? t : null;
        if (!active) {
            clearParticles();
            currentTheme = null;
            return;
        }
        if (active === currentTheme) return;   // no change
        spawnParticlesForTheme(active);
    };

    /* ---------- Init ---------- */
    function init() {
        ensureLayer();
        window.__refreshParticles();
        if (observer) observer.disconnect();
        observer = new MutationObserver(() => {
            ensureLayer();
            window.__refreshParticles();
        });
        observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['data-theme', 'data-particles', 'data-reduced-motion']
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

/* ============ 調試：加入手牌 ============ */
function debugAddCardToHand(defId) {
    if (!isDebugMode()) return;
    const g = window.game;
    if (!g) { alert('沒有進行中的遊戲'); return; }
    if (g.state !== 'battle') { alert('遊戲尚未開始或已結束'); return; }
    if (g.netMode && g.role === 'guest') { alert('訪客無法使用調試功能'); return; }

    const def = CARD_DB.find(d => d.id === defId);
    if (!def) return;

    const me = g.netMode ? g.localPlayerIdx : g.current;
    const oppPi = g.opponentOf(me);
    const oppHas = g.players[oppPi].hand.some(c => c.data.id === defId);
    if (oppHas) {
        alert('❌ 這張牌目前在對手手中，無法添加');
        return;
    }

    const inst = g.newInst(def);
    inst.justDrawn = true;
    g.players[me].hand.push(inst);
    g.addLog('sys', `🐛 [調試] 加入 ${def.name} 至 ${g.players[me].name} 手牌`);
    g.render();
    closeViewerInspect();
}

/* 初始化 showSetup 的調試複選框（在載入頁面時同步） */
function _syncDebugCheckbox() {
    const dbg = document.getElementById('cfg-debugMode');
    if (dbg) dbg.checked = isDebugMode();
}

/* ================================================================ */
/* ============ 快速 AI 背景對戰（Debug） ========================== */
/* ================================================================ */
function isFastAiDebug() {
    return safeStore.get('sanguo_fastAiDebug', '0') === '1';
}
function setFastAiDebug(on) {
    safeStore.set('sanguo_fastAiDebug', on ? '1' : '0');
}

function isFastAiRunning() {
    const g = window.game;
    if (!g) return false;
    if (!g._fastAiDebug) return false;
    if (g._destroyed) return false;
    if (g.state === 'gameover') return false;
    return true;
}

function startFastAIBattle() {
    if (isFastAiRunning()) return;
    const cfg = {
        mode: 'local',
        gameMode: selectedGameMode,
        playerConfigs: seatConfigs.map(s => ({ type: 'hard' })),
        seed: '',
        cardSets: readCardSetConfig(),
        sendToBottom: false,
        initialFood: 7,
        winBonus: 1,
        baseRefill: 6,
        initialCards: 4,
        maxFood: 12,
        aiTrashTalk: false,
        chatEnabled: false,
        autoExport: false,
        autoRestart: false,
        fastAIDebug: true
    };
    if (!validateCardSets(cfg.cardSets)) return;
    window.game = new Game(cfg);
    showSetup();
}

function stopFastAIBattle() {
    const g = window.game;
    if (g) {
        try { g.closeGameMenu && g.closeGameMenu(); } catch (e) {}
        try { g.clearAllTimers(); } catch (e) {}
    }
    window.game = null;
    showSetup();
}

function viewFastAIBattle() {
    const g = window.game;
    if (!g) return;
    g._backgroundMode = false;
    // ★ 進入查看模式：把速度降到可點擊的值（避免 UI 刷新太快）
    if (g._fastAiDebug && g.aiSpeed > 10) {
        g._savedAiSpeedForView = g.aiSpeed;
        g.aiSpeed = 2;   // 想更慢可改 1，想更快可改 4
        g.addLog('sys', '👁 查看模式：AI 速度降至 2x（返回背景模式後恢復）');
    }
    g.render();
}

try {
    showSetup();
} catch (err) {
    document.getElementById('app').innerHTML =
        '<div style="color:#ff6060;background:#1a0000;border:2px solid #ff3030;padding:20px;font-family:monospace;font-size:14px;line-height:1.7;margin:20px auto;max-width:900px;white-space:pre-wrap;border-radius:10px;">' +
        '<div style="color:#ffd700;font-size:18px;font-weight:bold;margin-bottom:12px;">🚨 showSetup() threw an error:</div>' +
        'Message: ' + (err && err.message) + '\n\n' +
        'Stack:\n' + (err && err.stack || '(no stack)') +
        '</div>';
    console.error('showSetup failed:', err);
}
</script>
</body>
</html>
