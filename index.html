        // 其次：對最後正面敵軍造成 1 傷害 + 沉默（但傷害會被堅守擋）
        if (fodder.length === 0) {
            const last = this._validLastFaceUpEnemy(enemyPi, bi);
            if (last) {
                // 若最後正面敵軍被堅守保護，傷害被擋、沉默無意義 → 幾乎沒用
                if (this._isJianshouProtected(last, enemyPi, bi)) {
                    score -= 8;
                } else {
                    const tsk = last.data.skills || [];
                    const silenceValue = tsk.filter(s => !LOCKED_SKILLS.includes(s)).length;
                    score += silenceValue * 2 + 2;
                }
            } else {
                score -= 8;   // 完全無目標
            }
        }
        // 蓋牌本身是伏兵 → 加分
        if (d.isAmbush || (d.skills||[]).includes('伏兵')) score += 3;
    }	
    /* 荀彧【驅虎】：對陣 2+ 張時，移 1 張 + 對剩下一張 -1。
       對手場上越擠越值，尤其對手有高戰力或關鍵牌。 */
    if (d.id === 'xunyu') {
        const visCnt = oppFieldNow.filter(c => !c.faceDown).length;
        if (visCnt >= 3) score += 9;        // was 6
        else if (visCnt >= 2) score += 6;   // was 4
        else score -= 5;                    // ★ v3.9：不足 2 張時不觸發，白白浪費
        const hasBigEnemy = oppFieldNow.some(c => !c.faceDown && c.data.power >= 5);
        if (hasBigEnemy) score += 3;
        if (visCnt >= 2) score += 3;
        const hasKeySupport = oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).some(s => ['蜀王','魏王','吳王','建言','督戰'].includes(s)));
        if (hasKeySupport) score += 3;
    }
    /* 荀攸【奇策】：進場後再打 1 張正面 + 補 1 糧。
       手上有可打的好牌 → 大幅加分；手上都是差牌 → 只算基礎。 */
    if (d.id === 'xunyou') {
        const spareAfter = p.food - 2;             // 進場費 2
        const goodFollowup = p.hand.filter(c =>
            !c.data.forceFaceDown &&
            c.data.cost <= spareAfter &&
            c.data.power >= 3).length;
        if (goodFollowup >= 2) score += 8;
        else if (goodFollowup === 1) score += 4;
        // 補 1 糧也是價值
        score += 2;
        // 賽末點時：若能連出 2 張湊足戰力，超值
        if (ctx.mustWinThisRound && goodFollowup >= 1) score += 4;
    }
    /* 曹洪【護衛/鶴翼】：保護己方高價值卡；鶴翼保底 1 戰力。
       己方有 4+ 戰力卡 → 護衛有目標；空場 → 浪費。 */
    if (d.id === 'caohong') {
        const hasTarget = myFieldNow.some(c =>
            c !== null && !c.faceDown && c.data.power >= 4);
        if (hasTarget) score += 5;
        // 鶴翼：面對力竭時保底
        const oppHasLijie = oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).includes('力竭'));
        if (oppHasLijie) score += 3;
        // 自己會被威嚇/烈矢打 → 護衛能替隊友擋
        if (oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).some(s => ['威嚇','烈矢','飛矢'].includes(s)))) {
            score += 3;
        }
    }
    /* ★ v3.5: 程昱【設伏 + 捧日】AI 評分
       捧日只需要「一張高戰力背面牌」就能把程昱基本戰力拉到很高。
       所以程昱要的不是很多背面牌，而是「至少 1 張高戰力」。
       目前場上已有的背面牌最高戰力，直接決定捧日的潛在收益。 */
    if (d.id === 'chengyu') {
        const fdOnField = myFieldNow.filter(c => c.faceDown);

        // ★ 場上已有背面牌 → 看最高戰力
        const highestOnField = fdOnField.length > 0
            ? Math.max(...fdOnField.map(c => c.data.power || 0))
            : 0;
        if (highestOnField >= 6) score += 15;      // 捧日能變 6+ 戰力，超值
        else if (highestOnField >= 4) score += 9;
        else if (highestOnField >= 2) score += 4;

        // ★ 手上有高戰力牌（可埋伏）→ 潛在 combo
        const handHighPower = p.hand.filter(x =>
            x !== c &&
            !x.data.forceFaceDown &&
            !x.data.isGeneral &&
            (x.data.power || 0) >= 4
        ).length;
        if (handHighPower >= 1) score += 6;
        if (handHighPower >= 2) score += 3;

        // 沒高戰力背面牌也沒高戰力手牌 → 捧日完全無用
        if (highestOnField < 4 && handHighPower === 0) score -= 10;

        // 己方已有鐘會/潘璋 → 設伏能觸發 combo
        const hasSynergy = myFieldNow.some(c => !c.faceDown &&
            ['zhonghui','panzhang'].includes(c.data.id));
        if (hasSynergy) score += 4;

        // ★ 粮草承諾檢查（一場只需一張高戰力，但這張要付得起）
        const existingFlipCost = fdOnField.reduce((s, c) => s + c.data.cost, 0);
        const cheapHandFubing = p.hand
            .filter(x => x !== c && !x.data.forceFaceDown && !x.data.isGeneral && x.data.cost >= 1)
            .map(x => ({ cost: x.data.cost, power: x.data.power || 0 }))
            .sort((a, b) => b.power - a.power)   // 高戰力優先
            .slice(0, 1)
            .reduce((s, x) => s + x.cost, 0);
        const foodAfter = p.food - (d.cost || 0);
        if (existingFlipCost + cheapHandFubing > foodAfter) score -= 20;
    }
    /* 李典【忘隙】：前一個友軍 + 下一個友軍各 +1。
       最佳位置：前 1 張、後至少 1 張。補充已有評分。 */
    if (d.id === 'lidian') {
        const prior = myFieldNow.filter(c => !c.faceDown).length;
        const handAfter = p.hand.filter(c =>
            c.data.cost <= p.food &&
            !c.data.forceFaceDown &&
            c.data.cost >= 1).length;
        // 前有 1-2 張、後有 2+ 張 → 完美
        if (prior >= 1 && prior <= 2 && handAfter >= 2) score += 5;
        // 前無、後有 → 只吃一半
        else if (prior === 0 && handAfter >= 2) score += 1;
        // 前有、後無 → 只吃一半
        else if (prior >= 3 && handAfter === 0) score -= 3;
    }
    /* 曹植【酒詩】：累計 7 張後返回手牌 + 補糧。
       屬「拖時間」牌，逆風時無價值，順風時保值。
       已在手牌中時（AI 從手牌出），主動視為「潛在回收」。 */
    if (d.id === 'caozhi') {
        const played = p.cardsPlayedByPlayer || 0;
        if (played >= 7) score += 5;       // 已可回收
        else if (played >= 5) score += 2;  // 接近門檻
        else score -= 3;                   // ★ v3.9：還太早，當填充物只會浪費節奏
        // 己方領先時留著保值
        if (myPow > oppPow + 3) score += 3;
        // 糧草緊張時：酒詩能補糧回來
        if (p.food <= 2) score += 3;
    }		
    /* 若手上有上將，優先出「啟動器」卡 */
    if (!d.isGeneral && !d.forceFaceDown) {
        const handHasGeneral = p.hand.some(x =>
            x !== c && x.data.isGeneral && !x.data.forceFaceDown);
        if (handHasGeneral) {
            const sk = d.skills || [];
            if (sk.includes('放權')) score += 12;      // 劉禪
            if (sk.includes('龍吟')) score += 12;      // 關平
            if (sk.includes('忘隙')) score += 10;      // 李典
            if (sk.includes('護衛')) score += 8;       // 曹洪/周泰
            if (sk.includes('督戰')) score += 8;       // 程普
            if (sk.includes('隱忍')) score += 6;       // 司馬懿
            if (sk.includes('蜀王') || sk.includes('魏王') || sk.includes('吳王')) score += 10;
        }

        /* ★ v3.4.1: 關羽 COMBO — 鋪被動增益，擴大斬將門檻
           若手上有【關羽】，這張增益牌的直接價值 = 讓關羽多斬 1 張牌的機會。
           每 +1 戰力 ≈ 斬將門檻 +1 ≈ 可能多斬一張中大型敵牌。 */
        const hasGuanyuInHand = p.hand.some(x =>
            x !== c && x.data.id === 'guanyu' && !x.data.forceFaceDown);
        if (hasGuanyuInHand) {
            const sk = d.skills || [];
            // 直接給關羽 +1 戰力的牌 → 大幅加分
            if (sk.includes('龍吟')) score += 15;      // 關平：下一張友軍 +1
            if (sk.includes('放權')) score += 10;      // 劉禪：下一張友軍 +1（並補 1 糧）
            if (sk.includes('建言')) score += 12;      // 法正 / 張昭：同陣地正面友軍 +1
            if (sk.includes('蜀王')) score += 18;      // 劉備 / 劉禪：蜀國光環
            if (sk.includes('鐵騎')) score += 10;      // 馬超：下一陣地 +1（若關羽後續打到下一陣）
            if (sk.includes('忘隙')) score += 8;       // 李典：前後友軍 +1（魏國，僅蜀無用）
            // 補糧 / 抽牌類，讓 combo 能跑完
            if (sk.includes('權衡')) score += 5;
            if (sk.includes('觀星')) score += 5;
        }

        /* 關羽已在場上時，繼續鋪增益無意義（斬將已觸發過）→ 不特別加分
           但若關羽還沒出，且這張牌屬於「前置準備」，則加分（見上） */
    }		
    /* ★ v3.4.1: 關羽【斬將】價值評估
       AI 需要知道「現在出關羽能斬到多少東西」，因為斬將門檻 = 關羽最終戰力 - 4，
       而最終戰力會因場上被動加成（蜀王 / 建言 / 龍吟 / 鐵騎等）浮動。 */
    if (d.id === 'guanyu' && !d.forceFaceDown) {
        const pred = this._predictGuanyuEntry(pi, bi);
        if (pred) {
            let killValue = 0, killCount = 0;
            pred.enemies.forEach(e => {
                if (e.kind === 'normal' && e.power <= pred.threshold) {
                    killValue += this.cardThreatValue(e.card);
                    killCount++;
                }
            });
            // 斬到的牌價值 × 1.5（斬將是節奏牌，價值高於單純移除）
            score += killValue * 1.5;
            // 一次斬 2 張以上：大幅加分
            if (killCount >= 2) score += 6 + killCount * 2;
            // 有敵軍但一張都斬不掉 → 關羽只是 7 戰力，扣分
            if (killCount === 0 && pred.enemies.length > 0) score -= 12;
            // 有可斬目標時，即使開局懲罰也該降低（見下方 isGeneral 區塊）
            if (killCount > 0) score += 8;
        }
    }
    if (d.isGeneral && !d.forceFaceDown) {
        if (ctx.isFirstMoveOfRound) {
            // v3.5：動態懲罰。若對手手牌多（挑襲/奪銳目標多），或我落後需要翻盤，
            // 開局懲罰降低
            let openPenalty = -50;
            if (p.hand.length >= 3 && opp.hand.length >= 4) openPenalty += 15;
            if (ctx.mustWinThisRound) openPenalty += 15;
            if (ctx.iAmBehindInMatch) openPenalty += 10;
            score += openPenalty;
        }
        else if (ctx.iAmResponding && !(myPow > oppPow) && !ctx.mustWinThisRound) score -= 15;
        else if (opp.passed) {
            if (myPow > oppPow + 5) score -= 8;
            else if (myPow > oppPow) score -= 3;
            else score += 3;
        } else {
            const projected = myPow + (d.power || 0);
            const wouldWin = projected > oppPow;
            if (!wouldWin) score -= 10;
            else if (myPow > oppPow + 5) score -= 8;
            else score += 1;
        }
        if (ctx.alreadyWonRound1 && !ctx.mustWinThisRound) score -= 6;
    }
    /* 奇謀 / 奇襲 / 奔襲：評估放到其他陣地是否能翻盤或追平 */
    const positionSkills = ['奇謀','奇襲','奔襲'];
    if ((d.skills||[]).some(s => positionSkills.includes(s))) {
        const fields = this.getPlayableFields(c, pi);
        let bestFlipBonus = 0;
        for (const f of fields) {
            if (f === bi) continue;
            const myF = this.fieldPower(pi, f, false);
            const oppF = this.fieldPower(this.opponentOf(pi), f, false);
            const cardDelta = (d.power || 0)
                + ((d.skills||[]).includes('建言') ? this.players[pi].fields[f].filter(x=>!x.faceDown).length : 0);
            const projected = myF + cardDelta;
            if (myF < oppF && projected > oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 28);      // 翻盤，極有價值
            } else if (myF < oppF && projected === oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 14);      // 追平
            } else if (myF === oppF && projected > oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 12);      // 平手→勝
            } else if (myF < oppF && projected < oppF) {
                // 打到輸的場地只會更輸，不鼓勵（除非是拖延型如法正在已結算場地）
                if (f >= bi) bestFlipBonus = Math.max(bestFlipBonus, -6);
            }
        }
        score += bestFlipBonus;
    }	
    if (diff === 'hard') {
	        // ★ v3.9: 若手上持有 魏延/鄧艾，且存在「可翻盤的過去陣地」，
        // 本回合不應把糧草用光，需預留 preend 出牌的費用。
        if (!d.isGeneral && !d.forceFaceDown) {
            let pastFlipCost = 0;
            for (const card of p.hand) {
                if (card === c) continue;
                if (!(card.data.skills || []).includes('奇襲')) continue;
                for (let fb = 0; fb < this.currentBfIndex; fb++) {
                    const hist = this.history.find(h => h.round === fb + 1);
                    if (!hist || hist.winner === pi) continue;
                    const myF = this.fieldPower(pi, fb, false);
                    const oppF = this.fieldPower(this.opponentOf(pi), fb, false);
                    const projected = myF + card.data.power;
                    const wasFirst = (hist.firstPlayer === pi);
                    const canFlip = (projected > oppF) || (projected === oppF && wasFirst);
                    if (canFlip) { pastFlipCost = Math.max(pastFlipCost, card.data.cost); break; }
                }
                if (pastFlipCost) break;
            }
            if (pastFlipCost > 0) {
                const foodAfter = p.food - (d.cost || 0);
                if (foodAfter < pastFlipCost) score -= 25;
            }
        }
		// v3.1：下輪資源評估——避免把糧草用完導致下一輪斷炊
		const foodAfterPlay = p.food - (d.cost || 0);
		const foodWasted = Math.max(0, foodAfterPlay + this.cfg.baseRefill - this.cfg.maxFood);
		// v3.4.1: dying with cards in hand is the #1 loss pattern
		if (foodAfterPlay === 0 && p.hand.length >= 3) {
			score -= (p.hand.length >= 5) ? 14 : (p.hand.length >= 4 ? 10 : 7);
		} else if (foodAfterPlay === 1 && p.hand.length >= 3) {
			score -= 5;
		}
		// If opponent will have ≥3 food advantage after this play, they outlast us
		if (opp.food - foodAfterPlay >= 3) {
			score -= 5;
		}
		if (foodWasted > 2) {
			score -= 2;
		}

		// v3.4：平手先手勝。後手方任何平手都等於輸，必須積極拉開
		const iAmFirst = (this.roundFirstPlayer === pi);
		if (!opp.passed) {
			const margin = myPow - oppPow;
			if (!iAmFirst) {
				// 後手：任何平手都會輸
				if (margin <= 0) {
					// 落後或平手 → 必須加碼
					score += 5;
					if (d.power >= 3) score += 3;
					if (d.power >= 5) score += 2;
				} else if (margin <= 2) {
					// 小領先尚未安全 → 繼續施壓
					score += 2;
					if (d.power >= 3) score += 2;
				}
			} else {
				// 先手：小幅領先即為勝 → 避免無謂消耗
				if (margin >= 1 && margin <= 2 && d.power <= 3) score -= 2;
			}
		}
        const projected = myPow + (d.power || 0);
        const wouldWin = projected > oppPow;
        if (opp.passed && myPow > oppPow + 5) score -= d.cost * 2;
        if (ctx.alreadyWonRound1 && myPow > oppPow + 5 && !ctx.mustWinThisRound) score -= d.cost * 3;
        if (ctx.mustWinThisRound) {
		// v3.9：決勝輪，戰力就是一切。加碼更狠。
		score += (d.power || 0) * 2.5;     // was 1.8
		// 節省型小牌（<3戰力）在決勝輪幾乎沒用
		if ((d.power || 0) <= 2 && !d.isAmbush) score -= 6;   // was -3

		if (wouldWin && !(myPow>oppPow)) score += 10;         // was 6
		else if (wouldWin) score += 2;
		}
        if (opp.food >= 10 && !wouldWin && d.cost >= 3) score -= 4;
        if (ctx.myPendingFlipCost > 0 && p.food - d.cost < ctx.myPendingFlipCost) score -= 25;
        if (Math.abs(myPow - oppPow) <= 2 && d.power >= 4) score += 2;
        if (ctx.iAmBehindInMatch && ctx.mustWinThisRound) score += 3;
        if (ctx.oppWonRound1 && this.round === 2) score += 2;
        const hasWinSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => WIN_TRIGGER_SKILLS.includes(s)));
        const hasLoseSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => LOSE_TRIGGER_SKILLS.includes(s)));
        if (hasWinSkill && wouldWin && !(myPow>oppPow)) score += 3;
        if (hasLoseSkill && !wouldWin && p.wins === 0 && opp.wins === 0) score += 1;

        // v3.4.1: Cross-round patience. If I already have 1 win and this
        // isn't the final round, don't dump expensive cards — keep them
        // for round 3 where they'll matter more.
        const isLastRound = this.round >= this.fieldCount;
        const iAlreadyWon = p.wins >= 1;
        if (!isLastRound && iAlreadyWon) {
            if (d.cost >= 3 && p.food <= 5) score -= 4;
            if (d.cost >= 5) score -= 3;
        }
        // Conversely: if I'm 0-1 (must win 2 in a row), spend MORE in R2
        if (!isLastRound && p.wins === 0 && opp.wins === 1 && this.round === 2) {
            score += 2;  // R2 is a must-win for me
        }

        // v3.4.2: 「這張是唯一能翻盤的牌」加成
        // 若我落後、這張牌的戰力足以讓局面變成領先、且我還有食物，
        // 大幅加分——避免像 0ETAQZW 那樣放著呂布不用就輸了
        const deficit = oppPow - myPow;
        if (deficit > 0 && d.power >= deficit + 2 && d.cost <= p.food && !d.isAmbush) {
            score += 8 + Math.min(6, deficit);   // 落後越多，越想打
        }
    }
    return score + this.rng() * 3;
}
resolveAIScry() {
    if (!this.scry) return;
    const { pi, cards } = this.scry;
    const n = cards.length;
    if (n === 0) { this.scryConfirm(); return; }

    // 1. 對每張牌評分
    const scored = cards.map(c => ({
        card: c,
        score: this._scryCardValue(c, pi)
    })).sort((a, b) => b.score - a.score);  // 高到低

    // 2. 決定每張牌屬於誰
    const owners = this._scryDrawOwners(pi, n);

    // 3. 貪心分配：
    //    - 位置是 AI 的 → 取「剩下最好的」
    //    - 位置不是 AI 的 → 給「剩下最差的」
    const result = new Array(n);
    let head = 0, tail = n - 1;
    for (let i = 0; i < n; i++) {
        if (owners[i] === pi) {
            result[i] = scored[head++].card;
        } else {
            result[i] = scored[tail--].card;
        }
    }

    this.scry.order = result.map(c => c.uid);
    this.scryConfirm();
}
/* ★ v3.5: 曹操【奸雄】AI 猜測
   要根據「對手場上的資訊」判斷，而不是盲目統計牌庫。
   核心原則：
   ① 1 費伏兵（冷箭、馬岱、李儒）是高價值目標 → 優先猜 1
   ② 沒 1 則猜 2（伏兵a、李傕）
   ③ 對手有諸葛亮/龐統/馬謖 → 疑兵(0) 有價值 → 可能猜 0
   ④ 對手有潘璋 → 更多便宜伏兵 → 提高 1、2 權重
   ⑤ 對手有程昱 → 任意牌都能背面 → 可能出現 2、3 費高戰力
   ⑥ 對手有高戰力上將在場（關羽等）→ 這類關鍵牌可能被對手藏著 */
resolveAIJianxiong() {
    if (!this.jianxiong) return;
    const pi = this.jianxiong.pi;
    const oppPi = this.opponentOf(pi);
    const diff = this.getAIDifficulty(pi);

    // 若不是困難 AI：簡單/普通 AI 用基本猜測
    if (diff !== 'hard') {
        const guess = [1, 1, 1, 2, 0][Math.floor(this.rng() * 5)];   // 偏向猜 1
        this.jianxiong.guess = guess;
        this.jxConfirm();
        return;
    }

    // ---- 困難 AI：分析對手場上資訊 ----
    const oppVisible = this.players[oppPi].fields.flat().filter(c => !c.faceDown);
    const hasZhuge = oppVisible.some(c => c.data.id === 'zhugeliang' && !c.silenced);
    const hasPangtong = oppVisible.some(c => c.data.id === 'pangtong' && !c.silenced);
    const hasMasu = oppVisible.some(c => c.data.id === 'masu' && !c.silenced);
    const hasPanZhang = oppVisible.some(c => c.data.id === 'panzhang' && !c.silenced);
    const hasChengyu = oppVisible.some(c => c.data.id === 'chengyu' && !c.silenced);

    // 權重表：戰力 → 猜中的機率權重
    const W = {};
    const add = (power, w) => { W[power] = (W[power] || 0) + w; };

    // ① 疑兵（戰力 0）：只有特定情境才有價值
    if (hasZhuge || hasPangtong || hasMasu) {
        add(0, 3);   // 對手有動機主動打疑兵
    } else {
        add(0, 0.3); // 否則疑兵無用，幾乎不會主動出（除非強制）
    }

    // ② 1 費伏兵群（戰力 1-2）：最高價值目標
    add(1, 6);   // 冷箭伏兵、馬岱、李儒
    add(2, 3);   // 伏兵a、李傕

    // ③ 2 費伏兵群
    add(4, 3);   // 伏兵b、徐榮

    // ④ 3 費伏兵群
    add(6, 2);   // 伏兵c、董卓

    // ⑤ 情境加成
    if (hasPanZhang) {
        // 潘璋在場 → 越多小伏兵越好 → 1、2 費伏兵更可能
        add(1, 5);
        add(2, 4);
    }
    if (hasChengyu) {
        // 程昱在場 → 任意牌可背面 → 高戰力牌也能藏
        add(4, 3);
        add(6, 3);
        add(2, 2);
    }

    // ⑥ 若對手有上將在場但手牌少 → 剩下的高戰力牌可能在場上蓋牌
    const oppHandCount = this.players[oppPi].hand.length;
    if (oppHandCount <= 1) {
        // 對手手牌快空了 → 場上蓋牌可能是關鍵牌
        add(4, 2);
        add(6, 2);
    }

    // 選擇最高權重
    let best = null, bestW = -1;
    for (const [v, w] of Object.entries(W)) {
        if (w > bestW) { bestW = w; best = parseInt(v); }
    }
    this.jianxiong.guess = best;
    this.jxConfirm();
}
/* ============ 觀星/料算 AI 增強 ============ */
/* 對 AI 來說，一張牌的「價值」——用於 scry 排序 */
_scryCardValue(card, pi) {
    const d = card.data;
    const p = this.players[pi];
    let v = d.power || 0;

    // 費用效率
    if (d.cost > 0) v += Math.max(0, 3 - d.cost) * 0.5;

    // 0 費疑兵 + 諸葛亮 = 白給戰力
    if ((d.skills || []).includes('疑兵')) {
        const hasZhuge = p.fields.some(f => f.some(c =>
            !c.faceDown && !c.silenced && c.data.id === 'zhugeliang'));
        v += hasZhuge ? 8 : 2;
    }

    // 諸葛亮本身價值 = 場上疑兵數 × 3（估算）
    if (d.id === 'zhugeliang') {
        const ybCount = p.fields.flat().filter(c =>
            (c.data.skills || []).includes('疑兵')).length;
        v = Math.max(3 * ybCount, 3);
    }

    // 上將價值
    if (d.isGeneral) v += 3;

    // 王類光環 / 建言
    const auraSkills = ['蜀王', '魏王', '吳王', '建言'];
    if ((d.skills || []).some(s => auraSkills.includes(s))) {
        const allies = p.fields.flat().filter(c =>
            !c.faceDown && c.data.faction === d.faction).length;
        v += Math.min(allies, 3) * 1.5;
    }

    // Combo 啟動器 / 關鍵牌
    const comboAssets = {
        'liushan': 4, 'guanping': 4, 'caohong': 4,
        'zhangjiao': 3, 'zhangbaogong': 3, 'zhangliang': 3,
        'pangtong': 3, 'chengyu': 3,
    };
    if (comboAssets[d.id]) v += comboAssets[d.id];

    return v;
}
/* 從 AI 開始，回傳「每張牌會被誰抽」的順序（依出牌輪轉） */
_scryDrawOwners(pi, n) {
    const owners = [];
    for (let i = 0; i < n; i++) owners.push((pi + i) % this.numPlayers);
    return owners;
}
/* ============ AI 個性圖示 ============ */
aiIcon(pi) {
    if (!this.isAI(pi)) return '';
    const p = this.players[pi];
    if (p.personality === 'kind') return ' 👑';
    if (p.personality === 'cold') return ' ❄️';

/* ============ AI 個性台詞庫 ============ */
_aiLines(pers) {
    if (pers === 'malignant') {
        return {
            greeting:  ['來吧！', '接招吧！', '看我的！', '出手吧！'],
            taunt:     ['輕鬆！', '太弱了！', '不堪一擊！', '這就是我的實力！', '見識到了嗎？'],
            defeat:    ['可惡…', '下一輪！', '我不會再輸！', '小看你了', '給我記住！'],
            retaliate: ['哼！', '走著瞧！', '別得意！', '回嘴是吧？', '有意思…'],
            general:   ['上將出陣！', '萬夫莫敵！', '決勝負吧！', '看我這一擊！'],
            winMsg:    [CHAT_MSG[1], CHAT_MSG[2]],    // 打得不錯！ / 抱歉
            winEmoji:  [CHAT_EMOJI[0], CHAT_EMOJI[1], CHAT_EMOJI[2], CHAT_EMOJI[3],
                        CHAT_EMOJI[4], CHAT_EMOJI[6], CHAT_EMOJI[7], CHAT_EMOJI[9]]
        };
    }
    return null;
}

_pick(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(this.rng() * arr.length)];
}

_chatBubble(pi, text, delay = 0) {
    if (!text) return;
    const fire = () => { try { showChatBubble(pi, text); } catch(e) {} };
    if (delay > 0) this._sTO(fire, delay);
    else fire();
}

/* ============ AI 聊天觸發器（個性化） ============ */
aiChatTrigger(pi, event, opts = {}) {
    if (this.netMode) return;
    if (!this.aiTrashTalk) return;
    if (!this.isAI(pi)) return;
    const p = this.players[pi];
    const pers = p.personality || 'malignant';
    const r = this.rng();

    /* ---- Cold（❄️）：從不打招呼、極少發話 ---- */
    if (pers === 'cold') {
        if (event === 'win_round' && r < 0.30) {
            this._chatBubble(pi, CHAT_EMOJI[9], 600);   // 🥀
        }
        // 其他事件全部靜默
        return;
    }

    /* ---- Kind（👑）：友善、有禮貌 ---- */
    if (pers === 'kind') {
        if (event === 'round_start') {
            this._chatBubble(pi, CHAT_EMOJI[0], 400);                  // 😀
            this._sTO(() => this._chatBubble(pi, CHAT_MSG[0]), 900);   // 你好！
            return;
        }
        if (event === 'win_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[1], 600); // 😂
            else if (r < 0.60) this._chatBubble(pi, CHAT_EMOJI[5], 600); // 👍
            else if (r < 0.80) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            // 剩 20% 靜默
            return;
        }
        if (event === 'lose_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[6], 600); // 👎
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[7], 600); // 😠
            // 剩 60% 靜默
            return;
        }
        if (event === 'general') {
            if (r < 0.50) this._chatBubble(pi, CHAT_MSG[0], 250);  // 你好！
            else          this._chatBubble(pi, CHAT_MSG[2], 250);  // 抱歉
            return;
        }
        if (event === 'gameover') {
            // 不論輸贏都稱讚
            this._chatBubble(pi, CHAT_MSG[1], 800);   // 打得不錯！
            return;
        }
        // 被玩家嗆 → 完全不回應
        return;
    }

    /* ---- Malignant（🤖）：噁心人 ---- */
    const L = this._aiLines('malignant');
    if (event === 'round_start') {
        if (r < 0.30) this._chatBubble(pi, this._pick(L.greeting), 400);
        return;
    }
    if (event === 'win_round') {
        const emoji = this._pick(L.winEmoji);
        const msg   = this._pick(L.winMsg);
        this._chatBubble(pi, `${emoji} ${msg}`, 700);
        return;
    }
    if (event === 'lose_round') {
        if (r < 0.50) this._chatBubble(pi, this._pick(L.defeat), 800);
        return;
    }
    if (event === 'general') {
        if (r < 0.45) this._chatBubble(pi, this._pick(L.general), 250);
        return;
    }
    if (event === 'gameover') {
        if (opts.won) {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.taunt), 800);
        } else {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.defeat), 800);
        }
        return;
    }
    if (event === 'human_chat') {
        if (r < 0.80) this._chatBubble(pi, this._pick(L.retaliate), 700 + this.rng() * 800);
        return;
    }
}

/* 向下相容：舊程式若呼叫 aiSay/aiSayEmoji 一律轉發 */
aiSay(pi, category, delay = 800) {
    const map = { victory: 'win_round', defeat: 'lose_round',
                  greeting: 'round_start', general: 'general',
                  retaliate: 'human_chat', taunt: 'win_round' };
    this.aiChatTrigger(pi, map[category] || 'round_start');
}
aiSayEmoji(pi, delay = 500) { this.aiChatTrigger(pi, 'win_round'); }

/* 玩家嗆 AI → 依個性回應 */
maybeAIChatResponse(humanPi, text) {
    if (this.netMode) return;
    if (!this.aiTrashTalk) return;
    const ais = [];
    for (let i = 0; i < this.numPlayers; i++) if (this.isAI(i)) ais.push(i);
    if (ais.length === 0) return;
    const opp = this.opponentOf(humanPi);
    const responder = this.isAI(opp) ? opp : ais[Math.floor(this.rng() * ais.length)];
    // 只有惡毒 AI 會回嗆（Kind / Cold 不回應）
    if (this.players[responder].personality !== 'malignant') return;
    this.aiChatTrigger(responder, 'human_chat');
}

/* 開局 / 換輪時統一觸發招呼 */
maybeTriggerAIChats(stage) {
    if (this.netMode) return;
    if (!this.aiTrashTalk) return;
    for (let pi = 0; pi < this.numPlayers; pi++) {
        if (!this.isAI(pi)) continue;
        if (stage === 'round_start') {
            const delay = 400 + this.rng() * 900;
            this._sTO(() => this.aiChatTrigger(pi, 'round_start'), delay);
        }
    }
}
/* ★ v3.5: 背面牌支付順序 — 玩家選擇 UI */
_askPaymentOrder(pi, faceDowns, food) {
    return new Promise(resolve => {
        this._paymentState = { pi, cards: faceDowns, food, order: [] };
        this._paymentResolver = resolve;
        this.render();
    });
}
paymentSelect(uid) {
    const s = this._paymentState;
    if (!s) return;
    const i = s.order.indexOf(uid);
    if (i >= 0) s.order.splice(i, 1);
    else s.order.push(uid);
    this.render();
}
paymentConfirm() {
    const s = this._paymentState;
    if (!s) return;
    const ordered = s.order.map(uid => s.cards.find(c => c.uid === uid)).filter(Boolean);
    s.cards.forEach(c => { if (!ordered.includes(c)) ordered.push(c); });
    const r = this._paymentResolver;
    this._paymentState = null;
    this._paymentResolver = null;
    this.render();
    r(ordered);
}
async settle() {
    this.phase = 'settle'; this.cover = false;
    console.log('[settle]', {
        round: this.round, roundFirstPlayer: this.roundFirstPlayer,
        preEndOrder: this.preEndOrder, preEndIdx: this.preEndIdx,
        passed: this.players.map(p => p.passed)
    });
    const bi = this.currentBfIndex;
    this.addLog('bat', `═══ 【${BATTLEFIELDS[bi]}】陣地結算 ═══`);
    this.render();
    await this._sleep(450);

    // ★ v3.5: 背面牌支付順序決策
    this._paymentOrders = {};
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const faceDowns = this.players[pi].fields[bi].filter(c => c.faceDown);
        if (faceDowns.length === 0) {
            this._paymentOrders[pi] = [];
            continue;
        }
        const totalCost = faceDowns.reduce((s, c) => s + c.data.cost, 0);
        const food = this.players[pi].food;
        if (this.isAI(pi) || (this.netMode && pi !== this.localPlayerIdx)) {
            // AI 或遠端玩家：便宜優先（最大化保留張數）
            this._paymentOrders[pi] = [...faceDowns].sort((a, b) => a.data.cost - b.data.cost);
        } else if (totalCost <= food) {
            // 粮草充足，順序無所謂
            this._paymentOrders[pi] = [...faceDowns];
        } else {
            // 本地人類玩家：彈窗選擇
            this._paymentOrders[pi] = await this._askPaymentOrder(pi, faceDowns, food);
        }
    }

    // 程昱【捧日】：翻面前先結算基本戰力改寫
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const field = this.players[pi].fields[bi];
        const chengyu = field.find(c => !c.faceDown && !c.silenced && c.data.id === 'chengyu');
        if (!chengyu) continue;
        const faceDowns = field.filter(c => c.faceDown);
        if (faceDowns.length === 0) {
            this.addLog(pi, `【捧日】${chengyu.data.name}：本陣無背面牌，不觸發`);
            continue;
        }
        // 找出基本戰力最高的背面牌
        let highest = faceDowns[0];
        faceDowns.forEach(c => {
            if ((c.data.power||0) > (highest.data.power||0)) highest = c;
        });
        // 需要糧草足夠翻開它
        if (this.players[pi].food < highest.data.cost) {
            this.addLog(pi, `【捧日】${chengyu.data.name}：糧草不足以翻開 ${highest.data.name}（需${highest.data.cost}糧，餘${this.players[pi].food}），不觸發`);
            continue;
        }
        const delta = (highest.data.power||0) - (chengyu.data.power||0);
        if (delta > 0) {
            chengyu.mod = (chengyu.mod || 0) + delta;
            this.addLog(pi, `【捧日】${chengyu.data.name}：基本戰力改為 ${highest.data.power}（參照 ${highest.data.name}）`);
        } else {
            this.addLog(pi, `【捧日】${chengyu.data.name}：本陣背面牌不強於自己，不觸發`);
        }
    }

    const toDiscard = [];
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const ordered = this._paymentOrders?.[pi]
            || this.players[pi].fields[bi].filter(c => c.faceDown);
        for (const c of ordered) {
            if (!c.faceDown) continue;
            if (!this.players[pi].fields[bi].includes(c)) continue;
            c.faceDown = false; c.fresh = true;
            c.keepOnField = false;
            if (c.data.skills && c.data.skills.includes('疑兵') && !c.silenced) {
                if (c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
                if (!c.keepOnField) {
                    c.willRemove = true;
                    this.addLog(pi, `【疑兵】${c.data.name} 翻開，結算後移除`);
                }
            } else if (this.players[pi].food >= c.data.cost) {
                this.players[pi].food -= c.data.cost;
                this.addLog(pi, `【伏兵】${c.data.name}(${c.data.cost}糧/${c.data.power}戰力) 翻開`);
                if (!c.silenced && c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
            } else {
                c.willDiscard = true;
                toDiscard.push(c);
                this.addLog(pi, `【伏兵】糧草不足，棄置！`);
            }
        }
    }
    this.render();
    await this._sleep(800);

    if (toDiscard.length) {
        for (let pi = 0; pi < this.numPlayers; pi++)
            this.players[pi].fields[bi] = this.players[pi].fields[bi].filter(c => !c.willDiscard);
        toDiscard.forEach(c => this.archive.push(c));
        this.render(); await this._sleep(400);
    }

    const order = [];
    for (let step = 0; step < this.numPlayers; step++) {
        order.push((this.current + step) % this.numPlayers);
    }
    for (const pi of order) {
        const f = [...this.players[pi].fields[bi]];
        for (const c of f) {
            if (c.faceDown || c.silenced) continue;
            if (c.data.onSettle) c.data.onSettle(this._ctxFor(pi, c, bi, null));
        }
    }
    this.render(); await this._sleep(400);

    // ★ v3.8: 快照所有場上牌（含即將被移除的疑兵），供統計使用
    const statSnapshot = [];
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].fields[bi].forEach(c => {
            statSnapshot.push({ player: pi, card: c });
        });
    }

    const powers = [];
    for (let pi = 0; pi < this.numPlayers; pi++) powers.push(this.totalPower(pi, false));
    const maxPow = Math.max(...powers);
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const behind = powers[pi] < maxPow;
        if (!behind) continue;
        const foesList = this.enemiesOf(pi);
        for (let fb = 0; fb < this.fieldCount; fb++) {
            const own = this.players[pi].fields[fb];
            // Betray to left neighbor (opponentOf)
            const leftFoe = this.opponentOf(pi);
            const foes = this.players[leftFoe].fields[fb];
            const movers = own.filter(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('反骨') && !c.activated);
            movers.forEach(c => {
                own.splice(own.indexOf(c), 1);
                c.activated = true; c.betrayed = true; c.betrayedFrom = pi;
                foes.push(c);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【反骨】背叛！加入 ${this.players[leftFoe].name} 陣營`);
            });
        }
    }
    if (this.players.some(p => p.fields[bi].some(c => c.betrayed)))
        { this.render(); await this._sleep(500); }

    for (let pi = 0; pi < this.numPlayers; pi++) {
        const f = this.players[pi].fields[bi];
        for (let i = f.length - 1; i >= 0; i--) {
            if (f[i].willRemove) {
                this.flashRemove(f[i]);
                f[i].originalOwner = pi;
                this.archive.push(f[i]); f.splice(i, 1);
            }
        }
    }

    // Compute per-player field powers
    const totals = [];
    for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, true));

    // Team totals (if teams mode)
    const teamTotals = {};
    if (this.teams) {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            const tid = this.seatTeam[pi];
            teamTotals[tid] = (teamTotals[tid] || 0) + totals[pi];
        }
    }

    // Determine winner
    let winner = 0;
    let tieBreakerOrder = (pi) => (pi - this.roundFirstPlayer + this.numPlayers) % this.numPlayers;

    if (this.teams) {
        const tids = Object.keys(teamTotals).map(Number);
        let bestTeam = tids[0], bestVal = teamTotals[bestTeam];
        for (const tid of tids) {
            if (teamTotals[tid] > bestVal) { bestTeam = tid; bestVal = teamTotals[tid]; }
            else if (teamTotals[tid] === bestVal) {
                // Tie between teams → use firstPlayer's team
                const firstTeam = this.seatTeam[this.roundFirstPlayer];
                if (tid === firstTeam) bestTeam = tid;
            }
        }
        // Pick lowest-seat member of winning team as winner (represents team)
        winner = Math.min(...this.teams[bestTeam]);
        // Award wins to all team members
        this.teams[bestTeam].forEach(seat => { this.players[seat].wins++; });
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `勝隊：${this.teams[bestTeam].map(s=>this.players[s].name).join('+')}`);
    } else {
        let bestVal = totals[0];
        for (let pi = 1; pi < this.numPlayers; pi++) {
            if (totals[pi] > bestVal) { winner = pi; bestVal = totals[pi]; }
            else if (totals[pi] === bestVal) {
                if (tieBreakerOrder(pi) < tieBreakerOrder(winner)) winner = pi;
            }
        }
        this.players[winner].wins++;
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `${this.players[winner].name} 贏得本輪！`);
    }

    // 🎭 AI 個性化反應（勝/敗）
    for (let pi = 0; pi < this.numPlayers; pi++) {
        if (!this.isAI(pi)) continue;
        const isWinner = (pi === winner) ||
            (this.teams && this.seatTeam[pi] !== null && this.seatTeam[pi] === this.seatTeam[winner]);
        if (isWinner) {
            this._sTO(() => this.aiChatTrigger(pi, 'win_round'), 800 + this.rng() * 400);
        } else {
            this._sTO(() => this.aiChatTrigger(pi, 'lose_round'), 1200 + this.rng() * 600);
        }
    }

    this.history.push({ round: this.round, battlefield: this.battlefields[bi], totals, winner, firstPlayer: this.roundFirstPlayer });

    // Compatibility: keep f0/f1 for old replay display and UI
    const f0 = totals[0] || 0;
    const f1 = totals[1] || 0;

    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + this.cfg.baseRefill);
        this.players[pi].fields[bi].forEach(c => {
            if (!c.faceDown && !c.silenced && (c.data.skills||[]).includes('締盟') && this.firstPasser === pi) {
                this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + 1);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【締盟】：先放棄 +1 糧`);
            }
        });
    }
    this.players[winner].food = Math.min(this.cfg.maxFood, this.players[winner].food + this.cfg.winBonus);
    this.addLog('sys', `補給 ${this.cfg.baseRefill} 糧，${this.players[winner].name} 額外 +${this.cfg.winBonus} 糧`);

    this.lastResult = { f0, f1, winner, battlefield: BATTLEFIELDS[bi] };
    this.recordEvent('settle', { battlefield: bi, f0, f1, winner,
        blueWins: this.players[0].wins, redWins: this.players[1].wins,
        blueFood: this.players[0].food, redFood: this.players[1].food });

    // 🎯 v3.7: 記錄卡片勝率（勝方場上的每張牌 +1 win）
    if (this.teams) {
        const teamId = this.seatTeam[winner];
        if (teamId !== null && this.teams[teamId]) {
            this._trackRoundWin(winner, bi, statSnapshot);   // ★ v3.8: 一次即可，areAllies 內部處理
        }
    } else {
        this._trackRoundWin(winner, bi, statSnapshot);       // ★ v3.8
    }


    let someoneWon = false;
    let winningPlayers = [];
    if (this.teams) {
        // For team modes, count each team's total wins
        for (const team of this.teams) {
            const teamWins = team.reduce((s, seat) => s + this.players[seat].wins, 0) / team.length;
            if (teamWins >= 2) { someoneWon = true; winningPlayers = team.slice(); break; }
        }
    } else {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (this.players[pi].wins >= 2) { someoneWon = true; winningPlayers = [pi]; break; }
        }
    }
    if (someoneWon) {
        this.gameWinner = winningPlayers[0];
        this.state = 'gameover';
        const winNames = winningPlayers.map(p => this.players[p].name).join(' & ');
        this.addLog('sys', `═══ ${winNames} 贏得最終勝利！═══`);
        // ...（以下原本的 AI 聊天、recordEvent、saveReplayToLocal、autoRestart 全部保留）
        this.render(); return;
    }

    // ★ v3.9: 本輪沒結束比賽 → 才執行過去陣地的待重算翻轉
    this._recheckAllPastBattlefields();

    // 翻轉可能把某人推到 2 勝 → 第二次判定
    let someoneWonAfterFlip = false;
    let winningAfterFlip = [];
    if (this.teams) {
        for (const team of this.teams) {
            const teamWins = team.reduce((s, seat) => s + this.players[seat].wins, 0) / team.length;
            if (teamWins >= 2) { someoneWonAfterFlip = true; winningAfterFlip = team.slice(); break; }
        }
    } else {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (this.players[pi].wins >= 2) { someoneWonAfterFlip = true; winningAfterFlip = [pi]; break; }
        }
    }
    if (someoneWonAfterFlip) {
        this.gameWinner = winningAfterFlip[0];
        this.state = 'gameover';
        const winNames = winningAfterFlip.map(p => this.players[p].name).join(' & ');
        this.addLog('sys', `═══ ${winNames} 藉翻轉取得最終勝利！═══`);
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (!this.isAI(pi)) continue;
            const won = winningAfterFlip.includes(pi);
            this._sTO(() => this.aiChatTrigger(pi, 'gameover', { won }), 900 + this.rng() * 800);
        }
        this.recordEvent('game_over', { winner: this.gameWinner, winners: winningAfterFlip, totalRounds: this.round, viaFlip: true });
        this.saveReplayToLocal();
        const allBots = this.players.every(p => p.botType);
        if (allBots && this.cfg.autoExport) this._sTO(() => this.downloadReplay(true), 400);
        this.render(); return;
    }

    this.render();
    if (this.players.every(p => p.botType) && this.round < this.fieldCount) {
        if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
        this.settleAutoTimer = this._sTO(() => {
            if (this.state === 'battle' && this.phase === 'settle') {
                this.settleAutoTimer = null;
                this.nextRound();
            }
        }, 2000);
    }
}

nextRound() {
    // ★ guard: only advance from a real settle phase, and only once.
    if (this.state === 'gameover') return;
    if (this.phase !== 'settle') return;
    this.phase = 'transition';        // mark consumed so a 2nd click can't re-run
    if (this.settleAutoTimer) { clearTimeout(this.settleAutoTimer); this.settleAutoTimer = null; }
    // 清除所有連環標記
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    if (this.round >= this.fieldCount) {
        const bi = this.currentBfIndex;
        for (let pi = 0; pi < this.numPlayers; pi++) {
            this.players[pi].fields[bi].forEach(c => {
                c.mod=0; c.burn=false; c.faceDown=false; c.silenced=false; c.activated=false;
                c.betrayed=false; c.betrayedFrom=null; c.lianhuan=false;
                c.preparing=false;
                this.archive.push(c);
            });
            this.players[pi].fields[bi] = [];
        }
    }
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].passed = false;
        this.players[pi].mustFaceUp = false;
        this.players[pi].roundSpent = 0;
    }
    this.firstPasser = null;
    this.passOrder = [];
    this.expandedField = null;   // 換輪時收起手動展開
    this._handoffDoneThisTurn = false;
    // ★ v3.9 FIX: 這些是 R1 遺留狀態，不清會污染 R2 的 preEnd / 隱忍判定
    this._simaYiLastChanceUsed = false;
    this.preEndOrder = null;
    this.preEndIdx = 0;
    this.preEndDone = [];
    this.countdown = null;
    if (this.countdownTimer) { clearTimeout(this.countdownTimer); this.countdownTimer = null; }
    const w = this.lastResult ? this.lastResult.winner : -1;
    if (w >= 0) this.current = (w + 1) % this.numPlayers;
    else this.current = (this.roundFirstPlayer + 1) % this.numPlayers;
    this.round++;
    this.roundFirstPlayer = this.current;
    this.phase = 'turn';
    this.cover = false;
    this.selected = null; this.selectedField = null;
    this.lastResult = null;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    for (let pi = 0; pi < this.numPlayers; pi++) this.logHand(pi, 'R'+this.round);
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1] ? this.players[1].hand.map(c => c.data.id) : [],
        blueFood: this.players[0].food, redFood: this.players[1] ? this.players[1].food : 0
    });
    this.render();
    this.maybeJianxiong();
}

render() {
    if (this._destroyed) return;                    // v3.6
    const app = document.getElementById('app');
    if (!app) return;                               // v3.6
    if (this.state === 'flip') { app.innerHTML = this.renderFlip(); return; }
    if (this.state === 'mulligan') { app.innerHTML = this.renderMulligan(); return; }
    if (this.state === 'gameover') { app.innerHTML = this.renderGameOver(); return; }
    app.innerHTML = this.renderBattle();
    setTimeout(() => {
        const el = document.querySelector('.log');
        if (el) el.scrollTop = el.scrollHeight;
        this.scheduleAI();
    }, 30);
}
_nextActorAfterCurrent() {
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) return nxt;
    }
    return null;
}
scheduleAI() {
    if (this._destroyed) return;                    // v3.6
    if (this.netMode) return;
    if (this.state !== 'battle') return;
    if (this.countdown !== null) return;
    if (this.scry || this.jianxiong || this.quanheng || this.lianying || this.guanyu || this.xunyu || this.xunyou) return;
    if (this.phase === 'turn') {
        if (this.cover) {
            // Show handoff only if BOTH current and next actor are humans.
            // Otherwise auto-advance.
            const next = this._nextActorAfterCurrent();
            const humanHandoff = !this.isAI(this.current) && next !== null && !this.isAI(next);
            if (humanHandoff) return;  // wait for user to click
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.handoff(); }, 500);
            return;
        }
        if (this.isAI(this.current)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doTurnAI(); }, 900);
        }
    } else if (this.phase === 'preend') {
        if (this.cover) return;
        const pi = this.preEndOrder[this.preEndIdx];
        if (this.isAI(pi)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
        }
    }
}

cardHTML(inst, o = {}) {
    const d = inst.data;
    const fac = FACTION_INFO[d.faction];
    const cls = [];
    if (o.size === 'sm') cls.push('sm', 'mini');
    if (o.size === 'xs') cls.push('xs', 'mini');
    if (o.extra) cls.push(o.extra);
    if (inst.justDrawn && !o.noHighlight) cls.push('just-drawn');
    if (inst.faceDown && !o.forceReveal) {
        return `<div class="card ${cls.join(' ')}" ${o.attr || ''}><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`;
    }
    const isZhuge = (d.id === 'zhugeliang');
    const isSmall = (o.size === 'sm' || o.size === 'xs');
    let powerMain, modTxt = '', pcls = '#ffffff';
    if (isZhuge && o.power === undefined) powerMain = '3X';
    else {
        const totalPower = (o.power !== undefined) ? o.power : Math.max(0, d.power + (inst.mod || 0));
        const base = d.power;
        const bonus = totalPower - base;
        powerMain = totalPower;
        if (bonus !== 0) modTxt = `(${bonus > 0 ? '+' : ''}${bonus})`;
        if (isSmall) {
            // 迷你卡（陣地/棄牌區）都是深色底 → 保持淺色文字
            const colUp   = '#5ac05a';
            const colDown = '#ff6b6b';
            pcls = bonus > 0 ? colUp : (bonus < 0 ? colDown : '#ffffff');
        } else {
            pcls = bonus > 0 ? 'var(--card-power-up)'
                 : (bonus < 0 ? 'var(--card-power-down)'
                 : 'var(--card-power-neutral)');
        }
    }
    const generalTag = d.isGeneral ? '<span class="c-gen">上將</span>' : '';
    const tag = inst.betrayed && !inst.faceDown
        ? '<span class="c-tag" style="background:rgba(200,40,40,.85);">倒戈</span>'
        : '';
    const sil = inst.silenced ? '<span class="c-tag" style="background:rgba(120,120,120,.8);left:auto;right:2px;bottom:20px;">沉默</span>' : '';
    const burn = inst.burn ? '<span class="c-tag" style="background:rgba(255,80,0,.85);left:auto;right:2px;bottom:36px;">燃</span>' : '';
	const guardOff = inst.guardUsed ? '<span class="c-tag" style="background:rgba(100,100,100,.85);left:auto;right:2px;bottom:52px;">護衛×</span>' : '';
    const prepTag = inst.preparing ? '<span class="c-tag" style="background:rgba(60,140,220,.85);left:auto;right:2px;bottom:36px;">準備</span>' : '';
    const skillNames = (d.skills || []).map(s => `<div>${s}</div>`).join('');
    return `<div class="card ${cls.join(' ')}" ${o.attr || ''}>
        <div class="card-front ${fac.cls}">
            <span class="c-cost">${d.cost}</span>
            <span class="c-fac">${fac.name}</span>
            <span class="c-skills">${skillNames}</span>
            <span class="c-name">${d.name}</span>
            ${d.title ? `<span class="c-title">${d.title}</span>` : ''}
            <span class="c-art">${d.emoji}</span>
            <span class="c-power" style="color:${pcls}">${powerMain}${modTxt ? `<span style="font-size:10px">${modTxt}</span>` : ''}</span>
            ${generalTag}${tag}${sil}${burn}${guardOff}${prepTag}
        </div>
    </div>`;
}

renderFlip() {
    const isAuto = this.players.every(p => p.botType);
    let html = this.renderBackBtn();
    html += this.renderSpeedPanel();
    html += `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">翻牌決定先後手 ${this.modeTag()}</div></div>
        <div style="text-align:center; padding:14px;">`;

    if (this.numPlayers === 2) {
        // --- Original 2-player layout (unchanged) ---
        const c0 = this.flipCards[0], c1 = this.flipCards[1];
        const r0 = this.flipRevealed[0], r1 = this.flipRevealed[1];
        html += `<div class="flip-stage">
            <div class="flip-slot">
                <div class="lbl" style="color:${PLAYER_COLORS[0].text};">${this.players[0].name}${this.aiIcon(0)}${this.diffTag(0)}</div>
                <div class="flip-card-wrap ${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'flip-click' : ''}" onclick="${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'game.revealFlip(0)' : ''}">
                    ${r0 ? this.cardHTML(c0, { forceReveal: true, noHighlight: true })
                          : `<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`}
                </div>
                <div class="flip-power ${r0 ? '' : 'hidden'}" style="color:${PLAYER_COLORS[0].text};">戰力 ${c0.data.power}</div>
            </div>
            <div style="font-size:32px;color:#ffd700;font-weight:bold;">VS</div>
            <div class="flip-slot">
                <div class="lbl" style="color:${PLAYER_COLORS[1].text};">${this.players[1].name}${this.aiIcon(1)}${this.diffTag(1)}</div>
                <div class="flip-card-wrap ${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'flip-click' : ''}" onclick="${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'game.revealFlip(1)' : ''}">
                    ${r1 ? this.cardHTML(c1, { forceReveal: true, noHighlight: true })
                          : `<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`}
                </div>
                <div class="flip-power ${r1 ? '' : 'hidden'}" style="color:${PLAYER_COLORS[1].text};">戰力 ${c1.data.power}</div>
            </div>
        </div>`;
        const both = r0 && r1;
        if (!both) html += `<p style="color:#a89070;font-size:15px;">請雙方各自點擊自己的牌以翻開${isAuto?'（AI 將自動翻牌）':''}</p>`;
        else if (this.firstPlayer === null) {
            html += `<p style="font-size:18px;color:#ff9c4a;margin-bottom:16px;font-weight:bold;">⚖️ 平手！重新翻牌…</p>
                     <p style="color:#a89070;font-size:13px;">兩張牌已進入棄牌堆</p>`;
        } else {
            const fp = this.firstPlayer;
            const fc = fp === 0 ? '#6fb6ff' : '#ff7b7b';
            const fcg = fp === 0 ? 'linear-gradient(180deg,#3a7ac8,#1a4a8a)' : 'linear-gradient(180deg,#c83a3a,#8a1a1a)';
            const fbd = fp === 0 ? '#5aa0e8' : '#e85a5a';
            html += `<p style="font-size:16px;color:#e0c080;margin-bottom:16px;">${c0.data.name}（${c0.data.power}） vs ${c1.data.name}（${c1.data.power}）</p>
                <button class="btn btn-big" style="background:${fcg};border:1px solid ${fbd};color:#fff;" onclick="game.beginBattle()"><span style="color:${fc}">${this.players[fp].name}</span>先手！開始對戰</button>`;
        }
    } else {
        // --- N-player layout (3 or 4 seats, horizontal row) ---
        const allRevealed = this.flipRevealed.every(x => x);
        html += `<div style="display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:24px 0;">`;
        for (let i = 0; i < this.numPlayers; i++) {
            const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
            const c = this.flipCards[i];
            const r = this.flipRevealed[i];
            const canClick = !r && (!this.netMode || this.localPlayerIdx === i);
            html += `<div class="flip-slot">
                <div class="lbl" style="color:${col.text};">${this.players[i].name}${this.aiIcon(i)}${this.diffTag(i)}</div>
                <div class="flip-card-wrap ${canClick ? 'flip-click' : ''}" onclick="${canClick ? `game.revealFlip(${i})` : ''}">
                    ${r ? this.cardHTML(c, { forceReveal: true, noHighlight: true })
                        : `<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`}
                </div>
                <div class="flip-power ${r ? '' : 'hidden'}" style="color:${col.text};">戰力 ${c.data.power}</div>
            </div>`;
        }
        html += `</div>`;
        if (!allRevealed) {
            html += `<p style="color:#a89070;font-size:15px;">請各方各自點擊自己的牌以翻開${isAuto?'（AI 將自動翻牌）':''}</p>`;
        } else if (this.firstPlayer === null) {
            html += `<p style="font-size:18px;color:#ff9c4a;margin-bottom:16px;font-weight:bold;">⚖️ 平手！重新翻牌…</p>
                     <p style="color:#a89070;font-size:13px;">所有牌已進入棄牌堆</p>`;
        } else {
            const col = PLAYER_COLORS[this.firstPlayer % PLAYER_COLORS.length];
            const fcg = 'linear-gradient(180deg,#8a6020,#5a3d10)';
            html += `<p style="font-size:16px;color:#e0c080;margin-bottom:16px;">${this.flipCards.map((c, idx) => `${this.players[idx].name}（${c.data.power}）`).join(' · ')}</p>
                <button class="btn btn-big" style="background:${fcg};border:1px solid ${col.border};color:#fff;" onclick="game.beginBattle()"><span style="color:${col.text}">${this.players[this.firstPlayer].name}</span>先手！開始對戰</button>`;
        }
    }

    html += `</div>`;
    html += `<div id="modal-slot"></div>`;
    return html;
}

renderMulligan() {
    const pi = this.mulliganPlayer, p = this.players[pi];
    const stage = this.mulliganStage;
    const color = pi === 0 ? '#6fb6ff' : '#ff7b7b';
    const isAIP = this.isAI(pi);
    const isRemote = this.netMode && pi !== this.localPlayerIdx;
    const showBacks = isAIP || isRemote;
    const canAct = !isAIP && !isRemote;
    let html = this.renderBackBtn();
    html += this.renderSpeedPanel();
    html += `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">開局重抽階段 — ${p.name}${this.aiIcon(pi)}${isAIP?this.diffTag(pi):''} ${this.modeTag()}</div></div>
        <div style="text-align:center;padding:8px;">
            <div class="phase-tag">${p.name} 的手牌（${p.hand.length} 張）</div>
            <div class="hand-row" style="justify-content:center;margin:16px 0;min-height:130px;">
                ${showBacks ? p.hand.map(()=>`<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`).join('') :
                  (p.hand.map(c => this.cardHTML(c, { extra:'clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('') || '<span style="color:#666;">無手牌</span>')}
            </div>
            ${isAIP ? `<p style="color:#c8a0ff;font-size:14px;margin-bottom:16px;">${p.personality==='kind'?'👑':(p.personality==='cold'?'❄️':'🤖')} 電腦正在決定是否重抽…</p>`
                    : `<p style="color:#a89070;font-size:14px;margin-bottom:16px;">可選擇重抽全部手牌，或直接開始。</p>`}
            <div class="ctrl-buttons">
                <button class="btn btn-purple" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganRedraw()">重抽</button>
                <button class="btn btn-red" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganSkip()">放棄重抽</button>
                <button class="btn btn-green" ${(stage !== 'confirm' || !canAct) ? 'disabled' : ''} onclick="game.mulliganConfirm()">確認</button>            </div>
        </div>`;
    if ((stage === 'hidden' || this.cover) && !this.netMode && !isAIP) {
        const other = this.opponentOf(pi);
        const otherIsHuman = !this.isAI(other);
        if (otherIsHuman) {
            html += `<div class="handoff-overlay">
                <div class="who" style="color:${color}">請將裝置交給 ${this.players[other].name}</div>
                <div class="note">${p.name} 的手牌已隱藏</div>
                <button class="btn btn-big btn-blue" onclick="game.mulliganHandoff()">轉換玩家</button>
            </div>`;
        } else {
            // Next is a bot — auto-advance
            setTimeout(() => { try { this.mulliganHandoff(); } catch (e) {} }, 300);
        }
    }
    html += this.renderInspect();
    html += `<div id="modal-slot"></div>`;
    return html;
}

voteRematch() {
    if (this.state !== 'gameover') return;
    // When the host is applying a remote action, the voter is the OTHER player.
    const pi = this.netMode
        ? (this._applyingRemote ? (this._remotePlayerIdx ?? 1) : this.localPlayerIdx)
        : 0;
    this._rematchVotes = this._rematchVotes || [false, false];
    if (this._rematchVotes[pi]) return;
    this._rematchVotes[pi] = true;
    this.addLog('sys', `${this.players[pi].name} 按下「再來一局」`);
    this.render();
    if (this.netMode && this.role === 'host' &&
        this._rematchVotes[0] && this._rematchVotes[1]) {
        this._doRematch();
    }
}
_doRematch() {
    if (this.role !== 'host') return;
    // Cancel any pending broadcast from the old game instance
    if (this._broadcastTimer) { clearTimeout(this._broadcastTimer); this._broadcastTimer = null; }
    const cfg = this.cfg;
    cfg.seed = '';
    cfg._rematchVotes = undefined;
    window.game = new Game(cfg);
}
_renderRematchButtons() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    if (v[me]) {
        return `<button class="btn btn-big btn-green" disabled>✅ 已同意（等待對手…）</button>`;

_renderRematchStatus() {

    const myName = this.players[me].name;

renderGameOver() {
    const w = this.gameWinner;
    const color = w === 0 ? '#6fb6ff' : '#ff7b7b';
    // ★ 用「實際玩家類型」判斷，不依賴 cfg.mode（因為本地對戰的 mode 是 'local'）
    const isAIvsAI = this.players.every(p => p.botType);

    // ★ 定時器必須在 return「之前」執行——放後面是死代碼
    if (isAIvsAI && this.cfg.autoRestart && !this._autoRestartQueued) {
        this._autoRestartQueued = true;
        const delay = this.cfg.autoRestartDelay || 2000;
        this._sTO(() => {
            const cfg = JSON.parse(JSON.stringify(this.cfg));

            <button class="btn btn-big btn-gold" onclick="game.downloadReplay()">📥 匯出遊戲記錄</button>
            <button class="btn btn-big" style="background:linear-gradient(180deg,#2a6a4a,#153828);border-color:#44cc88;color:#c8ffe0;" onclick="copyCurrentSeed()">🌱 複製種子</button>

buildReplayExport() {
    return {
        version: this.replay.version,
        createdAt: this.replay.createdAt,
        exportedAt: new Date().toISOString(),
        seed: this.seed,
        mode: this.cfg.mode,
        config: this.replay.config,
        deckTopToBottom: this.replay.deckTopToBottom,
        winner: this.gameWinner,
        totalRounds: this.round,
        finalWins: this.players.map(p => p.wins),
        events: this.replay.events
    };
}
saveReplayToLocal() {
    try {
        const data = this.buildReplayExport();
        const arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
        arr.push(data);
        while (arr.length > 500) arr.shift();
        localStorage.setItem('sanguo_logs', JSON.stringify(arr));
    } catch(e) { console.warn('localStorage 失敗', e); }
}
downloadReplay(auto = false) {
    if (!this.replay) { alert('沒有可匯出的記錄'); return; }
    const json = JSON.stringify(this.buildReplayExport(), null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-replay-${ts}${auto?'-auto':''}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

renderBattlefields() {
    const atSettle = (this.phase === 'settle');
    const activeBi = this.currentBfIndex;
    const roundActive = this.phase === 'turn' && !this.players.every(p => p.passed);
    let h = `<div class="bf-flex">`;
    for (let bi = 0; bi < this.fieldCount; bi++) {
        const isActive = (bi === activeBi);
        const isPast = (bi < activeBi);
        const isFuture = (bi > activeBi);
        const isExpanded = (this.expandedField === bi);
        // 大小判定：手動展開優先，否則當前戰場為大
        const showLarge = isExpanded || (isActive && this.expandedField === null);
        let wrapCls;
        if (showLarge) {
            wrapCls = 'active' + (isExpanded ? ' manually-expanded' : '') + ' expandable';
        } else if (isPast) {
            wrapCls = 'inactive expandable';
        } else {
            wrapCls = 'future expandable';
        }

		// 戰場標題
		let headRes = '';
		if (isPast) {
			const hist = this.history.find(r => r.round === bi + 1);
			if (hist) {
				const totals = (hist.totals && hist.totals.length) ? hist.totals : [hist.f0 || 0, hist.f1 || 0];
				const firstP = (hist.firstPlayer !== undefined) ? hist.firstPlayer : 0;
				const firstCol = PLAYER_COLORS[firstP % PLAYER_COLORS.length];
				const pending = this._pendingFlips && this._pendingFlips[bi];
				const pendingTxt = pending ? ` <span style="color:#ffb347;font-size:10px;">⚠ 待重算</span>` : '';
				headRes = `<div class="bf-meta">
					<div><span class="res">${totals.join(' : ')}（已定）</span>${pendingTxt}</div>
					<div class="bf-first-line">先：<b style="color:${firstCol.text}">${this.players[firstP].name}</b></div>
				</div>`;
			} else {
				headRes = `<span class="res">-</span>`;
			}
		} else if (isActive) {
			const totals = [];
			for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, atSettle));
			// 找領先方
			let leaderPi = 0, maxP = totals[0];
			for (let pi = 1; pi < this.numPlayers; pi++) {
				if (totals[pi] > maxP) { leaderPi = pi; maxP = totals[pi]; }
			}
			const tied = totals.filter(t => t === maxP).length > 1;
			const leaderCol = PLAYER_COLORS[leaderPi % PLAYER_COLORS.length];
			const leaderTxt = tied
				? `<span class="bf-leader" style="color:#a89070;">平手</span>`
				: `<span class="bf-leader" style="color:${leaderCol.text};">${this.players[leaderPi].name} 領先</span>`;
			const firstP = (this.roundFirstPlayer !== null && this.roundFirstPlayer !== undefined)
				? this.roundFirstPlayer : 0;
			const firstCol = PLAYER_COLORS[firstP % PLAYER_COLORS.length];
			headRes = `<div class="bf-meta">
				<div><span class="open">${totals.join(' : ')}</span> ${leaderTxt}</div>
				<div class="bf-first-line">先：<b style="color:${firstCol.text}">${this.players[firstP].name}</b></div>
			</div>`;
		} else {
			headRes = `<span class="res" style="color:#555;">尚未開啟</span>`;
		}

        // 展開提示圖示（非當前戰場才顯示）
        const expandIcon = (!isActive)
            ? `<span class="bf-expand-icon">${isExpanded ? '▼ 收合' : '▷ 展開'}</span>`
            : '';

        // 卡牌大小
        const cardSize = showLarge ? undefined : 'xs';
        const cardExtra = isPast ? 'grey clickable' : (isFuture ? (isExpanded ? 'clickable' : 'grey') : 'clickable');
        // 可被檢視的條件：非未來、或已被展開
        const canInspect = !isFuture || isExpanded || this.expandedField === bi;
        const inspAttr = (c) => canInspect ? `onclick="event.stopPropagation();game.inspect('${c.uid}')"` : '';

        // 只允許非當前戰場展開
        const toggleHandler = isActive ? '' : `onclick="game.toggleFieldExpand(${bi})"`;

        h += `<div class="bf-wrap ${wrapCls}" ${toggleHandler}><div class="bfield">
            <div class="bf-head"><span>${this.battlefields[bi]}${isActive ? ' ★' : ''}${expandIcon}</span>${headRes}</div>`;

        for (let pi = 0; pi < this.numPlayers; pi++) {
            const p = this.players[pi];
            const col = PLAYER_COLORS[pi % PLAYER_COLORS.length];
            const field = p.fields[bi];
            const showPass = isActive && roundActive && p.passed;
            const tot = this.fieldPower(pi, bi, atSettle);
            h += `<div class="bf-row ${showPass ? 'passed' : ''}" style="background:${col.bg};">
                <div class="bf-player-lbl" style="color:${col.text};">${p.name}</div>
                <div class="bf-cards">
                    ${field.length === 0
                        ? `<span class="bf-ghost">等待部屬…</span>`
                        : field.map(c => this.cardHTML(c, {
                            size: cardSize,
                            extra: c.fresh ? ('enter ' + cardExtra) : cardExtra,
                            power: this.getPower(c, pi, bi, atSettle),
                            attr: inspAttr(c)
                        })).join('')}
                </div>
                <div class="bf-total" style="color:${col.text};">${tot}</div>
            </div>`;
        }

        h += `</div></div>`;
    }
    h += `</div>`;
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.fresh = false);
    return h;
}
toggleFieldExpand(bi) {

/* 模擬關羽進場後的最終戰力與敵方能否被斬 */
_predictGuanyuEntry(pi, bi) {
    const hand = this.players[pi].hand;
    const gy = hand.find(c => c.data.id === 'guanyu');
    if (!gy) return null;
    const phantom = {
        uid: '__phantom_gy__', data: gy.data,
        mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null,
        usesLeft: undefined, pendingSilence: false, pendingBurnNext: false,
        pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false,
        _oneShotBuff: undefined, enteredFaceUp: null, _jiushiUsed: false,
        playedBy: pi
    };
    const myField = this.players[pi].fields[bi];
    myField.push(phantom);
    let myPower = 0;
    const enemies = [];
    try {
        myPower = this.getPower(phantom, pi, bi, false);
        const enemyPi = this.opponentOf(pi);
        const enemyField = this.players[enemyPi].fields[bi];
        for (const c of enemyField) {
            if (c.faceDown) {
                enemies.push({ card: c, power: null, kind: 'faceDown' });
            } else if (c.data.isGeneral) {
                enemies.push({ card: c, power: this.getPower(c, enemyPi, bi, false), kind: 'general' });
            } else {
                enemies.push({ card: c, power: this.getPower(c, enemyPi, bi, false), kind: 'normal' });
            }
        }
    } finally {
        myField.pop();
    }
    return { myPower, threshold: myPower - 4, enemies };
}
/* 毒士預測（賈詡用） */
_predictDushiTargets(pi, bi) {
    const enemyPi = this.opponentOf(pi);
    const enemyField = this.players[enemyPi].fields[bi];
    const killable = [], notKill = [], immune = [];
    for (const c of enemyField) {
        if (c.faceDown) { immune.push({ card: c, reason: '蓋牌' }); continue; }
        if (c.data.isGeneral) { immune.push({ card: c, reason: '上將' }); continue; }
        const ep = this.getPower(c, enemyPi, bi, false);
        if (ep <= 3) killable.push({ card: c, power: ep });
        else notKill.push({ card: c, power: ep });
    }
    return { killable, notKill, immune };
}
/* 斬除預測（馬岱 / 徐榮用） */
_predictZhanchuTargets(pi, bi) {
    const enemyPi = this.opponentOf(pi);
    const enemyField = this.players[enemyPi].fields[bi];
    const fodder = enemyField.filter(c => !c.faceDown && c.data.cost === 1);
    const lastFaceUp = this._validLastFaceUpEnemy(enemyPi, bi);
    return { fodder, lastFaceUp };
}
