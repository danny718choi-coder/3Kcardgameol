        }

        return `<div class="control-area">
            <div class="ctrl-info">請 <b style="color:${color}">${this.players[pi].name}${this.aiIcon(pi)}</b> 選擇在結算前可打出的牌</div>
                      ${isAIP && !this.cover ? `<div style="margin:6px 0;"><span class="ai-badge">${this.aiIcon(pi)} 電腦思考中…</span></div>` : ''}
            <div class="ctrl-buttons">
                <button class="btn btn-green" disabled>出牌</button>
                <button class="btn btn-red" ${(this.cover||isAIP) ? 'disabled' : ''} onclick="game.preEndAct()">放棄出牌</button>
            </div></div>`;
    }
    const pi = this.current, p = this.players[pi];
    const color = (PLAYER_COLORS[pi % PLAYER_COLORS.length] || PLAYER_COLORS[0]).text;
    const inst = this.selected ? p.hand.find(c => c.uid === this.selected) : null;
    const bfName = BATTLEFIELDS[this.currentBfIndex];
    const locked = this.cover || this.countdown !== null;
    const isAIP = this.isAI(pi);
    const opponentPassed = this.players[this.opponentOf(pi)].passed;
    let info = '';
    if (this.countdown !== null) info = `⏳ 請查看您新抽到的牌…`;
    else if (this.cover) {
        const nextPi = this.opponentOf(this.current);
        const nextP = this.players[nextPi];
        const nc = nextPi === 0 ? '#6fb6ff' : '#ff7b7b';
        info = `請將裝置交給 <b style="color:${nc}">${nextP.name}${this.aiIcon(nextPi)}</b>`;
    }
    else if (isAIP) info = `<b style="color:${color}">${p.name}${this.aiIcon(pi)}</b> 的回合`;
    else if (inst) info = `已選：<b>${inst.data.name}</b>（${inst.data.cost}糧 / ${inst.data.power}戰力）　→ 將出牌至【<b style="color:#ffd700">${bfName}</b>】`;
        else info = `<b style="color:${color}">${p.name}</b> 的回合　—　<span style="color:#7cff7c;font-weight:bold;">👆 點擊下方手牌</span> 選擇要出的牌（出牌至【${bfName}】）`;
    if (opponentPassed && !locked && !isAIP) info += `　<span style="color:#ff9c4a;">（對手已放棄跟牌，你可繼續出牌或放棄）</span>`;
    const hasQuanheng = !locked && !isAIP && p.fields.some(f => f.some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('權衡')));
    const hasLianying = !locked && !isAIP &&
        p.fields[this.currentBfIndex].some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('連營')) &&
        this.players[this.opponentOf(pi)].fields[this.currentBfIndex].some(c => !c.faceDown && !c.burn);
    const hasJiushi = !locked && !isAIP && !!this.findJiushiCard(pi);
    let skillBox = '';
    if (this.countdown !== null) {
        const newCard = p.hand.find(c => c.justDrawn);
        if (newCard) {
            skillBox = `<div class="sel-skill-box new-draw">
                <div class="skill-name">🆕 ${newCard.data.name}${newCard.data.title ? ` <span class="ttl">${newCard.data.title}</span>` : ''}
                    <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[newCard.data.faction].name}｜${newCard.data.cost}糧｜${newCard.data.power}戰力</span></div>
                <div class="skill-desc">${newCard.data.desc.replace(/\n/g,'<br>')}</div></div>`;
        }
    } else if (inst && !locked) {
        skillBox = `<div class="sel-skill-box">
            <div class="skill-name">${inst.data.name}${inst.data.title ? ` <span class="ttl">${inst.data.title}</span>` : ''}
                <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[inst.data.faction].name}｜${inst.data.cost}糧｜${inst.data.power}戰力</span></div>
            <div class="skill-desc">${inst.data.desc.replace(/\n/g,'<br>')}</div></div>`;
    }
    let fieldPicker = '';
    if (inst && !locked && !isAIP) {
        const allowed = this.getPlayableFields(inst, pi);
        if (allowed.length > 1) {
            const buttons = allowed.map(f => {
                const isCur = f === this.currentBfIndex;
                const on = (this.selectedField !== null) ? this.selectedField === f : isCur;
                const label = isCur ? `${BATTLEFIELDS[f]}（當前）` : BATTLEFIELDS[f];
                return `<button class="btn ${on ? 'btn-gold' : ''}" style="padding:6px 14px;font-size:13px;" onclick="game.selectField(${f})">${label}</button>`;
            }).join('');
            fieldPicker = `<div style="margin-top:8px;"><div style="font-size:12px;color:#c8a040;letter-spacing:1px;margin-bottom:5px;">選擇陣地</div><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">${buttons}</div></div>`;
        }
    }
    /* ★ v3.4: 關羽斬將預測提示 */
    let guanyuHint = '';
    if (inst && inst.data.id === 'guanyu' && !locked && !isAIP) {
        const pred = this._predictGuanyuEntry(pi, this.currentBfIndex);
        if (pred) {
            const killable   = pred.enemies.filter(e => e.kind === 'normal' && e.power <= pred.threshold);
            const notKill    = pred.enemies.filter(e => e.kind === 'normal' && e.power > pred.threshold);
            const immune     = pred.enemies.filter(e => e.kind !== 'normal');
            let parts = [];
            if (killable.length > 0) {
                parts.push(`<span style="color:#7cff7c;">✔ 可斬：${killable.map(e => `${e.card.data.name}(${e.power})`).join('、')}</span>`);
            }
            if (notKill.length > 0) {
                parts.push(`<span style="color:#ff9c4a;">✘ 無法斬：${notKill.map(e => `${e.card.data.name}(${e.power})`).join('、')}</span>`);
            }
            if (immune.length > 0) {
                parts.push(`<span style="color:#a89070;">⊘ 免疫：${immune.map(e => `${e.card.data.name}(${e.kind === 'general' ? '上將' : '蓋牌'})`).join('、')}</span>`);
            }
            if (parts.length === 0) parts.push('<span style="color:#a89070;">對陣無敵軍</span>');
            guanyuHint = `<div style="margin-top:8px;padding:6px 12px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.35);border-radius:6px;font-size:12.5px;line-height:1.75;text-align:left;">
                <b style="color:#ffd700;">⚔️ 關羽進場預測</b>（含所有被動後｜戰力 <b style="color:#ffd700;">${pred.myPower}</b>｜斬將門檻：敵方戰力 ≤ <b style="color:#ffd700;">${pred.threshold}</b>）<br>
                ${parts.join('　｜　')}
            </div>`;
        }
    }

    /* ★ 毒士 預測提示 */
    let dushiHint = '';
    if (inst && inst.data.id === 'jiaxu' && !locked && !isAIP) {
        const p = this._predictDushiTargets(pi, this.currentBfIndex);
        let parts = [];
        if (p.killable.length > 0) {
            parts.push(`<span style="color:#7cff7c;">✔ 可移除：${p.killable.map(e => `${e.card.data.name}(${e.power})`).join('、')}</span>`);
        }
        if (p.notKill.length > 0) {
            parts.push(`<span style="color:#ff9c4a;">✘ 戰力>3：${p.notKill.map(e => `${e.card.data.name}(${e.power})`).join('、')}</span>`);
        }
        if (p.immune.length > 0) {
            parts.push(`<span style="color:#a89070;">⊘ 免疫：${p.immune.map(e => `${e.card.data.name}(${e.reason})`).join('、')}</span>`);
        }
        if (parts.length === 0) parts.push('<span style="color:#a89070;">對陣無敵軍</span>');
        dushiHint = `<div style="margin-top:8px;padding:6px 12px;background:rgba(180,80,220,.10);border:1px solid rgba(180,80,220,.45);border-radius:6px;font-size:12.5px;line-height:1.75;text-align:left;">
            <b style="color:#d090ff;">☠️ 毒士預測</b>（門檻：敵方最終戰力 ≤ 3）<br>
            ${parts.join('　｜　')}
        </div>`;
    }

    /* ★ 斬除 預測提示（馬岱 / 徐榮） */
    let zhanchuHint = '';
    if (inst && (inst.data.id === 'madai' || inst.data.id === 'xurong') && !locked && !isAIP) {
        const p = this._predictZhanchuTargets(pi, this.currentBfIndex);
        let parts = [];
        if (p.fodder.length > 0) {
            parts.push(`<span style="color:#7cff7c;">✔ 優先移除（1糧）：${p.fodder.map(c => `${c.data.name}(${c.data.cost}糧)`).join('、')}</span>`);
        } else if (p.lastFaceUp) {
            const ep = this.getPower(p.lastFaceUp, this.opponentOf(pi), this.currentBfIndex, false);
            parts.push(`<span style="color:#ffd700;">→ 無 1 糧敵軍，將對 ${p.lastFaceUp.data.name}(${ep}) 造成 1 傷害並沉默</span>`);
        } else {
            parts.push(`<span style="color:#a89070;">對陣無 1 糧敵軍，且無最後正面敵軍 → 不觸發</span>`);
        }
        zhanchuHint = `<div style="margin-top:8px;padding:6px 12px;background:rgba(80,200,80,.08);border:1px solid rgba(80,200,80,.4);border-radius:6px;font-size:12.5px;line-height:1.75;text-align:left;">
            <b style="color:#7cff7c;">🗡️ 斬除預測</b><br>
            ${parts.join('　｜　')}
        </div>`;
    }

    const allHints = guanyuHint + dushiHint + zhanchuHint;
    if (isAIP && !this.cover) {
        return `<div class="control-area"><div class="ctrl-info">${info}</div><div style="margin:6px 0;"><span class="ai-badge">${this.aiIcon(pi)} 電腦思考中…</span></div>${allHints}${skillBox}</div>`;
    }
    return `<div class="control-area">
        <div class="ctrl-info">${info}</div>
        ${allHints}
        <div class="ctrl-buttons">
            <button class="btn btn-green" ${(!inst || locked || !this.canPlayNormally(inst, pi)) ? 'disabled' : ''} onclick="game.doPlay(false)">出牌</button>
            ${(inst && this.canPlayAmbush(inst, pi)) ? `<button class="btn btn-purple" ${locked ? 'disabled' : ''} onclick="game.doPlay(true)">埋伏出牌</button>` : ''}
            <button class="btn btn-red" ${(locked || p.passed) ? 'disabled' : ''} onclick="game.doPass()">放棄跟牌</button>
            ${hasQuanheng ? `<button class="btn btn-purple" onclick="game.openQuanheng()">權衡</button>` : ''}
            ${hasLianying ? `<button class="btn btn-purple" onclick="game.openLianying()">連營</button>` : ''}
            ${hasJiushi ? `<button class="btn btn-gold" onclick="game.activateJiushi()">酒詩（返回手牌）</button>` : ''}
        </div>${fieldPicker}${skillBox}</div>`;
}
renderQuickChat() {
    if (!this.chatEnabled) return '';
    if (this.state === 'gameover') return '';
    const me = this.netMode ? this.localPlayerIdx : this.current;
    const isAIP = this.isAI(me);
    const allBots = this.players.every(p => p.botType);
    const canAct = !allBots && !isAIP && !this.cover && this.countdown === null;
    const expanded = this._chatExpanded !== false;
    const toggleBtn = `<button class="qc-btn qc-toggle" onclick="game.toggleChatExpand()" title="${expanded ? '收合聊天' : '展開聊天'}">${expanded ? '▼' : '▲'} 💬</button>`;

    if (!expanded) {
        return `<div class="quick-chat collapsed">
            <span style="font-size:12px;color:#a89070;">💬 聊天已收合</span>
            ${toggleBtn}
        </div>`;
    }

    const presetBtns = CHAT_MSG.map((t, i) => {
        const displayText = t.replace(/\n/g, ' ');
        return `<button class="qc-btn" data-qc ${canAct ? '' : 'disabled'} onclick="sendChat(CHAT_MSG[${i}])">${displayText}</button>`;
    }).join('');
    const emojiBtns = CHAT_EMOJI.map((e, i) =>
        `<button class="qc-btn qc-emoji" data-qc ${canAct ? '' : 'disabled'} onclick="sendChat(CHAT_EMOJI[${i}])">${e}</button>`
    ).join('');
    const hint = allBots ? '<span style="font-size:11px;color:#888;">（AI 自動對話中）</span>'
                : (isAIP ? '<span style="font-size:11px;color:#888;">（等待 AI 行動…）</span>' : '');
    return `<div class="quick-chat">
        <div class="qc-header">
            <span>💬 快速聊天 ${hint}</span>
            <span style="display:flex;gap:8px;align-items:center;">${toggleBtn}<span class="qc-cooldown" id="qc-cooldown"></span></span>
        </div>
        <div class="qc-row">${presetBtns}</div>
        <div class="qc-row">${emojiBtns}</div>
    </div>`;
}
toggleChatExpand() {
    this._chatExpanded = !this._chatExpanded;
    safeStore.set('sanguo_chatExpanded', this._chatExpanded ? '1' : '0');
    this.render();
}
renderHands() {
    const pi = this.netMode ? this.localPlayerIdx : this.current;
    const p = this.players[pi];
    if (!p) return '';
    const color = pi === 0 ? '#6fb6ff' : (pi === 1 ? '#ff7b7b' : (pi === 2 ? '#7cff7c' : '#d090ff'));
    const cap = this.cfg.maxFood;
    const opponentIsHuman = !this.isAI(this.opponentOf(pi));
    const hideHand = !this.netMode && this.isAI(pi) && opponentIsHuman;
    if (this.phase === 'preend') {
        const pep = this.preEndOrder[this.preEndIdx], pp = this.players[pep];
        const hidePep = this.isAI(pep) && !this.isAI(this.opponentOf(pep));
        const canPlay = !this.isAI(pep) && !this.cover && !this.preEndDone[this.preEndIdx];
        const pendingFood = pp.fields[this.currentBfIndex].filter(c => c.faceDown).reduce((s,c) => s + c.data.cost, 0);
        const pendingTxt = pendingFood > 0 ? `　<span class="hand-pending">（背面牌將消耗 ${pendingFood} 糧）</span>` : '';
        const drawnHint = pp.hand.some(c => c.justDrawn) ? `<span style="color:#7cff7c;font-size:12px;margin-left:6px;">● 綠框為新抽到的牌</span>` : '';
        return `<div class="hand-wrap"><div class="hand-title" style="color:${pep === 0 ? '#6fb6ff' : '#ff7b7b'}">${pp.name}${this.aiIcon(pep)} 的手牌（${pp.hand.length}）　糧草：${pp.food}/${cap}${pendingTxt}${drawnHint}</div>
            <div class="hand-row">${(this.cover || hidePep) ? `<span style="color:#666;font-size:13px;padding:20px;">${hidePep?'🤖 AI 的手牌已隱藏':'手牌已隱藏'}</span>` :
                (pp.hand.map(c => {
                    if (canPlay) {
                        const playable = this.canPlayNormally(c, pep) || this.canPlayAmbush(c, pep);
                        const sel = this.selected === c.uid ? 'sel' : '';
                        const dim = playable ? '' : 'dim';
                        return this.cardHTML(c, { extra: `${sel} ${dim} clickable`, attr: `onclick="game.selectCard('${c.uid}')"` });
                    }
                    return this.cardHTML(c, { extra:'dim clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` });
                }).join('') || '<span style="color:#a89070;font-size:13px;font-style:italic;padding:20px;">（手牌已出盡）</span>')}</div></div>`;
    }
    if (this.phase === 'settle')
        return `<div class="hand-wrap"><div class="hand-title">手牌</div><div class="hand-row"><span style="color:#666;font-size:13px;padding:20px;">結算中…</span></div></div>`;
    if (this.cover)
        return `<div class="hand-wrap"><div class="hand-title" style="color:${color}">${p.name}${this.aiIcon(pi)} 的手牌（${p.hand.length}）　糧草：${p.food}/${cap}</div><div class="hand-row">${p.hand.map(c => this.cardHTML(c, { noHighlight: true })).join('') || '<span style="color:#666;">無手牌</span>'}</div></div>`;
    if (hideHand)
        return `<div class="hand-wrap"><div class="hand-title" style="color:${color}">${p.name}${this.aiIcon(pi)} 的手牌（${p.hand.length}）　糧草：${p.food}/${cap}</div><div class="hand-row">${p.hand.map(()=>`<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`).join('')}</div></div>`;
    const pendingFood = p.fields[this.currentBfIndex].filter(c => c.faceDown).reduce((s,c) => s + c.data.cost, 0);
    const pendingTxt = pendingFood > 0 ? `　<span class="hand-pending">（背面牌將消耗 ${pendingFood} 糧）</span>` : '';
    const cards = p.hand.map(c => {
        const playable = this.canPlayNormally(c, pi) || this.canPlayAmbush(c, pi);
        const sel = this.selected === c.uid ? 'sel' : '';
        const dim = (!playable || this.countdown !== null) ? 'dim' : '';
        return this.cardHTML(c, { extra: `${sel} ${dim} clickable`, attr: `onclick="game.selectCard('${c.uid}')"` });
    }).join('');
    const drawnHint = p.hand.some(c => c.justDrawn) ? `<span style="color:#7cff7c;font-size:12px;margin-left:6px;">● 綠框為新抽到的牌</span>` : '';
    return `<div class="hand-wrap">
        <div class="hand-title" style="color:${color}">${p.name}${this.aiIcon(pi)} 的手牌（${p.hand.length}）　糧草：${p.food}/${cap}${pendingTxt}${drawnHint}${p.mustFaceUp ? '　<span style="color:#ff9c4a;">【嘲諷】必須正面出牌</span>' : ''}</div>
        <div class="hand-row">${cards || '<span style="color:#666;">無手牌</span>'}</div></div>`;
}
renderHistory() {
    if (this.history.length === 0) return `<div class="side-panel"><h4>戰 報</h4><div style="font-size:11px;color:#666;">尚無紀錄</div></div>`;
    let h = `<div class="side-panel"><h4>戰 報</h4>`;
    this.history.slice().reverse().forEach(r => {
        const totals = (r.totals && r.totals.length) ? r.totals : [r.f0 || 0, r.f1 || 0];
        const winTeam = this.teams ? this.seatTeam[r.winner] : null;
        let rows = '';
        for (let i = 0; i < this.numPlayers; i++) {
            const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
            const isFirst = (i === r.firstPlayer);
            const isWin = (i === r.winner) || (winTeam !== null && this.seatTeam[i] === winTeam);
            const roleTxt = isFirst ? '先' : '後';
            const resultTxt = isWin ? '勝' : '負';
            const resultColor = isWin ? '#44ff44' : '#ff6b6b';
            rows += `<div class="hist-line" style="font-size:11px;">
                <span style="color:${col.text};">${this.players[i].name}（${roleTxt}）</span>
                <span><b style="color:${col.text};">${totals[i] || 0}</b> <span style="color:${resultColor};font-weight:bold;">${resultTxt}</span></span>
            </div>`;
        }
        h += `<div class="hist-item">
            <div><span class="rnd">第 ${r.round} 輪 · ${r.battlefield}</span></div>
            ${rows}
        </div>`;
    });
    h += `</div>`;
    return h;
}
openDeckViewer() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

    const me = this.netMode ? this.localPlayerIdx : this.current;

    // ---- Build the theoretical card pool from config ----
    const sets = this.cfg.cardSets || {
        vanilla:  { shu:true, wei:true, wu:true, qun:true },
        extended: { shu:true, wei:true, wu:true, qun:true }
    };
    const pool = [];
    CARD_DB.forEach(def => {
        const setCfg = sets[def.set];
        if (!setCfg || !setCfg[def.faction]) return;
        const n = def.count || 1;
        for (let i = 0; i < n; i++) pool.push(def);
    });
    pool.sort((a, b) => (a.cardId || '').localeCompare(b.cardId || '') || a.name.localeCompare(b.name));

    // ---- Snapshot current zones ----
    const myHandInsts   = [...this.players[me].hand];
    const archiveInsts  = [...this.archive];
    const fieldInsts    = [];
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => fieldInsts.push(c));

    // ---- Greedy match pool slots to known instances ----
    const rendered = pool.map(def => {
        let idx = myHandInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { myHandInsts.splice(idx, 1); return { def, status: 'myhand' }; }
        idx = archiveInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { archiveInsts.splice(idx, 1); return { def, status: 'archive' }; }
        idx = fieldInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { fieldInsts.splice(idx, 1); return { def, status: 'field' }; }
        return { def, status: 'unknown' };
    });

    // ---- Render ----
    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    rendered.forEach(item => { if (byFac[item.def.faction]) byFac[item.def.faction].push(item); });

    const legend = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;text-align:center;line-height:1.9;">
        🌕 <span style="color:#ffd700;">黃框</span>＝我方手牌　｜　⬛ <span style="color:#888;">灰暗</span>＝已打出或已棄置　｜　🔲 一般＝未知（牌庫或對手手牌）
        <br>共 <b style="color:#ffd700;">${pool.length}</b> 張
    </div>`;

    let content = '';
    FACTION_ORDER.forEach(f => {
        const list = byFac[f];
        if (!list || !list.length) return;
        content += `<div class="viewer-section"><h3>${FACTION_INFO[f].name}（${list.length} 張）</h3><div class="viewer-grid">`;
        content += list.map(item => {
            const wrapCls = item.status === 'myhand'
                ? 'viewer-card-wrap in-hand'
                : (item.status === 'archive' || item.status === 'field')
                    ? 'viewer-card-wrap in-played'
                    : 'viewer-card-wrap';
            return `<div class="${wrapCls}" onclick="inspectDefFromViewer('${item.def.id}')">
                ${cardHTMLStatic(item.def)}
            </div>`;
        }).join('');
        content += `</div></div>`;
    });

    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal viewer-modal" onclick="event.stopPropagation()">
        <h2>牌庫檢視</h2>
        ${legend}
        <div style="max-height:68vh;overflow-y:auto;padding:0 4px;">${content}</div>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div>
    </div></div>`;
}
renderArchive() {
    const groups = {};
    FACTION_ORDER.forEach(f => groups[f] = []);
    this.archive.forEach(c => { if (groups[c.data.faction]) groups[c.data.faction].push(c); });
    FACTION_ORDER.forEach(f => groups[f].sort((a,b) => (a.data.cost-b.data.cost) || (a.data.power-b.data.power)));
    let h = `<div class="side-panel"><h4 style="display:flex;justify-content:space-between;align-items:center;">
        <span>棄 牌 區 (${this.archive.length})</span>
        <button class="btn" style="padding:2px 8px;font-size:11px;" onclick="game.openDeckViewer()">👁 查看牌庫</button>
    </h4><div class="arch-scroll">`;
    let any = false;
    FACTION_ORDER.forEach(f => {
        if (!groups[f].length) return;
        any = true;
        h += `<div class="arch-fac">${FACTION_INFO[f].name}</div><div class="arch-row">`;
        h += groups[f].map(c => this.cardHTML(c, { size:'sm', extra:'grey clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('');
        h += `</div>`;
    });
    if (!any) h += `<div style="font-size:11px;color:#666;">尚無卡牌</div>`;
    h += `</div></div>`;
    return h;
}
renderLog() {
    return `<div class="log">${this.logs.map(l => {
        let c = 'l-sys';
        if (l.type === 0) c = 'l-p0';
        if (l.type === 1) c = 'l-p1';
        if (l.type === 'bat') c = 'l-bat';
        if (l.type === 'skill') c = 'l-skill';
        return `<div class="e ${c}">${l.msg}</div>`;
    }).join('')}</div>`;
}
calcInspectPower(c) {
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            if (this.players[pi].fields[bi].includes(c))
                return this.getPower(c, pi, bi, false);
    return Math.max(0, c.data.power + (c.mod || 0));
}
renderInspect() {
    if (!this.inspectCard) return '';
    const c = this.inspectCard, d = c.data, fac = FACTION_INFO[d.faction];
    const actualPower = this.calcInspectPower(c);
    const isZhuge = d.id === 'zhugeliang';
    const base = d.power;
    const bonus = actualPower - base;
    let bonusDisplay = '';
    if (!isZhuge && bonus !== 0) {
        const col = bonus > 0 ? '#7cff7c' : '#ff6b6b';
        bonusDisplay = ` ｜ 現時戰力 <b style="color:${col}">${actualPower} (${bonus > 0 ? '+' : ''}${bonus})</b>`;
    } else if (isZhuge) bonusDisplay = ` ｜ 空城戰力 <b style="color:#ffd700">3×疑兵數</b>`;
    return `<div class="overlay" onclick="game.closeInspect()">
        <div class="modal inspect-modal" onclick="event.stopPropagation()">
            <div class="inspect-layout">
                <div>${this.cardHTML(c, { forceReveal: true, noHighlight: true, power: actualPower })}</div>
                <div class="inspect-body">
                    <h2>${d.name}</h2>
                    ${d.title ? `<div class="inspect-title">${d.title}</div>` : ''}
                    <div class="inspect-stats"><b>${fac.name}</b> ｜ 糧草 <b>${d.cost}</b> ｜ 基礎戰力 <b>${d.power}</b>${bonusDisplay}</div>
                    <div class="inspect-desc">${d.desc.replace(/\n/g,'<br>')}</div>
                </div>
            </div>
            <div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-red" onclick="game.closeInspect()">關閉</button>
                ${faqButtonHTML(d.cardId)}
            </div>
        </div></div>`;
}

            }).join('')}</div>

                <button class="btn btn-green" onclick="game.qhConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.qhCancel()">取消</button></div>
        </div></div>`;
    }
    if (this.lianying) {
        const pi = this.current, opp = this.players[this.opponentOf(pi)], bi = this.currentBfIndex;
        const targets = opp.fields[bi].filter(c => !c.faceDown);
        h += `<div class="overlay"><div class="modal">
            <h2>陸遜 · 連營</h2>

            <div class="modal-cards">${targets.length === 0 ? '<span style="color:#666;">對陣沒有可指定的正面牌</span>' :
                targets.map(c => {
                    const on = this.lianying.sel === c.uid;
                    return this.cardHTML(c, { extra: (on ? 'sel' : '') + ' clickable', noHighlight: true, attr: `onclick="game.lySelect('${c.uid}')"` });
                }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-green" ${this.lianying.sel === null ? 'disabled' : ''} onclick="game.lyConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.lyCancel()">取消</button></div>
        </div></div>`;
    }
    if (this.jianxiong && !this.isAI(this.jianxiong.pi)) {

            <h2>曹操 · 奸雄</h2>

        const targets = opp.fields[bi].filter(c => candidates.includes(c.uid));

        </div></div>`;

                <button class="btn btn-green btn-big" onclick="game.paymentConfirm()">✅ 確認支付順序</button>
            </div>
        </div></div>`;
    }	
    return h;
}

function importLogFromFile() {
    let input = document.getElementById('import-log-file');
    if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'import-log-file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        input.onchange = e => handleImportLog(e);
        document.body.appendChild(input);
    }
    input.click();
}
function handleImportLog(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            const logs = Array.isArray(data) ? data : [data];
            const valid = logs.filter(l => l && (l.events || l.config || l.deckTopToBottom));
            if (valid.length === 0) { alert('檔案中沒有有效的對戰記錄'); return; }
            const existing = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
            valid.forEach(l => existing.push(l));
            localStorage.setItem('sanguo_logs', JSON.stringify(existing));
            alert(`✅ 已匯入 ${valid.length} 份記錄（目前共 ${existing.length} 份）`);
            const el = document.getElementById('local-log-count');
            if (el) el.textContent = `（目前快取 ${existing.length} 份）`;
            const viewer = document.getElementById('modal-slot');
            if (viewer && viewer.querySelector('.log-viewer')) openLogViewer();
        } catch(err) {
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    ev.target.value = '';
}

                const hands = (ev.hands || []).map((h, i) => `P${i} [${h.map(cardName).join(', ')}]`).join('｜');

            case 'pass': d = `P${ev.player} 放棄`; break;
            case 'general_pass': d = `P${ev.player} 上將 ${cardName(ev.cardId)} 自動放棄`; break;
            case 'settle': d = `戰場 ${BATTLEFIELDS[ev.battlefield]}｜${ev.f0} vs ${ev.f1} → P${ev.winner} 勝｜比分 ${ev.blueWins}:${ev.redWins}`; break;
            case 'game_over': d = `勝者 P${ev.winner}｜總輪數 ${ev.totalRounds}`; break;
            case 'zhanjiang': d = `P${ev.player} 斬將 ${cardName(ev.targetId)}`; break;
            case 'lianying': d = `P${ev.player} 連營 ${cardName(ev.targetId)}`; break;
            case 'jianxiong': d = `P${ev.player} 猜 ${ev.guess} ${ev.hit?'命中':'未中'}`; break;
            case 'benxi_swap': d = `P${ev.player} 奔襲 ${cardName(ev.movedId)} ${BATTLEFIELDS[ev.from]}→${BATTLEFIELDS[ev.to]}`; break;
            case 'scry': d = `P${ev.player} 觀星 頂部: ${(ev.top3||[]).map(cardName).join(', ')}`; break;
            case 'quanheng': d = `P${ev.player} 權衡 棄 [${(ev.discarded||[]).map(cardName).join(', ')}]`; break;
            case 'quhu': d = `P${ev.player} 荀彧驅虎 ${cardName(ev.targetId)} → ${BATTLEFIELDS[ev.dest]}`; break;
            case 'qice_play': d = `P${ev.player} 荀攸奇策追加 ${cardName(ev.cardId)} 至 ${BATTLEFIELDS[ev.field]}｜餘糧 ${ev.foodAfter}`; break;
            case 'draw': d = `P${ev.player} 抽 ${cardName(ev.cardId)}`; break;
            default: d = JSON.stringify(ev).slice(0, 200);
        }
        return `<div class="ev">${i}${r}${t}<span class="ev-d">${d}</span></div>`;

    const header = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;">

    const eventsHtml = events.map(fmt).join('');

/* v3.7: 卡片庫 — set 篩選 + 勝率排序 */
window.__viewerVanilla  = (typeof window.__viewerVanilla  === 'undefined') ? true : window.__viewerVanilla;
window.__viewerExtended = (typeof window.__viewerExtended === 'undefined') ? true : window.__viewerExtended;

function openViewer() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

    // ---- 建立牌池（僅依卡片庫自己的 set 開關，不看設定頁） ----
    const pool = [];
    CARD_DB.forEach(d => {
        if (d.set === 'vanilla'  && !window.__viewerVanilla)  return;
        if (d.set === 'extended' && !window.__viewerExtended) return;
        const n = d.count || 1;
        for (let i = 0; i < n; i++) pool.push({ def: d, idx: i, total: n });
    });

    // ---- 讀取統計 ----
    const stats = loadCardStats();
    const getRate = (id, bucket) => {
        const s = stats[bucket] && stats[bucket][id];
        if (!s || !s.plays) return null;
        return s.wins / s.plays;
    };
    const getPlays = (id, bucket) => {
        const s = stats[bucket] && stats[bucket][id];
        return s ? s.plays : 0;
    };

    // ---- 排序 ----
    if (viewerMode === 'id') {
        pool.sort((a, b) => {
            const ai = a.def.cardId || '';
            const bi = b.def.cardId || '';
            if (ai !== bi) return ai.localeCompare(bi);
            return a.idx - b.idx;
        });
    } else if (viewerMode === 'sort') {
        pool.sort((a, b) => {
            const ac = a.def.cost - b.def.cost;
            if (ac !== 0) return ac;
            const ap = a.def.power - b.def.power;
            if (ap !== 0) return ap;
            return a.idx - b.idx;
        });
    } else if (viewerMode === 'aiRate' || viewerMode === 'playerRate') {
        const bucket = (viewerMode === 'aiRate') ? 'ai' : 'player';
        pool.sort((a, b) => {
            const ra = getRate(a.def.id, bucket);
            const rb = getRate(b.def.id, bucket);
            if (ra === null && rb === null) return (a.def.cardId||'').localeCompare(b.def.cardId||'');
            if (ra === null) return 1;
            if (rb === null) return -1;
            if (rb !== ra) return rb - ra;
            return getPlays(b.def.id, bucket) - getPlays(a.def.id, bucket);
        });
    }

    // ---- 分陣營 ----
    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    pool.forEach(item => { if (byFac[item.def.faction]) byFac[item.def.faction].push(item); });

    // ---- 內容 ----
    const showStats = (viewerMode === 'aiRate' || viewerMode === 'playerRate');
    const statBucket = (viewerMode === 'aiRate') ? 'ai' : 'player';
    let content = '';
    FACTION_ORDER.forEach(f => {
        if (!byFac[f] || !byFac[f].length) return;
        content += `<div class="viewer-section"><h3>${FACTION_INFO[f].name}（${byFac[f].length} 張）</h3><div class="viewer-grid">`;
        content += byFac[f].map(item => {
            const d = item.def;
            const badge = item.total > 1 ? `<div class="viewer-badge">${item.idx + 1}/${item.total}</div>` : '';
            let statBadge = '';
            if (showStats) {
                const s = stats[statBucket][d.id];
                if (s && s.plays > 0) {
                    const pct = Math.round((s.wins / s.plays) * 100);
                    const col = pct >= 60 ? '#7cff7c' : (pct >= 40 ? '#ffd700' : '#ff7b7b');
                    const tip = `「打出此牌的玩家」贏得該輪的比例\n（出場 ${s.plays} 次，勝 ${s.wins} 次）`;
statBadge = `<div title="${tip}" style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.85);color:${col};font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid ${col};font-weight:bold;z-index:2;cursor:help;">${pct}% (${s.plays})</div>`;
                } else {
                    statBadge = `<div style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.5);color:#777;font-size:11px;padding:2px 6px;border-radius:4px;z-index:2;">—</div>`;
                }
            }
            return `<div class="viewer-card-wrap" style="position:relative;" onclick="inspectDefFromViewer('${d.id}')">${cardHTMLStatic(d)}${badge}${statBadge}</div>`;
        }).join('');
        content += `</div></div>`;
    });

    const btnVanilla  = `<button class="${window.__viewerVanilla  ? 'on' : ''}" onclick="toggleViewerSet('vanilla')">標準</button>`;
    const btnExtended = `<button class="${window.__viewerExtended ? 'on' : ''}" onclick="toggleViewerSet('extended')">擴展</button>`;

    const sortBtns = `
        <button class="${viewerMode === 'id' ? 'on' : ''}" onclick="setViewerMode('id')">依編號</button>
        <button class="${viewerMode === 'sort' ? 'on' : ''}" onclick="setViewerMode('sort')">依糧草+戰力</button>
        <button class="${viewerMode === 'aiRate' ? 'on' : ''}" onclick="setViewerMode('aiRate')">🤖 AI 勝率</button>
        <button class="${viewerMode === 'playerRate' ? 'on' : ''}" onclick="setViewerMode('playerRate')">🧑 玩家勝率</button>
    `;

	const statsHint = showStats
		? `<p style="font-size:12px;color:#a89070;text-align:center;margin:6px 0 10px;line-height:1.7;">
			 ${statBucket === 'ai'
				? '🤖 僅統計「困難 AI vs 困難 AI」對局'
				: '🧑 僅統計人類玩家對局'}<br>
			 <span style="color:#ffd700;">勝率＝打出此牌的玩家最後贏得該輪的比例</span>

function exportCardStats() {
    const stats = loadCardStats();
    const buildBucket = (bucket) => {
        const out = {};
        Object.entries(bucket || {}).forEach(([id, s]) => {
            if (!s || !s.plays) return;
            const def = CARD_DB.find(d => d.id === id);
            out[id] = {
                name: def ? def.name : id,
                cardId: def ? def.cardId : '?',
                faction: def ? def.faction : '?',
                cost: def ? def.cost : null,
                power: def ? def.power : null,
                plays: s.plays,
                wins: s.wins,
                losses: s.plays - s.wins,
                winRate: s.plays > 0 ? +( (s.wins / s.plays) * 100 ).toFixed(2) : null
            };
        });
        return out;
    };
    const payload = {
        exportedAt: new Date().toISOString(),
        version: 1,
        description: '三國風雲 — 卡片勝率統計匯出',
        note: 'winRate 單位為 %；plays = 出場次數；wins = 該牌打出的陣營贏得該輪的次數',
        ai: buildBucket(stats.ai),
        player: buildBucket(stats.player)
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-cardstats-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const NET_ACTION_METHODS = [
    'selectCard','selectField','doPlay','doPass','preEndAct','handoff','nextRound',
    'revealFlip','beginBattle',
    'mulliganRedraw','mulliganSkip','mulliganConfirm',
    'scryToggle','scryConfirm','scrySkip',
    'qhToggle','qhConfirm','qhCancel',
    'lySelect','lyConfirm','lyCancel',
    'jxGuess','jxConfirm','jxSkip',
    'guanyuSelect','guanyuConfirm','guanyuSkip',
    'xunyuSelect','xunyuSelectDest','xunyuConfirm','xunyuSkip',
    'xunyouSelect','xunyouConfirm','xunyouSkip',
    'activateJiushi',
    'voteRematch'
];
NET_ACTION_METHODS.forEach(name => {
    const orig = Game.prototype[name];
    if (typeof orig !== 'function') return;
    Game.prototype[name] = function (...args) {
        if (this.netMode && this.role === 'guest' && !this._applyingRemote) {
            if (this._sendAction) this._sendAction({ action: name, args });
            return;
        }
        return orig.apply(this, args);
    };
});

/* ============ Auto-advance turn in net mode ============ */
const _origStartCountdown = Game.prototype.startCountdown;
Game.prototype.startCountdown = function (onDone) {
    if (this.netMode) {
        const wrapped = () => {
            try { onDone(); } catch (e) { console.error(e); }
            if (this.phase === 'turn' && this.state === 'battle') {
                this.advanceTurn();
            }
        };
        _origStartCountdown.call(this, wrapped);
        return;
    }
    return _origStartCountdown.apply(this, arguments);
};

/* ============ Render override: broadcast (host) + wait screen (guest) ============ */
const _origRender = Game.prototype.render;
Game.prototype.render = function () {
    // In net mode, "cover" (device handoff) is never needed.
    if (this.netMode) this.cover = false;
    if (this.netMode && this.role === 'guest' && !this._hasReceivedState && this.state !== 'gameover') {
        document.getElementById('app').innerHTML = `
            <div class="setup" style="text-align:center;max-width:600px;">
                <h1>三 國 風 雲</h1>
                <div class="sub">線上對戰 — 連線中</div>
                <div style="padding:30px 20px;font-size:16px;line-height:2;color:#e0c080;">
                    正在等待房主開始遊戲…<br>
                    <span style="color:#7cff7c;">● 已連線</span>
                </div>
                <button class="btn btn-red" onclick="cancelNet()">取消</button>
            </div>`;
        return;
    }
    const r = _origRender.apply(this, arguments);
    if (this.netMode && this.role === 'host' && this._broadcast) {
        if (this._broadcastTimer) clearTimeout(this._broadcastTimer);
        this._broadcastTimer = setTimeout(() => {
            this._broadcastTimer = null;
            try { this._broadcast(this.serializeForPlayer(1)); } catch (e) { console.error(e); }
        }, 40);
    }
    return r;
};

        sendToBottom: !!(document.getElementById('cfg-sendToBottom') || {}).checked,
        initialFood : num('cfg-initialFood', 7),
        winBonus    : num('cfg-winBonus', 1),
        baseRefill  : num('cfg-baseRefill', 6),
        initialCards: num('cfg-initialCards', 4),
        maxFood     : num('cfg-maxFood', 12),
        aiTrashTalk : document.getElementById('cfg-aiTrashTalk') ? document.getElementById('cfg-aiTrashTalk').checked : true,
        chatEnabled : document.getElementById('cfg-chatEnabled') ? document.getElementById('cfg-chatEnabled').checked : true,
        autoExport: false, autoRestart: false
    };
    if (!validateCardSets(cfg.cardSets)) return null;
    return cfg;
}

function validateCardSets(sets) {
    const hasAny = ['vanilla','extended'].some(s =>
        ['shu','wei','wu','qun'].some(f => sets[s][f])
    );
    if (!hasAny) { alert('至少勾選一張要加入牌庫的卡牌'); return false; }
    return true;
}

function joinOnlineRoom() {

    // ★ 超時偵測

        clearTimeout(timeoutId);

            ? `找不到房間「${code}」\n\n請確認：\n① 房主的畫面仍顯示「等待對手加入…」\n② 房間代碼正確（6 碼，無空格）`

function attachHostHandlers(c, cfg) {
    c.on('open', () => {
        c.send({ type: 'START' });
        if (!window.game) {
            // First connection — boot up the game
            setTimeout(() => {
                const names = cfg.playerNames || ['藍方', '紅方'];
                if (window.__guestName) names[1] = window.__guestName;
                const hostCfg = Object.assign({}, cfg, {
                    netMode: true, role: 'host', localPlayerIdx: 0, mode: 'pvp',
                    playerNames: names
                });
                hostCfg._broadcast = (state) => {
                    if (conn && conn.open) {
                        try { conn.send({ type: 'STATE', state }); } catch (e) { console.error(e); }
                    }
                };
                window.game = new Game(hostCfg);
            }, 300);
        } else {
            // Reconnection — push current state to the guest
            try {
                if (window.game._broadcast) {
                    window.game._broadcast(window.game.serializeForPlayer(1));
                }
                window.game.addLog('sys', '✅ 對手已重新連線');
                window.game.render();
            } catch (e) { console.error(e); }
        }
    });
    c.on('data', handleGuestToHost);
    c.on('close', () => {
        conn = null;
        console.log('[net] guest disconnected — waiting for reconnect');
        if (window.game && window.game.netMode) {
            window.game.addLog('sys', '⚠️ 對手連線中斷，等待重新連線…');
            window.game.render();
        }
    });
    c.on('error', (err) => console.error('Conn error:', err));
}

function connectToHost(code) {
    if (!peer || peer.destroyed) return;
    const connOptions = { reliable: true };
    // ★ Safari 修正：強制 JSON 序列化
    const ua = navigator.userAgent;
    if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) {
        connOptions.serialization = 'json';
    }
    conn = peer.connect('sanguo-flash-' + code, connOptions);

    // ★ 連線本身也可能超時
    const connTimeoutId = setTimeout(() => {
        if (!conn || !conn.open) {
            console.warn('[net] connect timeout for', code);
            try { if (conn) conn.close(); } catch (e) {}
        }
    }, 15000);

    conn.on('open', () => {
        clearTimeout(connTimeoutId);
        console.log('[net] connection opened');
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            showNetStatus(`已連線！<br><span style="color:#7cff7c;">● 正在等待房主開始遊戲…</span>`);
        } else {
            try {
                window.game.addLog('sys', '✅ 已重新連線');
                window.game.render();
            } catch (e) {}
        }
        conn.send({ type: 'HELLO', name: window.__myName || null });
    });
    conn.on('data', handleHostToGuest);
    conn.on('close', () => {
        clearTimeout(connTimeoutId);
        conn = null;
        console.log('[net] connection lost, retrying in 2s...');
        if (window.game && window.game.netMode) {
            try {
                window.game.addLog('sys', '⚠️ 連線中斷，嘗試重新連線…');
                window.game.render();
            } catch (e) {}
        }
        setTimeout(() => {
            if (!conn && peer && !peer.destroyed && window.__netState && window.__netState.role === 'guest') {
                connectToHost(window.__netState.roomCode);
            }
        }, 2000);
    });
    conn.on('error', (err) => {
        clearTimeout(connTimeoutId);
        console.error('[net] conn error:', err);
    });
}

function handleGuestToHost(data) {
	// v3.2: 若 game 還沒建立，先暫存名字
	if (data && data.type === 'HELLO' && data.name) {
		window.__guestName = String(data.name).slice(0, 12);
	}
    if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'HELLO') {
        // Guest just (re)connected — update their name if supplied
        if (data.name && window.game && window.game.players[1]) {
            window.game.players[1].name = String(data.name).slice(0, 12);
        }
        // Force sync
        try {
            if (window.game._broadcast) window.game._broadcast(window.game.serializeForPlayer(1));
        } catch (e) { console.error(e); }
        return;
    }
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'ACTION') {
        const g = window.game;
        g._applyingRemote = true;
        g._remotePlayerIdx = 1 - g.localPlayerIdx;   // 1v1: the other side
        try {
            const fn = g[data.action];
            if (typeof fn === 'function') fn.apply(g, data.args || []);
            else console.warn('Unknown action:', data.action);
        } catch (e) { console.error('Action error:', e); }
        finally { g._applyingRemote = false; g._remotePlayerIdx = undefined; }
    }
}

function handleHostToGuest(data) {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'START') return;
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'STATE') {
        if (data.state && data.state.state === 'gameover') {
            // Game finished — clear rejoin shortcut
            try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
        }
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            const shell = {
                mode: 'pvp', netMode: true, role: 'guest', localPlayerIdx: 1,
                vanillaCards: true, extendedCards: true,
                factions: { shu:true, wei:true, wu:true, qun:true },
                initialFood: 7, winBonus: 1, baseRefill: 6, initialCards: 4, maxFood: 12,
                seed: data.state.seed || '',
                ai1Diff: 'hard', ai2Diff: 'hard',
                autoExport: false, autoRestart: false
            };
            shell._sendAction = (action) => {
                if (conn && conn.open) {
                    try { conn.send({ type: 'ACTION', ...action }); } catch (e) { console.error(e); }
                }
            };
            window.game = new Game(shell);
        }
        window.game.applyState(data.state);
    }
}

let chatCooldownUntil = 0;
let chatCooldownTimer = null;

function showChatBubble(pi, text) {
    if (!text) return;
    const posMap = ['blue', 'red', 'green', 'purple'];
    const pos = posMap[pi % posMap.length] || 'blue';
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble chat-bubble-${pos}`;
    bubble.textContent = text;
    document.body.appendChild(bubble);
    setTimeout(() => {
        try { bubble.remove(); } catch (e) {}
    }, 4000);
}

function sendChat(text) {
    if (!window.game) return;
    if (Date.now() < chatCooldownUntil) return;
    const g = window.game;
    if (g.netMode) {
        if (!conn || !conn.open) return;
        const me = g.localPlayerIdx;
        try { conn.send({ type: 'CHAT', text }); } catch (e) { console.error(e); }
        showChatBubble(me, text);
    } else {
        const pi = g.current;
        if (!g.players[pi]) return;
        if (g.isAI(pi)) return;
        showChatBubble(pi, text);
        // 觸發 AI 回應（PvAI 模式）
        g.maybeAIChatResponse(pi, text);
    }
    chatCooldownUntil = Date.now() + 5000;
    updateChatCooldownUI();
}

function updateChatCooldownUI() {
    const btns = document.querySelectorAll('[data-qc]');
    const rem = Math.max(0, Math.ceil((chatCooldownUntil - Date.now()) / 1000));
    const indicator = document.getElementById('qc-cooldown');
    if (rem > 0) {
        btns.forEach(b => { b.disabled = true; });
        if (indicator) indicator.textContent = `⏳ ${rem}s`;
        if (chatCooldownTimer) clearTimeout(chatCooldownTimer);
        chatCooldownTimer = setTimeout(updateChatCooldownUI, 250);
    } else {
        btns.forEach(b => { b.disabled = false; });
        if (indicator) indicator.textContent = '';
        chatCooldownTimer = null;
    }
}

/* Reset cooldown on rematch */
const _origDoRematch = Game.prototype._doRematch;
Game.prototype._doRematch = function () {
    chatCooldownUntil = 0;
    if (chatCooldownTimer) { clearTimeout(chatCooldownTimer); chatCooldownTimer = null; }
    return _origDoRematch.apply(this, arguments);
};

/* Refresh cooldown UI after every render */
const _origRenderForChat = Game.prototype.render;
Game.prototype.render = function () {
    const r = _origRenderForChat.apply(this, arguments);
    setTimeout(() => { try { updateChatCooldownUI(); } catch (e) {} }, 0);
    return r;
};

/* ============ v3.6: 鍵盤快捷鍵 ================================= */
/* ================================================================ */
(function() {
    function isTyping() {
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }
    function hasBlockingModal() {
        // 卡片檢視 / 觀星 / 權衡 等 modal 開著時禁用快捷鍵
        // 遊戲選單（game-menu-overlay）不算，因為它不阻擋動作
        const overlays = document.querySelectorAll('.overlay');
        for (const o of overlays) {
            if (o.classList.contains('game-menu-overlay')) continue;
            return true;
        }
        return false;
    }
    document.addEventListener('keydown', e => {
        if (isTyping()) return;
        const g = window.game;
        if (!g || g._destroyed) return;
        if (g.state !== 'battle') return;

        // 有 modal 開著：僅允許 Escape 關閉
        if (hasBlockingModal()) {
            if (e.key === 'Escape') {
                const el = document.querySelector('.overlay:not(.game-menu-overlay)');
                if (el) el.remove();
                if (g.inspectCard) g.closeInspect();
            }
            return;
        }

        // ---- preend 階段：只支援 Q（放棄出牌） ----
        if (g.phase === 'preend') {
            const pep = g.preEndOrder && g.preEndOrder[g.preEndIdx];
            if (pep === undefined || pep === null) return;
            if (g.isAI(pep)) return;
            if (g.netMode && pep !== g.localPlayerIdx) return;
            if (g.cover || g.countdown !== null) return;
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                g.preEndAct();
            }
            return;
        }

        // ---- turn 階段 ----
        if (g.phase !== 'turn') return;
        const pi = g.current;
        if (g.isAI(pi)) return;
        if (g.netMode && pi !== g.localPlayerIdx) return;
        if (g.cover || g.countdown !== null) return;
        const p = g.players[pi];
        if (!p || p.passed) return;

        const playable = p.hand.filter(c => g.canPlayNormally(c, pi) || g.canPlayAmbush(c, pi));

        function navigateCard(dir) {
            if (playable.length === 0) return;
            const curIdx = playable.findIndex(c => c.uid === g.selected);
            let newIdx;
            if (curIdx === -1) newIdx = dir > 0 ? 0 : playable.length - 1;
            else newIdx = curIdx + dir;
            newIdx = ((newIdx % playable.length) + playable.length) % playable.length;
            g.selectCard(playable[newIdx].uid);
        }
        function navigateField(dir) {
            if (!g.selected) return;
            const inst = p.hand.find(c => c.uid === g.selected);
            if (!inst) return;
            const allowed = g.getPlayableFields(inst, pi);
            if (allowed.length <= 1) return;
            const cur = (g.selectedField !== null) ? g.selectedField : g.currentBfIndex;
            const curIdx = allowed.indexOf(cur);
            let newIdx = (curIdx === -1 ? 0 : curIdx + dir);
            newIdx = ((newIdx % allowed.length) + allowed.length) % allowed.length;
            const target = allowed[newIdx];
            g.selectedField = (target === g.currentBfIndex) ? null : target;
            g.render();
        }

        const k = e.key;
        const code = e.code;

        if (code === 'Space' || k === ' ') {
            e.preventDefault();
            if (g.selected) g.doPlay(false);
            return;
        }
        if (k === 'e' || k === 'E') {
            if (g.selected) {
                const inst = p.hand.find(c => c.uid === g.selected);
                if (inst && g.canPlayAmbush(inst, pi)) g.doPlay(true);
            }
            return;
        }
        if (k === 'q' || k === 'Q') {
            e.preventDefault();
            g.doPass();
            return;
        }
        if (k === 'w' || k === 'W' || code === 'ArrowUp') {
            e.preventDefault();
            navigateCard(-1);
            return;
        }
        if (k === 's' || k === 'S' || code === 'ArrowDown') {
            e.preventDefault();
            navigateCard(1);
            return;
        }
        if (k === 'a' || k === 'A' || code === 'ArrowLeft') {
            e.preventDefault();
            navigateField(-1);
            return;
        }
        if (k === 'd' || k === 'D' || code === 'ArrowRight') {
            e.preventDefault();
            navigateField(1);
            return;
        }
    });
})();

                    p.style.height = size + 'px';

                    p.style.top = '105vh';
                    p.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
                    p.style.animationDuration = (6 + Math.random() * 12) + 's';
                    p.style.animationDelay = (-Math.random() * 18) + 's';
                    p.style.opacity = (0.55 + Math.random() * 0.45);
                }
            },

            moon: {
                count: Math.round(70 * densityMul),
                css: `
                    .pt-moon {
                        position: absolute;
                        border-radius: 50%;
                        background: radial-gradient(circle,
                            #ffffff 0%,
                            rgba(200,220,255,.95) 40%,
                            rgba(140,180,255,0) 78%);
                        animation-name: ptTwinkle;
                        animation-timing-function: ease-in-out;
                        animation-iteration-count: infinite;
                        will-change: opacity, transform;
                    }
                    @keyframes ptTwinkle {
                        0%, 100% { opacity: .15; transform: scale(.8); }
                        45%      { opacity: 1;   transform: scale(1.2); }
                    }
                `,
                spawn(p) {
                    p.className = 'pt-moon';
                    const size = 1 + Math.random() * 3;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.top = Math.random() * 100 + 'vh';
                    p.style.animationDuration = (1.8 + Math.random() * 5.5) + 's';
                    p.style.animationDelay = (-Math.random() * 7) + 's';
                }
            },

            bamboo: {
                count: Math.round(22 * densityMul),
                css: `
                    .pt-bamboo {
                        position: absolute;
                        background: linear-gradient(135deg,
                            rgba(140,190,90,.95),
                            rgba(60,120,40,.55));
                        border-radius: 50% 0 50% 0;
                        animation-name: ptLeafFall;
                        animation-timing-function: linear;
                        animation-iteration-count: infinite;
                        will-change: transform, opacity;
                    }
                    @keyframes ptLeafFall {
                        0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
                        10%  { opacity: 1; }
                        90%  { opacity: 1; }
                        100% { transform: translate3d(var(--sway, 40px), 115vh, 0)
                                            rotate(var(--spin, 360deg)); opacity: 0; }
                    }
                `,
                spawn(p) {
                    p.className = 'pt-bamboo';
                    const w = 6 + Math.random() * 10;
                    p.style.width = w + 'px';
                    p.style.height = (w * (0.45 + Math.random() * 0.2)) + 'px';
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.top = '-6vh';
                    p.style.setProperty('--sway', (Math.random() * 240 - 120) + 'px');
                    p.style.setProperty('--spin', (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 540) + 'deg');
                    p.style.animationDuration = (9 + Math.random() * 14) + 's';
                    p.style.animationDelay = (-Math.random() * 22) + 's';
                    p.style.opacity = (0.5 + Math.random() * 0.45);
                }
            },

            sand: {
                count: Math.round(240 * densityMul),
                css: `
                    .pt-sand {
                        position: absolute;
                        border-radius: 50%;
                        background: radial-gradient(circle,
                            rgba(255,240,190,1) 0%,
                            rgba(255,200,110,.85) 45%,
                            rgba(210,150,60,0) 92%);
                        box-shadow: 0 0 4px rgba(255,215,140,.55);
                        animation-name: ptSandBlow;
                        animation-timing-function: linear;
                        animation-iteration-count: infinite;
                        will-change: transform, opacity;
                    }
                    @keyframes ptSandBlow {
                        0%   { transform: translate3d(0, 0, 0); opacity: 0; }
                        12%  { opacity: 1; }
                        88%  { opacity: 1; }
                        100% { transform: translate3d(var(--dx, 100vw), var(--dy, 0), 0); opacity: 0; }
                    }
                `,
                spawn(p) {
                    p.className = 'pt-sand';
                    // 70% tiny grains (1–3.5px), 30% soft puffs (4–9px)
                    const size = Math.random() < 0.7
                        ? (1 + Math.random() * 2.5)
                        : (4 + Math.random() * 5);
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    // 70% go right, 30% go left → varied direction
                    const goRight = Math.random() < 0.7;
                    if (goRight) {
                        p.style.left = '-6vw';
                        p.style.setProperty('--dx', (115 + Math.random() * 25) + 'vw');
                    } else {
                        p.style.left = '106vw';
                        p.style.setProperty('--dx', -(115 + Math.random() * 25) + 'vw');
                    }
                    p.style.top = (Math.random() * 100) + 'vh';
                    p.style.setProperty('--dy', (Math.random() * 50 - 25) + 'px');
                    // Huge duration spread → different visual speeds
                    p.style.animationDuration = (4.5 + Math.random() * 16) + 's';
                    p.style.animationDelay = (-Math.random() * 18) + 's';
                    p.style.opacity = (0.30 + Math.random() * 0.65);
                }
            }
        };
        return cfg[theme] || null;
    }

    /* ---------- Layer management ---------- */
    function ensureLayer() {
        let layer = document.getElementById(LAYER_ID);
        if (!layer) {
            layer = document.createElement('div');
            layer.id = LAYER_ID;
            layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;';
            document.body.appendChild(layer);
        }
        return layer;
    }

    function clearParticles() {
        const layer = document.getElementById(LAYER_ID);
        if (layer) layer.innerHTML = '';
        if (currentStyleEl) { currentStyleEl.remove(); currentStyleEl = null; }
    }

    function spawnParticlesForTheme(theme) {
        const cfg = getParticleConfig(theme);
        if (!cfg) { clearParticles(); currentTheme = null; return; }

        clearParticles();
        const layer = ensureLayer();

        // Inject keyframes for this theme only
        const style = document.createElement('style');
        style.textContent = cfg.css;
        document.head.appendChild(style);
        currentStyleEl = style;

        // Spawn all particles in one batch for performance
        const frag = document.createDocumentFragment();
        for (let i = 0; i < cfg.count; i++) {
            const p = document.createElement('span');
            cfg.spawn(p);
            frag.appendChild(p);
        }
        layer.appendChild(frag);
        currentTheme = theme;
    }

    /* ---------- Public refresh ---------- */
    window.__refreshParticles = function () {
        const reduced = document.body.hasAttribute('data-reduced-motion');
        const off = document.body.getAttribute('data-particles') === 'off';
        if (reduced || off) {
            clearParticles();
            currentTheme = null;
            return;
        }
        const t = document.body.getAttribute('data-theme') || 'xuanwu';
        const active = ['red', 'moon', 'bamboo', 'sand'].includes(t) ? t : null;
        if (!active) {
            clearParticles();
            currentTheme = null;
            return;
        }
        if (active === currentTheme) return;   // no change
        spawnParticlesForTheme(active);
    };

    /* ---------- Init ---------- */
    function init() {
        ensureLayer();
        window.__refreshParticles();
        if (observer) observer.disconnect();
        observer = new MutationObserver(() => {
            ensureLayer();
            window.__refreshParticles();
        });
        observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['data-theme', 'data-particles', 'data-reduced-motion']
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

try {
    showSetup();
} catch (err) {
    document.getElementById('app').innerHTML =
        '<div style="color:#ff6060;background:#1a0000;border:2px solid #ff3030;padding:20px;font-family:monospace;font-size:14px;line-height:1.7;margin:20px auto;max-width:900px;white-space:pre-wrap;border-radius:10px;">' +
        '<div style="color:#ffd700;font-size:18px;font-weight:bold;margin-bottom:12px;">🚨 showSetup() threw an error:</div>' +
        'Message: ' + (err && err.message) + '\n\n' +
        'Stack:\n' + (err && err.stack || '(no stack)') +
        '</div>';
    console.error('showSetup failed:', err);
}
</script>
