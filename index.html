openDeckViewer() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

    const me = this.netMode ? this.localPlayerIdx : this.current;

    // ---- Build the theoretical card pool from config ----
    const sets = this.cfg.cardSets || {
        vanilla:  { shu:true, wei:true, wu:true, qun:true },
        extended: { shu:true, wei:true, wu:true, qun:true }
    };
    const pool = [];
    CARD_DB.forEach(def => {
        const setCfg = sets[def.set];
        if (!setCfg || !setCfg[def.faction]) return;
        const n = def.count || 1;
        for (let i = 0; i < n; i++) pool.push(def);
    });
    pool.sort((a, b) => (a.cardId || '').localeCompare(b.cardId || '') || a.name.localeCompare(b.name));

    // ---- Snapshot current zones ----
    const myHandInsts   = [...this.players[me].hand];
    const archiveInsts  = [...this.archive];
    const fieldInsts    = [];
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => fieldInsts.push(c));

    // ---- Greedy match pool slots to known instances ----
    const rendered = pool.map(def => {
        let idx = myHandInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { myHandInsts.splice(idx, 1); return { def, status: 'myhand' }; }
        idx = archiveInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { archiveInsts.splice(idx, 1); return { def, status: 'archive' }; }
        idx = fieldInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { fieldInsts.splice(idx, 1); return { def, status: 'field' }; }
        return { def, status: 'unknown' };
    });

    // ---- Render ----
    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    rendered.forEach(item => { if (byFac[item.def.faction]) byFac[item.def.faction].push(item); });

    const legend = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;text-align:center;line-height:1.9;">
        🌕 <span style="color:#ffd700;">黃框</span>＝我方手牌　｜　⬛ <span style="color:#888;">灰暗</span>＝已打出或已棄置　｜　🔲 一般＝未知（牌庫或對手手牌）
        <br>共 <b style="color:#ffd700;">${pool.length}</b> 張
    </div>`;

    let content = '';
    FACTION_ORDER.forEach(f => {
        const list = byFac[f];
        if (!list || !list.length) return;
        content += `<div class="viewer-section"><h3>${FACTION_INFO[f].name}（${list.length} 張）</h3><div class="viewer-grid">`;
        content += list.map(item => {
            const wrapCls = item.status === 'myhand'
                ? 'viewer-card-wrap in-hand'
                : (item.status === 'archive' || item.status === 'field')
                    ? 'viewer-card-wrap in-played'
                    : 'viewer-card-wrap';
            return `<div class="${wrapCls}" onclick="inspectDefFromViewer('${item.def.id}')">
                ${cardHTMLStatic(item.def)}
            </div>`;
        }).join('');
        content += `</div></div>`;
    });

    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal viewer-modal" onclick="event.stopPropagation()">
        <h2>牌庫檢視</h2>
        ${legend}
        <div style="max-height:68vh;overflow-y:auto;padding:0 4px;">${content}</div>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div>
    </div></div>`;
}

    const groups = {};

                ${dests.map(i => `<button class="btn ${x.dest === i ? 'btn-green' : ''}" onclick="game.xunyuSelectDest(${i})">${BATTLEFIELDS[i]}${i < x.bi ? '（已結算）' : ''}</button>`).join('')}
            </div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;margin-top:14px;">
                <button class="btn btn-green" ${(x.sel === null || x.dest === null) ? 'disabled' : ''} onclick="game.xunyuConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.xunyuSkip()">略過</button>
            </div>
        </div></div>`;
    }
    if (this.xunyou && !this.isAI(this.xunyou.pi)) {
        const x = this.xunyou;
        const p = this.players[x.pi];
        const cards = p.hand.filter(c => x.eligible.includes(c.uid));
        h += `<div class="overlay"><div class="modal">
            <h2>荀攸 · 奇策</h2>
            <p>選擇1張手牌作為追加正面打出（花費其糧草，之後 +1 糧）。或略過。</p>
            <div class="modal-cards">${cards.map(c => {
                const on = x.sel === c.uid;
                const affordable = c.data.cost <= p.food;
                return this.cardHTML(c, { extra: (on ? 'sel' : '') + (affordable ? ' clickable' : ' dim'),
                    noHighlight: true,
                    attr: affordable ? `onclick="game.xunyouSelect('${c.uid}')"` : '' });
            }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-green" ${x.sel === null ? 'disabled' : ''} onclick="game.xunyouConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.xunyouSkip()">略過（僅 +1 糧）</button>
            </div>
        </div></div>`;
    }
    return h;
}
}

function exportAllLocalLogs() {
    const raw = localStorage.getItem('sanguo_logs');
    if (!raw) { alert('本地沒有快取記錄'); return; }
    const blob = new Blob([raw], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-logs-bundle-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function clearLocalLogs() {
    if (!confirm('確定清空所有本地快取記錄？')) return;
    localStorage.removeItem('sanguo_logs');
    showSetup();
}

/* ============ 回放檢視器 ============ */
function importLogFromFile() {
    let input = document.getElementById('import-log-file');
    if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'import-log-file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        input.onchange = e => handleImportLog(e);
        document.body.appendChild(input);
    }
    input.click();
}
function handleImportLog(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            const logs = Array.isArray(data) ? data : [data];
            const valid = logs.filter(l => l && (l.events || l.config || l.deckTopToBottom));
            if (valid.length === 0) { alert('檔案中沒有有效的對戰記錄'); return; }
            const existing = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
            valid.forEach(l => existing.push(l));
            localStorage.setItem('sanguo_logs', JSON.stringify(existing));
            alert(`✅ 已匯入 ${valid.length} 份記錄（目前共 ${existing.length} 份）`);
            const el = document.getElementById('local-log-count');
            if (el) el.textContent = `（目前快取 ${existing.length} 份）`;
            const viewer = document.getElementById('modal-slot');
            if (viewer && viewer.querySelector('.log-viewer')) openLogViewer();
        } catch(err) {
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    ev.target.value = '';
}
function openLogViewer() {
    const slot = document.getElementById('modal-slot');
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}
    arr = arr.slice().reverse(); // newest first
    if (arr.length === 0) {
        slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>回放記錄</h2><p>目前沒有已儲存的對戰記錄。</p><div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div></div></div>`;
        return;
    }
    const modeLabel = m => m === 'aiai' ? '🤖 AI vs AI' : (m === 'pvai' ? '🧑 PVAI' : '👥 PVP');
    const listHtml = arr.map((log, i) => {
        const w = log.winner;
        const wName = w === 0 ? '藍方' : (w === 1 ? '紅方' : '未知');
        return `<div class="log-item" onclick="viewLogDetail(${arr.length - 1 - i})">
            <span class="li-time">${(log.createdAt||'').slice(0,19).replace('T',' ')}</span>
            <span class="li-mode">${modeLabel(log.mode||log.config?.mode)}</span>
            <span class="li-winner">${wName}勝</span>
            ｜ 共 ${log.totalRounds||0} 輪
            ｜ 賽果 ${log.finalWins ? log.finalWins.join(' : ') : '?'}
            ｜ 事件 ${log.events ? log.events.length : 0}
        </div>`;
    }).join('');
    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal log-viewer" onclick="event.stopPropagation()">
        <h2>回放記錄 (${arr.length})</h2>
        <p>點擊任一條目查看完整事件時間軸</p>
        <div style="max-height:60vh;overflow-y:auto;padding:4px;">${listHtml}</div>
        <div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-gold" onclick="importLogFromFile()">📂 匯入 JSON</button>
            <button class="btn btn-red" onclick="closeModal()">關閉</button>
        </div>
    </div></div>`;
}
function viewLogDetail(idx) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}
    const log = arr[idx];
    if (!log) return;
    const slot = document.getElementById('modal-slot');
    const events = log.events || [];
    const fmt = ev => {
        const i = `<span class="ev-i">#${ev.i||0}</span>`;
        const r = `<span class="ev-r">R${ev.round||'?'}</span>`;
        const t = `<span class="ev-t">${ev.type}</span>`;
        let d = '';
        switch (ev.type) {
            case 'flip_result': d = `藍 ${cardName(ev.blueCard)}(${ev.bluePower}) vs 紅 ${cardName(ev.redCard)}(${ev.redPower}) → P${ev.firstPlayer} 先手`; break;
            case 'mulligan_redraw': d = `P${ev.player} 重抽 ${(ev.discarded||[]).map(cardName).join(', ')}`; break;
            case 'mulligan_skip': case 'mulligan_confirm': d = `P${ev.player}`; break;
            case 'round_start': d = `戰場 ${ev.battlefieldName}｜藍手 [${(ev.blueHand||[]).map(cardName).join(', ')}]｜紅手 [${(ev.redHand||[]).map(cardName).join(', ')}]｜糧 ${ev.blueFood}/${ev.redFood}`; break;
			            case 'turn_start': {
                const hands = (ev.hands || []).map((h, i) => `P${i} [${h.map(cardName).join(', ')}]`).join('｜');
                const foods = (ev.foods || []).join('/');
                const passedTxt = (ev.passed || []).some(x => x) ? `｜放棄 [${ev.passed.map(p => p ? '✓' : '✗').join(',')}]` : '';
                d = `P${ev.player} 回合開始｜糧 ${foods}${passedTxt}｜${hands}`;
                break;
            }
            case 'play': d = `P${ev.player} 出 ${cardName(ev.cardId)}${ev.faceDown?'(背)':''} 至 ${BATTLEFIELDS[ev.field]}｜花費 ${ev.foodCost}｜餘糧 ${ev.foodAfter}｜餘手 ${ev.handAfter}` + (ev.handAfterNames ? ` [${ev.handAfterNames.map(cardName).join(', ')}]` : ''); break;
            case 'pass': d = `P${ev.player} 放棄`; break;
            case 'general_pass': d = `P${ev.player} 上將 ${cardName(ev.cardId)} 自動放棄`; break;
            case 'settle': d = `戰場 ${BATTLEFIELDS[ev.battlefield]}｜${ev.f0} vs ${ev.f1} → P${ev.winner} 勝｜比分 ${ev.blueWins}:${ev.redWins}`; break;
            case 'game_over': d = `勝者 P${ev.winner}｜總輪數 ${ev.totalRounds}`; break;
            case 'zhanjiang': d = `P${ev.player} 斬將 ${cardName(ev.targetId)}`; break;
            case 'lianying': d = `P${ev.player} 連營 ${cardName(ev.targetId)}`; break;
            case 'jianxiong': d = `P${ev.player} 猜 ${ev.guess} ${ev.hit?'命中':'未中'}`; break;
            case 'benxi_swap': d = `P${ev.player} 奔襲 ${cardName(ev.movedId)} ${BATTLEFIELDS[ev.from]}→${BATTLEFIELDS[ev.to]}`; break;
            case 'scry': d = `P${ev.player} 觀星 頂部: ${(ev.top3||[]).map(cardName).join(', ')}`; break;
            case 'quanheng': d = `P${ev.player} 權衡 棄 [${(ev.discarded||[]).map(cardName).join(', ')}]`; break;
            case 'quhu': d = `P${ev.player} 荀彧驅虎 ${cardName(ev.targetId)} → ${BATTLEFIELDS[ev.dest]}`; break;
            case 'qice_play': d = `P${ev.player} 荀攸奇策追加 ${cardName(ev.cardId)} 至 ${BATTLEFIELDS[ev.field]}｜餘糧 ${ev.foodAfter}`; break;
            case 'draw': d = `P${ev.player} 抽 ${cardName(ev.cardId)}`; break;
            default: d = JSON.stringify(ev).slice(0, 200);
        }
        return `<div class="ev">${i}${r}${t}<span class="ev-d">${d}</span></div>`;
    };
    const header = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;">
        建立：${(log.createdAt||'').slice(0,19).replace('T',' ')}
        ｜ 模式：${log.mode||log.config?.mode}
        ｜ 種子：<span style="color:#7cff7c;font-family:monospace;letter-spacing:1px;">${log.seed || log.config?.seed || '(無)'}</span>
        ${log.seed ? `
            <button class="btn" style="padding:2px 8px;font-size:11px;margin-left:6px;" onclick="copySeedStr('${log.seed}')">複製</button>
            <button class="btn btn-green" style="padding:2px 8px;font-size:11px;margin-left:4px;" onclick="applySeedAndReturn('${log.seed}')">套用此種子</button>
        ` : ''}
        ｜ 賽果：${log.finalWins ? log.finalWins.join(' : ') : '?'}
        ｜ 牌庫頂(前10)：${(log.deckTopToBottom||[]).slice(0,10).map(cardName).join(', ')}
    </div>`;
    const eventsHtml = events.map(fmt).join('');
    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal log-viewer" onclick="event.stopPropagation()">
        <h2>對戰時間軸</h2>
        ${header}
        <div style="max-height:60vh;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;">${eventsHtml}</div>

function downloadLogByIndex(idx) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}
    const log = arr[idx];
    if (!log) return;
    const blob = new Blob([JSON.stringify(log, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = (log.createdAt||'').slice(0,19).replace(/[:.]/g,'-');
    a.href = url; a.download = `sanguo-replay-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    const slot = document.getElementById('modal-slot');
    const sets = readCardSetConfig();

    const pool = [];
    CARD_DB.forEach(d => {
        const setCfg = sets[d.set];
        if (!setCfg || !setCfg[d.faction]) return;
        const n = d.count || 1;
        for (let i = 0; i < n; i++) pool.push({ def: d, idx: i, total: n });
    });

    if (viewerMode === 'id') {
        pool.sort((a, b) => {
            const ai = a.def.cardId || '';
            const bi = b.def.cardId || '';
            if (ai !== bi) return ai.localeCompare(bi);
            return a.idx - b.idx;
        });
    } else {
        pool.sort((a, b) => {
            const ac = a.def.cost - b.def.cost;
            if (ac !== 0) return ac;
            const ap = a.def.power - b.def.power;
            if (ap !== 0) return ap;
            return a.idx - b.idx;
        });

/* ============ Phase 2: Network wrappers (action forwarding) ========= */
/* ==================================================================== */
const NET_ACTION_METHODS = [
    'selectCard','selectField','doPlay','doPass','preEndAct','handoff','nextRound',
    'revealFlip','beginBattle',
    'mulliganRedraw','mulliganSkip','mulliganConfirm',
    'scryToggle','scryConfirm','scrySkip',
    'qhToggle','qhConfirm','qhCancel',
    'lySelect','lyConfirm','lyCancel',
    'jxGuess','jxConfirm','jxSkip',
    'guanyuSelect','guanyuConfirm','guanyuSkip',
    'xunyuSelect','xunyuSelectDest','xunyuConfirm','xunyuSkip',
    'xunyouSelect','xunyouConfirm','xunyouSkip',
    'activateJiushi',
    'voteRematch'
];
NET_ACTION_METHODS.forEach(name => {
    const orig = Game.prototype[name];
    if (typeof orig !== 'function') return;
    Game.prototype[name] = function (...args) {
        if (this.netMode && this.role === 'guest' && !this._applyingRemote) {
            if (this._sendAction) this._sendAction({ action: name, args });
            return;
        }
        return orig.apply(this, args);
    };
});

/* ============ Auto-advance turn in net mode ============ */
const _origStartCountdown = Game.prototype.startCountdown;
Game.prototype.startCountdown = function (onDone) {
    if (this.netMode) {
        const wrapped = () => {
            try { onDone(); } catch (e) { console.error(e); }
            if (this.phase === 'turn' && this.state === 'battle') {
                this.advanceTurn();
            }
        };
        _origStartCountdown.call(this, wrapped);
        return;
    }
    return _origStartCountdown.apply(this, arguments);
};

/* ============ Render override: broadcast (host) + wait screen (guest) ============ */
const _origRender = Game.prototype.render;
Game.prototype.render = function () {
    // In net mode, "cover" (device handoff) is never needed.
    if (this.netMode) this.cover = false;
    if (this.netMode && this.role === 'guest' && !this._hasReceivedState && this.state !== 'gameover') {
        document.getElementById('app').innerHTML = `
            <div class="setup" style="text-align:center;max-width:600px;">
                <h1>三 國 風 雲</h1>
                <div class="sub">線上對戰 — 連線中</div>
                <div style="padding:30px 20px;font-size:16px;line-height:2;color:#e0c080;">
                    正在等待房主開始遊戲…<br>
                    <span style="color:#7cff7c;">● 已連線</span>
                </div>
                <button class="btn btn-red" onclick="cancelNet()">取消</button>
            </div>`;
        return;
    }
    const r = _origRender.apply(this, arguments);
    if (this.netMode && this.role === 'host' && this._broadcast) {
        if (this._broadcastTimer) clearTimeout(this._broadcastTimer);
        this._broadcastTimer = setTimeout(() => {
            this._broadcastTimer = null;
            try { this._broadcast(this.serializeForPlayer(1)); } catch (e) { console.error(e); }
        }, 40);
    }
    return r;
};

        ta.value = code; document.body.appendChild(ta); ta.select();

    let info = null;
    try { info = JSON.parse(sessionStorage.getItem('sanguo_rejoin') || 'null'); } catch (e) {}
    if (!info || !info.roomCode) { alert('沒有可重新加入的對戰'); return; }
    const code = info.roomCode;
    window.__netState = { roomCode: code, role: 'guest' };
    showNetStatus(`正在重新連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);
    peer = new Peer({ debug: 1 });
    peer.on('open', () => { connectToHost(code); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', (err) => {
        console.error(err);
        alert('重新連線失敗：' + err.message + '\n\n（房主可能已經離開，或房間已關閉）');
        cancelNet();
    });
}

function clearRejoinInfo() {
    try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
    showSetup();
}

function createOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const cfg = readCfgFromSetup();
    if (!cfg) return;
    cfg.playerNames = [window.__myName, '對手'];
    const code = makeRoomCode();
    const peerId = 'sanguo-flash-' + code;
    window.__netState = { roomCode: code, role: 'host' };

    showNetStatus(`正在建立房間…`);
    peer = new Peer(peerId, { debug: 1 });

    peer.on('open', () => {
        showNetStatus(`
            房間已建立！<br>
            <div style="font-size:34px;letter-spacing:8px;color:#ffd700;font-family:monospace;margin:14px 0;">${code}</div>
            <button class="btn btn-gold" onclick="copyRoomCode('${code}')" style="margin-bottom:10px;">📋 複製房間代碼</button><br>
            <span style="color:#a89070;">請將此代碼分享給對手</span><br>
            <span style="color:#7cff7c;">● 等待對手加入…</span>
        `);
    });
    peer.on('error', (err) => {
        console.error(err);
        alert('建立房間失敗：' + err.message + '\n（房間代碼可能已被使用，請重試）');
        cancelNet();
    });
    peer.on('connection', (c) => {
        if (conn && conn.open) { try { c.close(); } catch (e) {} }
        conn = c;
        attachHostHandlers(c, cfg);
    });
    peer.on('disconnected', () => {
        console.log('[net] peerjs server disconnected, reconnecting...');
        try { peer.reconnect(); } catch (e) {}
    });
}

function attachHostHandlers(c, cfg) {
    c.on('open', () => {
        c.send({ type: 'START' });
        if (!window.game) {
            // First connection — boot up the game
            setTimeout(() => {
                const names = cfg.playerNames || ['藍方', '紅方'];
                const hostCfg = Object.assign({}, cfg, {
                    netMode: true, role: 'host', localPlayerIdx: 0, mode: 'pvp',
                    playerNames: names
                });
                hostCfg._broadcast = (state) => {
                    if (conn && conn.open) {
                        try { conn.send({ type: 'STATE', state }); } catch (e) { console.error(e); }
                    }
                };
                window.game = new Game(hostCfg);
            }, 300);
        } else {
            // Reconnection — push current state to the guest
            try {
                if (window.game._broadcast) {
                    window.game._broadcast(window.game.serializeForPlayer(1));
                }
                window.game.addLog('sys', '✅ 對手已重新連線');
                window.game.render();
            } catch (e) { console.error(e); }
        }
    });
    c.on('data', handleGuestToHost);
    c.on('close', () => {
        conn = null;
        console.log('[net] guest disconnected — waiting for reconnect');
        if (window.game && window.game.netMode) {
            window.game.addLog('sys', '⚠️ 對手連線中斷，等待重新連線…');
            window.game.render();
        }
    });
    c.on('error', (err) => console.error('Conn error:', err));
}

function joinOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const raw = prompt('請輸入房間代碼：');
    if (!raw) return;
    const code = raw.trim().toUpperCase();
    if (!code) return;
    window.__netState = { roomCode: code, role: 'guest' };
    showNetStatus(`正在連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);
    peer = new Peer({ debug: 1 });
    peer.on('open', () => { connectToHost(code); });
    peer.on('disconnected', () => {
        console.log('[net] peerjs server disconnected, reconnecting...');
        try { peer.reconnect(); } catch (e) {}
    });
    peer.on('error', (err) => {
        console.error(err);
        alert('連線失敗：' + err.message + '\n（找不到房間？請確認代碼）');
        cancelNet();
    });
}

function connectToHost(code) {
    if (!peer || peer.destroyed) return;
    conn = peer.connect('sanguo-flash-' + code, { reliable: true });
    conn.on('open', () => {
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            showNetStatus(`已連線！<br><span style="color:#7cff7c;">● 正在等待房主開始遊戲…</span>`);
        } else {
            try {
                window.game.addLog('sys', '✅ 已重新連線');
                window.game.render();
            } catch (e) {}
        }
        conn.send({ type: 'HELLO', name: window.__myName || null });
    });
    conn.on('data', handleHostToGuest);
    conn.on('close', () => {
        conn = null;
        console.log('[net] connection lost, retrying in 2s...');
        if (window.game && window.game.netMode) {
            try {
                window.game.addLog('sys', '⚠️ 連線中斷，嘗試重新連線…');
                window.game.render();
            } catch (e) {}
        }
        setTimeout(() => {
            if (!conn && peer && !peer.destroyed && window.__netState && window.__netState.role === 'guest') {
                connectToHost(window.__netState.roomCode);
            }
        }, 2000);
    });
    conn.on('error', (err) => console.error('Conn error:', err));
}

function handleGuestToHost(data) {
    if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'HELLO') {
        // Guest just (re)connected — update their name if supplied
        if (data.name && window.game && window.game.players[1]) {
            window.game.players[1].name = String(data.name).slice(0, 12);
        }
        // Force sync
        try {
            if (window.game._broadcast) window.game._broadcast(window.game.serializeForPlayer(1));
        } catch (e) { console.error(e); }
        return;
    }
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'ACTION') {
        const g = window.game;
        g._applyingRemote = true;
        g._remotePlayerIdx = 1 - g.localPlayerIdx;   // 1v1: the other side
        try {
            const fn = g[data.action];
            if (typeof fn === 'function') fn.apply(g, data.args || []);
            else console.warn('Unknown action:', data.action);
        } catch (e) { console.error('Action error:', e); }
        finally { g._applyingRemote = false; g._remotePlayerIdx = undefined; }
    }
}

function handleHostToGuest(data) {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'START') return;
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'STATE') {
        if (data.state && data.state.state === 'gameover') {
            // Game finished — clear rejoin shortcut
            try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
        }
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            const shell = {
                mode: 'pvp', netMode: true, role: 'guest', localPlayerIdx: 1,
                vanillaCards: true, extendedCards: true,
                factions: { shu:true, wei:true, wu:true, qun:true },
                initialFood: 7, winBonus: 1, baseRefill: 6, initialCards: 4, maxFood: 12,
                seed: data.state.seed || '',
                ai1Diff: 'hard', ai2Diff: 'hard',
                autoExport: false, autoRestart: false
            };
            shell._sendAction = (action) => {
                if (conn && conn.open) {
                    try { conn.send({ type: 'ACTION', ...action }); } catch (e) { console.error(e); }
                }
            };
            window.game = new Game(shell);
        }
        window.game.applyState(data.state);
    }
}
/* ==================================================================== */
/* ============ Quick Chat module ===================================== */
/* ==================================================================== */
let chatCooldownUntil = 0;
let chatCooldownTimer = null;

function showChatBubble(pi, text) {
    if (!text) return;
    const posMap = ['blue', 'red', 'green', 'purple'];
    const pos = posMap[pi % posMap.length] || 'blue';
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble chat-bubble-${pos}`;
    bubble.textContent = text;
    document.body.appendChild(bubble);
    setTimeout(() => {
        try { bubble.remove(); } catch (e) {}
    }, 4000);
}

function sendChat(text) {
    if (!window.game) return;
    if (Date.now() < chatCooldownUntil) return;
    const g = window.game;
    if (g.netMode) {
        if (!conn || !conn.open) return;
        const me = g.localPlayerIdx;
        try { conn.send({ type: 'CHAT', text }); } catch (e) { console.error(e); }
        showChatBubble(me, text);
    } else {
        const pi = g.current;
        if (!g.players[pi]) return;
        if (g.isAI(pi)) return;
        showChatBubble(pi, text);
        // 觸發 AI 回應（PvAI 模式）
        g.maybeAIChatResponse(pi, text);
    }
    chatCooldownUntil = Date.now() + 5000;
    updateChatCooldownUI();
}

function updateChatCooldownUI() {
    const btns = document.querySelectorAll('[data-qc]');
    const rem = Math.max(0, Math.ceil((chatCooldownUntil - Date.now()) / 1000));
    const indicator = document.getElementById('qc-cooldown');
    if (rem > 0) {
        btns.forEach(b => { b.disabled = true; });
        if (indicator) indicator.textContent = `⏳ ${rem}s`;
        if (chatCooldownTimer) clearTimeout(chatCooldownTimer);
        chatCooldownTimer = setTimeout(updateChatCooldownUI, 250);
    } else {
        btns.forEach(b => { b.disabled = false; });
        if (indicator) indicator.textContent = '';
        chatCooldownTimer = null;
    }
}

/* Reset cooldown on rematch */
const _origDoRematch = Game.prototype._doRematch;
Game.prototype._doRematch = function () {
    chatCooldownUntil = 0;
    if (chatCooldownTimer) { clearTimeout(chatCooldownTimer); chatCooldownTimer = null; }
    return _origDoRematch.apply(this, arguments);
};

/* Refresh cooldown UI after every render */
const _origRenderForChat = Game.prototype.render;
Game.prototype.render = function () {
    const r = _origRenderForChat.apply(this, arguments);
    setTimeout(() => { try { updateChatCooldownUI(); } catch (e) {} }, 0);
    return r;
};

try {
    showSetup();
} catch (err) {
    document.getElementById('app').innerHTML =
        '<div style="color:#ff6060;background:#1a0000;border:2px solid #ff3030;padding:20px;font-family:monospace;font-size:14px;line-height:1.7;margin:20px auto;max-width:900px;white-space:pre-wrap;border-radius:10px;">' +
        '<div style="color:#ffd700;font-size:18px;font-weight:bold;margin-bottom:12px;">🚨 showSetup() threw an error:</div>' +
        'Message: ' + (err && err.message) + '\n\n' +
        'Stack:\n' + (err && err.stack || '(no stack)') +
        '</div>';
    console.error('showSetup failed:', err);
}
</script>
