/* ============ 貂蟬【離間】 ============ */
diaochanChoose(useRemove) {
    const dc = this.diaochan;
    if (!dc) return;
    const pi = dc.pi, bi = dc.bi;
    const oppPi = this.opponentOf(pi);
    const myField = this.players[pi].fields[bi];
    const enemyField = this.players[oppPi].fields[bi];
    const self = myField.find(c => c.uid === dc.selfUid);

    let selfRemoved = false;
    if (useRemove && dc.weakestUid) {
        const weakest = enemyField.find(c => c.uid === dc.weakestUid);
        if (weakest && self) {
            this.flashRemove(self);
            this.flashRemove(weakest);
            myField.splice(myField.indexOf(self), 1);
            this.archive.push(self);
            enemyField.splice(enemyField.indexOf(weakest), 1);
            this.archive.push(weakest);
            this.addLog(pi, `[R${this.round}] ${self.data.name}【離間】：與 ${weakest.data.name} 一同進入棄牌堆`);
            this.recordEvent('lijian', { player: pi, mode: 'remove', targetId: weakest.data.id });
            selfRemoved = true;
        }
    }
    if (!selfRemoved && self) {
        self.mod = (self.mod || 0) + dc.gainB;
        this.addLog(pi, `[R${this.round}] ${self.data.name}【離間】：吸收戰力 +${dc.gainB}`);
        this.recordEvent('lijian', { player: pi, mode: 'buff', gain: dc.gainB, sourceId: dc.highestUid });
    }

    this.diaochan = null;

    if (selfRemoved) {
        // 卡已移除 → 不呼叫 doPlayAfterEntry，但補牌 + finishAction 仍要
        this.drawOne(pi);
        this.finishAction();
    } else {
        const inst = myField.find(c => c.uid === dc.selfUid);
        if (inst) this.doPlayAfterEntry(pi, inst, false, bi);
        else { this.drawOne(pi); this.finishAction(); }
    }
}

/* ================================================================ */
/* ★ v3.6: 統一「每回合開始前」技能觸發入口                          */
/*   - 觀星（諸葛亮）、奸雄（曹操）、權衡（孫權）                      */
/*   - 掃描己方所有戰場上的牌，從「最新打出」到「最舊」              */
/*   - 每張牌每回合只觸發一次（用 _tst_used 標記）                    */
/* ================================================================ */
_resetTurnStartFlags(pi) {
    const p = this.players[pi];
    if (!p) return;
    for (let bi = 0; bi < this.fieldCount; bi++) {
        p.fields[bi].forEach(c => { c._tst_used = false; });
    }
}
_uidNum(c) {
    // 用 uid 推算打出順序（uid 是單調遞增計數器）
    return parseInt((c.uid || '').replace(/\D/g, ''), 10) || 0;
}
_triggerTurnStartSkills(pi) {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return false;
    // 已經有 modal 開著 → 不重複觸發
    if (this.scry || this.jianxiong || this.quanheng) return false;
    const p = this.players[pi];
    if (!p) return false;

    // ─── 1. 收集己方所有戰場上的牌（未翻面、未被沉默） ───
    const all = [];
    for (let bi = 0; bi < this.fieldCount; bi++) {
        p.fields[bi].forEach(c => {
            if (c.faceDown || c.silenced) return;
            if (c._tst_used) return;
            const sk = c.data.skills || [];
            if (sk.includes('觀星') || sk.includes('奸雄') || sk.includes('權衡')) {
                all.push(c);
            }
        });
    }
    // ─── 2. 從「最新打出」排到「最舊」 ───
    all.sort((a, b) => this._uidNum(b) - this._uidNum(a));

    // ─── 3. 依序找第一個能觸發的技能 ───
    for (const card of all) {
        const sk = card.data.skills || [];

        // ── 觀星（諸葛亮） ──
        if (sk.includes('觀星')) {
            card._tst_used = true;
            if (this.deck.length > 0) {
                const n = Math.min(3, this.deck.length);
                const cards = [];
                for (let i = 0; i < n; i++) cards.push(this.deck.pop());
                this.scry = { pi, cards, order: [], source: 'guanxing' };
                this.addLog(pi, `[R${this.round}] ${card.data.name}【觀星】：查看牌堆頂 ${n} 張`);
                this.render();
                if (this.isAI(pi)) this._sTO(() => this.resolveAIScry(), 700);
                return true;
            }
            continue;   // 牌堆為空 → 跳過這張
        }

        // ── 奸雄（曹操） ──
        if (sk.includes('奸雄')) {
            card._tst_used = true;
            const anyFaceDown = this.players[this.opponentOf(pi)].fields.some(f => f.some(c => c.faceDown));
            if (anyFaceDown) {
                this.jianxiong = { pi, guess: null };
                this.addLog(pi, `[R${this.round}] ${card.data.name}【奸雄】：發動`);
                this.render();
                if (this.isAI(pi)) this._sTO(() => this.resolveAIJianxiong(), 700);
                return true;
            }
            continue;
        }
        // ── 權衡（孫權） ──
        if (sk.includes('權衡')) {
            card._tst_used = true;
            if (this.isAI(pi)) {
                // ★ v3.6: AI 自行判斷；若 AI 選擇不用，continue 到下一個技能
                const used = this.maybeAutoQuanhengAI(pi);
                if (!used) {
                    this.addLog(pi, `[R${this.round}] ${card.data.name}【權衡】(AI)：評估後不使用`);
                }
                continue;
            }
            if (p.hand.length > 0) {
                this.quanheng = { sel: [], pi };
                this.addLog(pi, `[R${this.round}] ${card.data.name}【權衡】：發動`);
                this.render();
                return true;
            }
            continue;
        }
    }
    return false;
}
/* 相容舊呼叫：外部若還有人呼叫 maybeJianxiong() → 轉發 */
maybeJianxiong() { return this._triggerTurnStartSkills(this.current); }
jxGuess(v){if(!this.jianxiong)return;this.jianxiong.guess=v;this.render();}
jxConfirm() {
    if(!this.jianxiong||this.jianxiong.guess===null)return;
    const pi=this.jianxiong.pi,foes=this.opponentOf(pi),v=this.jianxiong.guess;
    let hit=null;
    for(let bi=0;bi<this.fieldCount&&!hit;bi++){
        for(const c of this.players[foes].fields[bi]){
            if(c.faceDown&&c.data.power===v){hit={c,bi};break;}
        }
    }
    if(hit){
        if (this._isJianshouProtected(hit.c, foes, hit.bi)) {
            this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜中 ${v}，但目標受【堅守】保護，無法棄置`);
        } else {
            const f=this.players[foes].fields[hit.bi];
            f.splice(f.indexOf(hit.c),1);
            this.archive.push(hit.c);
            this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜中 ${v}！`);
        }
    } else this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜 ${v} 未命中`);
    this.jianxiong=null;
    this.render();
    this._triggerTurnStartSkills(pi);
}
jxSkip() {
    const pi = this.jianxiong ? this.jianxiong.pi : this.current;
    this.jianxiong=null;
    this.render();
    this._triggerTurnStartSkills(pi);
}

finishAction() {
    this.selected = null;
    const opp = this.opponentOf(this.current);

    // 隱忍：對手放棄後，只要己方有司馬懿在場，對手出牌後可重新出牌
    // ★ v3.12: 每輪最多觸發一次，避免 3+ 人局死循環
    const oppHasYinren = this.players[opp].fields.some(f => f.some(c =>
        !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
    if (this.players[opp].passed && oppHasYinren && !this._yinrenUsedThisRound) {
        this._yinrenUsedThisRound = true;
        this.players[opp].passed = false;
        this.addLog(opp, `[R${this.round}] 司馬懿【隱忍】：${this.players[opp].name} 可再次出牌`);
    }
    const opponentPassed = this.players[opp].passed;
    if (opponentPassed && this.players.filter(pl => !pl.passed).length === 1) {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = false; this.render();
        return;
    }
    this.startCountdown(() => {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = !this.netMode;
        this.render();
    });
}
doPass() {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    this._handoffDoneThisTurn = false;
    const pi = this.current, p = this.players[pi];
    if (p.passed) {
        // ★ 已放棄 → 不應該卡在這個人的回合；強制推進
        this.addLog('sys', `[R${this.round}] ${p.name} 已放棄，自動推進回合`);
        this._handoffDoneThisTurn = false;   // 保險起見再清一次
        this.advanceTurn();
        return;
    }
    if (this.firstPasser === null) this.firstPasser = pi;
    p.passed = true; p.mustFaceUp = false;
    this.lastPasser = pi;
    this.passOrder = this.passOrder || [];
    this.passOrder.push(pi);
    this.addLog(pi, `[R${this.round}] ${p.name} 放棄跟牌`);
    this.recordEvent('pass', { player: pi, foodAfter: p.food });
	    // ★ v3.7: 對手放棄 → 檢查我方孫堅【英魂】
    for (let x = 0; x < this.numPlayers; x++) {
        if (x === pi) continue;
        if (this.areAllies(pi, x)) continue;
        this._triggerSunjianYinghunOnPass(x);
    }
    this.selected = null; this.selectedField = null;
    if (this.players.every(pl => pl.passed)) {
        if (!this._simaYiLastChanceUsed) {
            for (let pIdx = 0; pIdx < this.numPlayers; pIdx++) {
                const hasYinren = this.players[pIdx].fields.some(f => f.some(c =>
                    !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
                if (hasYinren) {
                    this._simaYiLastChanceUsed = true;
                    this.players[pIdx].passed = false;
                    if (this.firstPasser === pIdx) this.firstPasser = null;
                    this.addLog(pIdx, `[R${this.round}] 司馬懿【隱忍】：全員皆放棄，${this.players[pIdx].name} 獲得最後出牌機會`);
                    this.selected = null; this.selectedField = null;
                    if (pIdx === this.current) { this.cover = false; this.render(); }
                    else { this.cover = true; this.render(); }
                    return;
                }
            }
        }
		console.log('[doPass→preEnd]', {
            round: this.round, current: this.current,
            passed: this.players.map(p => p.passed),
            passOrder: (this.passOrder || []).slice(),
            firstPasser: this.firstPasser,
            phase: this.phase
        });
        this.startPreEnd(); return;
    }
    // ★ v3.9 FIX: 不要再提前跳 preEnd。當自己剛 pass、只剩對手未 pass 時，
    // 規則說「一方放棄後，對方可繼續出牌直到也放棄」——所以應該讓對手
    // 繼續走 turn 流程（handoff → advanceTurn），只有雙方都放棄才 preEnd。
    this.startCountdown(() => {
        this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
        this.cover = true;
        this.render();
    });
}
handoff() {
    this.cover = false;
    this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
    if (this.phase === 'mulligan') { this.mulliganHandoff(); return; }
    if (this.phase === 'turn') {
        this.advanceTurn();
        // ★ 額外保險：若 advanceTurn 提前返回而未重繪，這裡強制重繪一次
        // （避免 cover=false 但畫面仍是舊的鎖定狀態）
        this.render();
        return;
    }
    if (this.phase === 'preend') { this.advancePreEnd(); return; }
    this.render();
}
advanceTurn() {
    if (this.players.every(p => p.passed)) { this.startPreEnd(); return; }
    // ★ 防護：若當前玩家已放棄，無條件推進（避免 _handoffDoneThisTurn 卡住）
    const currentPassed = this.players[this.current].passed;
    if (!currentPassed && this._handoffDoneThisTurn) {
        // 已推進過，但狀態可能不同步 → 強制重繪避免卡住
        this.render();
        return;
    }
    this._handoffDoneThisTurn = true;
    this.players[this.current].mustFaceUp = false;
    // Find next non-passed player in cyclic order
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) { this.current = nxt; break; }
    }
    this.selected = null; this.selectedField = null;
    this._resetTurnStartFlags(this.current);
    this._triggerPreTurnFlip();
    this._triggerPangtongLianhuan();
    this._triggerSunjianYinghun(this.current);
    this._triggerTurnStartSkills(this.current);
    this._logTurnStart();
    this.render();
}

_logTurnStart() {
    if (!this.replay) return;
    this.recordEvent('turn_start', {
        player: this.current,
        hands: this.players.map(p => p.hand.map(c => c.data.id)),
        handCounts: this.players.map(p => p.hand.length),
        foods: this.players.map(p => p.food),
        passed: this.players.map(p => !!p.passed)
    });
}

/* ★ v3.7 preend 重製：
   - 結算前 = 迷你出牌階段，輪流行動（與 turn 相同）。
   - 行動順序依「本輪先後手」：先手方先行動。
   - 只有 PREEND_SKILLS（奇襲/奇謀/奔襲）卡片可以打出；馬岱/徐榮 特許以埋伏方式打出。
   - 放棄後即退出結算前；對方仍可繼續出牌，直到也放棄。
   - 雙方都放棄 → finishPreEnd()：先重算所有過去陣地，再結算當前陣地。 */
startPreEnd() {
    console.log('[startPreEnd]', {
        round: this.round,
        roundFirstPlayer: this.roundFirstPlayer,
        passOrder: (this.passOrder || []).slice(),
        passed: this.players.map(p => p.passed)
    });
    this.phase = 'preend';
    this.preEndPassed = new Array(this.numPlayers).fill(false);
    this.preEndTurn = this.roundFirstPlayer;   // 先手方先行動
    this.selected = null; this.selectedField = null;
    this.addLog('bat', '═══ 陣地結算前 ═══');
    this.recordEvent('preend_start', { firstActor: this.preEndTurn });
    const actor = this.preEndTurn;
    if (this.isAI(actor)) {
        this.cover = false;
        this.render();
        this._sTO(() => this.doPreEndAI(), 900);
    } else if (this.netMode) {
        this.cover = false;
        this.render();
    } else {
        // 熱座模式：蓋牌等待裝置交接
        this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
        this.cover = true;
        this.render();
    }
}
/* 放棄（結算前）：放棄後退出 preend，換下一位未放棄者 */
preEndAct() {
    if (this.phase !== 'preend' || this.cover || this.countdown !== null) return;
    const pi = this.preEndTurn;
    if (pi === undefined || pi === null) return;
    if (this.preEndPassed[pi]) return;
    this.preEndPassed[pi] = true;
    this.addLog(pi, `[R${this.round}·結算前] ${this.players[pi].name} 放棄出牌`);
    this.recordEvent('preend_pass', { player: pi });
    this._preEndAdvance(pi);
}
/* preend 輪轉：找下一位未放棄者；都放棄 → finishPreEnd() */
_nextPreEndActor(fromPi) {
    for (let step = 1; step <= this.numPlayers; step++) {
        const pi = (fromPi + step) % this.numPlayers;
        if (!this.preEndPassed[pi]) return pi;
    }
    return null;
}
_preEndAdvance(fromPi) {
    this.selected = null; this.selectedField = null;
    const next = this._nextPreEndActor(fromPi);
    if (next === null) { this.finishPreEnd(); return; }
    this.preEndTurn = next;
    if (this.isAI(next)) {
        this.cover = false;
        this.render();
        if (this.aiTimer) clearTimeout(this.aiTimer);
        this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
    } else if (next === fromPi || this.netMode) {
        // 同一位人類繼續出牌（其他人都已放棄），或網路模式各自畫面
        this.cover = false;
        this.render();
    } else {
        // 熱座：換人 → 蓋牌 + 交接畫面
        this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
        this.cover = true;
        this.render();
    }
}
/* 裝置交接後揭示畫面（hotseat） */
advancePreEnd() {
    this.cover = false;
    this.render();
    this.scheduleAI();
}
/* ★ v3.7: 雙方放棄後 → 先重算所有過去陣地（r1 → 上一輪），再結算當前陣地 */
finishPreEnd() {
    this.preEndTurn = null;
    this.addLog('bat', '═══ 結算前結束 — 重新檢查過去陣地 ═══');
    this._takeYbSnapshot();
    this._recheckAllPastBattlefields();
    const winners = this._collectGameWinners();
    if (winners) { this._endGameWithWinners(winners, true); return; }
    this.settle();
}
/* 這張牌是否可在結算前階段打出（奇襲/奇謀/奔襲，外加特許的馬岱/徐榮） */
isPreEndPlayable(inst) {
    if (!inst || !inst.data) return false;
    const sk = inst.data.skills || [];
    return PREEND_CARD_IDS.includes(inst.data.id) || sk.some(s => PREEND_SKILLS.includes(s));
}
/* ★ v3.7: 馬岱/徐榮 只有 onFlip 效果 → 結算前必須背面進場才有作用 */
_preEndMustAmbush(inst) {
    return !!(inst && inst.data && PREEND_CARD_IDS.includes(inst.data.id));
}
/* ★ v3.7: 結算前出牌時，這張牌是否應以「埋伏」方式打出 */
_preEndAsAmbush(inst) {
    return !!(inst && inst.data && (inst.data.forceFaceDown || this._preEndMustAmbush(inst)));
}
/* ★ v3.7 重製：AI 在結算前階段的出牌邏輯（輪流制，只能打奇襲/奇謀/奔襲或埋伏馬岱/徐榮） */
doPreEndAI() {
    if (this.phase !== 'preend') return;
    const pi = this.preEndTurn;
    if (pi === undefined || pi === null) return;
    if (!this.isAI(pi)) return;
    if (this.preEndPassed[pi]) return;

    const p = this.players[pi];
    const bi = this.currentBfIndex;
    const oppPi = this.opponentOf(pi);

    // 目前可見戰力 + 埋伏牌估算（保守：每張背面 3 點預期）
    const myVisible = this.fieldPower(pi, bi, false);
    const oppVisible = this.fieldPower(oppPi, bi, false);
    const myFlipPotential = p.fields[bi].filter(c => c.faceDown).length * 3;
    const oppFlipPotential = this.players[oppPi].fields[bi].filter(c => c.faceDown).length * 3.5;

    const myEff = myVisible + myFlipPotential;
    const oppEff = oppVisible + oppFlipPotential;

    // 平手時先手方勝 — 後手任何平手都算輸，因此 +1 修正
    const iAmFirst = (this.roundFirstPlayer === pi);
    const margin = (myEff - oppEff) - (iAmFirst ? 0 : 1);

    // 只有奇襲/奇謀/奔襲卡（或馬岱/徐榮埋伏）可以在結算前打出
    const playable = p.hand.filter(c =>
        this.isPreEndPlayable(c) && (c.data.forceFaceDown || this._preEndMustAmbush(c) ? true : c.data.cost <= p.food)
    );
    if (playable.length === 0) { this.preEndAct(); return; }

    // 對每張牌 × 每個可打陣地評分，選最佳組合
    let best = null, bestField = bi, bestScore = -Infinity;
    for (const c of playable) {
        const allowed = this.getPlayableFields(c, pi, 'preend');
        for (const f of allowed) {
            const s = this._scorePreEndPlacement(pi, c, f, margin);
            if (s > bestScore) { bestScore = s; best = c; bestField = f; }
        }
    }

    // 能翻盤過去陣地 → 無條件打（翻盤 = 直接多一勝）
    if (best && bestScore >= 22) {
        this.doPreEndPlay(best, this._preEndAsAmbush(best), bestField);
        return;
    }

    // 非最後一輪 + 極大落後 → 放棄當前陣地，保留資源給下一輪
    const roundIsFinal = (this.round >= this.fieldCount);
    if (!roundIsFinal && margin < -10 && p.hand.length >= 3) {
        this.preEndAct();
        return;
    }

    if (!best || bestScore <= 0) { this.preEndAct(); return; }
    this.doPreEndPlay(best, this._preEndAsAmbush(best), bestField);
}
/* 結算前出牌評分：過去陣地(翻盤) > 當前陣地(追分) > 未來陣地(布局) */
_scorePreEndPlacement(pi, c, f, margin) {
    const bi = this.currentBfIndex;
    const oppPi = this.opponentOf(pi);
    const pow = c.data.power || 0;
    const cost = c.data.cost || 0;
    // ★ v3.7: 馬岱/徐榮（埋伏限定）— 價值來自結算時翻開的【斬除】，而非自身戰力
    if (this._preEndMustAmbush(c)) {
        const zf = this._predictZhanchuTargets(pi, f);
        let s = pow - cost;                        // 翻開後自身戰力，扣掉結算時才要付的糧
        if (zf.fodder.length > 0) {
            const worst = zf.fodder.reduce((a, b) => ((b.data.power || 0) > (a.data.power || 0) ? b : a));
            s += 6 + (worst.data.power || 0) * 2;  // 移除敵軍 = 相對戰力的雙倍 swing
        } else if (zf.lastFaceUp) {
            s += 4;                                // 無 1 糧目標：1 傷害 + 失去非鎖定技
        }
        if (margin >= 4) s -= 6;                   // 已穩贏 → 不必多花一筆結算糧
        return s;
    }
    if (f < bi) {
        // 過去陣地：只有能翻盤才有意義
        const myF = this.fieldPower(pi, f, false);
        const oppF = this.fieldPower(oppPi, f, false);
        const projected = myF + pow;
        const hist = this.history.find(h => h.round === f + 1);
        const wasFirst = hist && hist.firstPlayer === pi;
        if (myF >= oppF) return -5;                          // 已勝 → 沒意義
        if (projected > oppF) return 40;                     // 直接翻盤
        if (projected === oppF && wasFirst) return 22;       // 追平且該輪先手 → 翻盤
        return -20;                                          // 還是輸 → 浪費
    }
    if (f === bi) {
        // 當前陣地：依落後程度決定投入
        if (margin >= 4) return -1;                          // 穩贏 → 不浪費糧
        if (margin >= 1) return pow - cost * 0.5;            // 小贏 → 保守加碼
        return pow * 2 - cost;                               // 平手/落後 → 全力追
    }
    // 未來陣地：預先布局
    const myF = this.fieldPower(pi, f, false);
    const oppF = this.fieldPower(oppPi, f, false);
    if (myF < oppF && myF + pow > oppF) return 12;
    if (myF < oppF && myF + pow === oppF && this.roundFirstPlayer === pi) return 8;
    return 2 - cost * 0.5;
}

/* v3.1 新增 / v3.7 重製：在 preend 出牌的實作（與 doPlay 類似但狀態不同） */
doPreEndPlay(inst, asAmbush, bi) {
    const pi = this.preEndTurn;
    if (pi === undefined || pi === null) return;
    const p = this.players[pi];
    if (!inst || !p.hand.includes(inst)) { this.preEndAct(); return; }
    if (!this.isPreEndPlayable(inst)) { this.preEndAct(); return; }   // 只有奇襲/奇謀/奔襲、馬岱/徐榮埋伏 可打
    const hasJieliangPre = p.fields[bi].some(c =>
        !c.faceDown && !c.silenced && (c.data.skills||[]).includes('借糧'));
    const effCost = (hasJieliangPre && inst.data.cost > 1) ? inst.data.cost - 1 : inst.data.cost;
    if (!asAmbush && p.food < effCost) { this.preEndAct(); return; }

    if (!asAmbush) {
        p.food -= effCost;
        p.roundSpent += effCost;
    }
    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = !!asAmbush;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = !asAmbush;
    inst.grantedFubing = !!(asAmbush && (
        (!inst.data.isAmbush && this.hasShefuBonus(pi, bi)) ||
        (inst.data.skills||[]).includes('潛襲')
    ));
    p.fields[bi].push(inst);                              // ★ FIX: place card on field
    inst.playedBy = pi;                                   // ★ v3.8
    this._trackCardPlayed(pi, inst.data.id);              // ★ v3.7: track play
    this.cardsPlayedCount++;                              // ★ FIX
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;  // ★ FIX
    if (!asAmbush) this.players[pi].lastFaceUpEnemy[bi] = inst;

    this.addLog(pi, `[R${this.round}·結算前] ${p.name} ${asAmbush ? '埋伏' : '加碼'} ${inst.data.name}（-${asAmbush ? 0 : inst.data.cost}糧｜餘${p.food}）`);  // ★ FIX: log line
    this.recordEvent('play', {
        player: pi, cardId: inst.data.id, cardUid: inst.uid, field: bi, faceDown: !!asAmbush,
        foodCost: asAmbush ? 0 : inst.data.cost, foodAfter: p.food, handAfter: p.hand.length,
        phase: 'preend'
    });

    if (!asAmbush) this.runEntryTriggers(pi, inst, bi);
    // ★ v3.7: 夏侯淵【奔襲】交換 — preend 才是真正能打到過去陣地的階段，這裡必須補上
    this._benxiSwap(pi, inst, bi, asAmbush);
    this.applyBurn(pi);
    this.drawOne(pi);

    // ★ v3.7: 若打在過去陣地，標記為待重新結算（finishPreEnd 會統一重算）
    if (!asAmbush && bi < this.currentBfIndex) this._markPendingFlip(bi);

    // ★ v3.7: 上將（甘寧）在結算前出牌後同樣自動放棄
    if (!asAmbush && inst.data.isGeneral) {
        this.preEndPassed[pi] = true;
        this.addLog(pi, `[R${this.round}·結算前] ${inst.data.name}為上將！${p.name} 結算前停止出牌`);
        this.recordEvent('general_pass', { player: pi, cardId: inst.data.id, phase: 'preend' });
    }

    // ★ v3.7: 輪流制 — 交給下一位未放棄者；都放棄 → finishPreEnd()
    this._preEndAdvance(pi);
}

/* ============ AI decision ============ */
decidePlayAI(pi) {
    const diff = this.getAIDifficulty(pi);
    const p = this.players[pi];
    const opp = this.players[this.opponentOf(pi)];
    const bi = this.currentBfIndex;
    const myField = p.fields[bi];
    const oppField = opp.fields[bi];
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);
    const totalOnField = myField.length + oppField.length;
    const oppPassed = opp.passed;
    const myWins = p.wins, oppWins = opp.wins;
    const oppAtMatchPoint = (oppWins === 1);
    const myFieldEmpty = myField.length === 0;
    const isFirstMoveOfRound = myFieldEmpty && oppField.length === 0;
    const iAmResponding = myFieldEmpty && oppField.length > 0;
    const alreadyWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === pi));
    const oppWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === (this.opponentOf(pi))));
    const iAmAheadInMatch = myWins > oppWins;
    const iAmBehindInMatch = myWins < oppWins;
    // ★ v3.4.2: 糧草承諾 = 場上已有的背面牌 + 手上伏兵預留（最便宜的 2 張）
    const myFieldFlipCost = myField.filter(c => c.faceDown).reduce((s, c) => s + c.data.cost, 0);
    const handFubing = p.hand.filter(c =>
        c.data.forceFaceDown || (c.data.skills||[]).includes('伏兵'));
    let myHandFubingReserve = 0;
    if (handFubing.length > 0) {
        const sorted = [...handFubing].sort((a, b) => a.data.cost - b.data.cost);
        myHandFubingReserve = sorted.slice(0, Math.min(2, sorted.length))
            .reduce((s, c) => s + c.data.cost, 0);
    }
    const myPendingFlipCost = myFieldFlipCost + myHandFubingReserve;

	// v3.6：更保守/現實的對手潛力估計。
	// 一張牌平均戰力 ≈ 3，但需要花 1-2 糧。
	// 對手最多能打出的牌數 = min(手牌數, 糧草能支撐的次數)
	const oppCardsCapable = Math.max(0, Math.min(
		opp.hand.length,
		Math.floor(opp.food / 1.8)      // 假設平均 1.8 費/張
	));
	const oppFaceDownCount = oppField.filter(c => c.faceDown).length;
	const oppFlipPotential = oppFaceDownCount * 3.0;
	const myFlipPotential = myField.filter(c => c.faceDown).reduce((s, c) => s + (c.data.power || 0), 0);
	// 平均每張牌 3.0 戰力（含上將時可能更高，這裡保守）
	const oppMaxPotential = oppCardsCapable * 3.0 + oppFlipPotential;
    const myEffectivePow = myPow + myFlipPotential;
    const oppEffectivePow = oppPow + oppFlipPotential;
    const myLead = myEffectivePow - oppEffectivePow;
    const safeLead = myEffectivePow > (oppPow + oppMaxPotential + 2);
    const alreadyWinningBig = myLead > 8;
    const iAmSecondPlayer = (this.current !== this.roundFirstPlayer);

    this.maybeAutoJiushiAI(pi);

        handFubing.forEach(c => { handScore += c.data.cost <= 2 ? 3 : 1; });

        // 完全沒伏兵可搭配 → 重罰（2/3 白板）
        if (fieldFubing.length === 0 && handFubing.length === 0) score -= 15;

        // 已有 2 張以上便宜伏兵 → 潘璋站場能立即帶來高收益
        const cheapFieldFubing = fieldFubing.filter(c => c.data.cost <= 2).length;
        if (cheapFieldFubing >= 2) score += 8;
        else if (cheapFieldFubing >= 1) score += 4;

        // ★ 粮草承諾檢查（避免打潘璋後無粮翻開伏兵）
        const existingFlipCost = myFieldNow.filter(c => c.faceDown)
            .reduce((s, c) => s + c.data.cost, 0);
        const handFubingCost = handFubing.reduce((s, x) => s + x.data.cost, 0);
        const foodAfter = p.food - (d.cost || 0);
        if (handFubingCost + existingFlipCost > foodAfter) score -= 25;
    }
    /* 孫權【權衡】：手牌品質差時權衡更值 */
    if (d.id === 'sunquan') {
        const badInHand = p.hand.filter(c => {
            const r = c.data.power / Math.max(1, c.data.cost);
            return c.data.cost > 3 || r < 0.8;
        }).length;
        if (badInHand >= 2) score += 3;
    }
    /* 周泰【不屈/護衛】：落後時防守強 */
    if (d.id === 'zhoutai') {
        if (myPow < oppPow) score += 3;
        // 己方有強卡需要保護 → 護衛有價值
        const highValueAlly = myFieldNow.some(c => !c.faceDown && c.data.power >= 4);
        if (highValueAlly) score += 3;
    }
    /* ============ 吳國擴充 (213-215) AI 評分 ============ */
    /* 韓當【飛矢】：敵方有正面牌時價值大增 */
    if (d.id === 'handang') {
        const enemyVis = oppFieldNow.filter(c => !c.faceDown).length;
        score += enemyVis * 2;
        const lowAllies = p.hand.filter(c => !c.data.forceFaceDown && c.data.power < 3).length;
        if (lowAllies >= 2) score += 3;
        if (opp.passed) score -= 3;
    }
    /* 徐盛【疑城】：本陣背面牌越多越強 */
    if (d.id === 'xusheng') {
        const fdOnField = myFieldNow.filter(c => c.faceDown).length;
        score += fdOnField * 4;
        const potentialFubing = p.hand.filter(c =>
            (c.data.skills||[]).includes('伏兵') || c.data.forceFaceDown
        ).length;
        if (potentialFubing >= 2) score += 4;
    }
    /* 凌統【獨殿】：牌少時加分，落後時加分 */
    if (d.id === 'lingtong') {
        const allyCnt = myFieldNow.filter(c => !c.faceDown).length;
        // 自己是本陣最後進場的牌（剛出=最後）
        if (allyCnt === 0) score += 5;      // 進場即為最後一張
        else if (allyCnt === 1) score += 2;
        // 己方本陣牌數<4（進場後）
        if (allyCnt + 1 < 4) score += 3;
        // 己方未佔優勢/劣勢
        if (myPow < oppPow) score += 5;     // 劣勢：兩個條件都觸發
        else if (myPow === oppPow) score += 3;  // 平手：只觸發一個
    }	
	    /* 丁奉【短兵】：對陣正面牌越多越強，進場即為一次性 +N */
    if (d.id === 'dingfeng') {
        const enemyVis = oppFieldNow.filter(c => !c.faceDown).length;
        // 進場時 +min(3, enemyVis)，但進場後對陣會多一張（自己不算）
        const bonus = Math.min(3, enemyVis);
        score += bonus * 2;                  // 每 +1 戰力算 2 分
        if (enemyVis >= 3) score += 3;       // 吃滿 +3 額外獎勵
        // 對手已放棄且沒牌 → 沒加成，扣分
        if (enemyVis === 0 && opp.passed) score -= 5;
    }
    /* ============ 魏國續版 AI 專屬評分 ============ */

    /* 鐘會【權謀/自立】：場上每張牌 +1，每 3 張再 +1。
       場上牌數越多越值。空場時嚴重浪費。 */
    if (d.id === 'zhonghui') {
        const fieldCount = myFieldNow.length;
        if (fieldCount >= 3) score += fieldCount * 2.5;
        else if (fieldCount >= 2) score += 4;
        else score -= 6;              // 空場或 1 張，權謀/自立幾乎不觸發
    }
    /* 曹丕【魏王/放逐】：魏王是通用 aura，放逐是手牌過濾。
       手上有 2+ 張爛牌 → 放逐很值；能吃到魏王光環更值。 */
    if (d.id === 'caopi') {
        const badInHand = p.hand.filter(c => {
            const r = c.data.power / Math.max(1, c.data.cost);
            return c.data.cost >= 3 || r < 1.0;
        }).length;
        if (badInHand >= 2) score += 6;
        else if (badInHand === 1) score += 3;
        else score -= 4;   // ★ v3.9：無爛牌可丟，放逐只是空轉
        // 魏國友軍在場 → 魏王 aura 加分
        const weiAllies = myFieldNow.filter(c => !c.faceDown && c.data.faction === 'wei').length;
        if (weiAllies >= 2) score += 3;
    }
    /* 曹彰【將馳】上將：額外支付糧草換戰力。
       糧草充裕 + 對手無強牌時暴強；糧草不足時浪費。 */
    if (d.id === 'caozhang') {
        const spareFood = p.food - 1;             // 進場費 1，其餘可灌
        if (spareFood >= 4) score += 8;
        else if (spareFood >= 2) score += 5;
        else if (spareFood >= 1) score += 2;
        // 對手目前最高戰力 vs 曹彰可達戰力
        const maxEnemyP = oppFieldNow.filter(c=>!c.faceDown).reduce((m,c)=>Math.max(m, c.data.power+(c.mod||0)), 0);
        const myMaxP = 2 + Math.min(5, spareFood) * 2 + 2;  // 基礎2 + 灌糧 + 最高+2
        if (myMaxP > maxEnemyP) score += 4;
        // 賽末點時不該出（灌光糧草但可能失敗）
        if (ctx.mustWinThisRound && myPow <= oppPow) score += 6;
    }
    /* ★ v3.4.1: 賈詡【毒士】AI 評分（含堅守保護判斷 + 正確 getPower） */
    if (d.id === 'jiaxu') {
        const targets = oppFieldNow.filter(c => {
            if (c.faceDown || c.data.isGeneral) return false;
            // ★ 用 getPower 而非原始戰力（與實際技能邏輯一致）
            const ep = this.getPower(c, this.opponentOf(pi), bi, false);
            if (ep > 3) return false;
            // ★ 受堅守保護 → 無法移除，不算目標
            if (this._isJianshouProtected(c, this.opponentOf(pi), bi)) return false;
            return true;
        });
        targets.forEach(t => {
            const tsk = t.data.skills || [];
            const hasAura = tsk.some(s => ['蜀王','魏王','吳王','建言','督戰','堅守','隱忍'].includes(s));
            score += hasAura ? 8 : 4;
        });
        // ★ 無可移除目標時重罰（比原本 -5 更重，因為完全浪費）
        if (targets.length === 0) score -= 10;
    }
    /* ★ v3.4.1: 馬岱 / 徐榮【斬除】AI 評分 */
    if (d.id === 'madai' || d.id === 'xurong') {
        const enemyPi = this.opponentOf(pi);
        // 優先：1 糧敵軍（可移除）
        const fodder = oppFieldNow.filter(c => {
            if (c.faceDown || c.data.cost !== 1) return false;
            if (this._isJianshouProtected(c, enemyPi, bi)) return false;
            return true;
        });
        fodder.forEach(t => {
            score += this.cardThreatValue(t) * 1.2;
        });
        // 其次：對最後正面敵軍造成 1 傷害 + 沉默（但傷害會被堅守擋）
        if (fodder.length === 0) {
            const last = this._validLastFaceUpEnemy(enemyPi, bi);
            if (last) {
                // 若最後正面敵軍被堅守保護，傷害被擋、沉默無意義 → 幾乎沒用
                if (this._isJianshouProtected(last, enemyPi, bi)) {
                    score -= 8;
                } else {
                    const tsk = last.data.skills || [];
                    const silenceValue = tsk.filter(s => !LOCKED_SKILLS.includes(s)).length;
                    score += silenceValue * 2 + 2;
                }
            } else {
                score -= 8;   // 完全無目標
            }
        }
        // 蓋牌本身是伏兵 → 加分
        if (d.isAmbush || (d.skills||[]).includes('伏兵')) score += 3;
    }	
    /* 荀彧【驅虎】：對陣 2+ 張時，移 1 張 + 對剩下一張 -1。
       對手場上越擠越值，尤其對手有高戰力或關鍵牌。 */
    if (d.id === 'xunyu') {
        const visCnt = oppFieldNow.filter(c => !c.faceDown).length;
        if (visCnt >= 3) score += 9;        // was 6
        else if (visCnt >= 2) score += 6;   // was 4
        else score -= 5;                    // ★ v3.9：不足 2 張時不觸發，白白浪費
        const hasBigEnemy = oppFieldNow.some(c => !c.faceDown && c.data.power >= 5);
        if (hasBigEnemy) score += 3;
        if (visCnt >= 2) score += 3;
        const hasKeySupport = oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).some(s => ['蜀王','魏王','吳王','建言','督戰'].includes(s)));
        if (hasKeySupport) score += 3;
    }
    /* 荀攸【奇策】：進場時糧草 +1。 */
    if (d.id === 'xunyou') {
        score += 3;                                // 基本值
        if (p.food <= 2) score += 3;               // 糧草緊張時更值
        if (ctx.mustWinThisRound && myPow < oppPow) score += 2;   // 決勝輪補糧
    }
    /* 曹洪【護衛/鶴翼】：保護己方高價值卡；鶴翼保底 1 戰力。
       己方有 4+ 戰力卡 → 護衛有目標；空場 → 浪費。 */
    if (d.id === 'caohong') {
        const hasTarget = myFieldNow.some(c =>
            c !== null && !c.faceDown && c.data.power >= 4);
        if (hasTarget) score += 5;
        // 鶴翼：面對力竭時保底
        const oppHasLijie = oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).includes('力竭'));
        if (oppHasLijie) score += 3;
        // 自己會被威嚇/烈矢打 → 護衛能替隊友擋
        if (oppFieldNow.some(c => !c.faceDown &&
            (c.data.skills||[]).some(s => ['威嚇','烈矢','飛矢'].includes(s)))) {
            score += 3;
        }
    }
    /* ★ v3.5: 程昱【設伏 + 捧日】AI 評分
       捧日只需要「一張高戰力背面牌」就能把程昱基本戰力拉到很高。
       所以程昱要的不是很多背面牌，而是「至少 1 張高戰力」。
       目前場上已有的背面牌最高戰力，直接決定捧日的潛在收益。 */
    if (d.id === 'chengyu') {
        const fdOnField = myFieldNow.filter(c => c.faceDown);

        // ★ 場上已有背面牌 → 看最高戰力
        const highestOnField = fdOnField.length > 0
            ? Math.max(...fdOnField.map(c => c.data.power || 0))
            : 0;
        if (highestOnField >= 6) score += 15;      // 捧日能變 6+ 戰力，超值
        else if (highestOnField >= 4) score += 9;
        else if (highestOnField >= 2) score += 4;

        // ★ 手上有高戰力牌（可埋伏）→ 潛在 combo
        const handHighPower = p.hand.filter(x =>
            x !== c &&
            !x.data.forceFaceDown &&
            !x.data.isGeneral &&
            (x.data.power || 0) >= 4
        ).length;
        if (handHighPower >= 1) score += 6;
        if (handHighPower >= 2) score += 3;

        // 沒高戰力背面牌也沒高戰力手牌 → 捧日完全無用
        if (highestOnField < 4 && handHighPower === 0) score -= 10;

        // 己方已有鐘會/潘璋 → 設伏能觸發 combo
        const hasSynergy = myFieldNow.some(c => !c.faceDown &&
            ['zhonghui','panzhang'].includes(c.data.id));
        if (hasSynergy) score += 4;

        // ★ 粮草承諾檢查（一場只需一張高戰力，但這張要付得起）
        const existingFlipCost = fdOnField.reduce((s, c) => s + c.data.cost, 0);
        const cheapHandFubing = p.hand
            .filter(x => x !== c && !x.data.forceFaceDown && !x.data.isGeneral && x.data.cost >= 1)
            .map(x => ({ cost: x.data.cost, power: x.data.power || 0 }))
            .sort((a, b) => b.power - a.power)   // 高戰力優先
            .slice(0, 1)
            .reduce((s, x) => s + x.cost, 0);
        const foodAfter = p.food - (d.cost || 0);
        if (existingFlipCost + cheapHandFubing > foodAfter) score -= 20;
    }
    /* 李典【忘隙】：前一個友軍 + 下一個友軍各 +1。
       最佳位置：前 1 張、後至少 1 張。補充已有評分。 */
    if (d.id === 'lidian') {
        const prior = myFieldNow.filter(c => !c.faceDown).length;
        const handAfter = p.hand.filter(c =>
            c.data.cost <= p.food &&
            !c.data.forceFaceDown &&
            c.data.cost >= 1).length;
        // 前有 1-2 張、後有 2+ 張 → 完美
        if (prior >= 1 && prior <= 2 && handAfter >= 2) score += 5;
        // 前無、後有 → 只吃一半
        else if (prior === 0 && handAfter >= 2) score += 1;
        // 前有、後無 → 只吃一半
        else if (prior >= 3 && handAfter === 0) score -= 3;
    }
    /* 曹植【酒詩】：累計 7 張後返回手牌 + 補糧。
       屬「拖時間」牌，逆風時無價值，順風時保值。
       已在手牌中時（AI 從手牌出），主動視為「潛在回收」。 */
    if (d.id === 'caozhi') {
        const played = p.cardsPlayedByPlayer || 0;
        if (played >= 7) score += 5;       // 已可回收
        else if (played >= 5) score += 2;  // 接近門檻
        else score -= 3;                   // ★ v3.9：還太早，當填充物只會浪費節奏
        // 己方領先時留著保值
        if (myPow > oppPow + 3) score += 3;
        // 糧草緊張時：酒詩能補糧回來
        if (p.food <= 2) score += 3;
    }		
    /* 若手上有上將，優先出「啟動器」卡 */
    if (!d.isGeneral && !d.forceFaceDown) {
        const handHasGeneral = p.hand.some(x =>
            x !== c && x.data.isGeneral && !x.data.forceFaceDown);
        if (handHasGeneral) {
            const sk = d.skills || [];
            if (sk.includes('放權')) score += 12;      // 劉禪
            if (sk.includes('龍吟')) score += 12;      // 關平
            if (sk.includes('忘隙')) score += 10;      // 李典
            if (sk.includes('護衛')) score += 8;       // 曹洪/周泰
            if (sk.includes('督戰')) score += 8;       // 程普
            if (sk.includes('隱忍')) score += 6;       // 司馬懿
            if (sk.includes('蜀王') || sk.includes('魏王') || sk.includes('吳王')) score += 10;
        }

        /* ★ v3.4.1: 關羽 COMBO — 鋪被動增益，擴大斬將門檻
           若手上有【關羽】，這張增益牌的直接價值 = 讓關羽多斬 1 張牌的機會。
           每 +1 戰力 ≈ 斬將門檻 +1 ≈ 可能多斬一張中大型敵牌。 */
        const hasGuanyuInHand = p.hand.some(x =>
            x !== c && x.data.id === 'guanyu' && !x.data.forceFaceDown);
        if (hasGuanyuInHand) {
            const sk = d.skills || [];
            // 直接給關羽 +1 戰力的牌 → 大幅加分
            if (sk.includes('龍吟')) score += 15;      // 關平：下一張友軍 +1
            if (sk.includes('放權')) score += 10;      // 劉禪：下一張友軍 +1（並補 1 糧）
            if (sk.includes('建言')) score += 12;      // 法正 / 張昭：同陣地正面友軍 +1
            if (sk.includes('蜀王')) score += 18;      // 劉備 / 劉禪：蜀國光環
            if (sk.includes('鐵騎')) score += 10;      // 馬超：下一陣地 +1（若關羽後續打到下一陣）
            if (sk.includes('忘隙')) score += 8;       // 李典：前後友軍 +1（魏國，僅蜀無用）
            // 補糧 / 抽牌類，讓 combo 能跑完
            if (sk.includes('權衡')) score += 5;
            if (sk.includes('觀星')) score += 5;
        }

        /* 關羽已在場上時，繼續鋪增益無意義（斬將已觸發過）→ 不特別加分
           但若關羽還沒出，且這張牌屬於「前置準備」，則加分（見上） */
    }		
    /* ★ v4.1: 孫堅【英魂】AI 評估（強化版）
       三個關鍵改進：
         ① 孫堅自身被光環/建言放大 → 門檻提高 → 可 buff 更多友軍
         ② 諸葛亮 combo → buff 會被空城倍數放大
         ③ 情境感知：領先時不浪費上將、賽末點落後時當救命牌
       ⚠ 注意：英魂只 buff「進場時已在場」的友軍，不 buff 後續進場的。 */
    if (d.id === 'sunjian' && !d.forceFaceDown) {
        const pred = this._predictYinghunEntry(pi, bi);
        if (pred) {
            const buffCount = pred.willBuff.length;

            /* ── ① 立即 buff 的基礎價值 ── */
            score += buffCount * 3;
            pred.willBuff.forEach(b => {
                const threat = this.cardThreatValue(b.card);
                score += Math.min(6, threat * 0.6);   // 上限 4 → 6
            });
            if (buffCount >= 2) score += 6;
            if (buffCount >= 3) score += 5;

            /* ── ② 孫堅自身被放大 → 門檻提高 ── */
            // 若孫堅最終戰力 > 6（吃到吳王、建言、放權、鐵騎等），
            // 門檻提升後原本 6 戰力的友軍也會被 buff → 額外加分。
            if (pred.myPower > 6) {
                const extraThreshold = pred.myPower - 6;
                score += extraThreshold * 3;
            }

            /* ── ③ 諸葛亮 combo（空城倍數放大） ── */
            const zhugeBuffed = pred.willBuff.find(b => b.card.data.id === 'zhugeliang');
            if (zhugeBuffed) {
                const ybCount = myFieldNow.filter(c =>
                    (c.data.skills||[]).includes('疑兵')).length;
                if (ybCount >= 1) score += 4;
                if (ybCount >= 2) score += 4;
                if (ybCount >= 3) score += 4;
            }

            /* ── ④ 完全 buff 不到（友軍全高於門檻）→ 浪費 ── */
            if (buffCount === 0 && pred.wontBuff.length > 0) score -= 6;

            /* ── ⑤ 司馬懿【隱忍】combo ── */
            // 隱忍在場時，對手無法阻止我們後續出牌，孫堅的 buff 更安全
            const hasSimaYi = myFieldNow.some(x =>
                !x.faceDown && !x.silenced && x.data.id === 'simayi');
            if (hasSimaYi && buffCount >= 1) score += 3;

            /* ── ⑥ 賽末點落後 → 孫堅是即時翻盤戰力 ── */
            if (ctx.mustWinThisRound && myPow < oppPow) {
                const projected = myPow + pred.myPower + buffCount;
                if (projected > oppPow) score += 8;
                else if (projected === oppPow && this.roundFirstPlayer === pi) score += 4;
            }

            /* ── ⑦ 領先時出孫堅（浪費上將斷點）→ 扣分 ── */
            if (opp.passed && myPow > oppPow + 5) score -= 8;
            else if (opp.passed && myPow > oppPow + 2) score -= 3;
        }
    }
    /* ★ v3.4.1: 關羽【斬將】價值評估
       AI 需要知道「現在出關羽能斬到多少東西」，因為斬將門檻 = 關羽最終戰力 - 4，
       而最終戰力會因場上被動加成（蜀王 / 建言 / 龍吟 / 鐵騎等）浮動。 */
    if (d.id === 'guanyu' && !d.forceFaceDown) {
        const pred = this._predictGuanyuEntry(pi, bi);
        if (pred) {
            let killValue = 0, killCount = 0;
            pred.enemies.forEach(e => {
                if (e.kind === 'normal' && e.power <= pred.threshold) {
                    killValue += this.cardThreatValue(e.card);
                    killCount++;
                }
            });
            // 斬到的牌價值 × 1.5（斬將是節奏牌，價值高於單純移除）
            score += killValue * 1.5;
            // 一次斬 2 張以上：大幅加分
            if (killCount >= 2) score += 6 + killCount * 2;
            // 有敵軍但一張都斬不掉 → 關羽只是 7 戰力，扣分
            if (killCount === 0 && pred.enemies.length > 0) score -= 12;
            // 有可斬目標時，即使開局懲罰也該降低（見下方 isGeneral 區塊）
            if (killCount > 0) score += 8;
        }
    }
    if (d.isGeneral && !d.forceFaceDown) {
        if (ctx.isFirstMoveOfRound) {
            // v3.5：動態懲罰。若對手手牌多（挑襲/潰銳目標多），或我落後需要翻盤，
            // 開局懲罰降低
            let openPenalty = -50;
            if (p.hand.length >= 3 && opp.hand.length >= 4) openPenalty += 15;
            if (ctx.mustWinThisRound) openPenalty += 15;
            if (ctx.iAmBehindInMatch) openPenalty += 10;
            score += openPenalty;
        }
        else if (ctx.iAmResponding && !(myPow > oppPow) && !ctx.mustWinThisRound) score -= 15;
        else if (opp.passed) {
            if (myPow > oppPow + 5) score -= 8;
            else if (myPow > oppPow) score -= 3;
            else score += 3;
        } else {
            const projected = myPow + (d.power || 0);
            const wouldWin = projected > oppPow;
            if (!wouldWin) score -= 10;
            else if (myPow > oppPow + 5) score -= 8;
            else score += 1;
        }
        if (ctx.alreadyWonRound1 && !ctx.mustWinThisRound) score -= 6;
    }
    /* 奇謀 / 奇襲 / 奔襲：評估放到其他陣地是否能翻盤或追平 */
    const positionSkills = ['奇謀','奇襲','奔襲'];
    if ((d.skills||[]).some(s => positionSkills.includes(s))) {
        const fields = this.getPlayableFields(c, pi);
        let bestFlipBonus = 0;
        for (const f of fields) {
            if (f === bi) continue;
            const myF = this.fieldPower(pi, f, false);
            const oppF = this.fieldPower(this.opponentOf(pi), f, false);
            const cardDelta = (d.power || 0)
                + ((d.skills||[]).includes('建言') ? this.players[pi].fields[f].filter(x=>!x.faceDown).length : 0);
            const projected = myF + cardDelta;
            if (myF < oppF && projected > oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 28);      // 翻盤，極有價值
            } else if (myF < oppF && projected === oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 14);      // 追平
            } else if (myF === oppF && projected > oppF) {
                bestFlipBonus = Math.max(bestFlipBonus, 12);      // 平手→勝
            } else if (myF < oppF && projected < oppF) {
                // 打到輸的場地只會更輸，不鼓勵（除非是拖延型如法正在已結算場地）
                if (f >= bi) bestFlipBonus = Math.max(bestFlipBonus, -6);
            }
        }
        score += bestFlipBonus;
    }	
    if (diff === 'hard') {
	        /* ★ v3.10: 糧草保留智慧
           核心：不要為了「一時的最大戰力」把糧草耗盡，
           導致後續無法回應對手的關鍵威脅（如關羽、呂布、上將等）。
           規則：
             ① 開局（我方場上無牌）時，優先出便宜牌（≤2 費），把貴牌留作 response
             ② 若出完這張後剩餘糧草 < 手上最便宜的「需要糧草的牌」 → 重罰
             ③ 決勝輪（mustWinThisRound）例外，可以梭哈
        */
        {
            const foodAfter = p.food - (d.cost || 0);
            const otherCards = p.hand.filter(x => x.uid !== c.uid && !x.data.forceFaceDown);
            const otherCosts = otherCards.map(x => x.data.cost).filter(v => v > 0);
            const minOtherCost = otherCosts.length > 0 ? Math.min(...otherCosts) : 0;

            // ① 開局貴牌懲罰（對手下回合還有很多牌可出）
            if (ctx.isFirstMoveOfRound && !ctx.mustWinThisRound) {
                if (d.cost >= 3 && otherCards.length >= 2) {
                    const expensiveLeft = otherCards.filter(x => x.data.cost >= 3).length;
                    // 手上還有貴牌 → 不要先出貴牌
                    score -= 5 + expensiveLeft * 3;
                }
            }

            // ② 出完後糧草見底的懲罰
            if (!ctx.mustWinThisRound && otherCards.length >= 2) {
                // 出完後連最便宜的牌都出不起
                if (foodAfter < minOtherCost && minOtherCost > 0) {
                    score -= 12;
                }
                // 出完後只剩 1 張能出的空間
                else if (foodAfter === minOtherCost) {
                    score -= 5;
                }
                // 留下 0~1 糧且手上還有 3+ 張（含貴牌）→ 加重罰
                if (foodAfter <= 1 && p.hand.length >= 3) {
                    const hasExpensive = otherCards.some(x => x.data.cost >= 3);
                    if (hasExpensive) score -= 8;
                }
            }
        }
	        // ★ v3.9: 若手上持有 魏延/鄧艾，且存在「可翻盤的過去陣地」，
        // 本回合不應把糧草用光，需預留 preend 出牌的費用。
        if (!d.isGeneral && !d.forceFaceDown) {
            let pastFlipCost = 0;
            for (const card of p.hand) {
                if (card === c) continue;
                if (!(card.data.skills || []).includes('奇襲')) continue;
                for (let fb = 0; fb < this.currentBfIndex; fb++) {
                    const hist = this.history.find(h => h.round === fb + 1);
                    if (!hist || hist.winner === pi) continue;
                    const myF = this.fieldPower(pi, fb, false);
                    const oppF = this.fieldPower(this.opponentOf(pi), fb, false);
                    const projected = myF + card.data.power;
                    const wasFirst = (hist.firstPlayer === pi);
                    const canFlip = (projected > oppF) || (projected === oppF && wasFirst);
                    if (canFlip) { pastFlipCost = Math.max(pastFlipCost, card.data.cost); break; }
                }
                if (pastFlipCost) break;
            }
            if (pastFlipCost > 0) {
                const foodAfter = p.food - (d.cost || 0);
                if (foodAfter < pastFlipCost) score -= 25;
            }
        }
		// v3.1：下輪資源評估——避免把糧草用完導致下一輪斷炊
		const foodAfterPlay = p.food - (d.cost || 0);
		const foodWasted = Math.max(0, foodAfterPlay + this.cfg.baseRefill - this.cfg.maxFood);
		// v3.4.1: dying with cards in hand is the #1 loss pattern
		if (foodAfterPlay === 0 && p.hand.length >= 3) {
			score -= (p.hand.length >= 5) ? 14 : (p.hand.length >= 4 ? 10 : 7);
		} else if (foodAfterPlay === 1 && p.hand.length >= 3) {
			score -= 5;
		}
		// If opponent will have ≥3 food advantage after this play, they outlast us
		if (opp.food - foodAfterPlay >= 3) {
			score -= 5;
		}
		if (foodWasted > 2) {
			score -= 2;
		}

		// v3.10：平手先手勝。後手方任何平手都等於輸，必須積極拉開
		const iAmFirst = (this.roundFirstPlayer === pi);
		{
			// ★ 先算對手可能的翻面戰力（保守估計）
			const oppFieldRef = this.players[this.opponentOf(pi)].fields[bi];
			const oppPendingFlip = oppFieldRef.filter(c => c.faceDown)
				.reduce((s, c) => s + Math.max(3, c.data.power || 3), 0);
			const oppLikelyFinal = oppPow + oppPendingFlip;

			// 我方「現在能打出的最高戰力」對局面造成的效果
			const myNewPower = myPow + (d.power || 0);
			const marginAfterPlay = myNewPower - oppLikelyFinal;

			if (!iAmFirst) {
				// 後手：平手就是輸。必須讓 marginAfterPlay ≥ 1
				if (marginAfterPlay <= 0) {
					// 這一擊還不夠，繼續加碼
					score += 8;
					if (d.power >= 3) score += 4;
					if (d.power >= 5) score += 3;
				} else if (marginAfterPlay <= 2) {
					// 小贏，但還沒安全（對手可能有伏兵）
					score += 4;
				}
				// 若這張能一次拉開 ≥ 4，大力加分
				if (marginAfterPlay >= 4) score += 5;
			} else {
				// 先手：margin ≥ 1 就贏，避免無謂消耗
				const currentMargin = myPow - oppLikelyFinal;
				if (currentMargin >= 1 && currentMargin <= 3) {
					// 已經領先，別再加碼
					if (d.cost >= 3) score -= 6;
					if (d.cost >= 2 && d.power <= 3) score -= 3;
				}
			}
		}
        const projected = myPow + (d.power || 0);
        const wouldWin = projected > oppPow;
        if (opp.passed && myPow > oppPow + 5) score -= d.cost * 2;
        if (ctx.alreadyWonRound1 && myPow > oppPow + 5 && !ctx.mustWinThisRound) score -= d.cost * 3;
        if (ctx.mustWinThisRound) {
		// v3.9：決勝輪，戰力就是一切。加碼更狠。
		score += (d.power || 0) * 2.5;     // was 1.8
		// 節省型小牌（<3戰力）在決勝輪幾乎沒用
		if ((d.power || 0) <= 2 && !d.isAmbush) score -= 6;   // was -3

		if (wouldWin && !(myPow>oppPow)) score += 10;         // was 6
		else if (wouldWin) score += 2;
		}
        if (opp.food >= 10 && !wouldWin && d.cost >= 3) score -= 4;
        if (ctx.myPendingFlipCost > 0 && p.food - d.cost < ctx.myPendingFlipCost) score -= 25;
        if (Math.abs(myPow - oppPow) <= 2 && d.power >= 4) score += 2;
        if (ctx.iAmBehindInMatch && ctx.mustWinThisRound) score += 3;
        if (ctx.oppWonRound1 && this.round === 2) score += 2;
        const hasWinSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => WIN_TRIGGER_SKILLS.includes(s)));
        const hasLoseSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => LOSE_TRIGGER_SKILLS.includes(s)));
        if (hasWinSkill && wouldWin && !(myPow>oppPow)) score += 3;
        if (hasLoseSkill && !wouldWin && p.wins === 0 && opp.wins === 0) score += 1;

        // v3.4.1: Cross-round patience. If I already have 1 win and this
        // isn't the final round, don't dump expensive cards — keep them
        // for round 3 where they'll matter more.
        const isLastRound = this.round >= this.fieldCount;
        const iAlreadyWon = p.wins >= 1;
        if (!isLastRound && iAlreadyWon) {
            if (d.cost >= 3 && p.food <= 5) score -= 4;
            if (d.cost >= 5) score -= 3;
        }
        // Conversely: if I'm 0-1 (must win 2 in a row), spend MORE in R2
        if (!isLastRound && p.wins === 0 && opp.wins === 1 && this.round === 2) {
            score += 2;  // R2 is a must-win for me
        }

        // v3.4.2: 「這張是唯一能翻盤的牌」加成
        // 若我落後、這張牌的戰力足以讓局面變成領先、且我還有食物，
        // 大幅加分——避免像 0ETAQZW 那樣放著呂布不用就輸了
        const deficit = oppPow - myPow;
        if (deficit > 0 && d.power >= deficit + 2 && d.cost <= p.food && !d.isAmbush) {
            score += 8 + Math.min(6, deficit);   // 落後越多，越想打
        }
    }
    return score + this.rng() * 3;
}
resolveAIScry() {
    if (!this.scry) return;
    const { pi, cards } = this.scry;
    const n = cards.length;
    if (n === 0) { this.scryConfirm(); return; }

    // 1. 對每張牌評分
    const scored = cards.map(c => ({
        card: c,
        score: this._scryCardValue(c, pi)
    })).sort((a, b) => b.score - a.score);  // 高到低

    // 2. 決定每張牌屬於誰
    const owners = this._scryDrawOwners(pi, n);

    // 3. 貪心分配：
    //    - 位置是 AI 的 → 取「剩下最好的」
    //    - 位置不是 AI 的 → 給「剩下最差的」
    const result = new Array(n);
    let head = 0, tail = n - 1;
    for (let i = 0; i < n; i++) {
        if (owners[i] === pi) {
            result[i] = scored[head++].card;
        } else {
            result[i] = scored[tail--].card;
        }
    }

    this.scry.order = result.map(c => c.uid);
    this.scryConfirm();
}
/* ★ v3.5: 曹操【奸雄】AI 猜測
   要根據「對手場上的資訊」判斷，而不是盲目統計牌庫。
   核心原則：
   ① 1 費伏兵（冷箭、馬岱、李儒）是高價值目標 → 優先猜 1
   ② 沒 1 則猜 2（伏兵a、李傕）
   ③ 對手有諸葛亮/龐統/馬謖 → 疑兵(0) 有價值 → 可能猜 0
   ④ 對手有潘璋 → 更多便宜伏兵 → 提高 1、2 權重
   ⑤ 對手有程昱 → 任意牌都能背面 → 可能出現 2、3 費高戰力
   ⑥ 對手有高戰力上將在場（關羽等）→ 這類關鍵牌可能被對手藏著 */
resolveAIJianxiong() {
    if (!this.jianxiong) return;
    const pi = this.jianxiong.pi;
    const oppPi = this.opponentOf(pi);
    const diff = this.getAIDifficulty(pi);

    // 若不是困難 AI：簡單/普通 AI 用基本猜測
    if (diff !== 'hard') {
        const guess = [1, 1, 1, 2, 0][Math.floor(this.rng() * 5)];   // 偏向猜 1
        this.jianxiong.guess = guess;
        this.jxConfirm();
        return;
    }

    // ---- 困難 AI：分析對手場上資訊 ----
    const oppVisible = this.players[oppPi].fields.flat().filter(c => !c.faceDown);
    const hasZhuge = oppVisible.some(c => c.data.id === 'zhugeliang' && !c.silenced);
    const hasPangtong = oppVisible.some(c => c.data.id === 'pangtong' && !c.silenced);
    const hasMasu = oppVisible.some(c => c.data.id === 'masu' && !c.silenced);
    const hasPanZhang = oppVisible.some(c => c.data.id === 'panzhang' && !c.silenced);
    const hasChengyu = oppVisible.some(c => c.data.id === 'chengyu' && !c.silenced);

    // 權重表：戰力 → 猜中的機率權重
    const W = {};
    const add = (power, w) => { W[power] = (W[power] || 0) + w; };

    // ① 疑兵（戰力 0）：只有特定情境才有價值
    if (hasZhuge || hasPangtong || hasMasu) {
        add(0, 3);   // 對手有動機主動打疑兵
    } else {
        add(0, 0.3); // 否則疑兵無用，幾乎不會主動出（除非強制）
    }

    // ② 1 費伏兵群（戰力 1-2）：最高價值目標
    add(1, 6);   // 冷箭伏兵、馬岱、李儒
    add(2, 3);   // 伏兵a、李傕

    // ③ 2 費伏兵群
    add(4, 3);   // 伏兵b、徐榮

    // ④ 3 費伏兵群
    add(6, 2);   // 伏兵c、董卓

    // ⑤ 情境加成
    if (hasPanZhang) {
        // 潘璋在場 → 越多小伏兵越好 → 1、2 費伏兵更可能
        add(1, 5);
        add(2, 4);
    }
    if (hasChengyu) {
        // 程昱在場 → 任意牌可背面 → 高戰力牌也能藏
        add(4, 3);
        add(6, 3);
        add(2, 2);
    }

    // ⑥ 若對手有上將在場但手牌少 → 剩下的高戰力牌可能在場上蓋牌
    const oppHandCount = this.players[oppPi].hand.length;
    if (oppHandCount <= 1) {
        // 對手手牌快空了 → 場上蓋牌可能是關鍵牌
        add(4, 2);
        add(6, 2);
    }

    // 選擇最高權重
    let best = null, bestW = -1;
    for (const [v, w] of Object.entries(W)) {
        if (w > bestW) { bestW = w; best = parseInt(v); }
    }
    this.jianxiong.guess = best;
    this.jxConfirm();
}
/* ============ 觀星/料算 AI 增強 ============ */
/* 對 AI 來說，一張牌的「價值」——用於 scry 排序 */
_scryCardValue(card, pi) {
    const d = card.data;
    const p = this.players[pi];
    let v = d.power || 0;

    // 費用效率
    if (d.cost > 0) v += Math.max(0, 3 - d.cost) * 0.5;

    // 0 費疑兵 + 諸葛亮 = 白給戰力
    if ((d.skills || []).includes('疑兵')) {
        const hasZhuge = p.fields.some(f => f.some(c =>
            !c.faceDown && !c.silenced && c.data.id === 'zhugeliang'));
        v += hasZhuge ? 8 : 2;
    }

    // 諸葛亮本身價值 = 場上疑兵數 × 3（估算）
    if (d.id === 'zhugeliang') {
        const ybCount = p.fields.flat().filter(c =>
            (c.data.skills || []).includes('疑兵')).length;
        // ★ v3.7: 空城公式改為「目前戰力 × max(1, 疑兵數)」
        v = 3 * Math.max(1, ybCount);
    }

    // 上將價值
    if (d.isGeneral) v += 3;

    // 王類光環 / 建言
    const auraSkills = ['蜀王', '魏王', '吳王', '建言'];
    if ((d.skills || []).some(s => auraSkills.includes(s))) {
        const allies = p.fields.flat().filter(c =>
            !c.faceDown && c.data.faction === d.faction).length;
        v += Math.min(allies, 3) * 1.5;
    }

    // Combo 啟動器 / 關鍵牌
    const comboAssets = {
        'liushan': 4, 'guanping': 4, 'caohong': 4,
        'zhangjiao': 3, 'zhangbaogong': 3, 'zhangliang': 3,
        'pangtong': 3, 'chengyu': 3,
    };
    if (comboAssets[d.id]) v += comboAssets[d.id];

    return v;
}
/* 從 AI 開始，回傳「每張牌會被誰抽」的順序（依出牌輪轉） */
_scryDrawOwners(pi, n) {
    const owners = [];
    for (let i = 0; i < n; i++) owners.push((pi + i) % this.numPlayers);
    return owners;
}
/* ============ AI 個性圖示 ============ */
aiIcon(pi) {
    if (!this.isAI(pi)) return '';
    const p = this.players[pi];
    if (p.personality === 'kind') return ' 👑';
    if (p.personality === 'cold') return ' ❄️';
    return ' 🤖';
}

    else fire();
