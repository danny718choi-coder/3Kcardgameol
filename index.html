/* 速度延遲 helper — 只在所有玩家都是 AI 時套用倍率 */
_delay(ms) {
    if (this.netMode) return ms;
    if (this.players && this.players.every(p => p.botType)) return ms / (this.aiSpeed || 1);
    return ms;
}
_sleep(ms) { return sleep(this._delay(ms)); }
_sTO(fn, ms) {
    // v3.6: track timer so we can cancel it on destroy; also guard the callback.
    const id = setTimeout(() => {
        if (this._allTimers) this._allTimers.delete(id);
        if (this._destroyed) return;
        try { fn(); } catch(e) { console.error('[timer]', e); }
    }, this._delay(ms));
    if (this._allTimers) this._allTimers.add(id);
    return id;
}

/* ============ v3.7: 卡片統計掛鉤 ============ */
_statBucketForPlayer(pi) {
    if (this.netMode) return null;              // 網路對戰不記錄
    const p = this.players[pi];
    if (!p) return null;
    // AI 桶：全場都是「困難 AI」
    const allHardBots = this.players.every(x => x.botType === 'hard');
    if (allHardBots) return 'ai';
    // 玩家桶：這一位是人類（botType = null）
    if (!p.botType) return 'player';
    return null;                                // 簡單/普通 AI 不記錄
}
/* ============ v3.8: 統計修正 ============ */
/* 判斷此卡是否應計入勝率統計
   - 一般疑兵（非黃巾）結算時必定被移除，永遠無法出現在勝方場上
     → 統計毫無意義，直接排除
   - 黃巾三兄弟（張角/張寶/張梁）若 keepOnField 可留場，仍可統計 */
_isStatTrackable(cardId) {
    if (!cardId) return false;
    const def = CARD_DB.find(d => d.id === cardId);
    if (!def) return true;                       // 未知卡：保守起見照常統計
    const sk = def.skills || [];
    if (sk.includes('疑兵') && !sk.includes('黃巾')) return false;
    return true;
}
_trackCardPlayed(pi, cardId) {
    if (!cardId) return;
    const bucket = this._statBucketForPlayer(pi);
    if (!bucket) return;
    const stats = loadCardStats();
    if (!stats[bucket][cardId]) stats[bucket][cardId] = { plays: 0, wins: 0 };
    stats[bucket][cardId].plays++;
    saveCardStats(stats);
}
_trackRoundWin(winnerPi, bi, snapshot) {
    const bucket = this._statBucketForPlayer(winnerPi);
    if (!bucket) return;
    const stats = loadCardStats();
    // snapshot: [{ player, card }, ...] — taken before 疑兵 removal
    const list = snapshot || (this.players[winnerPi].fields[bi] || []).map(c => ({ player: winnerPi, card: c }));
    list.forEach(({ player, card }) => {
        const id = card.data && card.data.id;
        if (!id) return;
        // ★ v3.8: 以「打出此牌的人」為準，而非牌當前所在場地
        const playedBy = (card.playedBy !== undefined && card.playedBy !== null)
            ? card.playedBy
            : player;
        const isWinnerSide = (playedBy === winnerPi) ||
            (this.teams && this.areAllies(playedBy, winnerPi));
        if (!isWinnerSide) return;
        if (!stats[bucket][id]) stats[bucket][id] = { plays: 0, wins: 0 };
        stats[bucket][id].wins++;
    });
    saveCardStats(stats);
}
renderSpeedPanel() {
    if (this.netMode) return '';
    if (!this.players || !this.players.every(p => p.botType)) return '';
    const speeds = [0.5, 1, 2, 4, 10];
    return `<div class="ai-speed-panel">
        <span class="lbl">⚡ AI 速度</span>
        ${speeds.map(s => `<button class="sp-btn ${Math.abs(this.aiSpeed - s) < 0.01 ? 'on' : ''}" onclick="game.setAISpeed(${s})">${s}x</button>`).join('')}
    </div>`;
}
clearCountdown() { if(this.countdownTimer){clearTimeout(this.countdownTimer);this.countdownTimer=null;} this.countdown=null; }
startCountdown(onDone) {
    this.clearCountdown();
    if (this.netMode) { onDone(); return; }
    const allBots = this.players.every(p => p.botType);
    this.countdown = allBots ? 2 : 3;
    this.render();
    const tick = () => {
        this.countdown--;
        if (this.countdown > 0) { this.render(); this.countdownTimer=this._sTO(tick,1000); }
        else { this.countdown=null; this.countdownTimer=null; onDone(); }
    };
    this.countdownTimer = this._sTO(tick, 1000);
}
renderCountdown() {
    if (this.countdown === null) return '';
    return `<div class="countdown-overlay">
        <div class="countdown-label">請查看您新抽到的牌</div>
        <div class="countdown-num">${this.countdown}</div>
        <div class="countdown-hint">💡 綠色光圈標記了新抽到的卡牌</div>
    </div>`;
}

setupFlip() {
    const cards = [];
    for (let i = 0; i < this.numPlayers; i++) {
        if (this.deck.length === 0) this.reshuffle();
        const c = this.deck.pop();
        cards.push(c || this.newInst(CARD_DB[0]));
    }
    this.flipCards = cards;
    this.flipRevealed = new Array(this.numPlayers).fill(false);
    this.firstPlayer = null;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer = null; }
    this._checkAutoFlip();
}
/* Auto-flip any bot's card, or auto-begin the battle when all bots are done */
_checkAutoFlip() {
    if (this.state !== 'flip') return;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer = null; }
    for (let i = 0; i < this.numPlayers; i++) {
        if (!this.flipRevealed[i] && this.isAI(i)) {
            this.flipAutoTimer = setTimeout(() => {
                this.flipAutoTimer = null;
                if (this.state === 'flip' && !this.flipRevealed[i]) this.revealFlip(i);
            }, 700);
            return;
        }
    }
    const allRevealed = this.flipRevealed.every(x => x);
    if (allRevealed && this.firstPlayer !== null && this.players.every(p => p.botType)) {
        this.flipAutoTimer = setTimeout(() => {
            this.flipAutoTimer = null;
            this.beginBattle();
        }, 900);
    }
}
autoFlipAI() {
    if (this.state !== 'flip') return;
    for (let i = 0; i < this.numPlayers; i++) {
        if (!this.flipRevealed[i] && this.isAI(i)) {
            this.revealFlip(i);
            return;
        }
    }
}
_sendCard(c) {
    // Route a card to either the discard pile or the bottom of the draw pile.
    if (!c) return;
    c.mod = 0; c.faceDown = false; c.burn = false; c.silenced = false; c.activated = false;
    c.betrayed = false; c.betrayedFrom = null; c.usesLeft = undefined;
    c.pendingSilence = false; c.pendingBurnNext = false; c.pendingDamageNext = false;
    c.justDrawn = false; c.lianhuan = false; c.lianhuanArmed = false;
    c.grantedFubing = false; c.keepOnField = false; c.guardUsed = false;
    c._oneShotBuff = undefined; c.preparing = false; c._jiushiUsed = false;
    c.willRemove = false; c.willDiscard = false; c.originalOwner = undefined;
    c.playedBy = null;               // ★ v3.8
    if (this.sendToBottom) this.deck.unshift(c);   // bottom = unshift (deck uses pop from end)
    else this.archive.push(c);
}
revealFlip(i) {
    if (this.state !== 'flip' || this.flipRevealed[i]) return;
    this.flipRevealed[i] = true;
    const allRevealed = this.flipRevealed.every(x => x);
    if (allRevealed) {
        const powers = this.flipCards.map(c => c.data.power);
        const maxPow = Math.max(...powers);
        const leaders = [];
        for (let p = 0; p < this.numPlayers; p++) {
            if (powers[p] === maxPow) leaders.push(p);
        }

        if (leaders.length > 1) {
            // Tie → discard all cards, redraw
            const names = this.flipCards.map((c, idx) =>
                `${this.players[idx].name} ${c.data.name}(${c.data.power})`).join(' vs ');
            this.addLog('sys', `翻牌：${names} → 平手！重新翻牌`);
            this.recordEvent('flip_tie', {
                cards: this.flipCards.map(c => c.data.id),
                powers: powers.slice(),
                tiedPlayers: leaders.slice()
            });
            this.flipCards.forEach(c => this._sendCard(c));
            this.firstPlayer = null;
            this.render();
            this._sTO(() => {
                if (this.state !== 'flip') return;
                if (this.deck.length < this.numPlayers) this.reshuffle();
                if (this.deck.length < this.numPlayers) {
                    this.firstPlayer = 0;
                    this.addLog('sys', '牌庫耗盡，預設藍方先手');
                    this.render();
                    return;
                }
                const newCards = [];
                for (let k = 0; k < this.numPlayers; k++) newCards.push(this.deck.pop());
                this.flipCards = newCards;
                this.flipRevealed = new Array(this.numPlayers).fill(false);
                this.render();
                this._checkAutoFlip();
            }, 900);
            return;
        }

        // Single winner
        this.firstPlayer = leaders[0];
        const names = this.flipCards.map((c, idx) =>
            `${this.players[idx].name} ${c.data.name}(${c.data.power})`).join(' vs ');
        this.addLog('sys', `翻牌：${names} → ${this.players[this.firstPlayer].name} 先手`);
        this.recordEvent('flip_result', {
            cards: this.flipCards.map(c => c.data.id),
            powers: powers.slice(),
            firstPlayer: this.firstPlayer,
            // Legacy 2P-compatible fields (used by old replays)
            blueCard: this.flipCards[0].data.id,
            bluePower: powers[0],
            redCard: this.flipCards[1] ? this.flipCards[1].data.id : null,
            redPower: this.flipCards[1] ? powers[1] : 0
        });
        this.flipCards.forEach(c => this._sendCard(c));
    }
    this.render();
    this._checkAutoFlip();
}
beginBattle() {
    if (this.state !== 'flip') return;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer=null; }
    this.state = 'mulligan'; this.phase = '';
    this.mulliganPlayer = this.firstPlayer;
    this.mulliganStage = 'choose';
    this.addLog('sys', '═══ 三國風雲 開戰！═══');
    this.addLog('sys', `🌱 本局種子：${this.seed}`);
    this.render();
    if (this.isAI(this.mulliganPlayer)) this._sTO(() => this.doMulliganAI(), 900);
}

mulliganRedraw() {
    if (this.mulliganStage !== 'choose') return;
    const p = this.players[this.mulliganPlayer];
    const n = p.hand.length;
    const oldHand = p.hand.map(c => c.data.id);
    const discardNames = p.hand.map(c => c.data.name).join('、');
    const where = this.sendToBottom ? '牌庫底' : '棄牌堆';
    p.hand.forEach(c => this._sendCard(c));
    p.hand = [];
    this.drawTo(this.mulliganPlayer, n);
    p.redrawn = true;
    this.mulliganStage = 'confirm';
    this.addLog(this.mulliganPlayer, `${p.name} 重抽了 ${n} 張手牌（${where}：${discardNames}）`);
    this.recordEvent('mulligan_redraw', { player: this.mulliganPlayer, discarded: oldHand, drew: p.hand.map(c => c.data.id), toBottom: this.sendToBottom });
    this.render();
    if (this.isAI(this.mulliganPlayer)) this._sTO(() => this.doMulliganAI(), 900);
}
mulliganSkip() {
    if (this.mulliganStage !== 'choose') return;
    this.players[this.mulliganPlayer].mulliganDone = true;
    this.mulliganStage = 'hidden'; this.cover = true; this.render();
    this.recordEvent('mulligan_skip', { player: this.mulliganPlayer });
    this._sTO(() => this.mulliganHandoff(), 800);
}
mulliganConfirm() {
    if (this.mulliganStage !== 'confirm') return;
    this.players[this.mulliganPlayer].mulliganDone = true;
    this.mulliganStage = 'hidden'; this.cover = true; this.render();
    this.recordEvent('mulligan_confirm', { player: this.mulliganPlayer });
    this._sTO(() => this.mulliganHandoff(), 800);
}
mulliganHandoff() {
    if (this.mulliganStage !== 'hidden') return;
    if (this.state === 'battle') return;   // v3.4.1: already started
    this.cover = false;
    const other = this.opponentOf(this.mulliganPlayer);
    if (!this.players[other].mulliganDone) {
        this.mulliganPlayer = other; this.mulliganStage = 'choose'; this.render();
        if (this.isAI(other)) this._sTO(() => this.doMulliganAI(), 900);
    } else this.startBattle();
}
doMulliganAI() {
    if (this.state !== 'mulligan') return;
    if (!this.isAI(this.mulliganPlayer)) return;
    const p = this.players[this.mulliganPlayer];
    const diff = this.getAIDifficulty(this.mulliganPlayer);
    const badCards = p.hand.filter(c => {
        const ratio = c.data.power / Math.max(1, c.data.cost);
        return c.data.cost > 4 || ratio < 0.8;
    }).length;
    let threshold = 2;
    if (diff === 'hard') threshold = 3;
    if (badCards >= threshold && !p.redrawn) this.mulliganRedraw();
    else {
        if (this.mulliganStage === 'confirm') this.mulliganConfirm();
        else this.mulliganSkip();
    }
}

startBattle() {
    if (this.state === 'battle') return;   // v3.4.1: guard against double-call
    this.state = 'battle'; this.phase = 'turn'; this.cover = false;
    // Net mode skips the countdown, so clear the "just drawn" glow now.
    for (let pi = 0; pi < this.numPlayers; pi++)
        this.players[pi].hand.forEach(c => c.justDrawn = false);
    this.current = this.firstPlayer;
    this.roundFirstPlayer = this.firstPlayer;
    // 清除所有連環標記
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    this._simaYiLastChanceUsed = false;

    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].passed = false;
        this.players[pi].mustFaceUp = false;
        this.players[pi].roundSpent = 0;
        this.players[pi].cardsPlayedByPlayer = this.players[pi].cardsPlayedByPlayer || 0;
    }
    this.firstPasser = null;
    this.passOrder = [];
    this._handoffDoneThisTurn = false;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    this.addLog('sys', `${this.players[this.current].name} 先行出牌`);
    this._triggerPreTurnFlip();
    this._logTurnStart();
	this.maybeTriggerAIChats('round_start');
    for (let pi = 0; pi < this.numPlayers; pi++) this.logHand(pi, 'R'+this.round+' 開局');
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1].hand.map(c => c.data.id),
        blueFood: this.players[0].food, redFood: this.players[1].food
    });
    this.render();
    this.maybeJianxiong();
}

selectCard(uid) {
    if (this.cover || this.countdown !== null) return;
    let pi = null;
    if (this.phase === 'turn') {
        pi = this.current;
        if (this.players[pi].passed) return;
    } else if (this.phase === 'preend') {
        pi = this.preEndOrder[this.preEndIdx];
        if (pi === undefined) return;
        if (this.isAI(pi)) return;
        if (this.preEndDone[this.preEndIdx]) return;
    } else return;
    const p = this.players[pi];
    const inst = p.hand.find(c => c.uid === uid);
    if (!inst) return;
    this.selected = (this.selected === uid) ? null : uid;
    if (this.selected === null) this.selectedField = null;
    else if (this.selectedField !== null) {
        const allowed = this.getPlayableFields(inst, pi);
        if (!allowed.includes(this.selectedField)) this.selectedField = null;
    }
    this.render();
}

selectField(bi) {
    if (bi === this.currentBfIndex || this.selectedField === bi) this.selectedField = null;
    else this.selectedField = bi;
    this.render();
}

inspect(uid) {
    let found=null, ownerPi=-1;
    outer:
    for (let pi=0; pi<this.numPlayers; pi++) {
        const p = this.players[pi];
        for (const c of p.hand) if (c.uid===uid) { found=c; ownerPi=pi; break outer; }
        for (const f of p.fields) for (const c of f) if (c.uid===uid) { found=c; ownerPi=pi; break outer; }
    }
    if (!found) for (const c of this.archive) if (c.uid===uid) { found=c; ownerPi=-1; break; }
    if (!found) for (const c of this.deck) if (c.uid===uid) { found=c; ownerPi=-1; break; }
    if (!found) return;
	const myIdx = this.netMode ? this.localPlayerIdx : this.current;
	if (found.faceDown && ownerPi >= 0 && ownerPi !== myIdx) return;
	if (!this.netMode && found.faceDown && ownerPi >= 0 && this.phase === 'preend'
    && ownerPi !== this.preEndOrder[this.preEndIdx]) return;
    if (found.faceDown && ownerPi>=0 && this.phase==='preend' && ownerPi!==this.preEndOrder[this.preEndIdx]) return;
    this.inspectCard = found; this.render();
}
closeInspect() { this.inspectCard = null; this.render(); }

canPlayNormally(inst, pi) {
    const p = this.players[pi];
    if (inst.data.forceFaceDown) return false;
    return p.food >= inst.data.cost;
}
canPlayAmbush(inst, pi) {
    const p = this.players[pi];
    if (!inst.data.isAmbush && !this.hasShefuBonus(pi, this.currentBfIndex)) return false;
    if (p.mustFaceUp) {
        // 隱忍：己方無視嘲諷
        const hasYinren = p.fields.some(f => f.some(c =>
            !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
        if (!hasYinren) return false;
    }
    return true;
}
hasShefuBonus(pi, bi) {
    return this.players[pi].fields[bi].some(c=>!c.faceDown&&!c.silenced&&(c.data.skills||[]).includes('設伏'));
}

getPlayableFields(inst, pi, phase) {
    if (!inst) return [this.currentBfIndex];
    phase = phase || this.phase;              // ★ v3.9: 依當前階段判斷
    const sk = inst.data.skills || [];
    const bi = this.currentBfIndex;
    const fields = [bi];
    // ★ v3.9: 奇謀 / 奇襲 / 奔襲 只在「陣地結算前（preend）」開放其他陣地
    if (phase !== 'preend') return fields;
    if (sk.includes('奇謀')) for (let f=0;f<bi;f++) if (!fields.includes(f)) fields.push(f);
    if (sk.includes('奇襲')) for (let f=0;f<this.fieldCount;f++) if (!fields.includes(f)) fields.push(f);
    if (sk.includes('奔襲')) {
        if (bi>0 && !fields.includes(bi-1)) fields.push(bi-1);
    }
    return fields.sort((a,b)=>a-b);
}

doPlay(asAmbush) {
    if (this.cover || this.countdown !== null || !this.selected) return;
    // ★ v3.9: preend 階段的人類出牌 → 走 doPreEndPlay
    if (this.phase === 'preend') {
        if (this.preEndDone[this.preEndIdx]) return;
        const pep = this.preEndOrder[this.preEndIdx];
        if (pep === undefined || this.isAI(pep)) return;
        const pp = this.players[pep];
        const inst = pp.hand.find(c => c.uid === this.selected);
        if (!inst) return;
        const allowed = this.getPlayableFields(inst, pep, 'preend');
        const bi = (this.selectedField !== null && allowed.includes(this.selectedField))
                    ? this.selectedField : this.currentBfIndex;
        this.selectedField = null;
        const ambush = !!asAmbush || !!inst.data.forceFaceDown;
        if (!ambush && pp.food < inst.data.cost) return;
        this.selected = null;
        this.doPreEndPlay(inst, ambush, bi);
        return;
    }
    if (this.phase !== 'turn') return;
    this._handoffDoneThisTurn = false;
    const pi = this.current, p = this.players[pi];
    if (p.passed) return;
    const inst = p.hand.find(c => c.uid === this.selected);
    if (!inst) return;
    const allowed = this.getPlayableFields(inst, pi);
    const bi = (this.selectedField !== null && allowed.includes(this.selectedField)) ? this.selectedField : this.currentBfIndex;
    this.selectedField = null;
    const ambush = !!asAmbush || !!inst.data.forceFaceDown;

    if (!ambush) {
        if (p.food < inst.data.cost) return;
        p.food -= inst.data.cost;
        p.roundSpent += inst.data.cost;
    }

    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = ambush;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = !ambush;
    inst.grantedFubing = !!(ambush && (
        (!inst.data.isAmbush && this.hasShefuBonus(pi, bi)) ||
        (inst.data.skills||[]).includes('潛襲')
    ));
    if (inst.grantedFubing) this.addLog(pi, `[R${this.round}] 程昱【設伏】：${inst.data.name} 獲得【伏兵】技能`);
    p.fields[bi].push(inst);
    inst.playedBy = pi;              // ★ v3.8
    this._trackCardPlayed(pi, inst.data.id);
    this.cardsPlayedCount++;
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;

    if (!ambush) {
        // 記錄「這張牌是該玩家在這塊戰場上最後的正面進場牌」
        // 記錄「這張牌是該玩家在這塊戰場上最後的正面進場牌」
        this.players[pi].lastFaceUpEnemy[bi] = inst;
    }

    // 連環窗口：對陣若有龐統（已啟動）在這塊戰場，正面進場的牌也會被標記
    if (!ambush) {
        const oppPangtong = this.players[this.opponentOf(pi)].fields[bi].find(c =>
            !c.faceDown && !c.silenced && c.data.id === 'pangtong' && c.activated);
        if (oppPangtong) {
            inst.lianhuan = true;
            this.addLog(pi, `⚠️ 【連環】${inst.data.name} 被對陣龐統標記`);
        }
    }

    if (ambush) this.addLog(pi, `[R${this.round}] ${p.name} 於【${BATTLEFIELDS[bi]}】埋伏了一張牌`);
    else this.addLog('l-skill'===pi?pi:pi, `[R${this.round}] ${p.name} 於【${BATTLEFIELDS[bi]}】派出 ${inst.data.name}（-${inst.data.cost}糧｜餘${p.food}）`);

    this.recordEvent('play', {
        player: pi, cardId: inst.data.id, cardUid: inst.uid, field: bi, faceDown: ambush,
        foodCost: ambush ? 0 : inst.data.cost, foodAfter: p.food, handAfter: p.hand.length,
        handAfterNames: p.hand.map(c=>c.data.id)
    });

    // 忘隙一次性 buff：在進場觸發前綁定哨兵，讓 getPower 能吃到
    const osb = p.oneShotBuffs && p.oneShotBuffs[bi];
    if (osb && osb.armed && !inst.faceDown) {
        // v3.2: 韓當【解煩】限定基礎戰力<3 的友軍
        const passFilter = !osb.lowPowerOnly || inst.data.power < 3;
        if (passFilter) {
            inst._oneShotBuff = osb.amount;
            osb.armed = false;
            osb.target = inst;
        }
    }

    if (!ambush) this.runEntryTriggers(pi, inst, bi);
    if (this.guanyu || this.xunyu || this.xunyou || this.scry) { this.selected = null; this.render(); return; }
    this.doPlayAfterEntry(pi, inst, ambush, bi);
}

doPlayAfterEntry(pi, inst, ambush, bi) {
    if (!ambush && inst.data.skills && inst.data.skills.includes('奔襲') && bi !== this.currentBfIndex) {
        const src = this.players[pi].fields[bi];
        const candidates = src.filter(c => c !== inst && !c.faceDown && !c.data.isGeneral);
        if (candidates.length > 0) {
            let best = candidates[0];
            candidates.forEach(c => { if (c.data.power > best.data.power) best = c; });
            src.splice(src.indexOf(best), 1);
            this.players[pi].fields[this.currentBfIndex].push(best);
            this.addLog(pi, `[R${this.round}] 夏侯淵【奔襲】：${best.data.name} 移至【${BATTLEFIELDS[this.currentBfIndex]}】`);
        }
    }
    this.applyBurn(pi);
    const p = this.players[pi];

    const hasScry = p.fields.some(f => f.some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('觀星')));
    if (hasScry && this.deck.length > 0) {
        const n = Math.min(3, this.deck.length);
        const cards = []; for (let i=0;i<n;i++) cards.push(this.deck.pop());
        this.scry = { pi, cards, order: [] };
        this.selected = null;
        this.render();
        if (this.isAI(pi)) this._sTO(() => this.resolveAIScry(), 700);
        return;
    }
    this.drawOne(pi);
if (!ambush && inst.data.isGeneral && this.isAI(pi)) {
    this.aiChatTrigger(pi, 'general');
}
    if (!ambush && inst.data.isGeneral) {
        this.addLog(pi, `[R${this.round}] ${inst.data.name}為上將！${p.name}本回合結束出牌`);
        this.recordEvent('general_pass', { player: pi, cardId: inst.data.id });
        if (this.firstPasser === null) this.firstPasser = pi;
        p.passed = true; p.mustFaceUp = false;
        this.lastPasser = pi; this.selected = null;
        if (this.players.every(pl => pl.passed)) { this.startPreEnd(); return; }
        this.startCountdown(() => {
            this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
            this.cover = true;
            this.render();
        });
        return;
    }
    // ★ v3.9: 若打在過去陣地，標記為待重新結算（翻轉延後至本輪結束）
    if (!ambush && bi < this.currentBfIndex) this._markPendingFlip(bi);
    this.finishAction();
}

runEntryTriggers(pi, inst, bi) {
    if (!inst.silenced && inst.data.onEnter) {
        this.addLog('sys', `⚙️ 技能觸發：${inst.data.name}【進場】`);
        inst.data.onEnter(this._ctxFor(pi, inst, bi, null));
    }
    const hasZhaxiang = !inst.silenced && (inst.data.skills||[]).includes('詐降');
    if (hasZhaxiang) {
        this.addLog(pi, `🎭 ${inst.data.name}【詐降】：對陣敵軍的進場技能不觸發`);
        return;
    }
    for (const enemy of this.enemiesOf(pi)) {
        const enemyField = this.players[enemy].fields[bi];
        const watchers = enemyField.filter(c => !c.faceDown && !c.silenced && c.data.onEnemyEnter);
        watchers.forEach(w => {
            this.addLog('sys', `⚙️ 技能觸發：${w.data.name}【敵進場】→ ${inst.data.name}`);
            w.data.onEnemyEnter(this._ctxFor(enemy, w, bi, inst));
        });
    }
}
_ctxFor(pi, self, bi, target) {
    const game = this;
    const opp = game.opponentOf(pi);
    const enemies = game.enemiesOf(pi);
    return {
        game, owner: pi, self, field: bi, target,
        opponent: opp,
        enemies: enemies,
        allies: game.alliesOf(pi),
        myField: game.players[pi].fields[bi],
        enemyField: game.players[opp].fields[bi],
        enemyFields: enemies.map(e => game.players[e].fields[bi]),
        isLosing: game.fieldPower(pi, bi, false) < game.fieldPower(opp, bi, false),
        isWinning: game.fieldPower(pi, bi, false) > game.fieldPower(opp, bi, false),
        log: (m) => game.addLog(pi, m),
        drawCard: (n) => game.drawTo(pi, n)
    };
}
/* ============ 網路 hook (Phase 1 佔位) ============ */
broadcastState() {
    if (!this.netMode || this.role !== 'host') return;
    if (this._broadcast) this._broadcast(this.serializeForPlayer(1));
}
sendAction(action) {
    if (!this.netMode || this.role !== 'guest') {
        this.applyRemoteAction(this.localPlayerIdx, action);
        return;
    }
    if (this._sendAction) this._sendAction(action);
}
applyRemoteAction(pi, action) {
    // Phase 2: handoff handled elsewhere
}

/* ============ 網路狀態序列化 ============ */
_serCard(c, hideIdentity = false) {
    if (!c) return null;
    return {
        uid: c.uid,
        dataId: hideIdentity ? '__hidden__' : c.data.id,
        mod: c.mod || 0,
        faceDown: !!c.faceDown,
        burn: !!c.burn,
        silenced: !!c.silenced,
        activated: !!c.activated,
        betrayed: !!c.betrayed,
        betrayedFrom: c.betrayedFrom ?? null,
        usesLeft: c.usesLeft ?? null,
        pendingSilence: !!c.pendingSilence,
        pendingBurnNext: !!c.pendingBurnNext,
        pendingDamageNext: !!c.pendingDamageNext,
        justDrawn: !!c.justDrawn,
        lianhuan: !!c.lianhuan,
        lianhuanArmed: !!c.lianhuanArmed,
        preparing: !!c.preparing,
        grantedFubing: !!c.grantedFubing,
        keepOnField: !!c.keepOnField,
        guardUsed: !!c.guardUsed,
        fresh: !!c.fresh,
        willRemove: !!c.willRemove,
        willDiscard: !!c.willDiscard,
        originalOwner: c.originalOwner ?? null,
        _oneShotBuff: c._oneShotBuff ?? null,
        enteredFaceUp: (c.enteredFaceUp === undefined) ? null : !!c.enteredFaceUp,
        _jiushiUsed: !!c._jiushiUsed,
        playedBy: (c.playedBy !== undefined && c.playedBy !== null) ? c.playedBy : null   // ★ v3.8
    };
}
_unserCard(o) {
    if (!o) return null;
    // v3.2: 蓋牌占位符（身份未知）
    if (o.dataId === '__hidden__') {
        const c = Object.assign({}, o);
        c.data = {
            id: '__hidden__', cardId: '???', name: '?',
            cost: 0, power: 0, skills: [], faction: 'qun',
            desc: '???', emoji: '❓'
        };
        c._placeholder = true;
        return c;
    }
    const def = CARD_DB.find(d => d.id === o.dataId);
    if (!def) return null;
    const c = Object.assign({}, o);
    c.data = def;
    if (c.usesLeft === null) c.usesLeft = undefined;
    if (c.playedBy === undefined) c.playedBy = null;   // ★ v3.8
    return c;
}
serializeForPlayer(forPlayer) {
    const serP = (p, pi) => {
        const hideHand = (pi !== forPlayer);
        return {
            idx: p.idx, name: p.name,
            hand: hideHand ? null : p.hand.map(c => this._serCard(c)),
            handCount: p.hand.length,
            fields: p.fields.map(f => f.map(c =>
				this._serCard(c, pi !== forPlayer && c.faceDown)
			)),
            food: p.food, wins: p.wins,
            passed: !!p.passed, mustFaceUp: !!p.mustFaceUp,
            redrawn: !!p.redrawn, mulliganDone: !!p.mulliganDone,
            pendingBuffs: p.pendingBuffs || {},
            roundSpent: p.roundSpent || 0,
            cardsPlayedByPlayer: p.cardsPlayedByPlayer || 0,
            oneShotBuffs: p.oneShotBuffs || null,
            lastFaceUpEnemy: (p.lastFaceUpEnemy || []).map(c => c ? c.uid : null)
        };
    };
    return {
        _v: 1, forPlayer, seed: this.seed,
        players: [serP(this.players[0], 0), serP(this.players[1], 1)],
        deck: this.deck.map(c => this._serCard(c)),
        archive: this.archive.map(c => this._serCard(c)),
        flipCards: this.flipCards ? this.flipCards.map(c => this._serCard(c)) : null,
        flipRevealed: this.flipRevealed ? [...this.flipRevealed] : null,
        uid: this.uid, round: this.round,
        state: this.state, phase: this.phase, current: this.current,
        firstPlayer: this.firstPlayer, roundFirstPlayer: this.roundFirstPlayer,
        lastResult: this.lastResult, gameWinner: this.gameWinner,
        firstPasser: this.firstPasser, lastPasser: this.lastPasser,
        mulliganPlayer: this.mulliganPlayer, mulliganStage: this.mulliganStage,
        selected: this.selected, selectedField: this.selectedField,
        _rematchVotes: this._rematchVotes || [false, false],
        preEndOrder: this.preEndOrder, preEndIdx: this.preEndIdx,
        preEndDone: this.preEndDone, history: this.history,
        cardsPlayedCount: this.cardsPlayedCount,
        logs: this.logs.slice(-150)
    };
}
applyState(s) {
    this.seed = s.seed;
    this.players = s.players.map((p) => {
        const hand = (p.hand || []).map(c => this._unserCard(c)).filter(Boolean);
        return {
            idx: p.idx, name: p.name,
            hand, handCount: p.handCount,
            _handHidden: (p.hand === null),
            fields: p.fields.map(f => f.map(c => this._unserCard(c)).filter(Boolean)),
            food: p.food, wins: p.wins,
            passed: !!p.passed, mustFaceUp: !!p.mustFaceUp,
            redrawn: !!p.redrawn, mulliganDone: !!p.mulliganDone,
            pendingBuffs: p.pendingBuffs || {},
            roundSpent: p.roundSpent || 0,
            cardsPlayedByPlayer: p.cardsPlayedByPlayer || 0,
            oneShotBuffs: p.oneShotBuffs,
            lastFaceUpEnemy: new Array(this.fieldCount).fill(null)
        };
    });
    for (let pi = 0; pi < this.numPlayers; pi++) {
        for (let bi = 0; bi < this.fieldCount; bi++) {
            const uid = s.players[pi].lastFaceUpEnemy[bi];
            if (uid) this.players[pi].lastFaceUpEnemy[bi] =
                this.players[pi].fields[bi].find(c => c.uid === uid) || null;
        }
    }
    this.deck = s.deck.map(c => this._unserCard(c)).filter(Boolean);
    this.archive = s.archive.map(c => this._unserCard(c)).filter(Boolean);
    this.flipCards = s.flipCards ? s.flipCards.map(c => this._unserCard(c)).filter(Boolean) : null;
    this.flipRevealed = s.flipRevealed ? [...s.flipRevealed] : null;
    Object.assign(this, {
        uid: s.uid, round: s.round, state: s.state, phase: s.phase,
        current: s.current, firstPlayer: s.firstPlayer,
        roundFirstPlayer: s.roundFirstPlayer, lastResult: s.lastResult,
        gameWinner: s.gameWinner, firstPasser: s.firstPasser,
        lastPasser: s.lastPasser, mulliganPlayer: s.mulliganPlayer,
        mulliganStage: s.mulliganStage, preEndOrder: s.preEndOrder,
        preEndIdx: s.preEndIdx, preEndDone: s.preEndDone,
        history: s.history || [], cardsPlayedCount: s.cardsPlayedCount || 0,
        logs: s.logs || []
    });
    this.selected      = (s.selected      !== undefined) ? s.selected      : null;
    this.selectedField = (s.selectedField !== undefined) ? s.selectedField : null;
    this._rematchVotes = s._rematchVotes || [false, false];
    this.cover = false;
    this.countdown = null; this.scry = null; this.quanheng = null;
    this.jianxiong = null; this.lianying = null; this.guanyu = null;
    this.xunyu = null; this.xunyou = null;
    this._hasReceivedState = true;
    this.render();
}

/* ★ v3.9: 標記過去陣地的「待重新結算」。立即套用戰力，不動勝負。 */
_markPendingFlip(bi) {
    if (this.state !== 'battle') return;
    if (bi >= this.currentBfIndex) return;
    const hist = this.history.find(h => h.round === bi + 1);
    if (!hist) return;

    const newTotals = [];
    for (let pi = 0; pi < this.numPlayers; pi++) newTotals.push(this.fieldPower(pi, bi, true));

    const histFirst = (hist.firstPlayer !== undefined) ? hist.firstPlayer : this.roundFirstPlayer;
    const tieOrder = (pi) => (pi - histFirst + this.numPlayers) % this.numPlayers;
    let newWinner = 0, bestVal = newTotals[0];
    for (let pi = 1; pi < this.numPlayers; pi++) {
        if (newTotals[pi] > bestVal) { newWinner = pi; bestVal = newTotals[pi]; }
        else if (newTotals[pi] === bestVal && tieOrder(pi) < tieOrder(newWinner)) newWinner = pi;
    }

    if (newWinner !== hist.winner) {
        this._pendingFlips = this._pendingFlips || {};
        this._pendingFlips[bi] = { projected: newWinner, totals: newTotals };
        this.addLog('bat',
            `⚠️ 【${this.battlefields[bi]}】戰力被改寫（${newTotals.join(' : ')}），將於本輪結束後重新結算…`);
        try { this.onPendingFlip && this.onPendingFlip(bi, newWinner, hist.winner); } catch (e) {}
    } else {
        if (this._pendingFlips) delete this._pendingFlips[bi];
    }
}

/* ★ v3.9: 本輪結算後才真正重算所有過去陣地勝負。
   必須在 settle() 的 game-over 檢查「之前」呼叫。 */
_recheckAllPastBattlefields() {
    if (!this._pendingFlips) return;
    const keys = Object.keys(this._pendingFlips).map(Number);
    if (keys.length === 0) return;

    for (const bi of keys) {
        const hist = this.history.find(h => h.round === bi + 1);
        if (!hist) continue;
        const oldWinner = hist.winner;

        const newTotals = [];
        for (let pi = 0; pi < this.numPlayers; pi++) newTotals.push(this.fieldPower(pi, bi, true));

        const histFirst = (hist.firstPlayer !== undefined) ? hist.firstPlayer : this.roundFirstPlayer;
        const tieOrder = (pi) => (pi - histFirst + this.numPlayers) % this.numPlayers;
        let newWinner = 0, bestVal = newTotals[0];
        for (let pi = 1; pi < this.numPlayers; pi++) {
            if (newTotals[pi] > bestVal) { newWinner = pi; bestVal = newTotals[pi]; }
            else if (newTotals[pi] === bestVal && tieOrder(pi) < tieOrder(newWinner)) newWinner = pi;
        }

        hist.totals = newTotals;

        if (newWinner !== oldWinner) {
            this.players[oldWinner].wins = Math.max(0, this.players[oldWinner].wins - 1);
            this.players[newWinner].wins++;
            hist.winner = newWinner;
            hist.flipped = { from: oldWinner, to: newWinner, at: Date.now() };

            this.addLog('bat',
                `⚡ 【${this.battlefields[bi]}】戰局翻轉！${this.players[newWinner].name} 反敗為勝（${newTotals.join(' : ')}）`);
            this.recordEvent('battlefield_flip', {
                battlefield: bi, oldWinner, newWinner, totals: newTotals
            });
            try { this.onBattlefieldFlip && this.onBattlefieldFlip(bi, newWinner, oldWinner); } catch (e) {}
        }
    }
    this._pendingFlips = {};
}

applyBurn(pi) {
    const p = this.players[pi];
    let n = 0;
    for (let bi=0; bi<this.fieldCount; bi++) {
        p.fields[bi].forEach(c => {
            if (c.burn && !c.faceDown) { c.mod=(c.mod||0)-1; n++; }
        });
    }
    if (n>0) this.addLog(pi, `🔥 【燃燒】${n} 張卡牌各受到 1 點燃燒傷害`);
}
/* 卡片威脅值：戰力 + 技能影響力。用於 斬將/斬除/毒士 等移除技能的目標選擇。 */
cardThreatValue(c) {
    if (!c || c.faceDown) return 0;
    const d = c.data;
    let v = d.power + (c.mod || 0);
    const sk = d.skills || [];
    /* 持續性場上壓力（每回合都作用） */
    const PERSISTENT = ['威嚇','嘲諷','涉獵','力竭','火攻','連營','斷路','伏兵'];
    /* 一次性強力觸發（進場/結算時造成大影響） */
    const IMPACT     = ['止啼','識破','烈矢','飛矢','霸王','火船','奪銳','劫糧','虎痴','突圍','鐵騎','烈刃','建言'];
    /* 上將身分本身是威脅 */
    if (d.isGeneral) v += 4;
    if (sk.some(s => PERSISTENT.includes(s))) v += 3;
    if (sk.some(s => IMPACT.includes(s))) v += 2;
    /* 高戰力白板也算 */
    if (d.power >= 6) v += 2;
    return v;
}
/* 護衛：同陣地有 曹洪 / 周泰 在場時，友軍受到的 戰力傷害 減 1（最低 0）。
   呼叫端使用 `game.applyDamage(target, 1, targetOwnerPi, targetBi)`。 */
applyDamage(target, amount, targetPi, targetBi, sourceInst = null) {
    if (amount <= 0) return 0;

    // 曹仁 堅守（鎖定技）：所在陣地劣勢時，本陣友軍戰力不會減少
    const hasJianshou = this.players[targetPi].fields[targetBi].some(c =>
        !c.faceDown && (c.data.skills||[]).includes('堅守'));
    if (hasJianshou) {
        const myP = this.fieldPower(targetPi, targetBi, false, true);
        const oppP = this.fieldPower(this.opponentOf(targetPi), targetBi, false, true);
        if (myP <= oppP) {
            this.addLog(targetPi, `🏰 曹仁【堅守】：${target.data.name} 免受戰力傷害`);
            return 0;
        }
    }

    // 護衛（折衷版）：同陣地有 曹洪/周泰 且未使用過護衛時，
    // 友軍受到的傷害 -1；該護衛自身受 1 傷害並失去護衛（一次性）。
    const guard = this.players[targetPi].fields[targetBi].find(c =>
        c !== target && !c.faceDown && !c.silenced && !c.guardUsed &&
        (c.data.skills||[]).includes('護衛'));
    if (guard) {
        guard.guardUsed = true;
        const reduced = Math.max(0, amount - 1);
        target.mod = (target.mod||0) - reduced;
        guard.mod = (guard.mod||0) - 1;
        this.addLog(targetPi, `🛡️ ${guard.data.name}【護衛】：替 ${target.data.name} 減免1（友軍實受 ${reduced}，自身受1，護衛已用）`);
        return reduced;
    }
    target.mod = (target.mod||0) - amount;

    // 剛烈（鎖定技）：自己受到戰力傷害時，使傷害來源受到相同點數傷害
    if (sourceInst && sourceInst.uid !== target.uid &&
        (target.data.skills||[]).includes('剛烈') &&
        sourceInst.data) {
        sourceInst.mod = (sourceInst.mod||0) - amount;
        this.addLog(targetPi, `⚔️ ${target.data.name}【剛烈】：反傷 ${sourceInst.data.name} ${amount}`);
    }

    return amount;
}
/* ★ v3.4.1: 堅守保護檢查
   若目標牌所在陣地有曹仁【堅守】在場且該陣地己方劣勢，則該牌不能被移除。
   注意：【堅守】是鎖定技，時機等同「無時機技」，也就是說它永遠在線、
   不受沉默影響、不受時機限制。因此它能夠攔截任何「移除」類效果。 */
_isJianshouProtected(targetCard, ownerPi, bi) {
    if (!targetCard) return false;
    const field = this.players[ownerPi].fields[bi];
    if (!field || !field.includes(targetCard)) return false;
    const hasJianshou = field.some(c =>
        !c.faceDown && (c.data.skills||[]).includes('堅守'));
    if (!hasJianshou) return false;
    const myP = this.fieldPower(ownerPi, bi, false, true);
    const oppP = this.fieldPower(this.opponentOf(ownerPi), bi, false, true);
    return myP <= oppP;
}
flashRemove(inst) {
    if (!inst || !inst.data) return;
    try {
        const el = document.createElement('div');
        el.className = 'removal-clone';
        el.innerHTML = this.cardHTML(inst, { forceReveal: true, noHighlight: true });
        document.body.appendChild(el);
        setTimeout(() => { try { el.remove(); } catch(e){} }, 950);
    } catch(e) { /* 保護 */ }
}
/* 取得對手（pi 的對面）在 bi 上「最後的正面敵軍」（仍在場且正面） */
_validLastFaceUpEnemy(enemyPi, bi) {
    const c = this.players[enemyPi].lastFaceUpEnemy?.[bi];
    if (!c) return null;
    if (!this.players[enemyPi].fields[bi].includes(c)) return null;
    if (c.faceDown) return null;
    return c;
}
/* 每回合開始前：對手的背面冷箭/伏擊可翻開 */
_triggerPreTurnFlip() {
    const bi = this.currentBfIndex;
    const enemies = this.enemiesOf(this.current);
    for (const owner of enemies) {
        const ownerP = this.players[owner];
        const fus = ownerP.fields[bi].filter(c =>
            c.faceDown && !c.silenced &&
            ((c.data.skills||[]).includes('冷箭') || (c.data.skills||[]).includes('伏擊')));
        for (const c of fus) {
            c.faceDown = false;
            c.fresh = true;
            this.addLog(owner, `[R${this.round}] 冷箭：${c.data.name} 翻開`);
            if (c.data.onFlip) c.data.onFlip(this._ctxFor(owner, c, bi, null));
        }
    }
}
/* 己方回合開始時：結算龐統的【準備】→【連環】 */
_triggerPangtongLianhuan() {
    const pi = this.current;
    const bi = this.currentBfIndex;
    const pt = this.players[pi].fields[bi].find(c =>
        c.data.id === 'pangtong' && c.preparing);
    if (!pt) return;
    pt.preparing = false;
    if (pt.silenced) {
        this.addLog(pi, `[R${this.round}] 龐統【連環】：準備期間失去技能，效果不觸發`);
        return;
    }
    pt.activated = true;
    let n = 0;
    const enemies = this.enemiesOf(pi);
    for (const e of enemies) {
        this.players[e].fields[bi].forEach(c => {
            if (!c.faceDown) { c.lianhuan = true; n++; }
        });
    }
    this.addLog(pi, `[R${this.round}] 龐統【連環】：${n} 名敵軍陷入連環`);
}
/* 判斷是否應該正面進場（預設為埋伏）。 ... */
_shouldPlayFaceUp(card, pi, bi) {
    const d = card.data;
    const sk = d.skills || [];
    const oppField = this.players[this.opponentOf(pi)].fields[bi];

    if (sk.includes('冷箭') || d.forceFaceDown) return false;

    // 龐統 counterplay：對陣有啟動中的龐統 → 盡量背面進場避免被連環標記
    const oppPangtong = oppField.some(x =>
        !x.faceDown && !x.silenced && x.data.id === 'pangtong' && x.activated);
    if (oppPangtong && !d.isGeneral) {
        // 除非是必須正面才能選陣地的牌（奇謀/奇襲/奔襲），否則一律背面
        if (!sk.some(s => ['奇謀','奇襲','奔襲'].includes(s))) return false;
    }

    if (d.onEnter || d.onEnemyEnter) return true;

    const FACE_UP_ENGINES = ['觀星','權衡','連營','奸雄','設伏'];
    if (sk.some(s => FACE_UP_ENGINES.includes(s))) return true;

    if (d.isGeneral) return true;
    if (sk.includes('奇謀') || sk.includes('奇襲') || sk.includes('奔襲')) return true;

    if (oppField.some(x => !x.faceDown && (x.data.skills||[]).includes('力竭'))) return true;

    return false;
}

/* ============ 曹植【酒詩】 ============ */
findJiushiCard(pi) {

        !c.faceDown && !c.silenced && !c.activated && !c._jiushiUsed &&
        (c.data.skills||[]).includes('酒詩') &&
        (p.cardsPlayedByPlayer||0) >= 7);
}
activateJiushi() {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    const pi = this.current;
    const c = this.findJiushiCard(pi);
    if (!c) return;
    const p = this.players[pi];
    for (let bi=0; bi<this.fieldCount; bi++) {
        const idx = p.fields[bi].indexOf(c);
        if (idx >= 0) { p.fields[bi].splice(idx, 1); break; }
    }
    c.mod = 0; c.activated = true; c._jiushiUsed = true;
    p.hand.push(c);
    p.food = Math.min(this.cfg.maxFood, p.food + c.data.cost);
    this.addLog(pi, `[R${this.round}] 曹植【酒詩】：返回手牌並補回 ${c.data.cost} 糧`);
    this.recordEvent('jiushi', { player: pi, cardId: c.data.id, foodAfter: p.food });
    this.render();
}
/* ============ 荀彧【驅虎】 ============ */
chooseXunyuMove(pi, bi) {
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];
    const visible = enemyField.filter(c => !c.faceDown);
    if (visible.length < 2) return null;
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);
    const oppPi = this.opponentOf(pi);

    let best = null, bestScore = -Infinity;
    for (const c of visible) {
        const cp = c.data.power + (c.mod || 0);
        for (let dest = 0; dest < this.fieldCount; dest++) {
            if (dest === bi) continue;
            let score = cp * 1.5;

            if (dest < bi) {
                /* ★ v3.5: 過去陣地現在「可被翻轉」，不能再當成垃圾場無腦丟。
                   必須模擬搬過去後的新勝負。 */
                const hist = this.history.find(h => h.round === dest + 1);
                if (hist) {
                    const oldTotals = (hist.totals && hist.totals.length)
                        ? hist.totals
                        : [hist.f0 || 0, hist.f1 || 0];
                    const oldMe = oldTotals[pi];
                    const oldOpp = oldTotals[oppPi];
                    const newOpp = oldOpp + cp;   // 搬過去後對手戰力增加
                    const iWon = hist.winner === pi;

                    if (iWon) {
                        if (newOpp >= oldMe) {
                            // 翻盤！對手從輸變贏 → 極大扣分
                            score -= 150;
                        } else if (oldMe - newOpp <= 2) {
                            // 勉強守住 → 扣分（風險）
                            score -= 30;
                        } else {
                            // 安全，仍是我贏
                            score += 30;
                        }
                    } else {
                        // 我原本就輸 → 搬過去只會更輸
                        score -= 40;
                    }
                } else {
                    score += 60;   // 沒歷史（不該發生）
                }
            } else if (dest === bi) {
                // 不會進到這（已 continue）
            } else {
                // ★ 未來陣地：預先佈局，但對手憑空多一張牌
                score += (dest - bi) * 8;
                const futureMy = this.fieldPower(pi, dest, false);
                const futureOpp = this.fieldPower(oppPi, dest, false);
                const newFutureOpp = futureOpp + cp;
                if (futureMy > newFutureOpp + 5) score += 12;   // 我仍大幅領先
                else if (futureMy > newFutureOpp) score += 4;
                else if (newFutureOpp > futureMy + 8) score -= 20;  // 大幅落後
                else score -= 8;
            }

            // 讓當前陣地翻盤：優先
            if (myPow <= oppPow && myPow > oppPow - cp) score += 25;

            if (score > bestScore) { bestScore = score; best = { uid: c.uid, dest }; }
        }
    }
    return best;
}
/* 荀彧【驅虎】的次要效果：對剩下的最高戰力敵軍 -1（非傷害） */
_xunyuReduceSecondary(pi, bi) {
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];
    const remaining = enemyField.filter(c => !c.faceDown);
    if (remaining.length === 0) return;
    // 選戰力最高的（含 mod）
    let target = remaining[0];
    remaining.forEach(c => {
        if ((c.data.power + (c.mod||0)) > (target.data.power + (target.mod||0))) target = c;
    });
    // 堅守保護：若對手該陣地堅守生效（己方劣勢），跳過
    const hasJianshou = this.players[this.opponentOf(pi)].fields[bi].some(c =>
        !c.faceDown && (c.data.skills||[]).includes('堅守'));
    if (hasJianshou) {
        const oppTotal = this.fieldPower(this.opponentOf(pi), bi, false);
        const myTotal = this.fieldPower(pi, bi, false);
        if (oppTotal <= myTotal) {
            this.addLog(pi, `🛡️ 【驅虎】：${target.data.name} 因【堅守】免於戰力減少`);
            return;
        }
    }
    target.mod = (target.mod || 0) - 1;
    this.addLog(pi, `【驅虎】：${target.data.name} 戰力 -1`);
    this.recordEvent('quhu_reduce', { player: pi, targetId: target.data.id });
}

/* ============ 荀攸【奇策】 ============ */
chooseXunyouExtra(pi, bi) {
    const p = this.players[pi];
    // v3.5：排除上將（奇策打出上將不會自動放棄，時機容易錯亂）
    const eligible = p.hand.filter(c =>
        !c.data.forceFaceDown &&
        !c.data.isGeneral &&
        c.data.cost <= p.food
    );
    if (eligible.length === 0) return null;
    const opp = this.players[this.opponentOf(pi)];
    let best = null, bestScore = -Infinity;
    for (const c of eligible) {
        // v3.5：加入完整 ctx，避免評分函式拿到 undefined 而少扣分
        const score = this.scoreCardAI(c, pi, this.getAIDifficulty(pi), {
            myPow: this.fieldPower(pi, bi, false),
            oppPow: this.fieldPower(this.opponentOf(pi), bi, false),
            isFirstMoveOfRound: false,
            iAmResponding: false,
            alreadyWinningBig: false,
            alreadyWonRound1: false,
            oppWonRound1: false,
            iAmAheadInMatch: p.wins > opp.wins,
            iAmBehindInMatch: p.wins < opp.wins,
            mustWinThisRound: (opp.wins === 1)
        });
        if (score > bestScore) { bestScore = score; best = c; }
    }
    // v3.5：若最佳選項戰力太低，乾脆只拿 +1 糧
    if (!best || best.data.power < 1) return null;
    return best;
}
performQicePlay(pi, inst, bi) {
    const p = this.players[pi];
    if (p.food < inst.data.cost) {
        p.food = Math.min(this.cfg.maxFood, p.food + 1);
        this.addLog(pi, `[R${this.round}] 荀攸【奇策】：糧草不足，僅 +1 糧`);
        return;
    }
    p.food -= inst.data.cost;
    p.roundSpent += inst.data.cost;
    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = false;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = true;
    inst.grantedFubing = false;
    p.fields[bi].push(inst);
    inst.playedBy = pi;                                   // ★ v3.8
    this._trackCardPlayed(pi, inst.data.id);
    this.cardsPlayedCount++;
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;
    this.players[pi].lastFaceUpEnemy[bi] = inst;
    this.addLog(pi, `[R${this.round}] 荀攸【奇策】：追加 ${inst.data.name}（-${inst.data.cost}糧｜餘${p.food}）`);
	
    // 連環窗口
    const oppPangtong = this.players[this.opponentOf(pi)].fields[bi].find(c =>
        !c.faceDown && !c.silenced && c.data.id === 'pangtong' && c.activated);
    if (oppPangtong) {
        inst.lianhuan = true;
        this.addLog(pi, `⚠️ 【連環】${inst.data.name} 被對陣龐統標記`);
    }
    this.recordEvent('qice_play', { player: pi, cardId: inst.data.id, field: bi, foodAfter: p.food });

    const prevFlag = this._inExtraPlay;
    this._inExtraPlay = true;
    try {
        if (!inst.silenced && inst.data.onEnter) inst.data.onEnter(this._ctxFor(pi, inst, bi, null));
        const enemyField = this.players[this.opponentOf(pi)].fields[bi];
        const watchers = enemyField.filter(c => !c.faceDown && !c.silenced && c.data.onEnemyEnter);
        watchers.forEach(w => w.data.onEnemyEnter(this._ctxFor(this.opponentOf(pi), w, bi, inst)));
    } finally {
        this._inExtraPlay = prevFlag;
    }

    p.food = Math.min(this.cfg.maxFood, p.food + 1);
}

    if(!this.jianxiong||this.jianxiong.guess===null)return;

    let hit=null;
    for(let bi=0;bi<this.fieldCount&&!hit;bi++){
        for(const c of this.players[foes].fields[bi]){
            if(c.faceDown&&c.data.power===v){hit={c,bi};break;}
        }
    }
    if(hit){
        if (this._isJianshouProtected(hit.c, foes, hit.bi)) {
            this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜中 ${v}，但目標受【堅守】保護，無法棄置`);
        } else {
            const f=this.players[foes].fields[hit.bi];
            f.splice(f.indexOf(hit.c),1);
            this.archive.push(hit.c);
            this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜中 ${v}！`);
        }
    } else this.addLog(pi,`[R${this.round}] 曹操【奸雄】：猜 ${v} 未命中`);
    this.jianxiong=null;this.render();
}
jxSkip() { this.jianxiong=null; this.render(); }

finishAction() {
    this.selected = null;
    const opp = this.opponentOf(this.current);

    // 隱忍：對手放棄後，只要己方有司馬懿在場，對手出牌後可重新出牌
    const oppHasYinren = this.players[opp].fields.some(f => f.some(c =>
        !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
    if (this.players[opp].passed && oppHasYinren) {
        this.players[opp].passed = false;
        this.addLog(opp, `[R${this.round}] 司馬懿【隱忍】：${this.players[opp].name} 可再次出牌`);
    }

    const opponentPassed = this.players[opp].passed;
    if (opponentPassed && this.players.filter(pl => !pl.passed).length === 1) {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = false; this.render();
        return;
    }
    this.startCountdown(() => {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = !this.netMode;
        this.render();
    });
}
doPass() {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    this._handoffDoneThisTurn = false;
    const pi = this.current, p = this.players[pi];
    if (p.passed) {
        // ★ 已放棄 → 不應該卡在這個人的回合；強制推進
        this.addLog('sys', `[R${this.round}] ${p.name} 已放棄，自動推進回合`);
        this._handoffDoneThisTurn = false;   // 保險起見再清一次
        this.advanceTurn();
        return;
    }
    if (this.firstPasser === null) this.firstPasser = pi;
    p.passed = true; p.mustFaceUp = false;
    this.lastPasser = pi;
    this.passOrder = this.passOrder || [];
    this.passOrder.push(pi);
    this.addLog(pi, `[R${this.round}] ${p.name} 放棄跟牌`);
    this.recordEvent('pass', { player: pi, foodAfter: p.food });
    this.selected = null; this.selectedField = null;
    if (this.players.every(pl => pl.passed)) {
        if (!this._simaYiLastChanceUsed) {
            for (let pIdx = 0; pIdx < this.numPlayers; pIdx++) {
                const hasYinren = this.players[pIdx].fields.some(f => f.some(c =>
                    !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
                if (hasYinren) {
                    this._simaYiLastChanceUsed = true;
                    this.players[pIdx].passed = false;
                    if (this.firstPasser === pIdx) this.firstPasser = null;
                    this.addLog(pIdx, `[R${this.round}] 司馬懿【隱忍】：全員皆放棄，${this.players[pIdx].name} 獲得最後出牌機會`);
                    this.selected = null; this.selectedField = null;
                    if (pIdx === this.current) { this.cover = false; this.render(); }
                    else { this.cover = true; this.render(); }
                    return;
                }
            }
        }
		console.log('[doPass→preEnd]', {
            round: this.round, current: this.current,
            passed: this.players.map(p => p.passed),
            passOrder: (this.passOrder || []).slice(),
            firstPasser: this.firstPasser,
            phase: this.phase
        });
        this.startPreEnd(); return;
    }
    // ★ v3.9 FIX: 不要再提前跳 preEnd。當自己剛 pass、只剩對手未 pass 時，
    // 規則說「一方放棄後，對方可繼續出牌直到也放棄」——所以應該讓對手
    // 繼續走 turn 流程（handoff → advanceTurn），只有雙方都放棄才 preEnd。
    this.startCountdown(() => {
        this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
        this.cover = true;
        this.render();
    });
}
handoff() {
    this.cover = false;
    this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
    if (this.phase === 'mulligan') { this.mulliganHandoff(); return; }
    if (this.phase === 'turn') {
        this.advanceTurn();
        // ★ 額外保險：若 advanceTurn 提前返回而未重繪，這裡強制重繪一次
        // （避免 cover=false 但畫面仍是舊的鎖定狀態）
        this.render();
        return;
    }
    if (this.phase === 'preend') { this.advancePreEnd(); return; }
    this.render();
}
advanceTurn() {
    if (this.players.every(p => p.passed)) { this.startPreEnd(); return; }
    // ★ 防護：若當前玩家已放棄，無條件推進（避免 _handoffDoneThisTurn 卡住）
    const currentPassed = this.players[this.current].passed;
    if (!currentPassed && this._handoffDoneThisTurn) {
        // 已推進過，但狀態可能不同步 → 強制重繪避免卡住
        this.render();
        return;
    }
    this._handoffDoneThisTurn = true;
    this.players[this.current].mustFaceUp = false;
    // Find next non-passed player in cyclic order
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) { this.current = nxt; break; }
    }
    this.selected = null; this.selectedField = null;
    this._triggerPreTurnFlip();
    this._triggerPangtongLianhuan();
    this._logTurnStart();
    this.render();
    this.maybeJianxiong();
}
_logTurnStart() {
    if (!this.replay) return;
    this.recordEvent('turn_start', {
        player: this.current,
        hands: this.players.map(p => p.hand.map(c => c.data.id)),
        handCounts: this.players.map(p => p.hand.length),
        foods: this.players.map(p => p.food),
        passed: this.players.map(p => !!p.passed)
    });
}

startPreEnd() {
    console.log('[startPreEnd]', {
        round: this.round,
        roundFirstPlayer: this.roundFirstPlayer,
        passOrder: (this.passOrder || []).slice(),
        passed: this.players.map(p => p.passed)
    });
    this.phase = 'preend';
    // 🐛 v3.1 修正：原版只把主動 pass 的玩家放進 preEndOrder，
    // 導致「因對手 pass 而被動進入」的玩家完全沒有 preend 出牌機會。
    // 規則：「後放棄者先有機會在結算前再出一張牌，之後換先放棄者。」
    // 因此：
    //   ① 未主動 pass 的玩家（仍想繼續）視為「最後放棄」→ 排最前面
    //   ② 已主動 pass 的玩家按放棄順序反轉（後放棄者先出）
    const activePlayers = [];
    const passivePlayers = [];
    for (let step = 0; step < this.numPlayers; step++) {
        const pi = (this.roundFirstPlayer + step) % this.numPlayers;
        if (this.players[pi].passed) passivePlayers.push(pi);
        else activePlayers.push(pi);
    }
    passivePlayers.sort((a, b) => {
        const ia = this.passOrder.indexOf(a);
        const ib = this.passOrder.indexOf(b);
        return ib - ia;   // 後放棄者先出
    });
    const order = [...activePlayers, ...passivePlayers];
    // ★ defensive: 2P must always produce 2 slots; otherwise treat as a bad state.
    if (order.length < this.numPlayers) {
        // fall back to seating order rather than risk a 1-length preEnd
        order.length = 0;
        for (let i = 0; i < this.numPlayers; i++) order.push((this.roundFirstPlayer + i) % this.numPlayers);
    }
    this.preEndOrder = order;
    this.preEndDone = order.map(() => false);
    this.preEndIdx = 0;
    this.cover = false;
    this.addLog('bat', '═══ 陣地結算前 ═══');
    this.render();
    if (this.isAI(this.preEndOrder[this.preEndIdx])) {
        this._sTO(() => this.doPreEndAI(), 900);
    }
}
preEndAct() {
    if (this.phase !== 'preend' || this.cover || this.countdown !== null) return;
    if (this.preEndDone[this.preEndIdx]) return;                 // 🛡️ 新增：防止重複觸發
    const pi = this.preEndOrder[this.preEndIdx];
    if (pi === undefined) return;                                 // 🛡️ 新增：安全網
    this.preEndDone[this.preEndIdx] = true;
    this.addLog(pi, `${this.players[pi].name} 放棄出牌`);
    if (this.preEndIdx < this.preEndOrder.length - 1) {
        const nextPi = this.preEndOrder[this.preEndIdx + 1];
        if (this.netMode) {
            setTimeout(() => this.handoff(), 300);
        } else if (!this.isAI(nextPi)) {
            this.cover = true; this.render();
        } else {
            this._sTO(() => this.handoff(), 500);
        }
    } else this.settle();
}
advancePreEnd() {
    if (this.preEndIdx >= this.preEndOrder.length - 1) return;    // 🛡️ 新增：邊界防護
    this.preEndIdx++; this.cover = false; this.render();
    if (this.isAI(this.preEndOrder[this.preEndIdx])) {
        if (this.aiTimer) clearTimeout(this.aiTimer);             // 🛡️ 新增：與 scheduleAI 共用同一個 timer
        this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
    }
}
/* v3.1 新增：AI 在結算前階段的出牌邏輯 */
doPreEndAI() {
    if (this.phase !== 'preend') return;
    const pi = this.preEndOrder[this.preEndIdx];
    if (pi === undefined) return;
    if (!this.isAI(pi)) return;
    if (this.preEndDone[this.preEndIdx]) return;

    const p = this.players[pi];
    const bi = this.currentBfIndex;
    const oppPi = this.opponentOf(pi);
    const opp = this.players[oppPi];

    // 目前可見戰力 + 埋伏牌估算（保守：每張背面 3 點預期）
    const myVisible = this.fieldPower(pi, bi, false);
    const oppVisible = this.fieldPower(oppPi, bi, false);
    const myFlipPotential = p.fields[bi].filter(c => c.faceDown).length * 3;
    const oppFlipPotential = opp.fields[bi].filter(c => c.faceDown).length * 3.5;

    const myEff = myVisible + myFlipPotential;
    const oppEff = oppVisible + oppFlipPotential;

    // 平手時先手方勝 — 後手任何平手都算輸，因此 +1 修正
    const iAmFirst = (this.roundFirstPlayer === pi);
    const rawMargin = myEff - oppEff;
    const margin = iAmFirst ? rawMargin : rawMargin - 1;

    // 決定投入等級 0~5
    let invest = 0;
    if (margin >= 8) invest = 0;                            // 穩贏大
    else if (margin >= 4) invest = 1;                       // 穩贏中
    else if (margin >= 1) invest = 2;                       // 小贏
    else if (margin >= -3) invest = 4;                      // 平手/小落後 → 全力追
    else invest = 5;                                        // 大落後 → 梭哈

    if (invest === 0) { this.preEndAct(); return; }
	
	// v3.6：非最後一輪 + 極大落後 → 直接放棄，保留資源給下一輪
	const roundIsFinal = (this.round >= this.fieldCount);
	if (!roundIsFinal && margin < -10 && p.hand.length >= 3) {
		this.preEndAct();
		return;
	}

    // 找可出的牌
    const playable = p.hand.filter(c =>
        c.data.forceFaceDown ? true : c.data.cost <= p.food
    );
    if (playable.length === 0) { this.preEndAct(); return; }

    // 依「效率」選牌
    let best = null, bestScore = -Infinity;
    for (const c of playable) {
        let s = c.data.power;
        if (c.data.isAmbush) s += 1;                 // 埋伏可延後付糧
        if (invest >= 4) s = c.data.power * 2 - c.data.cost;
        // 若為上將且還在 preend：價值更高（可翻盤）
        if (c.data.isGeneral) s += 3;
        if (s > bestScore) { bestScore = s; best = c; }
    }
    if (!best) { this.preEndAct(); return; }

    // 若最強的一張也追不上，pass 省資源
    const projected = myVisible + (best.data.power || 0) + myFlipPotential;
    if (projected + 1 < oppEff && invest < 5) {
        this.preEndAct();
        return;
    }

    // 判斷正面或埋伏
    let asAmbush = false;
    if (best.data.forceFaceDown) asAmbush = true;
    else if (!this.canPlayNormally(best, pi) && this.canPlayAmbush(best, pi)) asAmbush = true;
    else if (this.canPlayAmbush(best, pi) && !this._shouldPlayFaceUp(best, pi, bi)) asAmbush = true;

    // ★ v3.9: 奇襲(魏延/鄧艾)可在結算前打於任一陣地。
    // 優先選「能翻盤」的陣地：過去陣地首選，未來次之，當前最保守。
    let targetBi = bi;
    if ((best.data.skills || []).includes('奇襲')) {
        const allowed = this.getPlayableFields(best, pi, 'preend');
        let bestField = bi, bestFieldScore = -Infinity;
        for (const f of allowed) {
            const myF = this.fieldPower(pi, f, false);
            const oppF = this.fieldPower(this.opponentOf(pi), f, false);
            const projected = myF + (best.data.power || 0);
            let s;
            if (f < this.currentBfIndex) {
                // 過去陣地：翻盤最有價值
                const hist = this.history.find(h => h.round === f + 1);
                const wasFirst = hist && hist.firstPlayer === pi;
                if (myF < oppF && projected > oppF) s = 40;                  // 直接翻盤
                else if (myF < oppF && projected === oppF && wasFirst) s = 22; // 追平且先手 → 翻盤
                else if (myF < oppF) s = -20;                                 // 還是輸 → 完全浪費
                else s = -5;                                                 // 已勝 → 沒意義
            } else if (f === this.currentBfIndex) {
                s = 3;                                    // 當前陣地 = 一般
            } else {
                // 未來陣地：預先布局
                if (myF < oppF && projected > oppF) s = 25;
                else if (myF < oppF && projected === oppF && this.roundFirstPlayer === pi) s = 12;
                else if (myF < oppF) s = -8;
                else s = 2;
            }
            if (s > bestFieldScore) { bestFieldScore = s; bestField = f; }
        }
        targetBi = bestField;
    }
    this.doPreEndPlay(best, asAmbush, targetBi);
}

/* v3.1 新增：在 preend 出牌的實作（與 doPlay 類似但狀態不同） */
doPreEndPlay(inst, asAmbush, bi) {
    const pi = this.preEndOrder[this.preEndIdx];
    const p = this.players[pi];
    if (!inst || !p.hand.includes(inst)) { this.preEndAct(); return; }
    if (!asAmbush && p.food < inst.data.cost) { this.preEndAct(); return; }

    if (!asAmbush) {
        p.food -= inst.data.cost;
        p.roundSpent += inst.data.cost;
    }
    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = !!asAmbush;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = !asAmbush;
    inst.grantedFubing = !!(asAmbush && (
        (!inst.data.isAmbush && this.hasShefuBonus(pi, bi)) ||
        (inst.data.skills||[]).includes('潛襲')
    ));
    p.fields[bi].push(inst);                              // ★ FIX: place card on field
    inst.playedBy = pi;                                   // ★ v3.8
    this._trackCardPlayed(pi, inst.data.id);              // ★ v3.7: track play
    this.cardsPlayedCount++;                              // ★ FIX
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;  // ★ FIX
    if (!asAmbush) this.players[pi].lastFaceUpEnemy[bi] = inst;

    this.addLog(pi, `[R${this.round}·結算前] ${p.name} ${asAmbush ? '埋伏' : '加碼'} ${inst.data.name}（-${asAmbush ? 0 : inst.data.cost}糧｜餘${p.food}）`);  // ★ FIX: log line
    this.recordEvent('play', {
        player: pi, cardId: inst.data.id, cardUid: inst.uid, field: bi, faceDown: !!asAmbush,
        foodCost: asAmbush ? 0 : inst.data.cost, foodAfter: p.food, handAfter: p.hand.length,
        phase: 'preend'
    });

    if (!asAmbush) this.runEntryTriggers(pi, inst, bi);
    this.applyBurn(pi);
    this.drawOne(pi);

    // ★ v3.9: 若打在過去陣地，標記為待重新結算（翻轉延後至本輪結束）
    if (!asAmbush && bi < this.currentBfIndex) this._markPendingFlip(bi);

    this.preEndDone[this.preEndIdx] = true;

    // ★ v3.9 FIX: 不要手動 preEndIdx++（advancePreEnd 會再加一次，
    // 導致跳過下一位、甚至越界 → 畫面卡住／顯示錯玩家視角）。
    // 改用與 preEndAct() 相同的流程：交給 handoff() → advancePreEnd() 推進。
    if (this.preEndIdx < this.preEndOrder.length - 1) {
        const nextPi = this.preEndOrder[this.preEndIdx + 1];
        if (this.netMode) {
            setTimeout(() => this.handoff(), 300);
        } else if (!this.isAI(nextPi)) {
            this.cover = true; this.render();
        } else {
            this._sTO(() => this.handoff(), 500);
        }
    } else this.settle();
}

/* ============ AI decision ============ */
decidePlayAI(pi) {
    const diff = this.getAIDifficulty(pi);
    const p = this.players[pi];
    const opp = this.players[this.opponentOf(pi)];
    const bi = this.currentBfIndex;
    const myField = p.fields[bi];
    const oppField = opp.fields[bi];
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);
    const totalOnField = myField.length + oppField.length;
    const oppPassed = opp.passed;
    const myWins = p.wins, oppWins = opp.wins;
    const oppAtMatchPoint = (oppWins === 1);
    const myFieldEmpty = myField.length === 0;
    const isFirstMoveOfRound = myFieldEmpty && oppField.length === 0;
    const iAmResponding = myFieldEmpty && oppField.length > 0;
    const alreadyWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === pi));
    const oppWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === (this.opponentOf(pi))));
    const iAmAheadInMatch = myWins > oppWins;
    const iAmBehindInMatch = myWins < oppWins;
    // ★ v3.4.2: 糧草承諾 = 場上已有的背面牌 + 手上伏兵預留（最便宜的 2 張）
    const myFieldFlipCost = myField.filter(c => c.faceDown).reduce((s, c) => s + c.data.cost, 0);
    const handFubing = p.hand.filter(c =>
        c.data.forceFaceDown || (c.data.skills||[]).includes('伏兵'));
    let myHandFubingReserve = 0;
    if (handFubing.length > 0) {
        const sorted = [...handFubing].sort((a, b) => a.data.cost - b.data.cost);
        myHandFubingReserve = sorted.slice(0, Math.min(2, sorted.length))
            .reduce((s, c) => s + c.data.cost, 0);
    }
    const myPendingFlipCost = myFieldFlipCost + myHandFubingReserve;

	// v3.6：更保守/現實的對手潛力估計。
	// 一張牌平均戰力 ≈ 3，但需要花 1-2 糧。
	// 對手最多能打出的牌數 = min(手牌數, 糧草能支撐的次數)
	const oppCardsCapable = Math.max(0, Math.min(
		opp.hand.length,
		Math.floor(opp.food / 1.8)      // 假設平均 1.8 費/張
	));
	const oppFaceDownCount = oppField.filter(c => c.faceDown).length;
	const oppFlipPotential = oppFaceDownCount * 3.0;
	const myFlipPotential = myField.filter(c => c.faceDown).reduce((s, c) => s + (c.data.power || 0), 0);
	// 平均每張牌 3.0 戰力（含上將時可能更高，這裡保守）
	const oppMaxPotential = oppCardsCapable * 3.0 + oppFlipPotential;
    const myEffectivePow = myPow + myFlipPotential;
    const oppEffectivePow = oppPow + oppFlipPotential;
    const myLead = myEffectivePow - oppEffectivePow;
    const safeLead = myEffectivePow > (oppPow + oppMaxPotential + 2);
    const alreadyWinningBig = myLead > 8;
    const iAmSecondPlayer = (this.current !== this.roundFirstPlayer);
    const mustWinThisRound = oppAtMatchPoint;
    // v3.4.1: Earlier rounds are less urgent. Save big plays.
    const isLastRound = this.round >= this.fieldCount;
    const iAmSafeInMatch = myWins >= 1 && !isLastRound;  // 1 more win is enough

    // ★ v3.9: 諸葛亮硬性門檻 — 場上+手牌疑兵總數為 0 時不可出（否則只是 2/0 白板）
    const playable = p.hand.filter(c => {
        if (c.data.id === 'zhugeliang') {
            const ybField = p.fields.flat().filter(x => (x.data.skills||[]).includes('疑兵')).length;
            const ybHand  = p.hand.filter(x => x !== c && (x.data.skills||[]).includes('疑兵')).length;
            if (ybField + ybHand === 0) return false;
        }
        return this.canPlayNormally(c, pi) || this.canPlayAmbush(c, pi);
    });
    if (playable.length === 0) return { play: false, reason: 'no_playable' };

    const scored = playable.map(c => ({
        card: c,
        score: this.scoreCardAI(c, pi, diff, { myPow, oppPow, mustWinThisRound, myPendingFlipCost,
            isFirstMoveOfRound, iAmResponding, alreadyWinningBig, alreadyWonRound1, oppWonRound1,
            iAmAheadInMatch, iAmBehindInMatch })
    })).sort((a, b) => b.score - a.score);
