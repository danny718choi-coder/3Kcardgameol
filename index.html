/* ============ AI 聊天觸發器（個性化） ============ */
aiChatTrigger(pi, event, opts = {}) {
    if (this.netMode) return;
    if (this._backgroundMode) return;   // ★ bg 模式不排台詞 timer
    if (this._aiPaused) return;
    if (!this.aiTrashTalk) return;
    if (!this.isAI(pi)) return;
    const p = this.players[pi];
    const pers = p.personality || 'malignant';
    const r = this.rng();

    /* ---- Cold（❄️）：從不打招呼、極少發話 ---- */
    if (pers === 'cold') {
        if (event === 'win_round' && r < 0.30) {
            this._chatBubble(pi, CHAT_EMOJI[9], 600);   // 🥀
        }
        // 其他事件全部靜默
        return;
    }

    /* ---- Kind（👑）：友善、有禮貌 ---- */
    if (pers === 'kind') {
        if (event === 'round_start') {
            this._chatBubble(pi, CHAT_EMOJI[0], 400);                  // 😀
            this._sTO(() => this._chatBubble(pi, CHAT_MSG[0]), 900);   // 你好！
            return;
        }
        if (event === 'win_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[1], 600); // 😂
            else if (r < 0.60) this._chatBubble(pi, CHAT_EMOJI[5], 600); // 👍
            else if (r < 0.80) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            // 剩 20% 靜默
            return;
        }
        if (event === 'lose_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[6], 600); // 👎
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[7], 600); // 😠
            // 剩 60% 靜默
            return;
        }
        if (event === 'general') {
            if (r < 0.50) this._chatBubble(pi, CHAT_MSG[0], 250);  // 你好！
            else          this._chatBubble(pi, CHAT_MSG[2], 250);  // 抱歉
            return;
        }
        if (event === 'gameover') {
            // 不論輸贏都稱讚
            this._chatBubble(pi, CHAT_MSG[1], 800);   // 打得不錯！
            return;
        }
        // 被玩家嗆 → 完全不回應
        return;
    }

    /* ---- Malignant（🤖）：噁心人 ---- */
    const L = this._aiLines('malignant');
    if (event === 'round_start') {
        if (r < 0.30) this._chatBubble(pi, this._pick(L.greeting), 400);
        return;
    }
    if (event === 'win_round') {
        const emoji = this._pick(L.winEmoji);
        const msg   = this._pick(L.winMsg);
        this._chatBubble(pi, `${emoji} ${msg}`, 700);
        return;
    }
    if (event === 'lose_round') {
        if (r < 0.50) this._chatBubble(pi, this._pick(L.defeat), 800);
        return;
    }
    if (event === 'general') {
        if (r < 0.45) this._chatBubble(pi, this._pick(L.general), 250);
        return;
    }
    if (event === 'gameover') {
        if (opts.won) {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.taunt), 800);
        } else {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.defeat), 800);
        }
        return;
    }
    if (event === 'human_chat') {
        if (r < 0.80) this._chatBubble(pi, this._pick(L.retaliate), 700 + this.rng() * 800);
        return;
    }
}

/* 向下相容：舊程式若呼叫 aiSay/aiSayEmoji 一律轉發 */
aiSay(pi, category, delay = 800) {
    const map = { victory: 'win_round', defeat: 'lose_round',
                  greeting: 'round_start', general: 'general',
                  retaliate: 'human_chat', taunt: 'win_round' };
    this.aiChatTrigger(pi, map[category] || 'round_start');
}
aiSayEmoji(pi, delay = 500) { this.aiChatTrigger(pi, 'win_round'); }

/* 玩家嗆 AI → 依個性回應 */
maybeAIChatResponse(humanPi, text) {
    if (this.netMode) return;
    if (!this.aiTrashTalk) return;
    const ais = [];
    for (let i = 0; i < this.numPlayers; i++) if (this.isAI(i)) ais.push(i);
    if (ais.length === 0) return;
    const opp = this.opponentOf(humanPi);
    const responder = this.isAI(opp) ? opp : ais[Math.floor(this.rng() * ais.length)];
    // 只有惡毒 AI 會回嗆（Kind / Cold 不回應）
    if (this.players[responder].personality !== 'malignant') return;
    this.aiChatTrigger(responder, 'human_chat');
}

/* 開局 / 換輪時統一觸發招呼 */
maybeTriggerAIChats(stage) {
    if (this.netMode) return;
    if (!this.aiTrashTalk) return;
    for (let pi = 0; pi < this.numPlayers; pi++) {
        if (!this.isAI(pi)) continue;
        if (stage === 'round_start') {
            const delay = 400 + this.rng() * 900;
            this._sTO(() => this.aiChatTrigger(pi, 'round_start'), delay);
        }
    }
}
/* ★ v3.5: 背面牌支付順序 — 玩家選擇 UI */
_askPaymentOrder(pi, faceDowns, food) {
    return new Promise(resolve => {
        this._paymentState = { pi, cards: faceDowns, food, order: [] };
        this._paymentResolver = resolve;
        this.render();
    });
}
paymentSelect(uid) {
    const s = this._paymentState;
    if (!s) return;
    const i = s.order.indexOf(uid);
    if (i >= 0) s.order.splice(i, 1);
    else s.order.push(uid);
    this.render();
}
paymentConfirm() {
    const s = this._paymentState;
    if (!s) return;
    const ordered = s.order.map(uid => s.cards.find(c => c.uid === uid)).filter(Boolean);
    s.cards.forEach(c => { if (!ordered.includes(c)) ordered.push(c); });
    const r = this._paymentResolver;
    this._paymentState = null;
    this._paymentResolver = null;
    this.render();
    r(ordered);
}
async settle() {
    this.phase = 'settle'; this.cover = false;
    console.log('[settle]', {
        round: this.round, roundFirstPlayer: this.roundFirstPlayer,
        preEndPassed: (this.preEndPassed || []).slice(),
        passed: this.players.map(p => p.passed)
    });

    // ★ v3.6: 快照「陣地結算前」的疑兵數量（供空城 / 巧計使用）
    this._takeYbSnapshot();
    const bi = this.currentBfIndex;
    this.addLog('bat', `═══ 【${BATTLEFIELDS[bi]}】陣地結算 ═══`);
    this.render();
    await this._sleep(450);

    // ★ v3.5: 背面牌支付順序決策
    this._paymentOrders = {};
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const faceDowns = this.players[pi].fields[bi].filter(c => c.faceDown);
        if (faceDowns.length === 0) {
            this._paymentOrders[pi] = [];
            continue;
        }
        const totalCost = faceDowns.reduce((s, c) => s + c.data.cost, 0);
        const food = this.players[pi].food;
        if (this.isAI(pi) || (this.netMode && pi !== this.localPlayerIdx)) {
            // AI 或遠端玩家：便宜優先（最大化保留張數）
            this._paymentOrders[pi] = [...faceDowns].sort((a, b) => a.data.cost - b.data.cost);
        } else if (totalCost <= food) {
            // 粮草充足，順序無所謂
            this._paymentOrders[pi] = [...faceDowns];
        } else {
            // 本地人類玩家：彈窗選擇
            this._paymentOrders[pi] = await this._askPaymentOrder(pi, faceDowns, food);
        }
    }

    // 程昱【捧日】：翻面前先結算基本戰力改寫
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const field = this.players[pi].fields[bi];
        const chengyu = field.find(c => !c.faceDown && !c.silenced && c.data.id === 'chengyu');
        if (!chengyu) continue;
        const faceDowns = field.filter(c => c.faceDown);
        if (faceDowns.length === 0) {
            this.addLog(pi, `【捧日】${chengyu.data.name}：本陣無背面牌，不觸發`);
            continue;
        }
        // 找出基本戰力最高的背面牌
        let highest = faceDowns[0];
        faceDowns.forEach(c => {
            if ((c.data.power||0) > (highest.data.power||0)) highest = c;
        });
        // 需要糧草足夠翻開它
        if (this.players[pi].food < highest.data.cost) {
            this.addLog(pi, `【捧日】${chengyu.data.name}：糧草不足以翻開 ${highest.data.name}（需${highest.data.cost}糧，餘${this.players[pi].food}），不觸發`);
            continue;
        }
        const delta = (highest.data.power||0) - (chengyu.data.power||0);
        if (delta > 0) {
            chengyu.mod = (chengyu.mod || 0) + delta;
            this.addLog(pi, `【捧日】${chengyu.data.name}：基本戰力改為 ${highest.data.power}（參照 ${highest.data.name}）`);
        } else {
            this.addLog(pi, `【捧日】${chengyu.data.name}：本陣背面牌不強於自己，不觸發`);
        }
    }

    const toDiscard = [];
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const ordered = this._paymentOrders?.[pi]
            || this.players[pi].fields[bi].filter(c => c.faceDown);
        for (const c of ordered) {
            if (!c.faceDown) continue;
            if (!this.players[pi].fields[bi].includes(c)) continue;
            c.faceDown = false; c.fresh = true;
            c.keepOnField = false;
            if (c.data.skills && c.data.skills.includes('疑兵') && !c.silenced) {
                if (c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
                if (!c.keepOnField) {
                    c.willRemove = true;
                    this.addLog(pi, `【疑兵】${c.data.name} 翻開，結算後移除`);
                }
            } else if (this.players[pi].food >= c.data.cost) {
                this.players[pi].food -= c.data.cost;
                this.addLog(pi, `【伏兵】${c.data.name}(${c.data.cost}糧/${c.data.power}戰力) 翻開`);
                if (!c.silenced && c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
            } else {
                c.willDiscard = true;
                toDiscard.push(c);
                this.addLog(pi, `【伏兵】糧草不足，棄置！`);
            }
        }
    }
    this.render();
    await this._sleep(800);

    if (toDiscard.length) {
        for (let pi = 0; pi < this.numPlayers; pi++)
            this.players[pi].fields[bi] = this.players[pi].fields[bi].filter(c => !c.willDiscard);
        toDiscard.forEach(c => this.archive.push(c));
        this.render(); await this._sleep(400);
    }

    const order = [];
    for (let step = 0; step < this.numPlayers; step++) {
        // ★ v3.7: 結算技能順序依「本輪先後手」，不是最後行動者
        order.push((this.roundFirstPlayer + step) % this.numPlayers);
    }
    for (const pi of order) {
        const f = [...this.players[pi].fields[bi]];
        for (const c of f) {
            if (c.faceDown || c.silenced) continue;
            if (c.data.onSettle) c.data.onSettle(this._ctxFor(pi, c, bi, null));
        }
    }
    this.render(); await this._sleep(400);

    // ★ v4.0: 不再需要場上快照，勝率改由 _roundPlays 帳本統計

    const powers = [];
    for (let pi = 0; pi < this.numPlayers; pi++) powers.push(this.totalPower(pi, false));
    const maxPow = Math.max(...powers);
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const behind = powers[pi] < maxPow;
        if (!behind) continue;
        const foesList = this.enemiesOf(pi);
        for (let fb = 0; fb < this.fieldCount; fb++) {
            const own = this.players[pi].fields[fb];
            // Betray to left neighbor (opponentOf)
            const leftFoe = this.opponentOf(pi);
            const foes = this.players[leftFoe].fields[fb];
            const movers = own.filter(c => !c.faceDown && (c.data.skills||[]).includes('反骨') && !c.activated);
            movers.forEach(c => {
                own.splice(own.indexOf(c), 1);
                c.activated = true; c.betrayed = true; c.betrayedFrom = pi;
                foes.push(c);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【反骨】背叛！加入 ${this.players[leftFoe].name} 陣營`);
            });
        }
    }
    if (this.players.some(p => p.fields[bi].some(c => c.betrayed)))
        { this.render(); await this._sleep(500); }

    for (let pi = 0; pi < this.numPlayers; pi++) {
        const f = this.players[pi].fields[bi];
        for (let i = f.length - 1; i >= 0; i--) {
            if (f[i].willRemove) {
                this.flashRemove(f[i]);
                f[i].originalOwner = pi;
                this.archive.push(f[i]); f.splice(i, 1);
            }
        }
    }

    // Compute per-player field powers
    const totals = [];
    for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, true));

    // Team totals (if teams mode)
    const teamTotals = {};
    if (this.teams) {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            const tid = this.seatTeam[pi];
            teamTotals[tid] = (teamTotals[tid] || 0) + totals[pi];
        }
    }

    // Determine winner
    let winner = 0;
    let tieBreakerOrder = (pi) => (pi - this.roundFirstPlayer + this.numPlayers) % this.numPlayers;

    if (this.teams) {
        const tids = Object.keys(teamTotals).map(Number);
        let bestTeam = tids[0], bestVal = teamTotals[bestTeam];
        for (const tid of tids) {
            if (teamTotals[tid] > bestVal) { bestTeam = tid; bestVal = teamTotals[tid]; }
            else if (teamTotals[tid] === bestVal) {
                // Tie between teams → use firstPlayer's team
                const firstTeam = this.seatTeam[this.roundFirstPlayer];
                if (tid === firstTeam) bestTeam = tid;
            }
        }
        // Pick lowest-seat member of winning team as winner (represents team)
        winner = Math.min(...this.teams[bestTeam]);
        // Award wins to all team members
        this.teams[bestTeam].forEach(seat => { this.players[seat].wins++; });
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `勝隊：${this.teams[bestTeam].map(s=>this.players[s].name).join('+')}`);
    } else {
        let bestVal = totals[0];
        for (let pi = 1; pi < this.numPlayers; pi++) {
            if (totals[pi] > bestVal) { winner = pi; bestVal = totals[pi]; }
            else if (totals[pi] === bestVal) {
                if (tieBreakerOrder(pi) < tieBreakerOrder(winner)) winner = pi;
            }
        }
        this.players[winner].wins++;
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `${this.players[winner].name} 贏得本輪！`);
    }

    // 🎭 AI 個性化反應（勝/敗）
    for (let pi = 0; pi < this.numPlayers; pi++) {
        if (!this.isAI(pi)) continue;
        const isWinner = (pi === winner) ||
            (this.teams && this.seatTeam[pi] !== null && this.seatTeam[pi] === this.seatTeam[winner]);
        if (isWinner) {
            this._sTO(() => this.aiChatTrigger(pi, 'win_round'), 800 + this.rng() * 400);
        } else {
            this._sTO(() => this.aiChatTrigger(pi, 'lose_round'), 1200 + this.rng() * 600);
        }
    }

    this.history.push({ round: this.round, battlefield: this.battlefields[bi], totals, winner, firstPlayer: this.roundFirstPlayer });

    // Compatibility: keep f0/f1 for old replay display and UI
    const f0 = totals[0] || 0;
    const f1 = totals[1] || 0;

    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + this.cfg.baseRefill);
        this.players[pi].fields[bi].forEach(c => {
            if (!c.faceDown && !c.silenced && (c.data.skills||[]).includes('締盟') && this.firstPasser === pi) {
                this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + 1);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【締盟】：先放棄 +1 糧`);
            }
        });
    }
    this.players[winner].food = Math.min(this.cfg.maxFood, this.players[winner].food + this.cfg.winBonus);
    this.addLog('sys', `補給 ${this.cfg.baseRefill} 糧，${this.players[winner].name} 額外 +${this.cfg.winBonus} 糧`);

    this.lastResult = { f0, f1, winner, battlefield: BATTLEFIELDS[bi] };
    this.recordEvent('settle', { battlefield: bi, f0, f1, winner,
        blueWins: this.players[0].wins, redWins: this.players[1].wins,
        blueFood: this.players[0].food, redFood: this.players[1].food });

    // ★ v4.0: 單輪結束不寫入勝率（改在整場遊戲結束時統一結算）

    let someoneWon = false;
    let winningPlayers = [];
    if (this.teams) {
        // For team modes, count each team's total wins
        for (const team of this.teams) {
            const teamWins = team.reduce((s, seat) => s + this.players[seat].wins, 0) / team.length;
            if (teamWins >= 2) { someoneWon = true; winningPlayers = team.slice(); break; }
        }
    } else {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (this.players[pi].wins >= 2) { someoneWon = true; winningPlayers = [pi]; break; }
        }
    }
    if (someoneWon) {
        this.gameWinner = winningPlayers[0];
        this.state = 'gameover';
        const winNames = winningPlayers.map(p => this.players[p].name).join(' & ');
        this.addLog('sys', `═══ ${winNames} 贏得最終勝利！═══`);
        this._recordGameStats(winningPlayers);
        // ★ 補回 AI 聊天 / recordEvent / 存檔 / 匯出
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (!this.isAI(pi)) continue;
            const won = winningPlayers.includes(pi);
            this._sTO(() => this.aiChatTrigger(pi, 'gameover', { won }), 900 + this.rng() * 800);
        }
        this.recordEvent('game_over', {
            winner: this.gameWinner,
            winners: winningPlayers,
            totalRounds: this.round
        });
        this.saveReplayToLocal();
        const allBots = this.players.every(p => p.botType);
        if (allBots && this.cfg.autoExport) this._sTO(() => this.downloadReplay(true), 400);
        this.render(); return;
    }

    // ★ v3.9: 本輪沒結束比賽 → 才執行過去陣地的待重算翻轉
    this._recheckAllPastBattlefields();

    // 翻轉可能把某人推到 2 勝 → 第二次判定
    let someoneWonAfterFlip = false;
    let winningAfterFlip = [];
    if (this.teams) {
        for (const team of this.teams) {
            const teamWins = team.reduce((s, seat) => s + this.players[seat].wins, 0) / team.length;
            if (teamWins >= 2) { someoneWonAfterFlip = true; winningAfterFlip = team.slice(); break; }
        }
    } else {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (this.players[pi].wins >= 2) { someoneWonAfterFlip = true; winningAfterFlip = [pi]; break; }
        }
    }
    if (someoneWonAfterFlip) {
        this.gameWinner = winningAfterFlip[0];
        this.state = 'gameover';
        const winNames = winningAfterFlip.map(p => this.players[p].name).join(' & ');
        this.addLog('sys', `═══ ${winNames} 藉翻轉取得最終勝利！═══`);
        // ★ v4.0: 寫入整場勝率
        this._recordGameStats(winningAfterFlip);
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (!this.isAI(pi)) continue;
            const won = winningAfterFlip.includes(pi);
            this._sTO(() => this.aiChatTrigger(pi, 'gameover', { won }), 900 + this.rng() * 800);
        }
        this.recordEvent('game_over', { winner: this.gameWinner, winners: winningAfterFlip, totalRounds: this.round, viaFlip: true });
        this.saveReplayToLocal();
        const allBots = this.players.every(p => p.botType);
        if (allBots && this.cfg.autoExport) this._sTO(() => this.downloadReplay(true), 400);
        this.render(); return;
    }

    this.render();
    if (this.players.every(p => p.botType) && this.round < this.fieldCount) {
        if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
        this.settleAutoTimer = this._sTO(() => {
            if (this.state === 'battle' && this.phase === 'settle') {
                this.settleAutoTimer = null;
                this.nextRound();
            }
        }, 2000);
    }
}

nextRound() {
    // ★ guard: only advance from a real settle phase, and only once.
    if (this.state === 'gameover') return;
    if (this.phase !== 'settle') return;
    this.phase = 'transition';        // mark consumed so a 2nd click can't re-run
    if (this.settleAutoTimer) { clearTimeout(this.settleAutoTimer); this.settleAutoTimer = null; }
    // 清除所有連環標記
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    if (this.round >= this.fieldCount) {
        const bi = this.currentBfIndex;
        for (let pi = 0; pi < this.numPlayers; pi++) {
            this.players[pi].fields[bi].forEach(c => {
                c.mod=0; c.burn=false; c.faceDown=false; c.silenced=false; c.activated=false;
                c.betrayed=false; c.betrayedFrom=null; c.lianhuan=false;
                c.preparing=false;
                this.archive.push(c);
            });
            this.players[pi].fields[bi] = [];
        }
    }
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].passed = false;
        this.players[pi].mustFaceUp = false;
        this.players[pi].roundSpent = 0;
    }
    this.firstPasser = null;
    this.passOrder = [];
    this.expandedField = null;   // 換輪時收起手動展開
    this._handoffDoneThisTurn = false;
    // ★ v3.6: 清除上一輪的疑兵快照
    this._ybSnapshot = null;
    this._ybArchiveSnapshot = null;
    // ★ v4.0: 整場遊戲只在開局時清一次帳本（見 startBattle）
    // ★ v3.9 FIX: 這些是 R1 遺留狀態，不清會污染 R2 的 preEnd / 隱忍判定
    this._simaYiLastChanceUsed = false;
    this._yinrenUsedThisRound = false;   // ★ v3.12
    this.preEndTurn = null;
    this.preEndPassed = [];
    this.countdown = null;
    if (this.countdownTimer) { clearTimeout(this.countdownTimer); this.countdownTimer = null; }
    const w = this.lastResult ? this.lastResult.winner : -1;
    if (w >= 0) this.current = (w + 1) % this.numPlayers;
    else this.current = (this.roundFirstPlayer + 1) % this.numPlayers;
    this.round++;
    this.roundFirstPlayer = this.current;
    this.phase = 'turn';
    this.cover = false;
    this.selected = null; this.selectedField = null;
    this.lastResult = null;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    for (let pi = 0; pi < this.numPlayers; pi++) this.logHand(pi, 'R'+this.round);
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1] ? this.players[1].hand.map(c => c.data.id) : [],
        blueFood: this.players[0].food, redFood: this.players[1] ? this.players[1].food : 0
    });
    this._resetTurnStartFlags(this.current);
    this._triggerPreTurnFlip();
    this._triggerPangtongLianhuan();
    this._triggerSunjianYinghun(this.current);
    this._triggerTurnStartSkills(this.current);
    this.render();
}

render() {
    if (this._destroyed) return;
    const app = document.getElementById('app');
    if (!app) return;

    // ★ 背景模式：不寫 DOM，但讓 AI 繼續跑
    if (this._backgroundMode) {
        if (this.state === 'battle') this.scheduleAI();
        if (this.state === 'gameover') this._scheduleAutoRestart();
        return;
    }

    if (this.state === 'flip') { app.innerHTML = this.renderFlip(); return; }
    if (this.state === 'mulligan') { app.innerHTML = this.renderMulligan(); return; }
    if (this.state === 'gameover') { app.innerHTML = this.renderGameOver(); return; }
    app.innerHTML = this.renderBattle();
    setTimeout(() => {
        const el = document.querySelector('.log');
        if (el) el.scrollTop = el.scrollHeight;
        this.scheduleAI();
    }, this._fastAiDebug ? 0 : 30);
}
_nextActorAfterCurrent() {
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) return nxt;
    }
    return null;
}
scheduleAI() {
    if (this._destroyed) return;
    if (this.netMode) return;
    if (this._aiPaused) return;                    // ★ 已暫停
    if (this.state !== 'battle') return;
    if (this.countdown !== null) return;
    if (this.scry || this.jianxiong || this.quanheng || this.lianying || this.guanyu || this.xunyu) return;
    if (this.phase === 'turn') {
        if (this.cover) {
            // Show handoff only if BOTH current and next actor are humans.
            // Otherwise auto-advance.
            const next = this._nextActorAfterCurrent();
            const humanHandoff = !this.isAI(this.current) && next !== null && !this.isAI(next);
            if (humanHandoff) return;  // wait for user to click
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.handoff(); }, 500);
            return;
        }
        if (this.isAI(this.current)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doTurnAI(); }, 900);
        }
    } else if (this.phase === 'preend') {
        if (this.cover) return;
        const pi = this.preEndTurn;
        if (pi !== null && pi !== undefined && this.isAI(pi) && !this.preEndPassed[pi]) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
        }
    }
}
/* ============ 解凍 AI（調試用） ============ */
defreezeRecalculate() {
    this.closeGameMenu();
    this._aiPaused = false;
    if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
    this.addLog('sys', '🐛 [解凍] 重新計算 AI');
    this.render();
    this.scheduleAI();
}
defreezeRedraw() {
    this.closeGameMenu();
    this.addLog('sys', '🐛 [解凍] 重新繪製');
    this.render();
}
/* ★ 強制 AI 重抽手牌：丟光 AI 手上所有牌 → 抽等量新牌。
   用於打破 AI「想太久 / 決策卡死」的狀態。
   效果類似孫權【權衡】但作用於整副手牌。
   ─ 只影響 AI 回合，人類玩家不受影響。
   ─ 不影響場上、棄牌堆以外的任何狀態。 */
defreezeForceRedraw() {
    this.closeGameMenu();

    if (this.state !== 'battle') {
        this.addLog('sys', '🐛 [解凍] 目前不在對戰中，無法強制重抽');
        this.render();
        return;
    }

    const pi = (this.phase === 'preend' && this.preEndTurn !== null)
        ? this.preEndTurn
        : this.current;

    if (pi === null || pi === undefined) {
        this.addLog('sys', '🐛 [解凍] 目前沒有行動中的玩家');
        this.render();
        return;
    }

    const p = this.players[pi];
    if (!p) return;

    if (!this.isAI(pi)) {
        this.addLog('sys', `🐛 [解凍] 目前是 ${p.name} 的回合，不是 AI，略過`);
        this.render();
        return;
    }

    const n = p.hand.length;
    if (n === 0) {
        this.addLog('sys', `🐛 [解凍] ${p.name} 手牌已空，無法重抽`);
        this.render();
        return;
    }

    // 記錄棄置的牌名（方便診斷）
    const discardedNames = p.hand.map(c => c.data.name).join('、');

    // ── 棄掉所有手牌（進棄牌堆 / 牌庫底，依設定）──
    p.hand.forEach(c => this._sendCard(c));
    p.hand = [];

    // ── 抽等量新牌 ──
    this.drawTo(pi, n);

    // ── 清掉所有可能的「思考卡死」狀態 ──
    if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
    this._aiPaused = false;
    this._aiPausedBeforeMenu = undefined;
    this.selected = null;
    this.selectedField = null;
    this._handoffDoneThisTurn = false;
    this.cover = false;
    this._lastActivityTime = Date.now();

    this.addLog('sys',
        `🐛 [解凍] 強制 ${p.name} 重抽 ${n} 張手牌（棄置：${discardedNames}）`);

    // 重繪 + 重新排程 AI
    this.render();
    this.scheduleAI();
}
defreezeSkipTurn() {
    this.closeGameMenu();
    if (this.phase === 'turn' && this.isAI(this.current) && !this.players[this.current].passed) {
        this.addLog('sys', '🐛 [解凍] 跳過 AI 回合');
        this.doPass();
        return;
    }
    if (this.phase === 'preend' && this.preEndTurn !== null && this.preEndTurn !== undefined
        && this.isAI(this.preEndTurn) && !this.preEndPassed[this.preEndTurn]) {
        this.addLog('sys', '🐛 [解凍] 跳過 AI 結算前');
        this.preEndAct();
        return;
    }
    this.addLog('sys', '🐛 [解凍] 目前沒有 AI 回合可跳過');
    this.render();
}
defreezeStopTurn() {
    this.closeGameMenu();
    this._aiPaused = true;
    if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
    this.addLog('sys', '🐛 [解凍] 已暫停 AI（點「重新計算」可恢復）');
    this.render();
}
minimizeToBackground() {
    this.closeGameMenu();
    this._backgroundMode = true;
    this._aiPaused = false;                       // ★ 確保 AI 不會因為選單殘留狀態卡住
    this._aiPausedBeforeMenu = undefined;
    // ★ 從查看模式返回背景時，把速度調回原本的快速值
    if (this._savedAiSpeedForView) {
        this.aiSpeed = this._savedAiSpeedForView;
        this._savedAiSpeedForView = null;
    }
    showSetup();
}
/* ============ 複製當前對局記錄 JSON（除錯用） ============ */
copyCurrentBattleLog() {
    try {
        const g = this;
        const state = {
            _meta: {
                exportedAt: new Date().toISOString(),
                seed: g.seed,
                version: 'v3.7-debug'
            },
            // ── 當前遊戲階段 ──
            gameState: {
                round: g.round,
                state: g.state,
                phase: g.phase,
                current: g.current,
                currentName: g.players[g.current] ? g.players[g.current].name : '?',
                roundFirstPlayer: g.roundFirstPlayer,
                battlefieldIndex: g.currentBfIndex,
                battlefieldName: (typeof BATTLEFIELDS !== 'undefined' && BATTLEFIELDS[g.currentBfIndex]) || '?'
            },
            // ── 玩家狀態（含手牌名稱、戰場內容） ──
            players: g.players.map((p, i) => ({
                idx: i,
                name: p.name,
                botType: p.botType,
                personality: p.personality,
                food: p.food,
                wins: p.wins,
                passed: p.passed,
                mustFaceUp: p.mustFaceUp,
                handCount: p.hand.length,
                handNames: p.hand.map(c => c.data ? c.data.name : '?'),
                fields: p.fields.map((f, bi) => f.map(c => ({
                    name: c.data ? c.data.name : '?',
                    faceDown: !!c.faceDown,
                    basePower: c.data ? c.data.power : 0,
                    mod: c.mod || 0,
                    silenced: !!c.silenced,
                    burn: !!c.burn
                })))
            })),
            // ── 凍結診斷：正在等哪個 modal ──
            activeModals: {
                scry:          !!g.scry,
                guanyu:        !!g.guanyu,
                xunyu:         !!g.xunyu,
                quanheng:      !!g.quanheng,
                lianying:      !!g.lianying,
                jianxiong:     !!g.jianxiong,
                diaochan:      !!g.diaochan,
                liangyuan:     !!g.liangyuan,
                lukang:        !!g.lukang,
                sunhao:        !!g.sunhao,
                paymentState:  !!g._paymentState,
                lianying_sel:  g.lianying ? g.lianying.sel : null
            },
            // ── 凍結診斷：AI 是否被暫停、是否有計時器排程 ──
            flags: {
                aiPaused:         g._aiPaused,
                aiPausedBeforeMenu: g._aiPausedBeforeMenu,
                backgroundMode:   g._backgroundMode,
                fastAiDebug:      g._fastAiDebug,
                hasAiTimer:       !!g.aiTimer,
                hasCountdown:     g.countdown !== null,
                cover:            g.cover,
                destroyed:        g._destroyed,
                inExtraPlay:      !!g._inExtraPlay
            },
            // ── 凍結診斷：距離上次活動過了多久 ──
            timing: {
                lastActivityTime: g._lastActivityTime,
                secondsSinceActivity: ((Date.now() - (g._lastActivityTime || Date.now())) / 1000).toFixed(2),
                now: Date.now()
            },
            // ── 最近 40 條 log ──
            recentLogs: g.logs.slice(-40),
            // ── 完整對局事件歷史（從開局到現在） ──
            replayEvents: (g.replay && g.replay.events) ? g.replay.events : [],
            // ── 卡牌統計帳本 ──
            gamePlays: (() => {
                const out = {};
                for (let i = 0; i < g.numPlayers; i++) {
                    out[i] = g._gamePlays && g._gamePlays[i] ? Array.from(g._gamePlays[i]) : [];
                }
                return out;
            })()
        };

        const json = JSON.stringify(state, null, 2);
        const sizeKB = (json.length / 1024).toFixed(1);

        // 優先使用 Clipboard API，失敗則 fallback
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(() => {
                showCopyToast(`✅ 已複製對局記錄（${sizeKB} KB）`);
            }).catch(() => {
                fallbackCopy(json);
                showCopyToast(`✅ 已複製對局記錄（${sizeKB} KB，fallback）`);
            });
        } else {
            fallbackCopy(json);
            showCopyToast(`✅ 已複製對局記錄（${sizeKB} KB）`);
        }
    } catch (e) {
        console.error('copyCurrentBattleLog failed:', e);
        alert('❌ 複製失敗：' + e.message);
    }
}
cardHTML(inst, o = {}) {
    const d = inst.data;
    const fac = FACTION_INFO[d.faction];
    const cls = [];
    if (o.size === 'sm') cls.push('sm', 'mini');
    if (o.size === 'xs') cls.push('xs', 'mini');
    if (o.extra) cls.push(o.extra);
    if (inst.justDrawn && !o.noHighlight) cls.push('just-drawn');
    if (inst.faceDown && !o.forceReveal) {
        return `<div class="card ${cls.join(' ')}" ${o.attr || ''}><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`;
    }
    const isZhuge = (d.id === 'zhugeliang');
    const isSmall = (o.size === 'sm' || o.size === 'xs');
    let powerMain, modTxt = '', pcls = '#ffffff';
    {
        const totalPower = (o.power !== undefined) ? o.power : Math.max(0, d.power + (inst.mod || 0));
        const base = d.power;
        const bonus = totalPower - base;
        powerMain = totalPower;
        if (bonus !== 0) modTxt = `(${bonus > 0 ? '+' : ''}${bonus})`;
        if (isSmall) {
            // 迷你卡（陣地/棄牌區）都是深色底 → 保持淺色文字
            const colUp   = '#5ac05a';
            const colDown = '#ff6b6b';
            pcls = bonus > 0 ? colUp : (bonus < 0 ? colDown : '#ffffff');
        } else {
            pcls = bonus > 0 ? 'var(--card-power-up)'
                 : (bonus < 0 ? 'var(--card-power-down)'
                 : 'var(--card-power-neutral)');
        }
    }
    const generalTag = d.isGeneral ? '<span class="c-gen">上將</span>' : '';
    const isFanpan = (d.skills || []).some(s => ['奇謀','奇襲','奔襲'].includes(s));
    const fanpanTag = isFanpan ? '<span class="c-fanpan">逆轉</span>' : '';
    const tag = inst.betrayed && !inst.faceDown
        ? '<span class="c-tag" style="background:rgba(200,40,40,.85);">倒戈</span>'
        : '';
    const sil = inst.silenced ? '<span class="c-tag" style="background:rgba(120,120,120,.8);left:auto;right:2px;bottom:20px;">沉默</span>' : '';
    const burn = inst.burn ? '<span class="c-tag" style="background:rgba(255,80,0,.85);left:auto;right:2px;bottom:36px;">燃</span>' : '';
	const guardOff = inst.guardUsed ? '<span class="c-tag" style="background:rgba(100,100,100,.85);left:auto;right:2px;bottom:52px;">護衛×</span>' : '';
    const prepTag = inst.preparing ? '<span class="c-tag" style="background:rgba(60,140,220,.85);left:auto;right:2px;bottom:36px;">準備</span>' : '';
    /* ★ v3.7: 連營已用盡的視覺標記。旗標在玩家身上，所以要反查這張牌屬於誰。 */
    const lyOff = (d.skills || []).includes('連營') &&
        this.players.some(pp => pp.lianyingUsed && pp.fields.some(f => f.includes(inst)))
        ? '<span class="c-tag" style="background:rgba(100,100,100,.85);left:auto;right:2px;bottom:52px;">連營×</span>' : '';
    /* ★ 連環燃料標籤：連3 / 連2 / 連1 / 連0 */
    const lhTag = (() => {
        if (!inst.lianhuan || inst.faceDown) return '';
        const hp = Math.max(0, Math.min(3, inst.lianhuanHp || 0));
        const cls = ['lh0','lh1','lh2','lh3'][hp];
        return `<span class="c-lh ${cls}">連${hp}</span>`;
    })();
    const isAmbushCapable = d.isAmbush || (d.skills || []).includes('伏兵');
    const ambushStrip = isAmbushCapable ? '<div class="c-ambush-strip"></div>' : '';	
    const skillNames = (d.skills || []).map(s => `<div>${s}</div>`).join('');
    return `<div class="card ${cls.join(' ')}" ${o.attr || ''}>
        <div class="card-front ${fac.cls}">
            ${ambushStrip}
            <span class="c-cost">${d.cost}</span>
            <span class="c-fac">${fac.name}</span>
            <span class="c-skills">${skillNames}</span>
            <span class="c-name">${d.name}</span>
            ${d.title ? `<span class="c-title">${d.title}</span>` : ''}
            <span class="c-art">${d.emoji}</span>
            <span class="c-power" style="color:${pcls}">${powerMain}${modTxt ? `<span style="font-size:10px">${modTxt}</span>` : ''}</span>
            ${generalTag}${fanpanTag}${tag}${sil}${burn}${guardOff}${prepTag}${lyOff}${lhTag}
        </div>
    </div>`;
}

renderMulligan() {

    const isRemote = this.netMode && pi !== this.localPlayerIdx;
    const showBacks = isAIP || isRemote;
    const canAct = !isAIP && !isRemote;
    let html = this.renderBackBtn();
    html += this.renderSpeedPanel();
    html += `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">開局重抽階段 — ${p.name}${this.aiIcon(pi)}${isAIP?this.diffTag(pi):''} ${this.modeTag()}</div></div>
        <div style="text-align:center;padding:8px;">
            <div class="phase-tag">${p.name} 的手牌（${p.hand.length} 張）</div>
            <div class="hand-row" style="justify-content:center;margin:16px 0;min-height:130px;">
                ${showBacks ? p.hand.map(()=>`<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`).join('') :
                  (p.hand.map(c => this.cardHTML(c, { extra:'clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('') || '<span style="color:#666;">無手牌</span>')}
            </div>
            ${isAIP ? `<p style="color:#c8a0ff;font-size:14px;margin-bottom:16px;">${p.personality==='kind'?'👑':(p.personality==='cold'?'❄️':'🤖')} 電腦正在決定是否重抽…</p>`
                    : `<p style="color:#a89070;font-size:14px;margin-bottom:16px;">可選擇重抽全部手牌，或直接開始。</p>`}
            <div class="ctrl-buttons">
                <button class="btn btn-purple" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganRedraw()">重抽</button>
                <button class="btn btn-red" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganSkip()">放棄重抽</button>
                <button class="btn btn-green" ${(stage !== 'confirm' || !canAct) ? 'disabled' : ''} onclick="game.mulliganConfirm()">確認</button>            </div>
        </div>`;
    if ((stage === 'hidden' || this.cover) && !this.netMode && !isAIP) {
        const other = this.opponentOf(pi);
        const otherIsHuman = !this.isAI(other);
        if (otherIsHuman) {
            html += `<div class="handoff-overlay">
                <div class="who" style="color:${color}">請將裝置交給 ${this.players[other].name}</div>
                <div class="note">${p.name} 的手牌已隱藏</div>
                <button class="btn btn-big btn-blue" onclick="game.mulliganHandoff()">轉換玩家</button>
            </div>`;
        } else {
            // Next is a bot — auto-advance
            setTimeout(() => { try { this.mulliganHandoff(); } catch (e) {} }, 300);
        }
    }
    html += this.renderInspect();
    html += `<div id="modal-slot"></div>`;
    return html;
}

voteRematch() {
    if (this.state !== 'gameover') return;
    // When the host is applying a remote action, the voter is the OTHER player.
    const pi = this.netMode
        ? (this._applyingRemote ? (this._remotePlayerIdx ?? 1) : this.localPlayerIdx)
        : 0;
    this._rematchVotes = this._rematchVotes || [false, false];
    if (this._rematchVotes[pi]) return;
    this._rematchVotes[pi] = true;
    this.addLog('sys', `${this.players[pi].name} 按下「再來一局」`);
    this.render();
    if (this.netMode && this.role === 'host' &&
        this._rematchVotes[0] && this._rematchVotes[1]) {
        this._doRematch();
    }
}
_scheduleAutoRestart() {
    if (this._autoRestartQueued || this._autoRestartCancelled) return;
    const isAIvsAI = this.players.every(p => p.botType);
    if (!isAIvsAI || !this.cfg.autoRestart) return;
    this._autoRestartQueued = true;
    const delay = this._fastAiDebug
        ? Math.max(50, this.cfg.autoRestartDelay || 100)
        : Math.max(2000, this.cfg.autoRestartDelay || 2000);
    const tickEvery = 500;
    let remaining = delay;
    const tick = () => {
        if (this._destroyed) return;
        remaining -= tickEvery;
        const el = document.getElementById('autorestart-countdown');
        if (el) el.textContent = Math.max(0, Math.ceil(remaining / 1000));
        if (remaining > 0) this._autoRestartTick = setTimeout(tick, tickEvery);
    };
    this._autoRestartTick = setTimeout(tick, tickEvery);
    this._autoRestartFire = setTimeout(() => {
        this._autoRestartCancelled = true;
        if (this._autoRestartTick) { clearTimeout(this._autoRestartTick); this._autoRestartTick = null; }
        this.clearAllTimers();
        try { clearTimeout(this._autoRestartFire); } catch (e) {}

        let cfgCopy;
        try {
            cfgCopy = JSON.parse(JSON.stringify(this.cfg));
        } catch (e) {
            console.error('[auto-restart] cfg 複製失敗：', e);
            return;
        }
        cfgCopy.seed = '';
        cfgCopy._rematchVotes = undefined;
        cfgCopy.autoRestart = true;
        cfgCopy.autoExport = this.cfg.autoExport;

        setTimeout(() => {
            try {
                window.game = new Game(cfgCopy);
                console.log('[auto-restart] 新對局已開始');
            } catch (e) {
                console.error('[auto-restart] 建立新對局失敗：', e);
            }
        }, 0);
    }, delay);
}
_doRematch() {
    if (this.role !== 'host') return;
    // Cancel any pending broadcast from the old game instance
    if (this._broadcastTimer) { clearTimeout(this._broadcastTimer); this._broadcastTimer = null; }
    const cfg = this.cfg;
    cfg.seed = '';
    cfg._rematchVotes = undefined;
    window.game = new Game(cfg);
}
_renderRematchButtons() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    if (v[me]) {
        return `<button class="btn btn-big btn-green" disabled>✅ 已同意（等待對手…）</button>`;
    }
    return `<button class="btn btn-big btn-green" onclick="game.voteRematch()">🔁 再來一局</button>`;
}
_renderRematchStatus() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    const myName = this.players[me].name;
    const opName = this.players[1 - me].name;

        <h2 style="color:${color};font-size:28px;">${this.players[w].name}${this.aiIcon(w)} 勝利！</h2>
        <p>率先取得兩輪勝利，稱霸三國！</p>

        <div style="display:flex;justify-content:center;gap:30px;margin:18px 0;flex-wrap:wrap;">
            ${this.players.map((p, i) => {
                const col = PLAYER_COLORS[i];
                return `<div><div style="font-size:13px;color:${col.text};">${p.name}勝場</div>
                     <div style="font-size:26px;color:${col.text};font-weight:bold;">${p.wins}</div></div>`;

        </div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">

            <button class="btn btn-big btn-gold" onclick="game.downloadReplay()">📥 匯出遊戲記錄</button>
            <button class="btn btn-big" style="background:linear-gradient(180deg,#2a6a4a,#153828);border-color:#44cc88;color:#c8ffe0;" onclick="copyCurrentSeed()">🌱 複製種子</button>
        </div>

        <p style="font-size:13px;color:#7cff7c;margin-top:10px;font-family:monospace;letter-spacing:2px;">🌱 種子：${this.seed}</p>
        <p style="font-size:12px;color:#a89070;margin-top:14px;">
            本場已存入本地快取。${isAIvsAI && this.cfg.autoExport ? '並已自動下載 JSON。' : (isAIvsAI ? '' : '')}<br>
            ${isAIvsAI && this.cfg.autoRestart && !this._autoRestartCancelled

                   <button class="btn" style="margin-top:6px;font-size:12px;padding:4px 12px;" onclick="cancelAutoRestart()">✋ 取消自動重開</button><br>`
                : (isAIvsAI && this.cfg.autoRestart && this._autoRestartCancelled
                    ? `<b style="color:#ff9c4a;font-size:14px;">✋ 已取消自動重開</b><br>`
                    : '')}
            ${isAIvsAI && !this.cfg.autoRestart ? '（可在「遊戲設定」勾選「自動重新開局」讓 AI 對戰連續跑）<br>' : ''}
            ${isAIvsAI && !this.cfg.autoExport ? '（可在「遊戲設定」勾選「自動下載 JSON 記錄」）<br>' : ''}
            回到主選單可用「📜 回放記錄」瀏覽所有對戰。
        </p>
    </div></div>`;
}

buildReplayExport() {
    return {
        version: this.replay.version,
        createdAt: this.replay.createdAt,
        exportedAt: new Date().toISOString(),
        seed: this.seed,
        mode: this.cfg.mode,
        config: this.replay.config,
        deckTopToBottom: this.replay.deckTopToBottom,
        winner: this.gameWinner,
        totalRounds: this.round,
        finalWins: this.players.map(p => p.wins),
        events: this.replay.events
    };
}
saveReplayToLocal() {
    try {
        const data = this.buildReplayExport();

        // ★ 新增：背景模式 → 存進記憶體批次，不寫 localStorage
        if (this._backgroundMode) {
            window.__aiBatchReplays = window.__aiBatchReplays || [];
            window.__aiBatchReplays.push(data);
            return;   // 不寫 localStorage（避免爆掉）
        }

        const arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
        arr.push(data);
        while (arr.length > 100) arr.shift();
        localStorage.setItem('sanguo_logs', JSON.stringify(arr));
    } catch(e) { console.warn('localStorage 失敗', e); }
}
downloadReplay(auto = false) {
    if (!this.replay) { alert('沒有可匯出的記錄'); return; }
    const json = JSON.stringify(this.buildReplayExport(), null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-replay-${ts}${auto?'-auto':''}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

return `<span style="color:${col.text};">${p.name} ${winDots}${this.aiIcon(i)}</span>`;

renderPlayerRow() {

        const p = this.players[pi];
        const col = PLAYER_COLORS[pi % PLAYER_COLORS.length];
        const isCur = (this.phase === 'turn' && pi === this.current) ||
                      (this.phase === 'preend' && this.preEndTurn === pi);
        h += `<div class="pr-chip ${isCur ? 'pr-cur' : ''}" style="border-color:${col.border};color:${col.text};">
            <span class="pr-name">${p.name}${this.aiIcon(pi)}</span>
            <span class="pr-wins">🏆 ${p.wins}</span>
            ${p.passed ? `<span class="pr-pass">放棄</span>` : ''}

renderBattlefields() {
    const atSettle = (this.phase === 'settle');
    const activeBi = this.currentBfIndex;
    const roundActive = this.phase === 'turn' && !this.players.every(p => p.passed);
    let h = `<div class="bf-flex">`;
    for (let bi = 0; bi < this.fieldCount; bi++) {
        const isActive = (bi === activeBi);
        const isPast = (bi < activeBi);
        const isFuture = (bi > activeBi);
        const isExpanded = (this.expandedField === bi);
        // 大小判定：手動展開優先，否則當前戰場為大
        const showLarge = isExpanded || (isActive && this.expandedField === null);
        let wrapCls;
        if (showLarge) {
            wrapCls = 'active' + (isExpanded ? ' manually-expanded' : '') + ' expandable';
        } else if (isPast) {
            wrapCls = 'inactive expandable';
        } else {
            wrapCls = 'future expandable';
        }

		// 戰場標題
		let headRes = '';
		if (isPast) {
			const hist = this.history.find(r => r.round === bi + 1);
			if (hist) {
				const totals = (hist.totals && hist.totals.length) ? hist.totals : [hist.f0 || 0, hist.f1 || 0];
				const firstP = (hist.firstPlayer !== undefined) ? hist.firstPlayer : 0;
				const firstCol = PLAYER_COLORS[firstP % PLAYER_COLORS.length];
				const pending = this._pendingFlips && this._pendingFlips[bi];
				const pendingTxt = pending ? ` <span style="color:#ffb347;font-size:10px;">⚠ 待重算</span>` : '';
				headRes = `<div class="bf-meta">
					<div><span class="res">${totals.join(' : ')}（已定）</span>${pendingTxt}</div>
					<div class="bf-first-line">先：<b style="color:${firstCol.text}">${this.players[firstP].name}</b></div>
				</div>`;
			} else {
				headRes = `<span class="res">-</span>`;
			}
		} else if (isActive) {
			const totals = [];
			for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, atSettle));
			// 找領先方
			let leaderPi = 0, maxP = totals[0];
			for (let pi = 1; pi < this.numPlayers; pi++) {
				if (totals[pi] > maxP) { leaderPi = pi; maxP = totals[pi]; }
			}
			const tied = totals.filter(t => t === maxP).length > 1;
			const leaderCol = PLAYER_COLORS[leaderPi % PLAYER_COLORS.length];
			const leaderTxt = tied
				? `<span class="bf-leader" style="color:#a89070;">平手</span>`
				: `<span class="bf-leader" style="color:${leaderCol.text};">${this.players[leaderPi].name} 領先</span>`;
			const firstP = (this.roundFirstPlayer !== null && this.roundFirstPlayer !== undefined)
				? this.roundFirstPlayer : 0;
			const firstCol = PLAYER_COLORS[firstP % PLAYER_COLORS.length];
			headRes = `<div class="bf-meta">
				<div><span class="open">${totals.join(' : ')}</span> ${leaderTxt}</div>
				<div class="bf-first-line">先：<b style="color:${firstCol.text}">${this.players[firstP].name}</b></div>
			</div>`;
		} else {
			headRes = `<span class="res" style="color:#555;">尚未開啟</span>`;
		}

        // 展開提示圖示（非當前戰場才顯示）
        const expandIcon = (!isActive)
            ? `<span class="bf-expand-icon">${isExpanded ? '▼ 收合' : '▷ 展開'}</span>`
            : '';

        // 卡牌大小
        const cardSize = showLarge ? undefined : 'xs';
        const cardExtra = isPast ? 'grey clickable' : (isFuture ? (isExpanded ? 'clickable' : 'grey') : 'clickable');
        // 可被檢視的條件：非未來、或已被展開
        const canInspect = !isFuture || isExpanded || this.expandedField === bi;
        const inspAttr = (c) => canInspect ? `onclick="event.stopPropagation();game.inspect('${c.uid}')"` : '';

        // 只允許非當前戰場展開
        const toggleHandler = isActive ? '' : `onclick="game.toggleFieldExpand(${bi})"`;

        h += `<div class="bf-wrap ${wrapCls}" ${toggleHandler}><div class="bfield">
            <div class="bf-head"><span>${this.battlefields[bi]}${isActive ? ' ★' : ''}${expandIcon}</span>${headRes}</div>`;

        for (let pi = 0; pi < this.numPlayers; pi++) {
            const p = this.players[pi];
            const col = PLAYER_COLORS[pi % PLAYER_COLORS.length];
            const field = p.fields[bi];
            const showPass = isActive && roundActive && p.passed;
            const tot = this.fieldPower(pi, bi, atSettle);
            h += `<div class="bf-row ${showPass ? 'passed' : ''}" style="background:${col.bg};">
                <div class="bf-player-lbl" style="color:${col.text};">${p.name}</div>
                <div class="bf-cards">
                    ${field.length === 0
                        ? `<span class="bf-ghost">等待部屬…</span>`
                        : field.map(c => this.cardHTML(c, {
                            size: cardSize,
                            extra: c.fresh ? ('enter ' + cardExtra) : cardExtra,
                            power: this.getPower(c, pi, bi, atSettle),
                            attr: inspAttr(c)
                        })).join('')}
                </div>
                <div class="bf-total" style="color:${col.text};">${tot}</div>
            </div>`;
        }

        h += `</div></div>`;
    }
    h += `</div>`;
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.fresh = false);
    return h;
}
toggleFieldExpand(bi) {
    if (bi === this.currentBfIndex) return;  // 當前戰場不可切換
    this.expandedField = (this.expandedField === bi) ? null : bi;
    this.render();
}

/* 模擬關羽進場後的最終戰力與敵方能否被斬 */
_predictGuanyuEntry(pi, bi) {
    const hand = this.players[pi].hand;
    const gy = hand.find(c => c.data.id === 'guanyu');
    if (!gy) return null;
    const phantom = {
        uid: '__phantom_gy__', data: gy.data,
        mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null,
        usesLeft: undefined, pendingSilence: false, pendingBurnNext: false,
        pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false, lianhuanHp: 0,
        grantedFubing: false, keepOnField: false, guardUsed: false,
        _oneShotBuff: undefined, enteredFaceUp: null, _jiushiUsed: false,
        playedBy: pi
    };
    const myField = this.players[pi].fields[bi];
    myField.push(phantom);
    let myPower = 0;
    const enemies = [];
    try {
        myPower = this.getPower(phantom, pi, bi, false);
        const enemyPi = this.opponentOf(pi);
        const enemyField = this.players[enemyPi].fields[bi];
        for (const c of enemyField) {
            if (c.faceDown) {
                enemies.push({ card: c, power: null, kind: 'faceDown' });
            } else if (c.data.isGeneral) {
                enemies.push({ card: c, power: this.getPower(c, enemyPi, bi, false), kind: 'general' });
            } else {
                enemies.push({ card: c, power: this.getPower(c, enemyPi, bi, false), kind: 'normal' });
            }
        }
    } finally {
        myField.pop();
    }
    return { myPower, threshold: myPower - 4, enemies };
}
/* ★ v3.6: 威嚇預測（張飛 / 典韋 / 夏侯惇用）
   使用與關羽斬將相同的 phantom 插入法，計算進場後的最終戰力。
   威嚇門檻 = 我方戰力；敵方進場時若 < 此值 → 受到 1 戰力傷害。
   因此「最終戰力越高 → 門檻越高 → 越多敵軍落入打擊範圍」。 */
_predictWeiheEntry(pi, bi, cardId) {
    const hand = this.players[pi].hand;
    const card = hand.find(c => c.data.id === cardId);
    if (!card) return null;

    const phantom = {
        uid: '__phantom_weihe__', data: card.data,
        mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null,
        usesLeft: undefined, pendingSilence: false, pendingBurnNext: false,
        pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false,
        _oneShotBuff: undefined, enteredFaceUp: null, _jiushiUsed: false,
        playedBy: pi
    };
    const myField = this.players[pi].fields[bi];
    const oppPi = this.opponentOf(pi);
    const oppField = this.players[oppPi].fields[bi];

    myField.push(phantom);
    let myPower = 0;
    let lowerEnemies = 0, higherEnemies = 0, totalEnemies = 0;
    let lowerThreat = 0;      // 低戰力敵軍的總威脅值
    try {
        myPower = this.getPower(phantom, pi, bi, false);
        for (const c of oppField) {
            if (c.faceDown) continue;
            totalEnemies++;
            const ep = this.getPower(c, oppPi, bi, false);
            if (ep < myPower) {
                lowerEnemies++;
                lowerThreat += this.cardThreatValue(c);
            } else {
                higherEnemies++;
            }
        }
    } finally {
        myField.pop();
    }

    // 對手還有多少牌可打（威嚇只能在未來敵軍進場時觸發）
    const opp = this.players[oppPi];
    const oppPlayable = Math.min(opp.hand.length, Math.floor(opp.food / 1.8));

    return { myPower, lowerEnemies, higherEnemies, totalEnemies, lowerThreat, oppPlayable };
}
/* ★ v4.0: 孫堅【英魂】預測
   使用 phantom 插入法，計算進場後的「孫堅最終戰力」，
   並列出同陣地所有正面友軍：哪些會被 +1、哪些不會。 */
_predictYinghunEntry(pi, bi) {
    const hand = this.players[pi].hand;
    const sj = hand.find(c => c.data.id === 'sunjian');
    if (!sj) return null;

    const phantom = {
        uid: '__phantom_sj__', data: sj.data,
        mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null,
        usesLeft: undefined, pendingSilence: false, pendingBurnNext: false,
        pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false,
        _oneShotBuff: undefined, enteredFaceUp: null, _jiushiUsed: false,
        playedBy: pi
    };

    const myField = this.players[pi].fields[bi];
    myField.push(phantom);
    let myPower = 0;
    const willBuff = [], wontBuff = [];
    try {
        myPower = this.getPower(phantom, pi, bi, false);
        myField.forEach(c => {
            if (c === phantom || c.faceDown) return;
            const cP = this.getPower(c, pi, bi, false);
            if (cP < myPower) {
                willBuff.push({ card: c, power: cP, after: cP + 1 });
            } else {
                wontBuff.push({ card: c, power: cP });
            }
        });
    } finally {
        myField.pop();
    }
    return { myPower, willBuff, wontBuff };
}
/* ★ v3.7: 諸葛亮【空城】預測
   使用 phantom 插入法，計算「進場後、含所有被動增益」的最終結算戰力。
   - 空城公式：目前戰力 × max(1, 疑兵數)
   - 「目前戰力」= 基本 3 + 所有被動（蜀王 / 建言 / 龍吟 / 忘隙 / 放權 / 鐵騎 / 王類光環） */
_predictZhugeEntry(pi, bi) {
    const hand = this.players[pi].hand;
    const zg = hand.find(c => c.data.id === 'zhugeliang');
    if (!zg) return null;

    const phantom = {
        uid: '__phantom_zg__', data: zg.data,
        mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null,
        usesLeft: undefined, pendingSilence: false, pendingBurnNext: false,
        pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false,
        _oneShotBuff: undefined, enteredFaceUp: null, _jiushiUsed: false,
        playedBy: pi
    };

    const myField = this.players[pi].fields[bi];
    myField.push(phantom);
    let basePower = 0, ybField = 0, ybHand = 0;
    try {
        // 目前戰力（不含空城倍數）— 含所有被動增益
        basePower = this.getPower(phantom, pi, bi, false);

        // 場上疑兵數（含尚未翻開的蓋牌）
        ybField = myField.filter(c =>
            c !== phantom && (c.data.skills||[]).includes('疑兵')
        ).length;

        // 手牌疑兵數（可能接下來會鋪）
        ybHand = hand.filter(c =>
            c !== zg && (c.data.skills||[]).includes('疑兵')
        ).length;
    } finally {
        myField.pop();
    }

    // 空城最終戰力（含現有場上疑兵；手牌疑兵為潛在加成）
    const settleNow  = basePower * Math.max(1, ybField);
    const settleBest = basePower * Math.max(1, ybField + ybHand);

    return { basePower, ybField, ybHand, settleNow, settleBest };
}
/* 毒士預測（賈詡用） */
_predictDushiTargets(pi, bi) {
    const enemyPi = this.opponentOf(pi);
    const enemyField = this.players[enemyPi].fields[bi];
    const killable = [], notKill = [], immune = [];
    for (const c of enemyField) {
        if (c.faceDown) { immune.push({ card: c, reason: '蓋牌' }); continue; }
        if (c.data.isGeneral) { immune.push({ card: c, reason: '上將' }); continue; }
        const ep = this.getPower(c, enemyPi, bi, false);
        if (ep <= 3) killable.push({ card: c, power: ep });
        else notKill.push({ card: c, power: ep });
    }
    return { killable, notKill, immune };
}
/* 斬除預測（馬岱 / 徐榮用） */
_predictZhanchuTargets(pi, bi) {
    const enemyPi = this.opponentOf(pi);
    const enemyField = this.players[enemyPi].fields[bi];
    const fodder = enemyField.filter(c => !c.faceDown && c.data.cost === 1);
    const lastFaceUp = this._validLastFaceUpEnemy(enemyPi, bi);
    return { fodder, lastFaceUp };
}

            const ep = this.getPower(p.lastFaceUp, this.opponentOf(pi), this.currentBfIndex, false);

        } else {
            parts.push(`<span style="color:#a89070;">對陣無 1 糧敵軍，且無最後正面敵軍 → 不觸發</span>`);
        }
        zhanchuHint = `<div style="margin-top:8px;padding:6px 12px;background:rgba(80,200,80,.08);border:1px solid rgba(80,200,80,.4);border-radius:6px;font-size:12.5px;line-height:1.75;text-align:left;">

    if (isAIP && !this.cover) {
        return `<div class="control-area"><div class="ctrl-info">${info}</div><div style="margin:6px 0;"><span class="ai-badge">${this.aiIcon(pi)} 電腦思考中…</span></div>${allHints}${skillBox}</div>`;

        <div class="ctrl-info">${info}</div>
        ${allHints}
        <div class="ctrl-buttons">
            <button class="btn btn-green" ${(!inst || locked || !this.canPlayNormally(inst, pi)) ? 'disabled' : ''} onclick="game.doPlay(false)">出牌</button>
            ${(inst && this.canPlayAmbush(inst, pi)) ? `<button class="btn btn-purple" ${locked ? 'disabled' : ''} onclick="game.doPlay(true)">埋伏出牌</button>` : ''}
            <button class="btn btn-red" ${(locked || p.passed) ? 'disabled' : ''} onclick="game.doPass()">放棄跟牌</button>
            ${hasQuanheng ? `<button class="btn btn-purple" onclick="game.openQuanheng()">權衡</button>` : ''}
            ${hasLianying ? `<button class="btn btn-purple" onclick="game.openLianying()">連營</button>` : ''}
            ${hasJiushi ? `<button class="btn btn-gold" onclick="game.activateJiushi()">酒詩（返回手牌）</button>` : ''}
        </div>${fieldPicker}${skillBox}</div>`;

            <div class="hand-row">${(this.cover || hidePep) ? `<span style="color:#666;font-size:13px;padding:20px;">${hidePep?'🤖 對手的手牌已隱藏':'手牌已隱藏'}</span>` :
                (pp.hand.map(c => {

    const cards = p.hand.map(c => {

openDeckViewer() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

    const me = this.netMode ? this.localPlayerIdx : this.current;

    // ---- Build the theoretical card pool from config ----
    const sets = this.cfg.cardSets || {
        vanilla:  { shu:true, wei:true, wu:true, qun:true },
        extended: { shu:true, wei:true, wu:true, qun:true }
    };
    const pool = [];
    CARD_DB.forEach(def => {
        const setCfg = sets[def.set];
        if (!setCfg || !setCfg[def.faction]) return;
        const n = def.count || 1;
        for (let i = 0; i < n; i++) pool.push(def);
    });
    pool.sort((a, b) => (a.cardId || '').localeCompare(b.cardId || '') || a.name.localeCompare(b.name));

    // ---- Snapshot current zones ----
    const myHandInsts   = [...this.players[me].hand];
    const archiveInsts  = [...this.archive];
    const fieldInsts    = [];
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => fieldInsts.push(c));

    // ---- Greedy match pool slots to known instances ----
    const rendered = pool.map(def => {
        let idx = myHandInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { myHandInsts.splice(idx, 1); return { def, status: 'myhand' }; }
        idx = archiveInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { archiveInsts.splice(idx, 1); return { def, status: 'archive' }; }
        idx = fieldInsts.findIndex(c => c.data.id === def.id);
        if (idx >= 0) { fieldInsts.splice(idx, 1); return { def, status: 'field' }; }
        return { def, status: 'unknown' };
    });

    // ---- Render ----
    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    rendered.forEach(item => { if (byFac[item.def.faction]) byFac[item.def.faction].push(item); });

    const legend = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;text-align:center;line-height:1.9;">
        🌕 <span style="color:#ffd700;">黃框</span>＝我方手牌　｜　⬛ <span style="color:#888;">灰暗</span>＝已打出或已棄置　｜　🔲 一般＝未知（牌庫或對手手牌）
        <br>共 <b style="color:#ffd700;">${pool.length}</b> 張
    </div>`;

    let content = '';
    FACTION_ORDER.forEach(f => {
        const list = byFac[f];
        if (!list || !list.length) return;
        content += `<div class="viewer-section"><h3>${FACTION_INFO[f].name}（${list.length} 張）</h3><div class="viewer-grid">`;
        content += list.map(item => {
            const wrapCls = item.status === 'myhand'
                ? 'viewer-card-wrap in-hand'
                : (item.status === 'archive' || item.status === 'field')
                    ? 'viewer-card-wrap in-played'
                    : 'viewer-card-wrap';
            return `<div class="${wrapCls}" onclick="inspectDefFromViewer('${item.def.id}')">
                ${cardHTMLStatic(item.def)}
            </div>`;
        }).join('');
        content += `</div></div>`;
    });

    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal viewer-modal" onclick="event.stopPropagation()">
        <h2>牌庫檢視</h2>
        ${legend}
        <div style="max-height:68vh;overflow-y:auto;padding:0 4px;">${content}</div>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div>
    </div></div>`;
}
renderArchive() {
    const groups = {};
    FACTION_ORDER.forEach(f => groups[f] = []);
    this.archive.forEach(c => { if (groups[c.data.faction]) groups[c.data.faction].push(c); });
    FACTION_ORDER.forEach(f => groups[f].sort((a,b) => (a.data.cost-b.data.cost) || (a.data.power-b.data.power)));

calcInspectPower(c) {
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            if (this.players[pi].fields[bi].includes(c))
                return this.getPower(c, pi, bi, false);
    return Math.max(0, c.data.power + (c.mod || 0));
}

            <p>指定對陣一張牌【燃燒】至陣地結算。陸遜將失去【連營】（<b>保留【謙遜】</b>），每場限用一次。</p>

            <h2>曹操 · 奸雄</h2>

        h += `<div class="overlay"><div class="modal">
            <h2>關羽 · 斬將</h2>
            <p>指定對陣一張正面非上將敵牌移除。</p>
            <div class="modal-cards">${targets.length === 0 ? '<span style="color:#666;">沒有可指定的目標</span>' :
                targets.map(c => {
                    const on = sel === c.uid;
                    return this.cardHTML(c, { extra: (on ? 'sel' : '') + ' clickable', noHighlight: true, attr: `onclick="game.guanyuSelect('${c.uid}')"` });
                }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-green" ${sel === null ? 'disabled' : ''} onclick="game.guanyuConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.guanyuSkip()">略過</button></div>
        </div></div>`;
    }
    if (this.xunyu && !this.isAI(this.xunyu.pi)) {
        const x = this.xunyu;
        const opp = this.players[x.targetPi !== undefined ? x.targetPi : this.opponentOf(x.pi)];
        const targets = opp.fields[x.bi].filter(c => x.candidates.includes(c.uid));
        const dests = [];
        for (let i = 0; i < this.fieldCount; i++) if (i !== x.bi) dests.push(i);

            <h2>荀彧 · 驅虎</h2>

                const on = x.sel === c.uid;

            <div style="text-align:center;font-size:13px;color:#c8a040;margin:8px 0;">移動目的地</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                ${dests.map(i => `<button class="btn ${x.dest === i ? 'btn-green' : ''}" onclick="game.xunyuSelectDest(${i})">${BATTLEFIELDS[i]}${i < x.bi ? '（已結算）' : ''}</button>`).join('')}

            <div style="text-align:center;display:flex;gap:10px;justify-content:center;margin-top:14px;">

                <button class="btn btn-red" onclick="game.xunyuSkip()">略過</button>
            </div>
        </div></div>`;
    }
	    /* ★ v3.7: 孫尚香 · 聯姻 */
    if (this.liangyuan && !this.isAI(this.liangyuan.pi)) {
        const ly = this.liangyuan;
        const p = this.players[ly.pi];
        const targets = p.fields[ly.bi].filter(c => ly.candidates.includes(c.uid));
        h += `<div class="overlay"><div class="modal">
            <h2>孫尚香 · 聯姻</h2>
            <p>選擇同陣地一張正面男性友軍，締結【連理】。你將失去【聯姻】。</p>
            <div class="modal-cards">${targets.map(c => {
                const on = ly.sel === c.uid;
                return this.cardHTML(c, { extra: (on ? 'sel' : '') + ' clickable', noHighlight: true,
                    attr: `onclick="game.liangyuanSelect('${c.uid}')"` });
            }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-green" ${ly.sel === null ? 'disabled' : ''} onclick="game.liangyuanConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.liangyuanSkip()">略過</button>
            </div>
        </div></div>`;
    }
    /* ★ v3.7: 陸抗 · 繼承 */
    if (this.lukang && !this.isAI(this.lukang.pi)) {
        const lk = this.lukang;
        const p = this.players[lk.pi];
        const targets = p.fields[lk.bi].filter(c => lk.candidates.includes(c.uid));
        h += `<div class="overlay"><div class="modal">
            <h2>陸抗 · 繼承</h2>
            <p>選擇同陣地一張正面友軍，繼承其目前享受的所有額外戰力加成。</p>
            <div class="modal-cards">${targets.map(c => {
                const on = lk.sel === c.uid;
                const bonus = c._expectedBonus || 0;
                const badge = `<div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#ffd700;color:#4a2000;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:10px;border:2px solid #fff8d0;box-shadow:0 0 8px rgba(255,215,0,.7);z-index:5;">+${bonus}</div>`;
                return `<div style="position:relative;">${badge}${this.cardHTML(c, { extra: (on ? 'sel' : '') + ' clickable', noHighlight: true,
                    attr: `onclick="game.lukangSelect('${c.uid}')"` })}</div>`;
            }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-green" ${lk.sel === null ? 'disabled' : ''} onclick="game.lukangConfirm()">確認</button>
                <button class="btn btn-red" onclick="game.lukangSkip()">略過</button>
            </div>
        </div></div>`;
    }
    /* ★ v3.7: 孫皓 · 苛政 */
    if (this.sunhao && !this.isAI(this.sunhao.pi)) {
        h += `<div class="overlay"><div class="modal" style="max-width:480px;">
            <h2>孫皓 · 苛政</h2>
            <p>指定 1～3。至本陣地結算前，雙方於此陣地正面出牌時糧草必須等於指定數字。</p>

                <button class="btn btn-big btn-gold" onclick="game.sunhaoPick(2)">2</button>
                <button class="btn btn-big btn-gold" onclick="game.sunhaoPick(3)">3</button>
            </div>
        </div></div>`;
    }
	    // ★ v3.6: 貂蟬 · 離間
    if (this.diaochan && !this.isAI(this.diaochan.pi)) {
        const dc = this.diaochan;
        const opp = this.players[this.opponentOf(dc.pi)];
        const weakest = dc.weakestUid ? opp.fields[dc.bi].find(c => c.uid === dc.weakestUid) : null;
        const highest = opp.fields[dc.bi].find(c => c.uid === dc.highestUid);
        if (highest) {
            h += `<div class="overlay"><div class="modal" style="max-width:680px;">

                        ${this.cardHTML(weakest, { forceReveal: true, noHighlight: true })}

                        </div>
                    </div>` : ''}
                    <div style="flex:1;min-width:180px;padding:12px;border:1px solid rgba(120,255,120,.5);border-radius:8px;text-align:center;background:rgba(20,80,20,.18);">
                        <div style="font-size:12px;color:#7cff7c;margin-bottom:8px;font-weight:bold;">選項 B：吸收戰力</div>
                        ${this.cardHTML(highest, { forceReveal: true, noHighlight: true })}
                        <div style="font-size:12px;color:#d8c8a0;margin-top:8px;line-height:1.6;">
                            吸收 <b>${highest.data.name}</b> 一半戰力<br>
                            <b style="color:#7cff7c;">自己 +${dc.gainB} 戰力</b>
                        </div>
                    </div>
                </div>
                <div style="text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                    ${weakest ? `<button class="btn btn-red btn-big" onclick="game.diaochanChoose(true)">選 A：同歸於盡</button>` : ''}
                    <button class="btn btn-green btn-big" onclick="game.diaochanChoose(false)">選 B：吸收 +${dc.gainB} 戰力</button>
                </div>
            </div></div>`;
        }
    }
    if (this._paymentState) {
        const s = this._paymentState;
        // 預覽
        let remaining = s.food;
        const ordered = [
            ...s.order.map(uid => s.cards.find(c => c.uid === uid)).filter(Boolean),
            ...s.cards.filter(c => !s.order.includes(c.uid))
        ];
        const previewText = ordered.map(c => {
            if (remaining >= c.data.cost) {
                remaining -= c.data.cost;
                return `<span style="color:#7cff7c;">${c.data.name}(${c.data.cost}🌾)✅</span>`;
            } else {
                return `<span style="color:#ff6b6b;">${c.data.name}(${c.data.cost}🌾)❌弃</span>`;
            }
        }).join(' → ');
        const totalCost = s.cards.reduce((a, c) => a + c.data.cost, 0);
        h += `<div class="overlay"><div class="modal" style="max-width:720px;">
            <h2>💰 結算支付順序</h2>
            <p>你場上有 <b>${s.cards.length}</b> 張背面牌，總計 <b>${totalCost}</b> 粮，但只有 <b style="color:#ffd700;">${s.food}</b> 粮。</p>
            <p>按順序點擊，<b>先選的先支付</b>。剩餘粮草不足的牌會被弃置。</p>
            <div class="modal-cards">${s.cards.map(c => {
                const idx = s.order.indexOf(c.uid);
                const label = idx >= 0 ? `<span style="position:absolute;top:2px;left:2px;background:#ffd700;color:#000;font-size:12px;font-weight:bold;padding:1px 6px;border-radius:50%;z-index:10;">${idx + 1}</span>` : '';
                return `<div style="position:relative;">${label}${this.cardHTML(c, {
                    forceReveal: true,
                    extra: (idx >= 0 ? 'sel' : '') + ' clickable',
                    attr: `onclick="game.paymentSelect('${c.uid}')"`
                })}</div>`;
            }).join('')}</div>
            <div style="background:rgba(0,0,0,.3);border-radius:8px;padding:12px;font-size:13px;line-height:1.9;margin-bottom:14px;">
                <b style="color:#ffd700;">📋 支付預覽：</b><br>${previewText}
            </div>
            <div style="text-align:center;">
                <button class="btn btn-green btn-big" onclick="game.paymentConfirm()">✅ 確認支付順序</button>
            </div>
        </div></div>`;
    }	
    return h;
}
}

function cancelAutoRestart() {
    const g = window.game;
    if (!g) return;
    if (g._autoRestartTick) { clearTimeout(g._autoRestartTick); g._autoRestartTick = null; }
    if (g._autoRestartFire) { clearTimeout(g._autoRestartFire); g._autoRestartFire = null; }
    g._autoRestartQueued = true;
    g._autoRestartCancelled = true;
    g.render();
}

function importLogFromFile() {
    let input = document.getElementById('import-log-file');
    if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'import-log-file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        input.onchange = e => handleImportLog(e);
        document.body.appendChild(input);
    }
    input.click();
}
function handleImportLog(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            const logs = Array.isArray(data) ? data : [data];
            const valid = logs.filter(l => l && (l.events || l.config || l.deckTopToBottom));
            if (valid.length === 0) { alert('檔案中沒有有效的對戰記錄'); return; }
            const existing = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
            valid.forEach(l => existing.push(l));
            localStorage.setItem('sanguo_logs', JSON.stringify(existing));
            alert(`✅ 已匯入 ${valid.length} 份記錄（目前共 ${existing.length} 份）`);
            const el = document.getElementById('local-log-count');
            if (el) el.textContent = `（目前快取 ${existing.length} 份）`;
            const viewer = document.getElementById('modal-slot');
            if (viewer && viewer.querySelector('.log-viewer')) openLogViewer();
        } catch(err) {
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    ev.target.value = '';
}

function openViewer() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

    // ---- 建立牌池（僅依卡片庫自己的 set 開關，不看設定頁） ----
    const pool = [];
    CARD_DB.forEach(d => {
        if (d.set === 'vanilla'  && !window.__viewerVanilla)  return;
        if (d.set === 'extended' && !window.__viewerExtended) return;
        const n = d.count || 1;
        for (let i = 0; i < n; i++) pool.push({ def: d, idx: i, total: n });
    });

    // ---- 讀取統計 ----
    const stats = loadCardStats();
    const statsMode = window.__statsMode || 'all';
    const _getBucketEntry = (bucket, id) => {
        const mb = stats[bucket] && stats[bucket][statsMode];
        return mb ? mb[id] : null;
    };
    const getRate = (id, bucket) => {
        const s = _getBucketEntry(bucket, id);
        if (!s || !s.plays) return null;
        return s.wins / s.plays;
    };
    const getPlays = (id, bucket) => {
        const s = _getBucketEntry(bucket, id);
        return s ? s.plays : 0;
    };

    // ---- 排序 ----
    if (viewerMode === 'id') {
        pool.sort((a, b) => {
            const ai = a.def.cardId || '';
            const bi = b.def.cardId || '';
            if (ai !== bi) return ai.localeCompare(bi);
            return a.idx - b.idx;
        });
    } else if (viewerMode === 'sort') {
        pool.sort((a, b) => {
            const ac = a.def.cost - b.def.cost;
            if (ac !== 0) return ac;
            const ap = a.def.power - b.def.power;
            if (ap !== 0) return ap;
            return a.idx - b.idx;
        });
    } else if (viewerMode === 'aiRate' || viewerMode === 'playerRate') {
        const bucket = (viewerMode === 'aiRate') ? 'ai' : 'player';
        pool.sort((a, b) => {
            const ra = getRate(a.def.id, bucket);
            const rb = getRate(b.def.id, bucket);
            if (ra === null && rb === null) return (a.def.cardId||'').localeCompare(b.def.cardId||'');
            if (ra === null) return 1;
            if (rb === null) return -1;
            if (rb !== ra) return rb - ra;
            return getPlays(b.def.id, bucket) - getPlays(a.def.id, bucket);
        });
    }

    // ---- 分陣營 ----
    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    pool.forEach(item => { if (byFac[item.def.faction]) byFac[item.def.faction].push(item); });

    // ---- 內容 ----
    const showStats = (viewerMode === 'aiRate' || viewerMode === 'playerRate');
    const statBucket = (viewerMode === 'aiRate') ? 'ai' : 'player';
    let content = '';
    FACTION_ORDER.forEach(f => {
        if (!byFac[f] || !byFac[f].length) return;
        const collapsed = !!window.__viewerCollapsed[f];
        content += `<div class="viewer-section ${collapsed ? 'collapsed' : ''}" data-fac="${f}"><h3 onclick="toggleFactionCollapse('${f}')"><span class="vs-chevron">▼</span>${FACTION_INFO[f].name}<span class="vs-count">（${byFac[f].length} 張）</span></h3><div class="viewer-grid">`;        content += byFac[f].map(item => {
            const d = item.def;
            const badge = item.total > 1 ? `<div class="viewer-badge">${item.idx + 1}/${item.total}</div>` : '';
            let statBadge = '';
            if (showStats) {
                const s = _getBucketEntry(statBucket, d.id);
                if (s && s.plays > 0) {
                    const pct = Math.round((s.wins / s.plays) * 100);
                    const col = getWinRateColor(pct);
                    const tip = `「打出此牌的玩家」最終贏得整場遊戲的比例\n（出場 ${s.plays} 場，勝 ${s.wins} 場）`;
statBadge = `<div title="${tip}" style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.85);color:${col};font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid ${col};font-weight:bold;z-index:2;cursor:help;">${pct}% (${s.plays})</div>`;
                } else {
                    statBadge = `<div style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.5);color:#777;font-size:11px;padding:2px 6px;border-radius:4px;z-index:2;">—</div>`;
                }
            }
            return `<div class="viewer-card-wrap" style="position:relative;" onclick="inspectDefFromViewer('${d.id}')">${cardHTMLStatic(d)}${badge}${statBadge}</div>`;
