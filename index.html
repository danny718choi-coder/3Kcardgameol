<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國風雲 — 卡牌對戰 v3.0</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#140900;background-image:radial-gradient(ellipse at 50% 0%,rgba(120,60,0,.28) 0%,transparent 70%),radial-gradient(ellipse at 50% 100%,rgba(120,60,0,.28) 0%,transparent 70%);color:#f0e6d0;font-family:'Microsoft YaHei','PingFang TC','SimHei',sans-serif;min-height:100vh;padding:10px;user-select:none}
#app{max-width:1320px;margin:0 auto}
h1,h2,h3{color:#ffd700}
.btn{padding:9px 20px;font-size:15px;font-weight:bold;border:none;border-radius:6px;cursor:pointer;font-family:inherit;transition:.18s;background:linear-gradient(180deg,#8a6020,#5a3d10);color:#ffe9a0;border:1px solid #c8a040}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-green{background:linear-gradient(180deg,#4a8c2a,#2d5a1e);border-color:#6aac4a;color:#fff}
.btn-red{background:linear-gradient(180deg,#8b2500,#5a1800);border-color:#cc4400;color:#ffd9c0}
.btn-purple{background:linear-gradient(180deg,#6a0dad,#3d0066);border-color:#8a2dcd;color:#e8d0ff}
.btn-blue{background:linear-gradient(180deg,#1a4a8a,#0d2a52);border-color:#3a7ac8;color:#cfe6ff}
.btn-gold{background:linear-gradient(180deg,#c8a040,#8a6020);border-color:#ffd700;color:#fff}
.btn-big{font-size:19px;padding:13px 40px}
.card{width:96px;height:134px;border-radius:7px;flex-shrink:0;position:relative;transition:transform .18s,box-shadow .18s,filter .18s;cursor:default}
.card.sm{width:70px;height:98px;border-radius:5px}
.card.xs{width:52px;height:74px;border-radius:4px}
.card-back{width:100%;height:100%;border-radius:inherit;background:linear-gradient(135deg,#3a2a1a,#241408);border:2px solid #6a5a3a;display:flex;align-items:center;justify-content:center}
.card-back-pattern{width:72%;height:80%;border:1px solid #6a5a3a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8a7a5a;letter-spacing:2px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(106,90,58,.25) 5px,rgba(106,90,58,.25) 10px)}
.card.sm .card-back-pattern{font-size:12px}
.card.xs .card-back-pattern{font-size:9px}
.card-front{width:100%;height:100%;border-radius:inherit;position:relative;overflow:hidden;padding:2px}
.card-front.shu{background:linear-gradient(140deg,#8b2500,#4a1200);border:2px solid #cc4400}
.card-front.wei{background:linear-gradient(140deg,#1a3a6a,#0b1a33);border:2px solid #2a5aaa}
.card-front.wu{background:linear-gradient(140deg,#2d5a1e,#16300c);border:2px solid #4a8c2a}
.card-front.qun{background:linear-gradient(140deg,#4a3a2a,#241a10);border:2px solid #8a7a5a}
.c-cost{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.55);color:#ffd700;font-size:15px;font-weight:bold;padding:1px 6px;border-radius:4px;border:1px solid rgba(255,215,0,.4)}
.c-name{position:absolute;top:27px;left:3px;writing-mode:vertical-rl;text-orientation:upright;font-size:15px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;letter-spacing:1px;line-height:1}
.c-title{position:absolute;top:27px;left:23px;writing-mode:vertical-rl;text-orientation:upright;font-size:10px;color:#c9c0a8;letter-spacing:1px;line-height:1}
.c-skills{position:absolute;top:22px;right:4px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000,1px 1px 2px #000;letter-spacing:0.5px;line-height:1.15;max-width:72px;pointer-events:none}
.c-power{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.55);color:#ffffff;font-size:15px;font-weight:bold;padding:1px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.35)}
.c-art{position:absolute;right:4px;bottom:5px;font-size:32px;filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
.c-fac{position:absolute;top:2px;right:2px;font-size:11px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.5);color:#ddd}
.c-gen{position:absolute;left:2px;bottom:24px;background:linear-gradient(180deg,#b81818,#6a0808);color:#ffe066;font-size:10px;font-weight:bold;padding:1px 5px;border-radius:3px;border:1px solid #ff8080;box-shadow:0 0 6px rgba(255,80,80,.7);letter-spacing:1px}
.c-tag{position:absolute;left:2px;bottom:42px;font-size:10px;padding:0 4px;border-radius:3px;background:rgba(128,0,255,.75);color:#fff}.card.sm .c-name{font-size:11px;top:19px;left:2px}
.card.sm .c-name{font-size:12px;top:22px;left:2px}
.card.sm .c-title{font-size:8px;top:22px;left:18px}
.card.sm .c-cost,.card.sm .c-power{font-size:11px;padding:0 4px}
.card.sm .c-art{font-size:24px}
.card.sm .c-fac{font-size:9px}
.card.sm .c-tag{display:none}
.card.sm .c-skills{font-size:10px;top:18px;max-width:50px;gap:1px}
.card.sm .c-gen{font-size:8px;padding:0 3px;bottom:20px}
.card.xs .c-name{font-size:10px;top:17px;left:1px}
.card.xs .c-title{display:none}
.card.xs .c-cost,.card.xs .c-power{font-size:9px;padding:0 3px}
.card.xs .c-art{font-size:18px;right:2px;bottom:3px}
.card.xs .c-fac{font-size:8px;padding:0 3px}
.card.xs .c-tag{display:none}
.card.xs .c-skills{display:none}
.card.xs .c-gen{display:none}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-6px);box-shadow:0 8px 22px rgba(255,215,0,.35)}
.card.sel{transform:translateY(-6px);animation:selPulse 1.25s ease-in-out infinite}
@keyframes selPulse{0%,100%{box-shadow:0 0 0 2px #ffd700,0 0 16px 4px rgba(255,215,0,.45)}50%{box-shadow:0 0 0 2px #ffd700,0 0 26px 10px rgba(255,215,0,.75)}}
.card.dim{opacity:.35;filter:grayscale(.6)}
.card.grey{opacity:.42;filter:grayscale(.85)}
.card.just-drawn{animation:justDrawnPulse 1.05s ease-in-out infinite}
@keyframes justDrawnPulse{0%,100%{box-shadow:0 0 0 3px #44ff88,0 0 24px 10px rgba(68,255,136,.7);transform:translateY(-6px)}50%{box-shadow:0 0 0 3px #44ff88,0 0 38px 18px rgba(68,255,136,1);transform:translateY(-11px)}}
.card.enter{animation:cardEnter .35s ease-out}
@keyframes cardEnter{from{opacity:0;transform:translateY(-22px) scale(.85)}to{opacity:1;transform:none}}
.back-menu-btn{position:fixed;top:12px;right:12px;z-index:960;padding:8px 16px;border-radius:6px;font-weight:bold;font-family:inherit;font-size:13px;cursor:pointer;transition:.25s;letter-spacing:1px;border:1px solid #888;background:linear-gradient(180deg,#444,#222);color:#ccc}
.back-menu-btn.red{background:linear-gradient(180deg,#c83030,#8a1010);border-color:#ff5050;color:#fff;animation:backPulse 1s infinite}
@keyframes backPulse{0%,100%{box-shadow:0 0 12px rgba(255,80,80,.5)}50%{box-shadow:0 0 22px rgba(255,80,80,.9)}}
/* ============ 遊戲選單按鈕 ============ */
.game-menu-btn{position:fixed;top:12px;right:12px;z-index:965;padding:8px 16px;border-radius:6px;font-weight:bold;font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;letter-spacing:1px;border:1px solid #c8a040;background:linear-gradient(180deg,#8a6020,#5a3d10);color:#ffe9a0}
.game-menu-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* ============ AI 速度控制 ============ */
.ai-speed-panel{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:970;padding:8px 14px;border-radius:24px;background:rgba(20,10,0,.92);border:1px solid #c8a040;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 0 24px rgba(255,215,0,.3)}
.ai-speed-panel .lbl{font-size:12px;color:#c8a040;letter-spacing:1px;margin-right:4px}
.ai-speed-panel .sp-btn{padding:5px 12px;font-size:12px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s}
.ai-speed-panel .sp-btn.on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700}
.ai-speed-panel .sp-btn:hover:not(.on){filter:brightness(1.2)}

/* ============ 戰場展開 ============ */
.bf-wrap.expandable{cursor:pointer}
.bf-wrap.expandable:hover{outline:1px dashed rgba(255,215,0,.45);outline-offset:2px}
.bf-wrap.manually-expanded{border:1px solid rgba(255,215,0,.75);box-shadow:0 0 22px rgba(255,215,0,.35);animation:manualExpPulse 2s ease-in-out infinite}
@keyframes manualExpPulse{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.3)}50%{box-shadow:0 0 28px rgba(255,215,0,.55)}}
.bf-wrap .bf-expand-icon{font-size:11px;color:#c8a040;margin-left:4px;opacity:.7}

/* ============ UI 縮放按鈕 ============ */
.ui-scale-btn{padding:6px 14px;font-size:13px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s;min-width:52px}
.ui-scale-btn.on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700}
.ui-scale-btn:hover:not(.on){filter:brightness(1.2)}

@media (max-width:640px){
    .game-menu-btn{padding:6px 12px;font-size:12px;top:8px;right:8px}
    .ai-speed-panel{bottom:8px;padding:6px 10px;max-width:calc(100vw - 16px)}
    .ai-speed-panel .sp-btn{padding:4px 8px;font-size:11px}
    .ai-speed-panel .lbl{font-size:11px}
    .ui-scale-btn{padding:5px 10px;font-size:12px;min-width:44px}
}
.ai-badge{display:inline-block;padding:4px 14px;border-radius:16px;background:linear-gradient(90deg,#6a0dad,#3d0066);color:#e8d0ff;font-weight:bold;font-size:13px;letter-spacing:2px;border:1px solid #8a2dcd;animation:aiPulse 1.2s ease-in-out infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 0 10px rgba(138,45,205,.5)}50%{box-shadow:0 0 22px rgba(138,45,205,.9)}}
.ai-mode-tag{display:inline-block;padding:2px 10px;border-radius:14px;font-size:11px;background:rgba(138,45,205,.2);color:#c8a0ff;border:1px solid rgba(138,45,205,.5);margin-left:8px}
.ai-diff-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;background:rgba(255,215,0,.15);color:#ffd700;border:1px solid rgba(255,215,0,.4);margin-left:6px}
.ai-diff-tag.hard{background:rgba(255,80,80,.18);color:#ff9c9c;border-color:rgba(255,120,120,.55)}
.ai-auto-hint{display:inline-block;margin-top:10px;padding:5px 16px;border-radius:16px;background:rgba(138,45,205,.25);color:#c8a0ff;font-size:13px;letter-spacing:2px;border:1px dashed rgba(138,45,205,.7)}
.countdown-overlay{position:fixed;inset:0;background:transparent;z-index:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;animation:cntFadeIn .3s ease-out}
@keyframes cntFadeIn{from{opacity:0}to{opacity:1}}
.countdown-num{font-size:130px;font-weight:bold;color:#ffd700;text-shadow:0 0 40px rgba(0,0,0,.95),0 0 40px rgba(255,215,0,.95),0 0 80px rgba(255,150,0,.55);line-height:1;animation:cntPulse .9s ease-in-out infinite}
@keyframes cntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.countdown-label{font-size:20px;color:#ffe066;letter-spacing:6px;font-weight:bold;text-shadow:0 0 6px #000,0 0 14px rgba(255,215,0,.8);background:rgba(0,0,0,.75);padding:6px 22px;border-radius:22px;border:1px solid rgba(255,215,0,.5)}
.countdown-hint{font-size:14px;letter-spacing:2px;background:rgba(0,0,0,.75);padding:4px 14px;border-radius:14px;border:1px solid rgba(68,255,136,.6);color:#7cff7c}
.handoff-overlay{position:fixed;inset:0;background:#000;z-index:870;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:handoffFadeIn .3s ease-out}
@keyframes handoffFadeIn{from{opacity:0}to{opacity:1}}
.handoff-overlay .who{font-size:30px;color:#ffd700;letter-spacing:6px}
.handoff-overlay .note{font-size:14px;color:#a89070}
.setup{max-width:820px;margin:24px auto;background:rgba(0,0,0,.4);border:1px solid #6a4a20;border-radius:14px;padding:26px}
.setup h1{text-align:center;letter-spacing:10px;font-size:34px;margin-bottom:6px;text-shadow:0 0 18px rgba(255,215,0,.5)}
.setup .sub{text-align:center;color:#b09a6a;font-size:13px;margin-bottom:22px}
.sec{margin-bottom:20px;padding:14px;background:rgba(255,255,255,.03);border:1px solid rgba(200,160,64,.2);border-radius:10px}
.sec h3{font-size:15px;margin-bottom:12px;color:#e8c060;letter-spacing:2px}
.chk-row{display:flex;flex-wrap:wrap;gap:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:15px;background:rgba(0,0,0,.3);padding:7px 14px;border-radius:8px;border:1px solid rgba(200,160,64,.25);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:#c8a040;cursor:pointer}
.chk-sm{padding:4px 10px;font-size:13px;gap:4px;}
.mode-btn{background:linear-gradient(180deg,#3a2a1a,#1a0f05);border:1px solid #6a4a20;color:#d8c090;padding:9px 18px;font-size:14px;}
.mode-btn.mode-btn-on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.5);}
.chk-sm input{width:14px;height:14px;}
.set-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.set-row:last-child{margin-bottom:0;}
.set-row-label{font-size:14px;color:#e8c060;letter-spacing:2px;min-width:60px;font-weight:bold;}.num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.num-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);padding:9px 14px;border-radius:8px;border:1px solid rgba(200,160,64,.2);font-size:14px}
.num-item input,.num-item select{width:100px;padding:5px 8px;border-radius:6px;text-align:center;background:#1a1008;color:#ffd700;border:1px solid #6a4a20;font-family:inherit;font-size:15px;font-weight:bold}
.num-item select{cursor:pointer}
.header{text-align:center;padding:8px;margin-bottom:10px;background:linear-gradient(180deg,rgba(80,40,0,.8),rgba(40,20,0,.55));border-bottom:2px solid #c8a040;border-radius:9px}
.header h1{font-size:23px;letter-spacing:9px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.header .info{font-size:13px;color:#e0c080;margin-top:3px}
.battle-layout{display:flex;gap:10px;align-items:flex-start}
.battle-main{flex:1;min-width:0}
.battle-side{width:240px;flex-shrink:0}
.hand-bar{display:flex;gap:12px;padding:8px 12px;margin-bottom:8px;background:linear-gradient(180deg,rgba(50,30,10,.55),rgba(20,10,0,.35));border:1px solid rgba(200,160,64,.25);border-radius:9px}
.hb-side{flex:1;display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.hb-lbl{font-size:15px;font-weight:bold;letter-spacing:2px;flex-shrink:0}
.hb-cards{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-height:22px;align-items:center}
.hb-food{font-size:15px;font-weight:bold;color:#ffd700;flex-shrink:0}
.hb-spent{font-size:12px;color:#a89070;flex-shrink:0}
.mini-back{width:13px;height:19px;border-radius:2px;background:linear-gradient(135deg,#3a2a1a,#241408);border:1px solid #6a5a3a;flex-shrink:0}
.hb-empty{font-size:11px;color:#555}
.hand-bar.multi{flex-wrap:wrap;gap:6px;padding:6px 8px;}
.hand-bar.multi .hb-side{flex:1 1 200px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.15);}
.hand-bar.multi .hb-side.hb-turn{background:rgba(255,215,0,.10);box-shadow:0 0 8px rgba(255,215,0,.35);}
.hand-bar.multi .hb-side.hb-me{outline:1px dashed rgba(255,215,0,.55);}
.hb-wins{font-size:12px;font-weight:bold;}
.player-row{display:flex;gap:8px;padding:6px 10px;margin-bottom:8px;background:rgba(0,0,0,.28);border-radius:9px;border:1px solid rgba(200,160,64,.22);flex-wrap:wrap;}
.pr-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:16px;border:2px solid;background:rgba(0,0,0,.3);font-size:13px;font-weight:bold;flex:1 1 auto;justify-content:center;transition:.15s;position:relative;min-width:110px;}
.pr-chip.pr-cur{background:rgba(255,215,0,.15);box-shadow:0 0 12px rgba(255,215,0,.4);animation:prPulse 1.2s infinite;}
@keyframes prPulse{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.3)}50%{box-shadow:0 0 20px rgba(255,215,0,.75)}}
.pr-name{letter-spacing:1px;}
.pr-wins{font-size:12px;opacity:.9;}
.pr-pass{font-size:10px;color:#ff6b6b;background:rgba(120,20,20,.55);padding:1px 6px;border-radius:8px;}
.bf-player-lbl{font-size:11px;font-weight:bold;letter-spacing:1px;writing-mode:vertical-rl;text-orientation:upright;padding:2px;opacity:.85;min-width:16px;text-align:center;}
.bf-flex{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.bf-wrap{transition:flex .25s ease,opacity .25s;border-radius:9px;overflow:hidden}
.bf-wrap.active{flex:4;box-shadow:0 0 18px rgba(255,215,0,.15)}
.bf-wrap.inactive{flex:1;opacity:.82}
.bf-wrap.future{flex:1;opacity:.45}
.bfield{background:rgba(0,0,0,.35);border:1px solid rgba(200,160,64,.25);border-radius:9px;padding:6px;height:100%;display:flex;flex-direction:column}
.bf-wrap.active .bfield{border-color:rgba(255,215,0,.55)}
.bf-head{display:flex;justify-content:space-between;font-size:12px;color:#c8a040;letter-spacing:2px;margin-bottom:4px;padding:0 2px}
.bf-wrap.active .bf-head{font-size:14px}
.bf-head .res{font-size:11px;color:#888;letter-spacing:0}
.bf-head .open{font-size:11px;color:#44ff88;letter-spacing:0}
.bf-row{display:flex;align-items:flex-start;gap:4px;padding:3px;border-radius:6px;margin-bottom:3px;flex:1;min-height:130px;position:relative}
.bf-wrap.active .bf-row{min-height:160px}
.bf-row.red{background:rgba(120,20,20,.18)}
.bf-row.blue{background:rgba(20,60,120,.18)}
.bf-row.passed::after{content:'已放棄跟牌';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-size:22px;font-weight:bold;color:#ff6b6b;text-shadow:0 0 6px #000,0 0 14px #000,0 0 24px rgba(255,60,60,.9);letter-spacing:4px;background:rgba(0,0,0,.68);padding:6px 22px;border-radius:9px;border:2px solid rgba(255,107,107,.85);box-shadow:0 0 18px rgba(255,80,80,.6);pointer-events:none;z-index:6;animation:passStamp .35s ease-out}
@keyframes passStamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.bf-cards{display:flex;gap:3px;flex-wrap:wrap;flex:1;align-items:center}
.bf-total{font-size:15px;font-weight:bold;min-width:34px;text-align:center;padding:2px;border-radius:5px;background:rgba(0,0,0,.4)}
.bf-total.red{color:#ff7b7b}
.bf-total.blue{color:#6fb6ff}
.bf-total.win{background:rgba(255,215,0,.25);color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.5)}
.bf-ghost{color:#555;font-size:11px;padding:14px 4px;text-align:center;width:100%;letter-spacing:1px}
.control-area{margin:10px 0;padding:10px;border-radius:10px;text-align:center;background:linear-gradient(180deg,rgba(60,40,20,.6),rgba(30,20,10,.4));border:1px solid rgba(200,160,64,.3)}
.ctrl-info{font-size:14px;color:#e0c080;margin-bottom:9px;min-height:20px}
.ctrl-info b{color:#ffd700}
.ctrl-buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ============ GLOBAL ERROR DISPLAY (for debugging) ============ */
window.addEventListener('error', function(e) {
    try {
        let box = document.getElementById('__err_box__');
        if (!box) {
            box = document.createElement('div');
            box.id = '__err_box__';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#7a0a0a;color:#fff;padding:12px 16px;font-family:Consolas,monospace;font-size:13px;z-index:999999;max-height:45vh;overflow:auto;border-bottom:3px solid #ff3030;line-height:1.5;white-space:pre-wrap;';
            document.body.appendChild(box);
        }
        box.textContent += `[${new Date().toLocaleTimeString()}] ${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n  ${e.error && e.error.stack ? e.error.stack.split('\n').slice(0,4).join('\n  ') : ''}\n\n`;
    } catch (x) {}
});
window.addEventListener('unhandledrejection', function(e) {
    try {
        let box = document.getElementById('__err_box__');
        if (!box) {
            box = document.createElement('div');
            box.id = '__err_box__';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#7a5a0a;color:#fff;padding:12px 16px;font-family:Consolas,monospace;font-size:13px;z-index:999999;max-height:45vh;overflow:auto;border-bottom:3px solid #ffd700;line-height:1.5;white-space:pre-wrap;';
            document.body.appendChild(box);
        }
        box.textContent += `[Promise] ${e.reason && e.reason.message ? e.reason.message : e.reason}\n\n`;
    } catch (x) {}
});

/* ============ Safari-safe storage (Private Browsing throws on setItem) ============ */
const safeStore = {
    get(key, dflt = null) {
        try { const v = localStorage.getItem(key); return v === null ? dflt : v; }
        catch (e) { return dflt; }
    },
    set(key, val) {
        try { localStorage.setItem(key, val); return true; }
        catch (e) { console.warn('storage.set failed:', e); return false; }
    },
    getSession(key, dflt = null) {
        try { const v = sessionStorage.getItem(key); return v === null ? dflt : v; }
        catch (e) { return dflt; }
    },
    setSession(key, val) {
        try { sessionStorage.setItem(key, val); return true; }
        catch (e) { console.warn('sessionStorage.set failed:', e); return false; }
    },
    del(key) { try { localStorage.removeItem(key); } catch (e) {} },
    delSession(key) { try { sessionStorage.removeItem(key); } catch (e) {} }
};
/* ============ 全域 UI 縮放 ============ */
function getUIScale() {
    try { const s = parseFloat(localStorage.getItem('sanguo_uiscale') || '1'); return (s && s > 0.3 && s < 3) ? s : 1; }
    catch(e) { return 1; }
}
function setUIScaleGlobal(s) {
    try { localStorage.setItem('sanguo_uiscale', String(s)); } catch(e) {}
    try { document.documentElement.style.zoom = s; } catch(e) {}
}
/* 頁面載入時套用已存的縮放 */
(function() {
    const s = getUIScale();
    if (s !== 1) { try { document.documentElement.style.zoom = s; } catch(e) {} }
})();

/* ============ 種子 PRNG ============ */
function mulberry32(a) {
    return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function makeSeed() {
    // 用 Math.random() 生成新種子本身沒問題——種子的目的是「之後的隨機」可重現，
    // 挑種子那一步不需要可重現。
    return Math.floor(Math.random() * 0xFFFFFFFF).toString(36).toUpperCase().padStart(7, '0');
}
function toggleSetupPanel(id) {
    const panel = document.getElementById(id + '-panel');
    const arrow = document.getElementById(id + '-arrow');
    if (!panel) return;
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    if (arrow) arrow.textContent = open ? '▼ 展開' : '▲ 收合';
}

function toggleSetAll(setName) {
    const master = document.getElementById('set-' + setName);
    const facs = ['shu','wei','wu','qun'].map(f => document.getElementById('fac-' + setName + '-' + f));
    facs.forEach(c => { if (c) c.checked = master.checked; });
    updateSetMaster(setName);
}

function onFacCheckboxChange(setName) {
    updateSetMaster(setName);
}

function updateSetMaster(setName) {
    const master = document.getElementById('set-' + setName);
    if (!master) return;
    const facs = ['shu','wei','wu','qun'].map(f => document.getElementById('fac-' + setName + '-' + f));
    const allChecked = facs.every(c => c && c.checked);
    const anyChecked = facs.some(c => c && c.checked);
    master.checked = allChecked;
    master.indeterminate = anyChecked && !allChecked;
}

function readCardSetConfig() {
    const read = setName => ({
        shu: document.getElementById('fac-' + setName + '-shu').checked,
        wei: document.getElementById('fac-' + setName + '-wei').checked,
        wu:  document.getElementById('fac-' + setName + '-wu').checked,
        qun: document.getElementById('fac-' + setName + '-qun').checked
    });
    return { vanilla: read('vanilla'), extended: read('extended') };
}

function seedToNumber(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return (h >>> 0) || 1;
}
function copySeedStr(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(s).then(() => alert(`✅ 已複製種子：${s}`));
    }
}
function applySeedAndReturn(s) {
    closeModal();
    showSetup();
    const input = document.getElementById('cfg-seed');
    if (input) {
        input.value = s;
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        input.focus();
    }
}
function copyCurrentSeed() {
    const s = (window.game && window.game.seed) || '';
    if (!s) return;
    const done = () => alert(`✅ 已複製種子：${s}`);
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(s).then(done).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = s; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta); done();
        });
    } else {
        const ta = document.createElement('textarea');
        ta.value = s; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
    }
}

          ctx.enemyField.splice(ctx.enemyField.indexOf(best), 1);

  skills:['連環','巧計'],
  desc:'連環：進場後，自己獲得【準備】；若準備期間失去此技能，後續效果不觸發。下個己方回合開始時，對陣所有正面敵軍獲得【連環】。陣地結算時，若連環敵軍受到戰力傷害，其他連環敵軍受到最多為1的戰力傷害。\n巧計：陣地結算時，自己的最後戰力加所在陣地己方的有【疑兵】技能牌數。',
  onEnter(ctx){
      if (ctx.self.activated || ctx.self.preparing) return;
      ctx.self.preparing = true;
      ctx.log(`${ctx.self.data.name}【連環】：進入準備狀態`);
  },
  onSettle(ctx){
      if (!ctx.self.activated) return;
      const marked = ctx.enemyField.filter(c => c.lianhuan && !c.faceDown);
      if (marked.length < 2) return;
      const worst = marked.reduce((a,c)=>(a.mod||0)<(c.mod||0)?a:c, marked[0]);
      const worstMod = Math.min(0, worst.mod||0);
      if (worstMod >= 0) return;
      const dmg = Math.min(1, Math.abs(worstMod));
      let total = 0;
      marked.forEach(c => {
          if (c !== worst) total += ctx.game.applyDamage(c, dmg, ctx.opponent, ctx.field, null);
      });
      ctx.log(`${ctx.self.data.name}【連環】：${marked.length-1} 名連環敵軍受到連鎖傷害（合計 ${total}）`);
      for (let pi = 0; pi < ctx.game.numPlayers; pi++)
          for (let b = 0; b < ctx.game.fieldCount; b++)
              ctx.game.players[pi].fields[b].forEach(x => x.lianhuan = false);
  }
},

/* FAQ 按鈕 HTML 產生器 */
function faqButtonHTML(cardId) {
    const entry = FAQ_DB[cardId];
    if (!entry) {
        return `<button class="btn" disabled style="opacity:.5;cursor:not-allowed;" title="此卡尚未收錄 FAQ">❓ FAQ（尚未提供）</button>`;
    }
    if (entry.noFaq) {
        return `<button class="btn" disabled style="opacity:.75;cursor:not-allowed;" title="${entry.reason || ''}">✅ 無 FAQ（技能明瞭）</button>`;
    }
    return `<button class="btn btn-gold" onclick="openFaqModal('${cardId}')">❓ FAQ</button>`;
}

/* 開啟 FAQ Modal */
function openFaqModal(cardId) {
    const entry = FAQ_DB[cardId];
    if (!entry || entry.noFaq) return;
    const slot = document.getElementById('modal-slot');
    if (!slot) return;
    const cardName = CARD_NAME_MAP[cardId] || cardId;
    const qaHtml = entry.qa.map(item => `
        <div style="margin-bottom:14px;padding:12px 14px;background:rgba(0,0,0,.28);border-left:3px solid #c8a040;border-radius:8px;">
            <div style="font-size:14px;font-weight:bold;color:#ffd700;margin-bottom:6px;">Q: ${item.q}</div>
            <div style="font-size:13px;color:#d8c8a0;line-height:1.85;">A: ${item.a}</div>
        </div>
    `).join('');
    const existing = slot.querySelector('.faq-modal-overlay');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'overlay faq-modal-overlay';
    div.style.zIndex = '1100';
    div.innerHTML = `<div class="modal" onclick="event.stopPropagation()" style="max-width:640px;">
        <h2>${entry.title || (cardName + ' · FAQ')}</h2>
        <p style="font-size:12px;color:#a89070;">常見問題</p>
        <div style="max-height:60vh;overflow-y:auto;padding:4px;">${qaHtml}</div>
        <div style="text-align:center;margin-top:16px;">
            <button class="btn btn-red" onclick="closeFaqModal()">關閉</button>
        </div>
    </div>`;
    div.addEventListener('click', e => { if (e.target === div) closeFaqModal(); });
    slot.appendChild(div);
}
function closeFaqModal() {
    const el = document.querySelector('.faq-modal-overlay');
    if (el) el.remove();
}

class Game {
constructor(cfg) {
    this.cfg = cfg;

    // 種子：有輸入則使用，否則隨機生成
    const rawSeed = (cfg.seed && String(cfg.seed).trim()) ? String(cfg.seed).trim().toUpperCase() : makeSeed();
    this.seed = rawSeed;
    this.rng = mulberry32(seedToNumber(rawSeed));

    this.uid = 0;
    this.logs = [];
    this.archive = [];
    this.history = [];
    this.round = 1;
    this.state = 'flip';
    this.phase = '';
    this.cover = false;
    this.selected = null;
    this.scry = null;
    this.quanheng = null;
    this.jianxiong = null;
    this.lianying = null;
    this.guanyu = null;
    this.selectedField = null;
    this.lastResult = null;
    this.gameWinner = null;
    this.roundFirstPlayer = null;
    this.inspectCard = null;
    this.firstPasser = null;
    this.backBtnState = 'grey';   // 已廢棄，保留相容
    this.backBtnTimer = null;      // 已廢棄，保留相容
    this.expandedField = null;     // 玩家手動展開的戰場索引
    this.aiSpeed = 1;              // AI vs AI 速度倍率
    this.countdown = null;
    this.countdownTimer = null;
    this.aiTimer = null;
    this.flipAutoTimer = null;
    this.settleAutoTimer = null;
    this._handoffDoneThisTurn = false;
    this.cardsPlayedCount = 0;
    this._simaYiLastChanceUsed = false;
    this._rematchVotes = [false, false];   // Phase 3: [host, guest]
    this.sendToBottom = !!(cfg.sendToBottom); // true = flip cards & redraw discards go to bottom of draw pile

    /* ============ 網路對戰欄位 (Phase 1) ============ */
    this.netMode = !!(cfg.netMode);
    this.localPlayerIdx = cfg.localPlayerIdx ?? 0;
    this.role = cfg.role || null;
    this._broadcast = cfg._broadcast || null;
    this._sendAction = cfg._sendAction || null;

    /* ============ Mode setup ============ */
    const modeKey = GAME_MODE_DEFS[cfg.gameMode] ? cfg.gameMode : '1v1';
    const modeDef = GAME_MODE_DEFS[modeKey];
    this.gameMode = modeKey;
    this.numPlayers = modeDef.numPlayers;
    this.fieldCount = modeDef.battlefields.length;
    this.battlefields = modeDef.battlefields.slice();
    BATTLEFIELDS = this.battlefields.slice();     // mutate global for card compatibility
    // Teams: array of arrays of seat indices, or null for FFA
    this.teams = modeDef.teams ? modeDef.teams.map(t => t.slice()) : null;
    // Map seat -> teamId
    this.seatTeam = new Array(this.numPlayers).fill(null);
    if (this.teams) {
        this.teams.forEach((t, tid) => t.forEach(seat => { this.seatTeam[seat] = tid; }));
    }

    /* ============ Player configs ============ */
    const pc = cfg.playerConfigs || [];
    const fallback = (i) => ({ type: 'hard' });
    const names = ['藍方', '紅方', '綠方', '紫方'];
    const seatCfg = [];
    for (let i = 0; i < this.numPlayers; i++) {
        const c = pc[i] || fallback(i);
        seatCfg.push(c);
    }
    this.playerConfigs = seatCfg;

    this.players = [];
    for (let i = 0; i < this.numPlayers; i++) {
        const t = seatCfg[i].type;
        const displayName = (cfg.playerNames && cfg.playerNames[i]) || names[i];
        const p = this.mkPlayer(displayName, i);
        p.botType = (t === 'human' || t === null || t === undefined) ? null : t;
        p.teamId = this.seatTeam[i];
        // 🎭 AI 個性指派（20% 友善 / 20% 冷酷 / 60% 惡毒）
        if (p.botType) {
            const r = this.rng();
            p.personality = r < 0.20 ? 'kind' : (r < 0.40 ? 'cold' : 'malignant');
        } else {
            p.personality = null;
        }		
        this.players.push(p);
    }

    this.buildDeck();
    this.initReplay();
    this.dealOpening();
    this.setupFlip();
    this.render();
}

get currentBfIndex() { return Math.max(0, Math.min(this.round - 1, this.fieldCount - 1)); }

initReplay() {
    this.replay = {
        version: 2,
        createdAt: new Date().toISOString(),
        seed: this.seed,
        config: JSON.parse(JSON.stringify(this.cfg)),
        deckTopToBottom: [...this.deck].reverse().map(c => c.data.id),
        events: []
    };
}
recordEvent(type, data = {}) {
    if (!this.replay) return;
    this.replay.events.push(Object.assign({ i: this.replay.events.length, type, round: this.round }, data));
}
isAI(pi) {
    if (this.netMode) return false;
    const p = this.players[pi];
    return !!(p && p.botType);
}
getAIDifficulty(pi) {
    if (!this.isAI(pi)) return null;
    return this.players[pi].botType;   // 'easy' | 'medium' | 'hard'
}
modeTag() {
    const label = {
        '1v1':     '👥 1 vs 1',
        '1v1v1':   '👥 1 vs 1 vs 1',
        '2v2':     '🤝 2 vs 2',
        '1v1v1v1': '👥 1 vs 1 vs 1 vs 1'
    }[this.gameMode] || '👥 對戰';
    return `<span class="ai-mode-tag">${label}</span>`;
}
diffTag(pi) {
    if (!this.isAI(pi)) return '';
    const d = this.getAIDifficulty(pi);
    const labelMap = { easy: '簡單', medium: '普通', hard: '困難' };
    const label = labelMap[d] || '普通';
    const cls = d === 'hard' ? 'ai-diff-tag hard' : 'ai-diff-tag';
    return `<span class="${cls}">${label}</span>`;
}
mkPlayer(name, idx) {
    // Fields array length must match this.fieldCount. Construct lazily after mode setup.
    const fields = [];
    for (let i = 0; i < (this.fieldCount || 3); i++) fields.push([]);
    const lfue = [];
    for (let i = 0; i < (this.fieldCount || 3); i++) lfue.push(null);
    return { idx, name, hand: [], fields, food: this.cfg.initialFood, wins: 0,
        passed: false, mustFaceUp: false, redrawn: false, mulliganDone: false, pendingBuffs: {},
        roundSpent: 0, lastFaceUpEnemy: lfue, botType: null, teamId: null };
}

/* ============ Player relationship helpers ============ */
opponentOf(pi) {
    // "對陣" = left neighbor (next in cycle).
    return (pi + 1) % this.numPlayers;
}
areAllies(a, b) {
    if (a === b) return true;
    if (!this.teams) return false;
    return this.seatTeam[a] !== null && this.seatTeam[a] === this.seatTeam[b];
}
enemiesOf(pi) {
    const out = [];
    for (let i = 0; i < this.numPlayers; i++) if (i !== pi && !this.areAllies(pi, i)) out.push(i);
    return out;
}
alliesOf(pi) {
    const out = [];
    for (let i = 0; i < this.numPlayers; i++) if (i !== pi && this.areAllies(pi, i)) out.push(i);
    return out;
}

buildDeck() {
    const list = [];
    const sets = this.cfg.cardSets || {
        vanilla:  { shu:true, wei:true, wu:true, qun:true },
        extended: { shu:true, wei:true, wu:true, qun:true }
    };
    CARD_DB.forEach(def => {
        const setCfg = sets[def.set];
        if (!setCfg || !setCfg[def.faction]) return;
        let n = def.count || 1;
        for (let i = 0; i < n; i++) list.push(def);
    });
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    this.deck = list.map(d => this.newInst(d));
}
newInst(def) {
    return { uid: 'u' + (this.uid++), data: def, mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null, usesLeft: undefined,
        pendingSilence: false, pendingBurnNext: false, pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false, _oneShotBuff: undefined,
        enteredFaceUp: null };
}
dealOpening() {
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.drawTo(pi, this.cfg.initialCards);
    }
}
drawTo(pi, n) {
    for (let i = 0; i < n; i++) {
        if (this.deck.length === 0) this.reshuffle();
        if (this.deck.length === 0) break;
        const c = this.deck.pop();
        c.justDrawn = true;
        this.players[pi].hand.push(c);
        this.recordEvent('draw', { player: pi, cardId: c.data.id, cardUid: c.uid });
    }
}
drawOne(pi) {
    if (this.deck.length === 0) this.reshuffle();
    if (this.deck.length === 0) return null;
    const c = this.deck.pop();
    c.justDrawn = true;
    this.players[pi].hand.push(c);
    this.recordEvent('draw', { player: pi, cardId: c.data.id, cardUid: c.uid });
    return c;
}
reshuffle() {
    if (this.archive.length === 0) return;
    const back = this.archive.splice(0, this.archive.length);
    back.forEach(c => {
        c.mod=0; c.faceDown=false; c.burn=false; c.silenced=false; c.activated=false;
        c.betrayed=false; c.betrayedFrom=null; c.usesLeft=undefined;
        c.pendingSilence=false; c.pendingBurnNext=false; c.pendingDamageNext=false;
        c.justDrawn=false; c.lianhuan=false; c.lianhuanArmed=false;
        c.grantedFubing=false; c.keepOnField=false; c.guardUsed=false; c._oneShotBuff=undefined;
        c.preparing=false;
    });
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            if (this.players[pi].lastFaceUpEnemy[bi] && !this.players[this.opponentOf(pi)].fields[bi].includes(this.players[pi].lastFaceUpEnemy[bi]))
                this.players[pi].lastFaceUpEnemy[bi] = null;
    for (let i = back.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [back[i], back[j]] = [back[j], back[i]];
    }
    this.deck.push(...back);
    this.addLog('sys', '牌庫耗盡，棄牌區重新洗入牌庫');
}
addLog(type, msg) { this.logs.push({ type, msg }); if (this.logs.length > 400) this.logs.shift(); }
logHand(pi, tag) {
    const p = this.players[pi];
    const names = p.hand.map(c=>c.data.name).join(', ') || '(無)';
    this.addLog('sys', `📋 [${tag}] ${p.name}手牌(${p.hand.length})：${names}｜糧:${p.food}`);
}

getPower(inst, pi, bi, atSettle) {
    if (inst.faceDown) return 0;
    const d = inst.data;
    const hasKongcheng = d.skills && d.skills.includes('空城');
    const isZhuge = d.id === 'zhugeliang';
    const effectiveBase = isZhuge ? 3 : d.power;
    if (!effectiveBase && !hasKongcheng) return 0;

    let modVal = inst.mod || 0;
    if ((d.skills||[]).includes('不屈') && modVal < 0) modVal = -modVal;
    let p = effectiveBase + modVal;
    const myField = this.players[pi].fields[bi];
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];

    if (!inst.silenced) {
        const sk = d.skills || [];
        if (sk.includes('力竭')) p -= enemyField.filter(c => !c.faceDown).length;
        if (sk.includes('涉獵')) {
            const base = effectiveBase + (inst.mod||0);
            p += enemyField.filter(c => !c.faceDown && (c.data.power+(c.mod||0)) > base).length;
        }
        if (sk.includes('先鋒')) {
            const first = myField.find(c => !c.faceDown);
            if (first === inst) p += 1;
        }
        const isFubing = (c) => (c.data.skills||[]).includes('伏兵') || c.grantedFubing;
        if (sk.includes('斷路')) p += myField.filter(c => c !== inst && isFubing(c)).length;
        if (sk.includes('伏兵') || inst.grantedFubing) p += myField.filter(c => c !== inst && (c.data.skills||[]).includes('斷路')).length;
        // 父魂 / 虎子
        if (sk.includes('父魂')) {
            const target = inst.data.id === 'guanxing' ? 'guanyu' : 'zhangfei';
            // 描述：同陣地「以外」己方有【關羽/張飛】才觸發
            const found = this.players[pi].fields.some((f,idx)=>idx!==bi && f.some(c=>c.data.id===target));
            if (found) p += 1;
        }
        if (sk.includes('虎子')) {
            const other = inst.data.id === 'guanxing' ? 'zhangbao' : 'guanxing';
            const found = this.players[pi].fields.some(f=>f.some(c=>c.data.id===other));
            if (found) p += 1;
        }
        // 巧計
        if (sk.includes('巧計')) {
            const ybHere = myField.filter(c=>c.data.skills&&c.data.skills.includes('疑兵')).length;
            const ybArchive = this.archive.filter(c=>c.data.skills&&c.data.skills.includes('疑兵')&&c.originalOwner===pi).length;
            if (inst.data.id === 'pangtong') p += ybHere;
            if (inst.data.id === 'masu') p += ybHere + ybArchive;
        }
        // 腹鱗
        if (sk.includes('腹鱗')) {
            const bigOnes = myField.filter(c=>c.data.power>5).length;
            p -= bigOnes;
        }
        // 鶴翼: power at least 1
        if (sk.includes('鶴翼') && p < 1) p = 1;
        // 繼志 (姜維) — 動態計算，包含背面牌（本陣每有一張牌）
        if (sk.includes('繼志')) {
            const n = myField.filter(c=>c!==inst).length;
            p += n;
        }
        // 權謀 (鐘會) — own power +1 per card on same field
        if (sk.includes('權謀')) {
            p += myField.length;
        }
        if (sk.includes('自立')) {
            p += Math.floor(myField.length / 3);
        }
        let baseBonus = 0;
        const buffs = this.players[pi].pendingBuffs?.[bi] || 0;
        if (buffs > 0) baseBonus += buffs;
        // 一次性 buff（忘隙）：只有該陣地最後進場的那張吃到
        const oneShot = this.players[pi].oneShotBuffs?.[bi];
        if (oneShot && oneShot.target === inst) baseBonus += oneShot.amount;
        myField.forEach(ally => {
            if (ally === inst || ally.faceDown || ally.silenced) return;
            const ask = ally.data.skills || [];
            if (ask.includes('蜀王') && d.faction === 'shu') baseBonus += 1;
            if (ask.includes('魏王') && d.faction === 'wei') baseBonus += 1;
            if (ask.includes('吳王') && d.faction === 'wu') baseBonus += 1;
        });
        myField.forEach(ally => {
            if (ally === inst || ally.faceDown || ally.silenced) return;
            if ((ally.data.skills||[]).includes('建言')) baseBonus += 1;
        });
        // 詐降：對陣每有【魏王】/【吳王】/【蜀王】技能在場，自己 +1（不分陣營）
        if ((d.skills||[]).includes('詐降')) {
            enemyField.forEach(foe => {
                if (foe.faceDown || foe.silenced) return;
                const fsk = foe.data.skills || [];
                if (fsk.includes('魏王') || fsk.includes('吳王') || fsk.includes('蜀王')) baseBonus += 1;
            });
        }
        p += baseBonus;
        inst._kongchengBonus = baseBonus;   // 給空城用
    }

    if (atSettle && !inst.silenced && hasKongcheng) {
        const yb = myField.filter(c => c.data.skills && c.data.skills.includes('疑兵')).length;
        const baseWithMods = 3 + (inst.mod || 0) + (inst._kongchengBonus || 0);
        p = Math.max(0, baseWithMods) * yb;
    }

    if (!inst.silenced && (d.skills||[]).includes('驍勇')) p = Math.max(p, d.power);
    return Math.max(0, p);
}
fieldPower(pi, bi, atSettle) { return this.players[pi].fields[bi].reduce((s,c)=>s+this.getPower(c,pi,bi,atSettle), 0); }
totalPower(pi, atSettle) { let t=0; for (let bi=0;bi<this.fieldCount;bi++) t+=this.fieldPower(pi,bi,atSettle); return t; }
roundLosing(pi) { return this.totalPower(pi, false) < this.totalPower(this.opponentOf(pi), false); }

clearAllTimers() {
    ['backBtnTimer','countdownTimer','aiTimer','flipAutoTimer','settleAutoTimer'].forEach(k=>{
        if (this[k]) { clearTimeout(this[k]); this[k]=null; }

    this.countdown=null; this.cover=false;
}

        }

    }

    showSetup();
}
/* 速度延遲 helper — 只在所有玩家都是 AI 時套用倍率 */
_delay(ms) {
    if (this.players && this.players.every(p => p.botType)) return ms / (this.aiSpeed || 1);
    return ms;
}
_sleep(ms) { return sleep(this._delay(ms)); }
_sTO(fn, ms) { return setTimeout(fn, this._delay(ms)); }
renderSpeedPanel() {
    if (!this.players || !this.players.every(p => p.botType)) return '';
    const speeds = [0.5, 1, 2, 4];
    return `<div class="ai-speed-panel">
        <span class="lbl">⚡ AI 速度</span>

    </div>`;
}
clearCountdown() { if(this.countdownTimer){clearTimeout(this.countdownTimer);this.countdownTimer=null;} this.countdown=null; }
startCountdown(onDone) {
    this.clearCountdown();
    if (this.netMode) { onDone(); return; }
    const allBots = this.players.every(p => p.botType);
    this.countdown = allBots ? 2 : 3;
    this.render();
    const tick = () => {
        this.countdown--;
        if (this.countdown > 0) { this.render(); this.countdownTimer=this._sTO(tick,1000); }
        else { this.countdown=null; this.countdownTimer=null; onDone(); }
    };
    this.countdownTimer = this._sTO(tick, 1000);
}
renderCountdown() {
    if (this.countdown === null) return '';
    return `<div class="countdown-overlay">
        <div class="countdown-label">請查看您新抽到的牌</div>
        <div class="countdown-num">${this.countdown}</div>
        <div class="countdown-hint">💡 綠色光圈標記了新抽到的卡牌</div>
    </div>`;
}

setupFlip() {
    const a = this.deck.pop(), b = this.deck.pop();
    this.flipCards = [a || this.newInst(CARD_DB[0]), b || this.newInst(CARD_DB[1])];
    this.flipRevealed = [false, false];
    this.firstPlayer = null;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer = null; }
    this._checkAutoFlip();
}
/* Auto-flip any bot's card, or auto-begin the battle when all bots are done */
_checkAutoFlip() {
    if (this.state !== 'flip') return;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer = null; }
    for (let i = 0; i < 2; i++) {
        if (!this.flipRevealed[i] && i < this.numPlayers && this.isAI(i)) {
            this.flipAutoTimer = setTimeout(() => {
                this.flipAutoTimer = null;
                if (this.state === 'flip' && !this.flipRevealed[i]) this.revealFlip(i);
            }, 700);
            return;
        }
    }
    if (this.flipRevealed[0] && this.flipRevealed[1] && this.firstPlayer !== null
        && this.players.every(p => p.botType)) {
        this.flipAutoTimer = setTimeout(() => {
            this.flipAutoTimer = null;
            this.beginBattle();
        }, 900);
    }
}
autoFlipAI() {
    if (this.state !== 'flip') return;
    if (!this.flipRevealed[0]) {
        this.revealFlip(0);
        if (this.state !== 'flip') return;
        this.flipAutoTimer = setTimeout(() => {
            this.flipAutoTimer=null;
            if (this.state==='flip' && !this.flipRevealed[1]) this.revealFlip(1);
        }, 700);
        return;
    }
    if (!this.flipRevealed[1]) this.revealFlip(1);
}
_sendCard(c) {
    // Route a card to either the discard pile or the bottom of the draw pile.
    if (!c) return;
    c.mod = 0; c.faceDown = false; c.burn = false; c.silenced = false; c.activated = false;
    c.betrayed = false; c.betrayedFrom = null; c.usesLeft = undefined;
    c.pendingSilence = false; c.pendingBurnNext = false; c.pendingDamageNext = false;
    c.justDrawn = false; c.lianhuan = false; c.lianhuanArmed = false;
    c.grantedFubing = false; c.keepOnField = false; c.guardUsed = false;
    c._oneShotBuff = undefined; c.preparing = false;
    c.willRemove = false; c.willDiscard = false; c.originalOwner = undefined;
    if (this.sendToBottom) this.deck.unshift(c);   // bottom = unshift (deck uses pop from end)
    else this.archive.push(c);
}
revealFlip(i) {
    if (this.state !== 'flip' || this.flipRevealed[i]) return;
    this.flipRevealed[i] = true;
    if (this.flipRevealed[0] && this.flipRevealed[1]) {
        const p0 = this.flipCards[0].data.power;
        const p1 = this.flipCards[1].data.power;
        if (p0 === p1) {
            this.addLog('sys', `翻牌：${this.flipCards[0].data.name}(${p0}) vs ${this.flipCards[1].data.name}(${p1}) → 平手！重新翻牌`);
            this.recordEvent('flip_tie', { blueCard: this.flipCards[0].data.id, redCard: this.flipCards[1].data.id, power: p0 });
            // Route both tied cards
            this._sendCard(this.flipCards[0]);
            this._sendCard(this.flipCards[1]);
            this.firstPlayer = null;
            this.render();
            this._sTO(() => {
                if (this.state !== 'flip') return;
                if (this.deck.length < 2) this.reshuffle();
                if (this.deck.length < 2) {
                    this.firstPlayer = 0;
                    this.addLog('sys', '牌庫耗盡，預設藍方先手');
                    this.render();
                    return;
                }
                this.flipCards = [this.deck.pop(), this.deck.pop()];
                this.flipRevealed = [false, false];
                this.render();
                this._checkAutoFlip();
            }, 900);
            return;
        }
        this.firstPlayer = (p0 > p1) ? 0 : 1;
        this.addLog('sys', `翻牌：${this.flipCards[0].data.name}(${p0}) vs ${this.flipCards[1].data.name}(${p1}) → ${this.players[this.firstPlayer].name}先手`);
        this.recordEvent('flip_result', {blueCard:this.flipCards[0].data.id,bluePower:p0,redCard:this.flipCards[1].data.id,redPower:p1,firstPlayer:this.firstPlayer});
        // Route flip cards after deciding
        this._sendCard(this.flipCards[0]);
        this._sendCard(this.flipCards[1]);
    }
    this.render();
    this._checkAutoFlip();
}
beginBattle() {
    if (this.state !== 'flip') return;
    if (this.flipAutoTimer) { clearTimeout(this.flipAutoTimer); this.flipAutoTimer=null; }
    this.state = 'mulligan'; this.phase = '';
    this.mulliganPlayer = this.firstPlayer;
    this.mulliganStage = 'choose';
    this.addLog('sys', '═══ 三國風雲 開戰！═══');
    this.addLog('sys', `🌱 本局種子：${this.seed}`);
    this.render();
    if (this.isAI(this.mulliganPlayer)) this._sTO(() => this.doMulliganAI(), 900);
}

mulliganRedraw() {
    if (this.mulliganStage !== 'choose') return;
    const p = this.players[this.mulliganPlayer];
    const n = p.hand.length;
    const oldHand = p.hand.map(c => c.data.id);
    const discardNames = p.hand.map(c => c.data.name).join('、');
    const where = this.sendToBottom ? '牌庫底' : '棄牌堆';
    p.hand.forEach(c => this._sendCard(c));
    p.hand = [];
    this.drawTo(this.mulliganPlayer, n);
    p.redrawn = true;
    this.mulliganStage = 'confirm';
    this.addLog(this.mulliganPlayer, `${p.name} 重抽了 ${n} 張手牌（${where}：${discardNames}）`);
    this.recordEvent('mulligan_redraw', { player: this.mulliganPlayer, discarded: oldHand, drew: p.hand.map(c => c.data.id), toBottom: this.sendToBottom });
    this.render();
    if (this.isAI(this.mulliganPlayer)) this._sTO(() => this.doMulliganAI(), 900);
}
mulliganSkip() {
    if (this.mulliganStage !== 'choose') return;
    this.players[this.mulliganPlayer].mulliganDone = true;
    this.mulliganStage = 'hidden'; this.cover = true; this.render();
    this.recordEvent('mulligan_skip', { player: this.mulliganPlayer });
    this._sTO(() => this.mulliganHandoff(), 800);
}
mulliganConfirm() {
    if (this.mulliganStage !== 'confirm') return;
    this.players[this.mulliganPlayer].mulliganDone = true;
    this.mulliganStage = 'hidden'; this.cover = true; this.render();
    this.recordEvent('mulligan_confirm', { player: this.mulliganPlayer });
    this._sTO(() => this.mulliganHandoff(), 800);
}
mulliganHandoff() {
    if (this.mulliganStage !== 'hidden') return;
    this.cover = false;
    const other = this.opponentOf(this.mulliganPlayer);
    if (!this.players[other].mulliganDone) {
        this.mulliganPlayer = other; this.mulliganStage = 'choose'; this.render();
        if (this.isAI(other)) this._sTO(() => this.doMulliganAI(), 900);
    } else this.startBattle();
}
doMulliganAI() {
    if (this.state !== 'mulligan') return;
    if (!this.isAI(this.mulliganPlayer)) return;
    const p = this.players[this.mulliganPlayer];
    const diff = this.getAIDifficulty(this.mulliganPlayer);
    const badCards = p.hand.filter(c => {
        const ratio = c.data.power / Math.max(1, c.data.cost);
        return c.data.cost > 4 || ratio < 0.8;
    }).length;
    let threshold = 2;
    if (diff === 'hard') threshold = 3;
    if (badCards >= threshold && !p.redrawn) this.mulliganRedraw();
    else {
        if (this.mulliganStage === 'confirm') this.mulliganConfirm();
        else this.mulliganSkip();
    }
}

startBattle() {
    this.state = 'battle'; this.phase = 'turn'; this.cover = false;
    // Net mode skips the countdown, so clear the "just drawn" glow now.
    for (let pi = 0; pi < this.numPlayers; pi++)
        this.players[pi].hand.forEach(c => c.justDrawn = false);
    this.current = this.firstPlayer;
    this.roundFirstPlayer = this.firstPlayer;
    // 清除所有連環標記
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    this._simaYiLastChanceUsed = false;

    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].passed = false;
        this.players[pi].mustFaceUp = false;
        this.players[pi].roundSpent = 0;
        this.players[pi].cardsPlayedByPlayer = this.players[pi].cardsPlayedByPlayer || 0;
    }
    this.firstPasser = null;
    this.passOrder = [];
    this._handoffDoneThisTurn = false;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    this.addLog('sys', `${this.players[this.current].name} 先行出牌`);
    this._triggerPreTurnFlip();
    this._logTurnStart();
    for (let pi = 0; pi < this.numPlayers; pi++) this.logHand(pi, 'R'+this.round+' 開局');
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1].hand.map(c => c.data.id),
        blueFood: this.players[0].food, redFood: this.players[1].food
    });
    this.render();
    this.maybeJianxiong();
}

selectCard(uid) {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    const p = this.players[this.current];
    if (p.passed) return;
    const inst = p.hand.find(c => c.uid === uid);
    if (!inst) return;
    this.selected = (this.selected === uid) ? null : uid;
    if (this.selected === null) this.selectedField = null;
    else if (this.selectedField !== null) {
        const allowed = this.getPlayableFields(inst, this.current);
        if (!allowed.includes(this.selectedField)) this.selectedField = null;
    }
    this.render();
}
selectField(bi) {
    if (bi === this.currentBfIndex || this.selectedField === bi) this.selectedField = null;
    else this.selectedField = bi;
    this.render();
}

inspect(uid) {
    let found=null, ownerPi=-1;
    outer:
    for (let pi=0; pi<this.numPlayers; pi++) {
        const p = this.players[pi];
        for (const c of p.hand) if (c.uid===uid) { found=c; ownerPi=pi; break outer; }
        for (const f of p.fields) for (const c of f) if (c.uid===uid) { found=c; ownerPi=pi; break outer; }
    }
    if (!found) for (const c of this.archive) if (c.uid===uid) { found=c; ownerPi=-1; break; }
    if (!found) for (const c of this.deck) if (c.uid===uid) { found=c; ownerPi=-1; break; }
    if (!found) return;
    if (ownerPi>=0 && this.isAI(ownerPi) && this.players[ownerPi].hand.includes(found)) return;
    if (found.faceDown && ownerPi>=0 && ownerPi!==this.current && this.phase==='turn') return;
    if (found.faceDown && ownerPi>=0 && this.phase==='preend' && ownerPi!==this.preEndOrder[this.preEndIdx]) return;
    this.inspectCard = found; this.render();
}
closeInspect() { this.inspectCard = null; this.render(); }

canPlayNormally(inst, pi) {
    const p = this.players[pi];
    if (inst.data.forceFaceDown) return false;
    return p.food >= inst.data.cost;
}
canPlayAmbush(inst, pi) {
    const p = this.players[pi];
    if (!inst.data.isAmbush && !this.hasShefuBonus(pi, this.currentBfIndex)) return false;
    if (p.mustFaceUp) {
        // 隱忍：己方無視嘲諷
        const hasYinren = p.fields.some(f => f.some(c =>
            !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
        if (!hasYinren) return false;
    }
    return true;
}
hasShefuBonus(pi, bi) {
    return this.players[pi].fields[bi].some(c=>!c.faceDown&&!c.silenced&&(c.data.skills||[]).includes('設伏'));
}

getPlayableFields(inst, pi) {
    if (!inst) return [this.currentBfIndex];
    const sk = inst.data.skills || [];
    const bi = this.currentBfIndex;
    const fields = [bi];
    if (sk.includes('奇謀')) for (let f=0;f<bi;f++) if (!fields.includes(f)) fields.push(f);
    if (sk.includes('奇襲')) for (let f=0;f<this.fieldCount;f++) if (!fields.includes(f)) fields.push(f);
    if (sk.includes('奔襲')) {
        if (bi>0 && !fields.includes(bi-1)) fields.push(bi-1);
    }
    return fields.sort((a,b)=>a-b);
}

doPlay(asAmbush) {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null || !this.selected) return;
    this._handoffDoneThisTurn = false;
    const pi = this.current, p = this.players[pi];
    if (p.passed) return;
    const inst = p.hand.find(c => c.uid === this.selected);
    if (!inst) return;
    const allowed = this.getPlayableFields(inst, pi);
    const bi = (this.selectedField !== null && allowed.includes(this.selectedField)) ? this.selectedField : this.currentBfIndex;
    this.selectedField = null;
    const ambush = !!asAmbush || !!inst.data.forceFaceDown;

    if (!ambush) {
        if (p.food < inst.data.cost) return;
        p.food -= inst.data.cost;
        p.roundSpent += inst.data.cost;
    }

    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = ambush;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = !ambush;
    inst.grantedFubing = !!(ambush && !inst.data.isAmbush && this.hasShefuBonus(pi, bi));
    if (inst.grantedFubing) this.addLog(pi, `[R${this.round}] 程昱【設伏】：${inst.data.name} 獲得【伏兵】技能`);
    p.fields[bi].push(inst);
    this.cardsPlayedCount++;
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;

    if (!ambush) {
        // 記錄「這張牌是該玩家在這塊戰場上最後的正面進場牌」
        this.players[pi].lastFaceUpEnemy[bi] = inst;
    }

    // 連環窗口：對陣若有龐統（已啟動）在這塊戰場，正面進場的牌也會被標記
    if (!ambush) {
        const oppPangtong = this.players[this.opponentOf(pi)].fields[bi].find(c =>
            !c.faceDown && !c.silenced && c.data.id === 'pangtong' && c.activated);
        if (oppPangtong) {
            inst.lianhuan = true;
            this.addLog(pi, `⚠️ 【連環】${inst.data.name} 被對陣龐統標記`);
        }
    }

    if (ambush) this.addLog(pi, `[R${this.round}] ${p.name} 於【${BATTLEFIELDS[bi]}】埋伏了一張牌`);
    else this.addLog('l-skill'===pi?pi:pi, `[R${this.round}] ${p.name} 於【${BATTLEFIELDS[bi]}】派出 ${inst.data.name}（-${inst.data.cost}糧｜餘${p.food}）`);

    this.recordEvent('play', {
        player: pi, cardId: inst.data.id, cardUid: inst.uid, field: bi, faceDown: ambush,
        foodCost: ambush ? 0 : inst.data.cost, foodAfter: p.food, handAfter: p.hand.length,
        handAfterNames: p.hand.map(c=>c.data.id)
    });

    // 忘隙一次性 buff：在進場觸發前綁定哨兵，讓 getPower 能吃到
    const osb = p.oneShotBuffs && p.oneShotBuffs[bi];
    if (osb && osb.armed && !inst.faceDown) {
        // 若這張是設 buff 的本人（李典）或已在綁定前存在，就跳過
        inst._oneShotBuff = osb.amount;
        osb.armed = false;
        osb.target = inst;
    }

    if (!ambush) this.runEntryTriggers(pi, inst, bi);
    if (this.guanyu || this.xunyu || this.xunyou || this.scry) { this.selected = null; this.render(); return; }
    this.doPlayAfterEntry(pi, inst, ambush, bi);
}

doPlayAfterEntry(pi, inst, ambush, bi) {
    if (!ambush && inst.data.skills && inst.data.skills.includes('奔襲') && bi !== this.currentBfIndex) {
        const src = this.players[pi].fields[bi];
        const candidates = src.filter(c => c !== inst && !c.faceDown && !c.data.isGeneral);
        if (candidates.length > 0) {
            let best = candidates[0];
            candidates.forEach(c => { if (c.data.power > best.data.power) best = c; });
            src.splice(src.indexOf(best), 1);
            this.players[pi].fields[this.currentBfIndex].push(best);
            this.addLog(pi, `[R${this.round}] 夏侯淵【奔襲】：${best.data.name} 移至【${BATTLEFIELDS[this.currentBfIndex]}】`);
        }
    }
    this.applyBurn(pi);
    const p = this.players[pi];

    const hasScry = p.fields.some(f => f.some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('觀星')));
    if (hasScry && this.deck.length > 0) {
        const n = Math.min(3, this.deck.length);
        const cards = []; for (let i=0;i<n;i++) cards.push(this.deck.pop());
        this.scry = { pi, cards, order: [] };
        this.selected = null;
        this.render();
        if (this.isAI(pi)) this._sTO(() => this.resolveAIScry(), 700);
        return;
    }
    this.drawOne(pi);
if (!ambush && inst.data.isGeneral && this.isAI(pi)) {
    this.aiChatTrigger(pi, 'general');
}
    if (!ambush && inst.data.isGeneral) {
        this.addLog(pi, `[R${this.round}] ${inst.data.name}為上將！${p.name}本回合結束出牌`);
        this.recordEvent('general_pass', { player: pi, cardId: inst.data.id });
        if (this.firstPasser === null) this.firstPasser = pi;
        p.passed = true; p.mustFaceUp = false;
        this.lastPasser = pi; this.selected = null;
        if (this.players.every(pl => pl.passed)) { this.startPreEnd(); return; }
        this.startCountdown(() => {
            this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
            this.cover = true;
            this.render();
        });
        return;
    }
    this.finishAction();
}

runEntryTriggers(pi, inst, bi) {
    if (!inst.silenced && inst.data.onEnter) {
        this.addLog('sys', `⚙️ 技能觸發：${inst.data.name}【進場】`);
        inst.data.onEnter(this._ctxFor(pi, inst, bi, null));
    }
    // 詐降：對陣敵軍視黃蓋為友軍 → 敵方 onEnemyEnter 全不觸發
    const hasZhaxiang = !inst.silenced && (inst.data.skills||[]).includes('詐降');
    if (hasZhaxiang) {
        this.addLog(pi, `🎭 ${inst.data.name}【詐降】：對陣敵軍技能視為友軍`);
        return;
    }
    for (const enemy of this.enemiesOf(pi)) {
        const enemyField = this.players[enemy].fields[bi];
        const watchers = enemyField.filter(c => !c.faceDown && !c.silenced && c.data.onEnemyEnter);
        watchers.forEach(w => {
            this.addLog('sys', `⚙️ 技能觸發：${w.data.name}【敵進場】→ ${inst.data.name}`);
            w.data.onEnemyEnter(this._ctxFor(enemy, w, bi, inst));
        });
    }
}
_ctxFor(pi, self, bi, target) {
    const game = this;
    const opp = game.opponentOf(pi);
    const enemies = game.enemiesOf(pi);
    return {
        game, owner: pi, self, field: bi, target,
        opponent: opp,
        enemies: enemies,
        allies: game.alliesOf(pi),
        myField: game.players[pi].fields[bi],
        enemyField: game.players[opp].fields[bi],
        enemyFields: enemies.map(e => game.players[e].fields[bi]),
        isLosing: game.fieldPower(pi, bi, false) < game.fieldPower(opp, bi, false),
        isWinning: game.fieldPower(pi, bi, false) > game.fieldPower(opp, bi, false),
        log: (m) => game.addLog(pi, m),
        drawCard: (n) => game.drawTo(pi, n)
    };
}
/* ============ 網路 hook (Phase 1 佔位) ============ */
broadcastState() {
    if (!this.netMode || this.role !== 'host') return;
    if (this._broadcast) this._broadcast(this.serializeForPlayer(1));
}
sendAction(action) {
    if (!this.netMode || this.role !== 'guest') {
        this.applyRemoteAction(this.localPlayerIdx, action);
        return;
    }
    if (this._sendAction) this._sendAction(action);
}
applyRemoteAction(pi, action) {
    // Phase 2: handoff handled elsewhere
}

/* ============ 網路狀態序列化 ============ */
_serCard(c) {
    if (!c) return null;
    return {
        uid: c.uid, dataId: c.data.id,
        mod: c.mod || 0, faceDown: !!c.faceDown, burn: !!c.burn,
        silenced: !!c.silenced, activated: !!c.activated,
        betrayed: !!c.betrayed, betrayedFrom: c.betrayedFrom ?? null,
        usesLeft: c.usesLeft ?? null,
        pendingSilence: !!c.pendingSilence,
        pendingBurnNext: !!c.pendingBurnNext,
        pendingDamageNext: !!c.pendingDamageNext,
        justDrawn: !!c.justDrawn,
        lianhuan: !!c.lianhuan, lianhuanArmed: !!c.lianhuanArmed,
        preparing: !!c.preparing, grantedFubing: !!c.grantedFubing,
        keepOnField: !!c.keepOnField, guardUsed: !!c.guardUsed,
        fresh: !!c.fresh, willRemove: !!c.willRemove, willDiscard: !!c.willDiscard,
        originalOwner: c.originalOwner ?? null,
        _oneShotBuff: c._oneShotBuff ?? null,
        enteredFaceUp: (c.enteredFaceUp === undefined) ? null : !!c.enteredFaceUp
    };
}
_unserCard(o) {
    if (!o) return null;
    const def = CARD_DB.find(d => d.id === o.dataId);
    if (!def) return null;
    const c = Object.assign({}, o);
    c.data = def;
    if (c.usesLeft === null) c.usesLeft = undefined;
    return c;
}
serializeForPlayer(forPlayer) {
    const serP = (p, pi) => {
        const hideHand = (pi !== forPlayer);
        return {
            idx: p.idx, name: p.name,
            hand: hideHand ? null : p.hand.map(c => this._serCard(c)),
            handCount: p.hand.length,
            fields: p.fields.map(f => f.map(c => this._serCard(c))),
            food: p.food, wins: p.wins,
            passed: !!p.passed, mustFaceUp: !!p.mustFaceUp,
            redrawn: !!p.redrawn, mulliganDone: !!p.mulliganDone,
            pendingBuffs: p.pendingBuffs || {},
            roundSpent: p.roundSpent || 0,
            cardsPlayedByPlayer: p.cardsPlayedByPlayer || 0,
            oneShotBuffs: p.oneShotBuffs || null,
            lastFaceUpEnemy: (p.lastFaceUpEnemy || []).map(c => c ? c.uid : null)
        };
    };
    return {
        _v: 1, forPlayer, seed: this.seed,
        players: [serP(this.players[0], 0), serP(this.players[1], 1)],
        deck: this.deck.map(c => this._serCard(c)),
        archive: this.archive.map(c => this._serCard(c)),
        flipCards: this.flipCards ? this.flipCards.map(c => this._serCard(c)) : null,
        flipRevealed: this.flipRevealed ? [...this.flipRevealed] : null,
        uid: this.uid, round: this.round,
        state: this.state, phase: this.phase, current: this.current,
        firstPlayer: this.firstPlayer, roundFirstPlayer: this.roundFirstPlayer,
        lastResult: this.lastResult, gameWinner: this.gameWinner,
        firstPasser: this.firstPasser, lastPasser: this.lastPasser,
        mulliganPlayer: this.mulliganPlayer, mulliganStage: this.mulliganStage,
        selected: this.selected, selectedField: this.selectedField,
        _rematchVotes: this._rematchVotes || [false, false],
        preEndOrder: this.preEndOrder, preEndIdx: this.preEndIdx,
        preEndDone: this.preEndDone, history: this.history,
        cardsPlayedCount: this.cardsPlayedCount,
        logs: this.logs.slice(-150)
    };
}
applyState(s) {
    this.seed = s.seed;
    this.players = s.players.map((p) => {
        const hand = (p.hand || []).map(c => this._unserCard(c)).filter(Boolean);
        return {
            idx: p.idx, name: p.name,
            hand, handCount: p.handCount,
            _handHidden: (p.hand === null),
            fields: p.fields.map(f => f.map(c => this._unserCard(c)).filter(Boolean)),
            food: p.food, wins: p.wins,
            passed: !!p.passed, mustFaceUp: !!p.mustFaceUp,
            redrawn: !!p.redrawn, mulliganDone: !!p.mulliganDone,
            pendingBuffs: p.pendingBuffs || {},
            roundSpent: p.roundSpent || 0,
            cardsPlayedByPlayer: p.cardsPlayedByPlayer || 0,
            oneShotBuffs: p.oneShotBuffs,
            lastFaceUpEnemy: new Array(this.fieldCount).fill(null)
        };
    });
    for (let pi = 0; pi < this.numPlayers; pi++) {
        for (let bi = 0; bi < this.fieldCount; bi++) {
            const uid = s.players[pi].lastFaceUpEnemy[bi];
            if (uid) this.players[pi].lastFaceUpEnemy[bi] =
                this.players[pi].fields[bi].find(c => c.uid === uid) || null;
        }
    }
    this.deck = s.deck.map(c => this._unserCard(c)).filter(Boolean);
    this.archive = s.archive.map(c => this._unserCard(c)).filter(Boolean);
    this.flipCards = s.flipCards ? s.flipCards.map(c => this._unserCard(c)).filter(Boolean) : null;
    this.flipRevealed = s.flipRevealed ? [...s.flipRevealed] : null;
    Object.assign(this, {
        uid: s.uid, round: s.round, state: s.state, phase: s.phase,
        current: s.current, firstPlayer: s.firstPlayer,
        roundFirstPlayer: s.roundFirstPlayer, lastResult: s.lastResult,
        gameWinner: s.gameWinner, firstPasser: s.firstPasser,
        lastPasser: s.lastPasser, mulliganPlayer: s.mulliganPlayer,
        mulliganStage: s.mulliganStage, preEndOrder: s.preEndOrder,
        preEndIdx: s.preEndIdx, preEndDone: s.preEndDone,
        history: s.history || [], cardsPlayedCount: s.cardsPlayedCount || 0,
        logs: s.logs || []
    });
    this.selected      = (s.selected      !== undefined) ? s.selected      : null;
    this.selectedField = (s.selectedField !== undefined) ? s.selectedField : null;
    this._rematchVotes = s._rematchVotes || [false, false];
    this.cover = false;
    this.countdown = null; this.scry = null; this.quanheng = null;
    this.jianxiong = null; this.lianying = null; this.guanyu = null;
    this.xunyu = null; this.xunyou = null;
    this._hasReceivedState = true;
    this.render();
}

applyBurn(pi) {
    const p = this.players[pi];
    let n = 0;
    for (let bi=0; bi<this.fieldCount; bi++) {
        p.fields[bi].forEach(c => {
            if (c.burn && !c.faceDown) { c.mod=(c.mod||0)-1; n++; }
        });
    }
    if (n>0) this.addLog(pi, `🔥 【燃燒】${n} 張卡牌各受到 1 點燃燒傷害`);
}
/* 卡片威脅值：戰力 + 技能影響力。用於 斬將/斬除/毒士 等移除技能的目標選擇。 */
cardThreatValue(c) {
    if (!c || c.faceDown) return 0;
    const d = c.data;
    let v = d.power + (c.mod || 0);
    const sk = d.skills || [];
    /* 持續性場上壓力（每回合都作用） */
    const PERSISTENT = ['威嚇','嘲諷','涉獵','力竭','火攻','連營','斷路','伏兵'];
    /* 一次性強力觸發（進場/結算時造成大影響） */
    const IMPACT     = ['止啼','識破','烈矢','飛矢','霸王','火船','奪銳','劫糧','虎痴','突圍','鐵騎','烈刃','建言'];
    /* 上將身分本身是威脅 */
    if (d.isGeneral) v += 4;
    if (sk.some(s => PERSISTENT.includes(s))) v += 3;
    if (sk.some(s => IMPACT.includes(s))) v += 2;
    /* 高戰力白板也算 */
    if (d.power >= 6) v += 2;
    return v;
}
/* 護衛：同陣地有 曹洪 / 周泰 在場時，友軍受到的 戰力傷害 減 1（最低 0）。
   呼叫端使用 `game.applyDamage(target, 1, targetOwnerPi, targetBi)`。 */
applyDamage(target, amount, targetPi, targetBi, sourceInst = null) {
    if (amount <= 0) return 0;

    // 曹仁 堅守（鎖定技）：所在陣地劣勢時，本陣友軍戰力不會減少
    const hasJianshou = this.players[targetPi].fields[targetBi].some(c =>
        !c.faceDown && (c.data.skills||[]).includes('堅守'));
    if (hasJianshou) {
        const myP = this.fieldPower(targetPi, targetBi, false);
        const oppP = this.fieldPower(this.opponentOf(targetPi), targetBi, false);
        if (myP <= oppP) {
            this.addLog(targetPi, `🏰 曹仁【堅守】：${target.data.name} 免受戰力傷害`);
            return 0;
        }
    }

    // 護衛（折衷版）：同陣地有 曹洪/周泰 且未使用過護衛時，
    // 友軍受到的傷害 -1；該護衛自身受 1 傷害並失去護衛（一次性）。
    const guard = this.players[targetPi].fields[targetBi].find(c =>
        c !== target && !c.faceDown && !c.silenced && !c.guardUsed &&
        (c.data.skills||[]).includes('護衛'));
    if (guard) {
        guard.guardUsed = true;
        const reduced = Math.max(0, amount - 1);
        target.mod = (target.mod||0) - reduced;
        guard.mod = (guard.mod||0) - 1;
        this.addLog(targetPi, `🛡️ ${guard.data.name}【護衛】：替 ${target.data.name} 減免1（友軍實受 ${reduced}，自身受1，護衛已用）`);
        return reduced;
    }
    target.mod = (target.mod||0) - amount;

    // 剛烈（鎖定技）：自己受到戰力傷害時，使傷害來源受到相同點數傷害
    if (sourceInst && sourceInst.uid !== target.uid &&
        (target.data.skills||[]).includes('剛烈') &&
        sourceInst.data) {
        sourceInst.mod = (sourceInst.mod||0) - amount;
        this.addLog(targetPi, `⚔️ ${target.data.name}【剛烈】：反傷 ${sourceInst.data.name} ${amount}`);
    }

    return amount;
}
flashRemove(inst) {
    if (!inst || !inst.data) return;
    try {
        const el = document.createElement('div');
        el.className = 'removal-clone';
        el.innerHTML = this.cardHTML(inst, { forceReveal: true, noHighlight: true });

}
/* 取得對手（pi 的對面）在 bi 上「最後的正面敵軍」（仍在場且正面） */
_validLastFaceUpEnemy(enemyPi, bi) {
    const c = this.players[enemyPi].lastFaceUpEnemy?.[bi];
    if (!c) return null;
    if (!this.players[enemyPi].fields[bi].includes(c)) return null;
    if (c.faceDown) return null;
    return c;
}
/* 每回合開始前：對手的背面冷箭/伏擊可翻開 */
_triggerPreTurnFlip() {
    const bi = this.currentBfIndex;
    const enemies = this.enemiesOf(this.current);
    for (const owner of enemies) {
        const ownerP = this.players[owner];
        const fus = ownerP.fields[bi].filter(c =>
            c.faceDown && !c.silenced &&
            ((c.data.skills||[]).includes('冷箭') || (c.data.skills||[]).includes('伏擊')));
        for (const c of fus) {
            c.faceDown = false;
            c.fresh = true;
            this.addLog(owner, `[R${this.round}] 冷箭：${c.data.name} 翻開`);
            if (c.data.onFlip) c.data.onFlip(this._ctxFor(owner, c, bi, null));
        }
    }
}
/* 己方回合開始時：結算龐統的【準備】→【連環】 */
_triggerPangtongLianhuan() {
    const pi = this.current;
    const bi = this.currentBfIndex;
    const pt = this.players[pi].fields[bi].find(c =>
        c.data.id === 'pangtong' && c.preparing);
    if (!pt) return;
    pt.preparing = false;
    if (pt.silenced) {
        this.addLog(pi, `[R${this.round}] 龐統【連環】：準備期間失去技能，效果不觸發`);
        return;
    }
    pt.activated = true;
    let n = 0;
    const enemies = this.enemiesOf(pi);
    for (const e of enemies) {
        this.players[e].fields[bi].forEach(c => {
            if (!c.faceDown) { c.lianhuan = true; n++; }
        });
    }
    this.addLog(pi, `[R${this.round}] 龐統【連環】：${n} 名敵軍陷入連環`);
}
/* 判斷是否應該正面進場（預設為埋伏）。 ... */
_shouldPlayFaceUp(card, pi, bi) {
    const d = card.data;
    const sk = d.skills || [];
    const oppField = this.players[this.opponentOf(pi)].fields[bi];

    if (sk.includes('冷箭') || d.forceFaceDown) return false;

    // 龐統 counterplay：對陣有啟動中的龐統 → 盡量背面進場避免被連環標記
    const oppPangtong = oppField.some(x =>
        !x.faceDown && !x.silenced && x.data.id === 'pangtong' && x.activated);
    if (oppPangtong && !d.isGeneral) {
        // 除非是必須正面才能選陣地的牌（奇謀/奇襲/奔襲），否則一律背面
        if (!sk.some(s => ['奇謀','奇襲','奔襲'].includes(s))) return false;
    }

    if (d.onEnter || d.onEnemyEnter) return true;

    const FACE_UP_ENGINES = ['觀星','權衡','連營','奸雄','設伏'];
    if (sk.some(s => FACE_UP_ENGINES.includes(s))) return true;

    if (d.isGeneral) return true;
    if (sk.includes('奇謀') || sk.includes('奇襲') || sk.includes('奔襲')) return true;

    if (oppField.some(x => !x.faceDown && (x.data.skills||[]).includes('力竭'))) return true;

    return false;
}

/* ============ 曹植【酒詩】 ============ */
findJiushiCard(pi) {
    const p = this.players[pi];
    return p.fields.flat().find(c =>
        !c.faceDown && !c.silenced && !c.activated &&
        (c.data.skills||[]).includes('酒詩') &&
        (p.cardsPlayedByPlayer||0) >= 7);
}
activateJiushi() {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    const pi = this.current;
    const c = this.findJiushiCard(pi);
    if (!c) return;
    const p = this.players[pi];
    for (let bi=0; bi<this.fieldCount; bi++) {
        const idx = p.fields[bi].indexOf(c);
        if (idx >= 0) { p.fields[bi].splice(idx, 1); break; }
    }
    c.mod = 0; c.activated = true;
    p.hand.push(c);
    p.food = Math.min(this.cfg.maxFood, p.food + c.data.cost);
    this.addLog(pi, `[R${this.round}] 曹植【酒詩】：返回手牌並補回 ${c.data.cost} 糧`);
    this.recordEvent('jiushi', { player: pi, cardId: c.data.id, foodAfter: p.food });
    this.render();
}
/* ============ 荀彧【驅虎】 ============ */
chooseXunyuMove(pi, bi) {
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];
    const visible = enemyField.filter(c => !c.faceDown);
    if (visible.length < 2) return null;
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);

    let best = null, bestScore = -Infinity;
    for (const c of visible) {
        const cp = c.data.power + (c.mod || 0);
        for (let dest = 0; dest < this.fieldCount; dest++) {
            if (dest === bi) continue;
            let score = cp * 1.5;

            if (dest < bi) {
                // Past battlefield = dumping ground (card neutralized)
                score += 60;
            } else {
                // Future — farther is better
                score += (dest - bi) * 10;
                const futureMy = this.fieldPower(pi, dest, false);
                const futureOpp = this.fieldPower(this.opponentOf(pi), dest, false);
                if (futureMy > futureOpp + 5) score += 10;
                else if (futureOpp > futureMy + 5) score -= 15;
            }

            // Flipping the current battlefield is huge
            if (myPow <= oppPow && myPow > oppPow - cp) score += 25;

            if (score > bestScore) { bestScore = score; best = { uid: c.uid, dest }; }
        }
    }
    return best;
}
/* 荀彧【驅虎】的次要效果：對剩下的最高戰力敵軍 -1（非傷害） */
_xunyuReduceSecondary(pi, bi) {
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];
    const remaining = enemyField.filter(c => !c.faceDown);
    if (remaining.length === 0) return;
    // 選戰力最高的（含 mod）
    let target = remaining[0];
    remaining.forEach(c => {
        if ((c.data.power + (c.mod||0)) > (target.data.power + (target.mod||0))) target = c;
    });
    // 堅守保護：若對手該陣地堅守生效（己方劣勢），跳過
    const hasJianshou = this.players[this.opponentOf(pi)].fields[bi].some(c =>
        !c.faceDown && (c.data.skills||[]).includes('堅守'));
    if (hasJianshou) {
        const oppTotal = this.fieldPower(this.opponentOf(pi), bi, false);
        const myTotal = this.fieldPower(pi, bi, false);
        if (oppTotal <= myTotal) {
            this.addLog(pi, `🛡️ 【驅虎】：${target.data.name} 因【堅守】免於戰力減少`);
            return;
        }
    }
    target.mod = (target.mod || 0) - 1;
    this.addLog(pi, `【驅虎】：${target.data.name} 戰力 -1`);
    this.recordEvent('quhu_reduce', { player: pi, targetId: target.data.id });
}
