/* ============ 荀攸【奇策】 ============ */
chooseXunyouExtra(pi, bi) {
    const p = this.players[pi];
    const eligible = p.hand.filter(c => !c.data.forceFaceDown && c.data.cost <= p.food);
    if (eligible.length === 0) return null;
    let best = null, bestScore = -Infinity;
    for (const c of eligible) {
        const score = this.scoreCardAI(c, pi, this.getAIDifficulty(pi), {
            myPow: this.fieldPower(pi, bi, false),
            oppPow: this.fieldPower(this.opponentOf(pi), bi, false)
        });
        if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
}
performQicePlay(pi, inst, bi) {
    const p = this.players[pi];
    if (p.food < inst.data.cost) {
        p.food = Math.min(this.cfg.maxFood, p.food + 1);
        this.addLog(pi, `[R${this.round}] 荀攸【奇策】：糧草不足，僅 +1 糧`);
        return;
    }
    p.food -= inst.data.cost;
    p.roundSpent += inst.data.cost;
    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = false;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = true;
    inst.grantedFubing = false;
    p.fields[bi].push(inst);
    this.cardsPlayedCount++;
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;
    this.players[pi].lastFaceUpEnemy[bi] = inst;
    this.addLog(pi, `[R${this.round}] 荀攸【奇策】：追加 ${inst.data.name}（-${inst.data.cost}糧｜餘${p.food}）`);

    // 連環窗口
    const oppPangtong = this.players[this.opponentOf(pi)].fields[bi].find(c =>
        !c.faceDown && !c.silenced && c.data.id === 'pangtong' && c.activated);
    if (oppPangtong) {
        inst.lianhuan = true;
        this.addLog(pi, `⚠️ 【連環】${inst.data.name} 被對陣龐統標記`);
    }
    this.recordEvent('qice_play', { player: pi, cardId: inst.data.id, field: bi, foodAfter: p.food });

    const prevFlag = this._inExtraPlay;
    this._inExtraPlay = true;
    try {
        if (!inst.silenced && inst.data.onEnter) inst.data.onEnter(this._ctxFor(pi, inst, bi, null));
        const enemyField = this.players[this.opponentOf(pi)].fields[bi];
        const watchers = enemyField.filter(c => !c.faceDown && !c.silenced && c.data.onEnemyEnter);
        watchers.forEach(w => w.data.onEnemyEnter(this._ctxFor(this.opponentOf(pi), w, bi, inst)));
    } finally {
        this._inExtraPlay = prevFlag;
    }

    p.food = Math.min(this.cfg.maxFood, p.food + 1);
}

finishAction() {
    this.selected = null;
    const opp = this.opponentOf(this.current);

    // 隱忍：對手放棄後，只要己方有司馬懿在場，對手出牌後可重新出牌
    const oppHasYinren = this.players[opp].fields.some(f => f.some(c =>
        !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
    if (this.players[opp].passed && oppHasYinren) {
        this.players[opp].passed = false;
        this.addLog(opp, `[R${this.round}] 司馬懿【隱忍】：${this.players[opp].name} 可再次出牌`);
    }

    const opponentPassed = this.players[opp].passed;
    if (opponentPassed && this.players.filter(pl => !pl.passed).length === 1) {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = false; this.render();
        return;
    }
    this.startCountdown(() => {
        this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
        this.cover = !this.netMode;
        this.render();
    });
}
doPass() {
    if (this.phase !== 'turn' || this.cover || this.countdown !== null) return;
    this._handoffDoneThisTurn = false;
    const pi = this.current, p = this.players[pi];
    if (p.passed) return;
    if (this.firstPasser === null) this.firstPasser = pi;
    p.passed = true; p.mustFaceUp = false;
    this.lastPasser = pi;
    this.passOrder = this.passOrder || [];
    this.passOrder.push(pi);
    this.addLog(pi, `[R${this.round}] ${p.name} 放棄跟牌`);
    this.recordEvent('pass', { player: pi, foodAfter: p.food });
    this.selected = null; this.selectedField = null;
    if (this.players.every(pl => pl.passed)) {
        if (!this._simaYiLastChanceUsed) {
            for (let pIdx = 0; pIdx < this.numPlayers; pIdx++) {
                const hasYinren = this.players[pIdx].fields.some(f => f.some(c =>
                    !c.faceDown && !c.silenced && (c.data.skills||[]).includes('隱忍')));
                if (hasYinren) {
                    this._simaYiLastChanceUsed = true;
                    this.players[pIdx].passed = false;
                    if (this.firstPasser === pIdx) this.firstPasser = null;
                    this.addLog(pIdx, `[R${this.round}] 司馬懿【隱忍】：全員皆放棄，${this.players[pIdx].name} 獲得最後出牌機會`);
                    this.selected = null; this.selectedField = null;
                    if (pIdx === this.current) { this.cover = false; this.render(); }
                    else { this.cover = true; this.render(); }
                    return;
                }
            }
        }
        this.startPreEnd(); return;
    }
    if (this.players.filter(pl => !pl.passed).length === 1) { this.startPreEnd(); return; }
    this.startCountdown(() => {
        this.players.forEach(pl => pl.hand.forEach(c => c.justDrawn = false));
        this.cover = true;
        this.render();
    });
}
handoff() {
    this.cover = false;
    this.players.forEach(p => p.hand.forEach(c => c.justDrawn = false));
    if (this.phase === 'mulligan') { this.mulliganHandoff(); return; }
    if (this.phase === 'turn') { this.advanceTurn(); return; }
    if (this.phase === 'preend') { this.advancePreEnd(); return; }
    this.render();
}
advanceTurn() {
    if (this.players.every(p => p.passed)) { this.startPreEnd(); return; }
    if (this._handoffDoneThisTurn) return;
    this._handoffDoneThisTurn = true;
    this.players[this.current].mustFaceUp = false;
    // Find next non-passed player in cyclic order
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) { this.current = nxt; break; }
    }
    this.selected = null; this.selectedField = null;
    this._triggerPreTurnFlip();
    this._triggerPangtongLianhuan();
    this._logTurnStart();
    this.render();
    this.maybeJianxiong();
}
_logTurnStart() {
    if (!this.replay) return;
    this.recordEvent('turn_start', {
        player: this.current,
        hands: this.players.map(p => p.hand.map(c => c.data.id)),
        handCounts: this.players.map(p => p.hand.length),
        foods: this.players.map(p => p.food),
        passed: this.players.map(p => !!p.passed)
    });
}

startPreEnd() {
    this.phase = 'preend';
    // 🐛 v3.1 修正：原版只把主動 pass 的玩家放進 preEndOrder，
    // 導致「因對手 pass 而被動進入」的玩家完全沒有 preend 出牌機會。
    // 規則：「後放棄者先有機會在結算前再出一張牌，之後換先放棄者。」
    // 因此：
    //   ① 未主動 pass 的玩家（仍想繼續）視為「最後放棄」→ 排最前面
    //   ② 已主動 pass 的玩家按放棄順序反轉（後放棄者先出）
    const activePlayers = [];
    const passivePlayers = [];
    for (let step = 0; step < this.numPlayers; step++) {
        const pi = (this.roundFirstPlayer + step) % this.numPlayers;
        if (this.players[pi].passed) passivePlayers.push(pi);
        else activePlayers.push(pi);
    }
    passivePlayers.sort((a, b) => {
        const ia = this.passOrder.indexOf(a);
        const ib = this.passOrder.indexOf(b);
        return ib - ia;   // 後放棄者先出
    });
    const order = [...activePlayers, ...passivePlayers];
    this.preEndOrder = order;
    this.preEndDone = order.map(() => false);
    this.preEndIdx = 0;
    this.cover = false;
    this.addLog('bat', '═══ 陣地結算前 ═══');
    this.render();
    if (this.isAI(this.preEndOrder[this.preEndIdx])) {
        this._sTO(() => this.doPreEndAI(), 900);
    }
}
preEndAct() {
    if (this.phase !== 'preend' || this.cover || this.countdown !== null) return;
    if (this.preEndDone[this.preEndIdx]) return;                 // 🛡️ 新增：防止重複觸發
    const pi = this.preEndOrder[this.preEndIdx];
    if (pi === undefined) return;                                 // 🛡️ 新增：安全網
    this.preEndDone[this.preEndIdx] = true;
    this.addLog(pi, `${this.players[pi].name} 放棄出牌`);
    if (this.preEndIdx < this.preEndOrder.length - 1) {
        const nextPi = this.preEndOrder[this.preEndIdx + 1];
        if (this.netMode) {
            setTimeout(() => this.handoff(), 300);
        } else if (!this.isAI(nextPi)) {
            this.cover = true; this.render();
        } else {
            this._sTO(() => this.handoff(), 500);
        }
    } else this.settle();
}
advancePreEnd() {
    if (this.preEndIdx >= this.preEndOrder.length - 1) return;    // 🛡️ 新增：邊界防護
    this.preEndIdx++; this.cover = false; this.render();
    if (this.isAI(this.preEndOrder[this.preEndIdx])) {
        if (this.aiTimer) clearTimeout(this.aiTimer);             // 🛡️ 新增：與 scheduleAI 共用同一個 timer
        this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
    }
}
/* v3.1 新增：AI 在結算前階段的出牌邏輯 */
doPreEndAI() {
    if (this.phase !== 'preend') return;
    const pi = this.preEndOrder[this.preEndIdx];
    if (pi === undefined) return;
    if (!this.isAI(pi)) return;
    if (this.preEndDone[this.preEndIdx]) return;

    const p = this.players[pi];
    const bi = this.currentBfIndex;
    const oppPi = this.opponentOf(pi);
    const opp = this.players[oppPi];

    // 目前可見戰力 + 埋伏牌估算（保守：每張背面 3 點預期）
    const myVisible = this.fieldPower(pi, bi, false);
    const oppVisible = this.fieldPower(oppPi, bi, false);
    const myFlipPotential = p.fields[bi].filter(c => c.faceDown).length * 3;
    const oppFlipPotential = opp.fields[bi].filter(c => c.faceDown).length * 3;

    const myEff = myVisible + myFlipPotential;
    const oppEff = oppVisible + oppFlipPotential;

    // 平手時先手方勝
    const iAmFirst = (this.roundFirstPlayer === pi);
    const margin = myEff - oppEff;

    // 決定投入等級 0~5
    let invest = 0;
    if (margin >= 8) invest = 0;                            // 穩贏大：省資源
    else if (margin >= 4) invest = 1;                       // 穩贏中：只打 1 糧牌保險
    else if (margin >= 1) invest = 2;                       // 小贏：適度加碼
    else if (margin === 0 && iAmFirst) invest = 0;          // 平手先手：已算贏
    else if (margin === 0 && !iAmFirst) invest = 4;         // 平手後手：必須加碼
    else if (margin >= -3) invest = 4;                      // 小落後：全力追
    else invest = 5;                                        // 大落後：梭哈

    if (invest === 0) { this.preEndAct(); return; }

    // 找可出的牌
    const playable = p.hand.filter(c =>
        c.data.forceFaceDown ? true : c.data.cost <= p.food
    );
    if (playable.length === 0) { this.preEndAct(); return; }

    // 依「效率」選牌
    let best = null, bestScore = -Infinity;
    for (const c of playable) {
        let s = c.data.power;
        if (c.data.isAmbush) s += 1;                 // 埋伏可延後付糧
        if (invest >= 4) s = c.data.power * 2 - c.data.cost;
        // 若為上將且還在 preend：價值更高（可翻盤）
        if (c.data.isGeneral) s += 3;
        if (s > bestScore) { bestScore = s; best = c; }
    }
    if (!best) { this.preEndAct(); return; }

    // 若最強的一張也追不上，pass 省資源
    const projected = myVisible + (best.data.power || 0) + myFlipPotential;
    if (projected + 1 < oppEff && invest < 5) {
        this.preEndAct();
        return;
    }

    // 判斷正面或埋伏
    let asAmbush = false;
    if (best.data.forceFaceDown) asAmbush = true;
    else if (!this.canPlayNormally(best, pi) && this.canPlayAmbush(best, pi)) asAmbush = true;
    else if (this.canPlayAmbush(best, pi) && !this._shouldPlayFaceUp(best, pi, bi)) asAmbush = true;

    this.doPreEndPlay(best, asAmbush, bi);
}

/* v3.1 新增：在 preend 出牌的實作（與 doPlay 類似但狀態不同） */
doPreEndPlay(inst, asAmbush, bi) {
    const pi = this.preEndOrder[this.preEndIdx];
    const p = this.players[pi];
    if (!inst || !p.hand.includes(inst)) { this.preEndAct(); return; }
    if (!asAmbush && p.food < inst.data.cost) { this.preEndAct(); return; }

    if (!asAmbush) {
        p.food -= inst.data.cost;
        p.roundSpent += inst.data.cost;
    }
    p.hand = p.hand.filter(c => c.uid !== inst.uid);
    inst.faceDown = !!asAmbush;
    inst.mod = 0; inst.burn = false; inst.silenced = false; inst.activated = false;
    inst.fresh = true; inst.usesLeft = undefined;
    inst.enteredFaceUp = !asAmbush;
    inst.grantedFubing = !!(asAmbush && !inst.data.isAmbush && this.hasShefuBonus(pi, bi));
    p.fields[bi].push(inst);
    this.cardsPlayedCount++;
    p.cardsPlayedByPlayer = (p.cardsPlayedByPlayer || 0) + 1;
    if (!asAmbush) this.players[pi].lastFaceUpEnemy[bi] = inst;

    this.addLog(pi, `[R${this.round}·結算前] ${p.name} ${asAmbush ? '埋伏' : '加碼'} ${inst.data.name}（-${asAmbush ? 0 : inst.data.cost}糧｜餘${p.food}）`);

    if (!asAmbush) this.runEntryTriggers(pi, inst, bi);
    this.applyBurn(pi);
    this.drawOne(pi);

    this.preEndDone[this.preEndIdx] = true;

    // 進入下一位
    if (this.preEndIdx < this.preEndOrder.length - 1) {
        this.preEndIdx++;
        this.cover = false;
        this.render();
        if (this.isAI(this.preEndOrder[this.preEndIdx])) {
            this._sTO(() => this.doPreEndAI(), 700);
        } else if (!this.netMode) {
            this.cover = true;
            this.render();
        }
    } else {
        this.settle();
    }
}

/* ============ AI decision ============ */
decidePlayAI(pi) {
    const diff = this.getAIDifficulty(pi);
    const p = this.players[pi];
    const opp = this.players[this.opponentOf(pi)];
    const bi = this.currentBfIndex;
    const myField = p.fields[bi];
    const oppField = opp.fields[bi];
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);
    const totalOnField = myField.length + oppField.length;
    const oppPassed = opp.passed;
    const myWins = p.wins, oppWins = opp.wins;
    const oppAtMatchPoint = (oppWins === 1);
    const myFieldEmpty = myField.length === 0;
    const isFirstMoveOfRound = myFieldEmpty && oppField.length === 0;
    const iAmResponding = myFieldEmpty && oppField.length > 0;
    const alreadyWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === pi));
    const oppWonRound1 = (this.round > 1 && this.history.some(h => h.round === 1 && h.winner === (this.opponentOf(pi))));
    const iAmAheadInMatch = myWins > oppWins;
    const iAmBehindInMatch = myWins < oppWins;
    const myPendingFlipCost = myField.filter(c => c.faceDown).reduce((s, c) => s + c.data.cost, 0);

    const oppFoodPotential = Math.min(opp.food, 8) * 1.5;
    const oppHandPotential = Math.min(opp.hand.length, 5) * 3;
    const oppFaceDownCount = oppField.filter(c => c.faceDown).length;
    const oppFlipPotential = oppFaceDownCount * 1.5;
    const myFlipPotential = myField.filter(c => c.faceDown).reduce((s, c) => s + (c.data.power || 0), 0);
    const oppMaxPotential = Math.min(oppFoodPotential, oppHandPotential) + oppFlipPotential;
    const myEffectivePow = myPow + myFlipPotential;
    const oppEffectivePow = oppPow + oppFlipPotential;
    const myLead = myEffectivePow - oppEffectivePow;
    const safeLead = myEffectivePow > (oppPow + oppMaxPotential + 2);
    const alreadyWinningBig = myLead > 8;
    const iAmSecondPlayer = (this.current !== this.roundFirstPlayer);
    const mustWinThisRound = oppAtMatchPoint;

    const playable = p.hand.filter(c => this.canPlayNormally(c, pi) || this.canPlayAmbush(c, pi));
    if (playable.length === 0) return { play: false, reason: 'no_playable' };

    const scored = playable.map(c => ({
        card: c,
        score: this.scoreCardAI(c, pi, diff, { myPow, oppPow, mustWinThisRound, myPendingFlipCost,
            isFirstMoveOfRound, iAmResponding, alreadyWinningBig, alreadyWonRound1, oppWonRound1,
            iAmAheadInMatch, iAmBehindInMatch })
    })).sort((a, b) => b.score - a.score);
    let best = scored[0];
    let shouldPlay = true;
    let reason = 'default';

    if (mustWinThisRound && isFirstMoveOfRound) { shouldPlay = true; reason = 'must_win_first'; }
    else if (mustWinThisRound && myPow <= oppPow) { shouldPlay = true; reason = 'must_win_behind'; }
    else if (alreadyWonRound1 && !mustWinThisRound && safeLead) { shouldPlay = false; reason = 'have_one_win_safe'; }
    else if (oppPassed && safeLead) { shouldPlay = false; reason = 'safe_lead'; }
    else if (oppPassed && myLead >= 15 && diff === 'hard') { shouldPlay = false; reason = 'crushing_lead'; }
    else if (oppPassed && myLead >= 10 && diff === 'hard') { shouldPlay = this.rng() < 0.05; reason = 'huge_lead'; }
    else if (oppPassed && myLead >= 6 && diff === 'hard') { shouldPlay = this.rng() < 0.15; reason = 'big_lead'; }
    else if (oppPassed && myLead >= 3 && diff === 'hard') { shouldPlay = this.rng() < 0.4; reason = 'moderate_lead'; }
    else if (oppPassed && iAmSecondPlayer && Math.abs(myEffectivePow - oppEffectivePow) <= 3) { shouldPlay = true; reason = 'break_tie'; }
    else if (oppPassed && myFieldEmpty) { shouldPlay = true; reason = 'empty_field'; }
    else if (oppPassed && myPow < oppPow) { shouldPlay = true; reason = 'behind_opp'; }
    else if (oppPassed) {
    // v3.1：對手已放棄，根據目前差距決定是否繼續加碼
    // 注意：對手還有埋伏牌，估算風險
    const oppFlipRisk = oppField.filter(c => c.faceDown).length * 3;
    const projectedOpp = oppPow + oppFlipRisk;
    const marginNow = myEffectivePow - projectedOpp;

    if (marginNow >= 10) shouldPlay = this.rng() < 0.15;          // 大優：省資源
    else if (marginNow >= 6) shouldPlay = this.rng() < 0.45;
    else if (marginNow >= 3) shouldPlay = this.rng() < 0.85;
    else shouldPlay = true;                                        // 小優/平/劣：必出
    reason = 'opp_pass_margin_' + Math.round(marginNow);
}
    else {
        const spareResources = p.hand.length >= 3 && p.food >= 3;
        if (spareResources && myLead > -8) { shouldPlay = true; reason = 'spare'; }
        else if (totalOnField >= 5) {
            if (myLead > 8) shouldPlay = this.rng() < 0.05;
            else if (myLead > 4) shouldPlay = this.rng() < 0.2;
            else if (myLead < -8) shouldPlay = true;
            else if (myLead < -3) shouldPlay = this.rng() < 0.95;
            else shouldPlay = this.rng() < 0.8;
        } else if (totalOnField >= 3) {
            if (myLead > 6) shouldPlay = this.rng() < 0.15;
            else if (myLead < -5) shouldPlay = true;
            else if (myLead < -2) shouldPlay = this.rng() < 0.9;
            else shouldPlay = this.rng() < 0.85;
        } else shouldPlay = true;
        if (diff === 'hard' && opp.food >= 8 && myLead > 3) shouldPlay = this.rng() < 0.5;
        if (mustWinThisRound && myPow <= oppPow) shouldPlay = true;
    }
    if (!shouldPlay) return { play: false, reason };

    if (best.card.data.isGeneral && !best.card.data.forceFaceDown) {
        const tiedAsSecond = (myEffectivePow === oppEffectivePow && iAmSecondPlayer);
        if (tiedAsSecond) {
            const otherNonGen = scored.filter(s => s.card !== best.card && !s.card.data.isGeneral);
            if (otherNonGen.length > 0) best = otherNonGen[0];
        } else if (!(oppPassed && myPow > oppPow + 2)) {
            const otherNonGen = scored.filter(s => s.card !== best.card && !s.card.data.isGeneral);
            if (otherNonGen.length > 0) {
                const projected = myPow + best.card.data.power;
                const wouldWin = projected > oppPow;
                const needGeneral = (!wouldWin) || (oppPassed && myPow < oppPow);
                if (!needGeneral && projected > oppPow + 5) best = otherNonGen[0];
                else if (!needGeneral && best.score - otherNonGen[0].score < 12) best = otherNonGen[0];
            }
        }
    }

    let asAmbush = false;
    if (this.canPlayAmbush(best.card, pi)) {
        const flipCost = best.card.data.cost;
        const canFlipLater = p.food >= flipCost;
        if (best.card.data.forceFaceDown) {
            asAmbush = true;
        } else if (!this.canPlayNormally(best.card, pi)) {
            if (!canFlipLater) return { play: false, reason: 'cannot_afford_flip' };
            asAmbush = true;
        } else {
            // 100% 埋伏為預設；只有「正面有明確效益」時才正面
            asAmbush = !this._shouldPlayFaceUp(best.card, pi, bi);
        }
    }
    return { play: true, card: best.card, asAmbush, reason };
}
doTurnAI() {
    if (this.state !== 'battle' || this.phase !== 'turn') return;
    const pi = this.current;
    if (!this.isAI(pi)) return;
    if (this.cover || this.countdown !== null) return;
    if (this.scry) { this.resolveAIScry(); return; }
    if (this.jianxiong) { this.resolveAIJianxiong(); return; }
    if (this.lianying) { this.lyCancel(); return; }
    this.maybeAutoQuanhengAI(pi);
    this.maybeAutoLianyingAI(pi);
    this.maybeAutoJiushiAI(pi);
    const decision = this.decidePlayAI(pi);
    if (!decision.play) { this.doPass(); return; }
    this.selected = decision.card.uid;
    this.render();
    this._sTO(() => { this.doPlay(decision.asAmbush); }, 500);
}
maybeAutoQuanhengAI(pi) {
    const bi = this.currentBfIndex;
    const sq = this.players[pi].fields[bi].find(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('權衡'));
    if (!sq) return false;
    const p = this.players[pi];
    if (p.hand.length < 4) return false;
    const sorted = [...p.hand].sort((a, b) => (a.data.power/Math.max(1,a.data.cost)) - (b.data.power/Math.max(1,b.data.cost)));
    const weak = sorted.slice(0, 2).filter(c => c.data.power <= 2);
    if (weak.length < 2) return false;
    weak.forEach(c => { const i = p.hand.findIndex(x => x.uid === c.uid); if (i >= 0) { this.archive.push(p.hand[i]); p.hand.splice(i, 1); } });
    this.drawTo(pi, 2);
    this.addLog(pi, `[R${this.round}] 孫權【權衡】(AI)：棄 2 抽 2`);
    return true;
}
maybeAutoLianyingAI(pi) {
    const bi = this.currentBfIndex;
    const lu = this.players[pi].fields[bi].find(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('連營'));
    if (!lu) return false;
    const targets = this.players[this.opponentOf(pi)].fields[bi].filter(c => !c.faceDown && !c.burn);
    if (targets.length === 0) return false;
    let target = targets[0];
    targets.forEach(t => { if (this.getPower(t, this.opponentOf(pi), bi, false) > this.getPower(target, this.opponentOf(pi), bi, false)) target = t; });
    target.burn = true; lu.silenced = true;
    this.addLog(pi, `[R${this.round}] 陸遜【連營】(AI)：${target.data.name} 燃燒`);
    return true;
}
maybeAutoJiushiAI(pi) {
    const c = this.findJiushiCard(pi);
    if (!c) return false;
    const p = this.players[pi];
    const bi = this.currentBfIndex;
    const myField = p.fields[bi];
    const oppField = this.players[this.opponentOf(pi)].fields[bi];
    const myPow = this.fieldPower(pi, bi, false);
    const oppPow = this.fieldPower(this.opponentOf(pi), bi, false);

    // v3.1：只有以下情況才使用酒詩
    // ① 手牌 ≤ 2 張（快打光了，保住這張有價值）
    // ② 我方已打出的累計牌數 ≥ 9（快接近上限）
    // ③ 落後且需要這張的糧草補給
    // 否則濫用只是浪費行動
    const played = p.cardsPlayedByPlayer || 0;
    const shouldUse =
        (p.hand.length <= 2) ||
        (played >= 9) ||
        (myPow < oppPow - 3 && p.food <= 2);
    if (!shouldUse) return false;

    this.current = pi;
    this.activateJiushi();
    return true;
}
scoreCardAI(c, pi, diff, ctx) {
    const d = c.data;
    const p = this.players[pi];
    const opp = this.players[this.opponentOf(pi)];
    const bi = this.currentBfIndex;
    const myPow = ctx.myPow !== undefined ? ctx.myPow : this.fieldPower(pi, bi, false);
    const oppPow = ctx.oppPow !== undefined ? ctx.oppPow : this.fieldPower(this.opponentOf(pi), bi, false);
    let score = 0;
    if (d.isAmbush || d.forceFaceDown) score = 4 + d.power + ((d.skills || []).length);
    else {
        score = d.power * 2 - d.cost;
        if (d.power >= 6) score += 5;
        if (d.skills) score += d.skills.length * 1.5;
        const sk = d.skills || [];
        if (sk.includes('威嚇') || sk.includes('嘲諷')) score += 3;
        if (sk.includes('王')) score += 4;
    }
    if (d.cost > p.food - 2) score -= 4;

    const myFieldNow = this.players[pi].fields[bi];
    const oppFieldNow = this.players[this.opponentOf(pi)].fields[bi];
    if (d.id === 'zhaoyun') score += oppFieldNow.length * 1.5;
    /* 關興 / 張苞：父魂需要不同陣地有對應上將；虎子需要另一個在場 */
    if (d.id === 'guanxing' || d.id === 'zhangbao') {
        const fatherId = d.id === 'guanxing' ? 'guanyu' : 'zhangfei';
        const brotherId = d.id === 'guanxing' ? 'zhangbao' : 'guanxing';
        const fatherElsewhere = this.players[pi].fields.some((f, idx) => idx !== bi && f.some(c => c.data.id === fatherId));
        const brotherAnywhere = this.players[pi].fields.some(f => f.some(c => c.data.id === brotherId));
        if (fatherElsewhere) score += 5;
        if (brotherAnywhere) score += 5;
        // 若兩者皆已具備，超強
        if (fatherElsewhere && brotherAnywhere) score += 4;
    }	
    /* 姜維 繼志：場上友軍（含自己這張進場後）越多越值 */
    if (d.id === 'jiangwei') {
        const allies = myFieldNow.filter(c => !c.faceDown).length;
        score += allies * 1.5;
    }
    /* 孟獲 七擒：落後時可移動 — 值在於「劣勢時可轉場」，屬防守型 */
    if (d.id === 'menghuo') {
        // 賽末點時不應出（因為他會轉場，反而失去當前陣地）
        if (ctx.mustWinThisRound && (myPow <= oppPow)) score -= 5;
    }
    /* 祝融 烈刃：場上有敵軍時進場打一發，敵陣有高價值目標時加分 */
    if (d.id === 'zhurong') {

    if (d.id === 'sunqian') {
        // 沒特殊加分，靠基礎分
    }
    /* 李嚴 腹鱗：場上已有大牌 → 扣分 */
    if (d.id === 'liyan') {

    if (d.id === 'pangtong') {

        const DAMAGERS = ['威嚇','烈矢','飛矢','霸王','火攻','烈刃'];
        const hasDamagerOnField = myFieldNow.some(c => !c.faceDown &&

    if (d.id === 'masu') {

    /* 諸葛亮 空城：靜態戰力不是 0，而是「場上疑兵數 × 3（基本） + mod」。

    if (d.id === 'zhugeliang') {
        const yb = myFieldNow.filter(c => (c.data.skills||[]).includes('疑兵')).length;

    if ((d.skills||[]).includes('斷路') || (d.skills||[]).includes('伏兵')) {

    const aura = (d.skills||[]).find(s => ['蜀王','魏王','吳王'].includes(s));
    if (aura) {

        score += myFieldNow.filter(c => !c.faceDown && c.data.faction === fac).length * 3;
    }
    if ((d.skills||[]).includes('嘲諷')) { if (oppFieldNow.length === 0) score += 5; }
    /* ============ 魏 原版 12 張 AI 加分 ============ */

    if (d.id === 'guojia') {

        if (gap > 0) score += 3;   // 落後時更值
        score += 4;                 // 料算價值
        if (this.deck.length <= 10) score += 2;  // 牌庫接近尾聲更值
        if (p.food <= 2) score += 1;             // 1 糧便宜牌，低資源時也好用
    }
    /* 司馬懿 隱忍：無視嘲諷 + 延後放棄 = 強防禦/節奏牌 */
    if (d.id === 'simayi') {

    if (d.id === 'caoren') {
        const lead = myPow - oppPow;
        if (lead < -3) score += 8;   // 落後時保護力強
        else if (lead < 0) score += 4;

    if (d.id === 'xiahoudun') {

    if (d.id === 'dianwei') {

    if (d.id === 'xuchu') {

    if (d.id === 'zhangliao') {

        // 敵陣有正面牌 → 止啼會沉默下一張進場的

    /* 徐晃 劫糧：贏這輪時 +1 糧，領先時更值 */
    if (d.id === 'xuhuang') {

    if (d.id === 'zhanghe') {

    if (d.id === 'yujin') {

    // anti-synergy 不屈 vs 督戰/堅守
    if ((d.skills||[]).includes('不屈')) {

    if ((d.skills||[]).some(s => s === '督戰' || s === '堅守')) {

        if (d.isGeneral) oppCeiling = oppBoardAfter + Math.min(opp.hand.length, 3) * 6;

    if (d.id !== 'machao') {

    if (d.id === 'liubei' || d.id === 'xushu') {

        else if (gap > 3) score += 6;    // 中劣
        else if (gap > 0) score += 3;    // 小劣

    /* 建言（法正）：進場後同陣地其他正面友軍 +1 */
    if ((d.skills||[]).includes('建言')) {

    if (d.id === 'zhouyu') {

    if (d.id === 'huanggai') {

    if (d.id === 'luxun') {
        const maxEnemyPower = oppFieldNow.filter(c=>!c.faceDown).reduce((m,c)=>Math.max(m, c.data.power+(c.mod||0)), 0);
        if (maxEnemyPower > d.power) score += 4;
        if (_enemyVisCnt > 0) score += 3;         // 連營可指定
        if (_enemyHasDanger) score += 4;          // 連營可壓制關鍵牌

    if (d.id === 'sunce' || d.id === 'taishici') {

    if (d.id === 'lurusu' || d.id === 'lusu') {

        if (followupBig >= 2) score += 5;

        if (this.current === this.roundFirstPlayer && this.firstPasser === null) score += 2;

    if (d.id === 'lumeng') {

        score += higherEnemies * 2;
        // 己方已有潘璋 / 伏兵 → 背面呂蒙更有價值
        const hasFubingSetup = myFieldNow.some(c => !c.faceDown &&

    if (d.id === 'chengpu') {

    if (d.id === 'panzhang') {

            (c.data.skills||[]).includes('伏兵')).length;

    if (d.id === 'sunquan') {

    if (d.id === 'zhoutai') {

       場上牌數越多越值。空場時嚴重浪費。 */
    if (d.id === 'zhonghui') {

        if (fieldCount >= 3) score += fieldCount * 2.5;
        else if (fieldCount >= 2) score += 4;
        else score -= 6;              // 空場或 1 張，權謀/自立幾乎不觸發
    }
    /* 曹丕【魏王/放逐】：魏王是通用 aura，放逐是手牌過濾。
       手上有 2+ 張爛牌 → 放逐很值；能吃到魏王光環更值。 */
    if (d.id === 'caopi') {
        const badInHand = p.hand.filter(c => {
            const r = c.data.power / Math.max(1, c.data.cost);
            return c.data.cost >= 3 || r < 1.0;
        }).length;
        if (badInHand >= 2) score += 6;
        else if (badInHand === 1) score += 3;
        // 魏國友軍在場 → 魏王 aura 加分
        const weiAllies = myFieldNow.filter(c => !c.faceDown && c.data.faction === 'wei').length;
        if (weiAllies >= 2) score += 3;
    }
    /* 曹彰【將馳】上將：額外支付糧草換戰力。
       糧草充裕 + 對手無強牌時暴強；糧草不足時浪費。 */
    if (d.id === 'caozhang') {
        const spareFood = p.food - 1;             // 進場費 1，其餘可灌
        if (spareFood >= 4) score += 8;
        else if (spareFood >= 2) score += 5;
        else if (spareFood >= 1) score += 2;
        // 對手目前最高戰力 vs 曹彰可達戰力
        const maxEnemyP = oppFieldNow.filter(c=>!c.faceDown).reduce((m,c)=>Math.max(m, c.data.power+(c.mod||0)), 0);
        const myMaxP = 2 + Math.min(5, spareFood) * 2 + 2;  // 基礎2 + 灌糧 + 最高+2
        if (myMaxP > maxEnemyP) score += 4;
        // 賽末點時不該出（灌光糧草但可能失敗）

    if (d.id === 'jiaxu') {

        // 每個可移除目標都算分，尤其他有輔助技能更值
        targets.forEach(t => {

            const hasAura = tsk.some(s => ['蜀王','魏王','吳王','建言','督戰','堅守','隱忍'].includes(s));
            score += hasAura ? 6 : 3;
        });
    }

    if (d.id === 'xunyu') {

resolveAIScry() {
    if (!this.scry) return;
    const { pi, cards } = this.scry;
    const n = cards.length;
    if (n === 0) { this.scryConfirm(); return; }

    // 1. 對每張牌評分
    const scored = cards.map(c => ({
        card: c,
        score: this._scryCardValue(c, pi)
    })).sort((a, b) => b.score - a.score);  // 高到低

    // 2. 決定每張牌屬於誰
    const owners = this._scryDrawOwners(pi, n);

    // 3. 貪心分配：
    //    - 位置是 AI 的 → 取「剩下最好的」
    //    - 位置不是 AI 的 → 給「剩下最差的」
    const result = new Array(n);
    let head = 0, tail = n - 1;
    for (let i = 0; i < n; i++) {
        if (owners[i] === pi) {
            result[i] = scored[head++].card;
        } else {
            result[i] = scored[tail--].card;
        }
    }

    this.scry.order = result.map(c => c.uid);
    this.scryConfirm();
}
resolveAIJianxiong() {
    if (!this.jianxiong) return;
    const diff = this.getAIDifficulty(this.jianxiong.pi);
    let guess;
    if (diff === 'hard') {
        const weights = {};
        const sets = this.cfg.cardSets || {};
        CARD_DB.forEach(def => {
            if (!(def.isAmbush || def.forceFaceDown)) return;
            const setCfg = sets[def.set];
            if (!setCfg || !setCfg[def.faction]) return;
            const copies = def.count || 1;
            const pw = def.power || 0;
            weights[pw] = (weights[pw] || 0) + copies;
        });
        let best = 0, bestW = -1;
        Object.entries(weights).forEach(([v, w]) => { if (w > bestW) { bestW = w; best = parseInt(v); } });
        guess = best;
    } else guess = [0, 1, 2, 3, 4, 6][Math.floor(this.rng() * 6)];
    this.jianxiong.guess = guess;
    this.jxConfirm();
}
/* ============ 觀星/料算 AI 增強 ============ */
/* 對 AI 來說，一張牌的「價值」——用於 scry 排序 */
_scryCardValue(card, pi) {
    const d = card.data;
    const p = this.players[pi];
    let v = d.power || 0;

    // 費用效率
    if (d.cost > 0) v += Math.max(0, 3 - d.cost) * 0.5;

    // 0 費疑兵 + 諸葛亮 = 白給戰力
    if ((d.skills || []).includes('疑兵')) {
        const hasZhuge = p.fields.some(f => f.some(c =>
            !c.faceDown && !c.silenced && c.data.id === 'zhugeliang'));
        v += hasZhuge ? 8 : 2;
    }

    // 諸葛亮本身價值 = 場上疑兵數 × 3（估算）
    if (d.id === 'zhugeliang') {
        const ybCount = p.fields.flat().filter(c =>
            (c.data.skills || []).includes('疑兵')).length;
        v = Math.max(3 * ybCount, 3);
    }

    // 上將價值
    if (d.isGeneral) v += 3;

    // 王類光環 / 建言
    const auraSkills = ['蜀王', '魏王', '吳王', '建言'];
    if ((d.skills || []).some(s => auraSkills.includes(s))) {
        const allies = p.fields.flat().filter(c =>
            !c.faceDown && c.data.faction === d.faction).length;
        v += Math.min(allies, 3) * 1.5;
    }

    // Combo 啟動器 / 關鍵牌
    const comboAssets = {
        'liushan': 4, 'guanping': 4, 'caohong': 4,
        'zhangjiao': 3, 'zhangbaogong': 3, 'zhangliang': 3,
        'pangtong': 3, 'chengyu': 3,
    };
    if (comboAssets[d.id]) v += comboAssets[d.id];

    return v;
}
/* 從 AI 開始，回傳「每張牌會被誰抽」的順序（依出牌輪轉） */
_scryDrawOwners(pi, n) {
    const owners = [];
    for (let i = 0; i < n; i++) owners.push((pi + i) % this.numPlayers);
    return owners;
}

/* ============ AI 個性台詞庫 ============ */
_aiLines(pers) {
    if (pers === 'malignant') {
        return {
            greeting:  ['來吧！', '接招吧！', '看我的！', '出手吧！'],
            taunt:     ['輕鬆！', '太弱了！', '不堪一擊！', '這就是我的實力！', '見識到了嗎？'],
            defeat:    ['可惡…', '下一輪！', '我不會再輸！', '小看你了', '給我記住！'],
            retaliate: ['哼！', '走著瞧！', '別得意！', '回嘴是吧？', '有意思…'],
            general:   ['上將出陣！', '萬夫莫敵！', '決勝負吧！', '看我這一擊！'],
            winMsg:    [CHAT_MSG[1], CHAT_MSG[2]],    // 打得不錯！ / 抱歉
            winEmoji:  [CHAT_EMOJI[0], CHAT_EMOJI[1], CHAT_EMOJI[2], CHAT_EMOJI[3],
                        CHAT_EMOJI[4], CHAT_EMOJI[6], CHAT_EMOJI[7], CHAT_EMOJI[9]]
        };
    }
    return null;
}

_pick(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(this.rng() * arr.length)];
}

_chatBubble(pi, text, delay = 0) {
    if (!text) return;
    const fire = () => { try { showChatBubble(pi, text); } catch(e) {} };
    if (delay > 0) this._sTO(fire, delay);
    else fire();
}

/* ============ AI 聊天觸發器（個性化） ============ */
aiChatTrigger(pi, event, opts = {}) {
    if (this.netMode) return;
    if (!this.isAI(pi)) return;
    const p = this.players[pi];
    const pers = p.personality || 'malignant';
    const r = this.rng();

    /* ---- Cold（❄️）：從不打招呼、極少發話 ---- */
    if (pers === 'cold') {
        if (event === 'win_round' && r < 0.30) {
            this._chatBubble(pi, CHAT_EMOJI[9], 600);   // 🥀
        }
        // 其他事件全部靜默
        return;
    }

    /* ---- Kind（👑）：友善、有禮貌 ---- */
    if (pers === 'kind') {
        if (event === 'round_start') {
            this._chatBubble(pi, CHAT_EMOJI[0], 400);                  // 😀
            this._sTO(() => this._chatBubble(pi, CHAT_MSG[0]), 900);   // 你好！
            return;
        }
        if (event === 'win_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[1], 600); // 😂
            else if (r < 0.60) this._chatBubble(pi, CHAT_EMOJI[5], 600); // 👍
            else if (r < 0.80) this._chatBubble(pi, CHAT_EMOJI[0], 600); // 😀
            // 剩 20% 靜默
            return;
        }
        if (event === 'lose_round') {
            if      (r < 0.20) this._chatBubble(pi, CHAT_EMOJI[6], 600); // 👎
            else if (r < 0.40) this._chatBubble(pi, CHAT_EMOJI[7], 600); // 😠
            // 剩 60% 靜默
            return;
        }
        if (event === 'general') {
            if (r < 0.50) this._chatBubble(pi, CHAT_MSG[0], 250);  // 你好！
            else          this._chatBubble(pi, CHAT_MSG[2], 250);  // 抱歉
            return;
        }
        if (event === 'gameover') {
            // 不論輸贏都稱讚
            this._chatBubble(pi, CHAT_MSG[1], 800);   // 打得不錯！
            return;
        }
        // 被玩家嗆 → 完全不回應
        return;
    }

    /* ---- Malignant（🤖）：噁心人 ---- */
    const L = this._aiLines('malignant');
    if (event === 'round_start') {
        if (r < 0.30) this._chatBubble(pi, this._pick(L.greeting), 400);
        return;
    }
    if (event === 'win_round') {
        const emoji = this._pick(L.winEmoji);
        const msg   = this._pick(L.winMsg);
        this._chatBubble(pi, `${emoji} ${msg}`, 700);
        return;
    }
    if (event === 'lose_round') {
        if (r < 0.50) this._chatBubble(pi, this._pick(L.defeat), 800);
        return;
    }
    if (event === 'general') {
        if (r < 0.45) this._chatBubble(pi, this._pick(L.general), 250);
        return;
    }
    if (event === 'gameover') {
        if (opts.won) {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.taunt), 800);
        } else {
            if (r < 0.70) this._chatBubble(pi, this._pick(L.defeat), 800);
        }
        return;
    }
    if (event === 'human_chat') {
        if (r < 0.80) this._chatBubble(pi, this._pick(L.retaliate), 700 + this.rng() * 800);
        return;
    }
}

/* 玩家嗆 AI → 依個性回應 */

        }
        const delta = (highest.data.power||0) - (chengyu.data.power||0);
        if (delta > 0) {
            chengyu.mod = (chengyu.mod || 0) + delta;
            this.addLog(pi, `【捧日】${chengyu.data.name}：基本戰力改為 ${highest.data.power}（參照 ${highest.data.name}）`);
        } else {
            this.addLog(pi, `【捧日】${chengyu.data.name}：本陣背面牌不強於自己，不觸發`);
        }
    }

    const toDiscard = [];
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const snapshot = [...this.players[pi].fields[bi]];
        for (const c of snapshot) {
            if (!c.faceDown) continue;
            if (!this.players[pi].fields[bi].includes(c)) continue;
            c.faceDown = false; c.fresh = true;
            c.keepOnField = false;
            if (c.data.skills && c.data.skills.includes('疑兵') && !c.silenced) {
                if (c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
                if (!c.keepOnField) {
                    c.willRemove = true;
                    this.addLog(pi, `【疑兵】${c.data.name} 翻開，結算後移除`);
                }
            } else if (this.players[pi].food >= c.data.cost) {
                this.players[pi].food -= c.data.cost;
                this.addLog(pi, `【伏兵】${c.data.name}(${c.data.cost}糧/${c.data.power}戰力) 翻開`);
                if (!c.silenced && c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
            } else {
                c.willDiscard = true;
                toDiscard.push(c);
                this.addLog(pi, `【伏兵】糧草不足，棄置！`);
            }
        }
    }
    this.render();
    await this._sleep(800);

    if (toDiscard.length) {
        for (let pi = 0; pi < this.numPlayers; pi++)
            this.players[pi].fields[bi] = this.players[pi].fields[bi].filter(c => !c.willDiscard);
        toDiscard.forEach(c => this.archive.push(c));
        this.render(); await this._sleep(400);
    }

    const order = [];
    for (let step = 0; step < this.numPlayers; step++) {
        order.push((this.current + step) % this.numPlayers);
    }
    for (const pi of order) {
        const f = [...this.players[pi].fields[bi]];
        for (const c of f) {
            if (c.faceDown || c.silenced) continue;
            if (c.data.onSettle) c.data.onSettle(this._ctxFor(pi, c, bi, null));
        }
    }
    this.render(); await this._sleep(400);

    const powers = [];
    for (let pi = 0; pi < this.numPlayers; pi++) powers.push(this.totalPower(pi, false));
    const maxPow = Math.max(...powers);
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const behind = powers[pi] < maxPow;
        if (!behind) continue;
        const foesList = this.enemiesOf(pi);
        for (let fb = 0; fb < this.fieldCount; fb++) {
            const own = this.players[pi].fields[fb];
            // Betray to left neighbor (opponentOf)
            const leftFoe = this.opponentOf(pi);
            const foes = this.players[leftFoe].fields[fb];
            const movers = own.filter(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('反骨') && !c.activated);
            movers.forEach(c => {
                own.splice(own.indexOf(c), 1);
                c.activated = true; c.betrayed = true; c.betrayedFrom = pi;
                foes.push(c);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【反骨】背叛！加入 ${this.players[leftFoe].name} 陣營`);
            });
        }
    }
    if (this.players.some(p => p.fields[bi].some(c => c.betrayed)))
        { this.render(); await this._sleep(500); }

    for (let pi = 0; pi < this.numPlayers; pi++) {
        const f = this.players[pi].fields[bi];
        for (let i = f.length - 1; i >= 0; i--) {
            if (f[i].willRemove) {
                this.flashRemove(f[i]);
                f[i].originalOwner = pi;
                this.archive.push(f[i]); f.splice(i, 1);
            }
        }
    }

    // Compute per-player field powers
    const totals = [];
    for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, true));

    // Team totals (if teams mode)
    const teamTotals = {};
    if (this.teams) {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            const tid = this.seatTeam[pi];
            teamTotals[tid] = (teamTotals[tid] || 0) + totals[pi];
        }
    }

    // Determine winner
    let winner = 0;
    let tieBreakerOrder = (pi) => (pi - this.roundFirstPlayer + this.numPlayers) % this.numPlayers;

    if (this.teams) {
        const tids = Object.keys(teamTotals).map(Number);
        let bestTeam = tids[0], bestVal = teamTotals[bestTeam];
        for (const tid of tids) {
            if (teamTotals[tid] > bestVal) { bestTeam = tid; bestVal = teamTotals[tid]; }
            else if (teamTotals[tid] === bestVal) {
                // Tie between teams → use firstPlayer's team
                const firstTeam = this.seatTeam[this.roundFirstPlayer];
                if (tid === firstTeam) bestTeam = tid;
            }
        }
        // Pick lowest-seat member of winning team as winner (represents team)
        winner = Math.min(...this.teams[bestTeam]);
        // Award wins to all team members
        this.teams[bestTeam].forEach(seat => { this.players[seat].wins++; });
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `勝隊：${this.teams[bestTeam].map(s=>this.players[s].name).join('+')}`);
    } else {
        let bestVal = totals[0];
        for (let pi = 1; pi < this.numPlayers; pi++) {
            if (totals[pi] > bestVal) { winner = pi; bestVal = totals[pi]; }
            else if (totals[pi] === bestVal) {
                if (tieBreakerOrder(pi) < tieBreakerOrder(winner)) winner = pi;
            }
        }
        this.players[winner].wins++;
        this.addLog('bat', `【${this.battlefields[bi]}】戰力：${this.players.map((p,i) => `${p.name} ${totals[i]}`).join(' ｜ ')}`);
        this.addLog('bat', `${this.players[winner].name} 贏得本輪！`);
    }

    // 🎭 AI 個性化反應（勝/敗）
    for (let pi = 0; pi < this.numPlayers; pi++) {
        if (!this.isAI(pi)) continue;
        const isWinner = (pi === winner) ||
            (this.teams && this.seatTeam[pi] !== null && this.seatTeam[pi] === this.seatTeam[winner]);
        if (isWinner) {
            this._sTO(() => this.aiChatTrigger(pi, 'win_round'), 800 + this.rng() * 400);
        } else {
            this._sTO(() => this.aiChatTrigger(pi, 'lose_round'), 1200 + this.rng() * 600);
        }
    }

    this.history.push({ round: this.round, battlefield: this.battlefields[bi], totals, winner, firstPlayer: this.roundFirstPlayer });

    // Compatibility: keep f0/f1 for old replay display and UI
    const f0 = totals[0] || 0;
    const f1 = totals[1] || 0;

    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + this.cfg.baseRefill);
        this.players[pi].fields[bi].forEach(c => {
            if (!c.faceDown && !c.silenced && (c.data.skills||[]).includes('締盟') && this.firstPasser === pi) {
                this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + 1);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【締盟】：先放棄 +1 糧`);
            }
        });
    }
    this.players[winner].food = Math.min(this.cfg.maxFood, this.players[winner].food + this.cfg.winBonus);
    this.addLog('sys', `補給 ${this.cfg.baseRefill} 糧，${this.players[winner].name} 額外 +${this.cfg.winBonus} 糧`);

    this.lastResult = { f0, f1, winner, battlefield: BATTLEFIELDS[bi] };
    this.recordEvent('settle', { battlefield: bi, f0, f1, winner,
        blueWins: this.players[0].wins, redWins: this.players[1].wins,
        blueFood: this.players[0].food, redFood: this.players[1].food });

    let someoneWon = false;
    let winningPlayers = [];
    if (this.teams) {
        // For team modes, count each team's total wins
        for (const team of this.teams) {
            const teamWins = team.reduce((s, seat) => s + this.players[seat].wins, 0) / team.length;
            if (teamWins >= 2) { someoneWon = true; winningPlayers = team.slice(); break; }
        }
    } else {
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (this.players[pi].wins >= 2) { someoneWon = true; winningPlayers = [pi]; break; }
        }
    }
    if (someoneWon) {
        this.gameWinner = winningPlayers[0];
        this.state = 'gameover';
        const winNames = winningPlayers.map(p => this.players[p].name).join(' & ');
        this.addLog('sys', `═══ ${winNames} 贏得最終勝利！═══`);
	        // 🎭 AI 最終發話（贏家嘲諷、輸家不甘）
        for (let pi = 0; pi < this.numPlayers; pi++) {
            if (!this.isAI(pi)) continue;
            const won = winningPlayers.includes(pi);
            this._sTO(() => this.aiChatTrigger(pi, 'gameover', { won }), 900 + this.rng() * 800);
        }	
        this.recordEvent('game_over', { winner: this.gameWinner, winners: winningPlayers, totalRounds: this.round });
        this.saveReplayToLocal();
        const allBots = this.players.every(p => p.botType);
        if (allBots && this.cfg.autoExport) this._sTO(() => this.downloadReplay(true), 400);
        if (allBots && this.cfg.autoRestart) {
            if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
            const savedCfg = JSON.parse(JSON.stringify(this.cfg));
            this.settleAutoTimer = this._sTO(() => {
                this.settleAutoTimer = null;
                try { window.game = new Game(savedCfg); }
                catch(e) { console.error(e); if (typeof showSetup === 'function') showSetup(); }
            }, this.cfg.autoRestartDelay || 2000);
        }
        this.render(); return;
    }
    this.render();
    if (this.players.every(p => p.botType) && this.round < this.fieldCount) {
        if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
        this.settleAutoTimer = this._sTO(() => {
            if (this.state === 'battle' && this.phase === 'settle') {
                this.settleAutoTimer = null;
                this.nextRound();
            }
        }, 2000);
    }
}

nextRound() {
    if (this.settleAutoTimer) { clearTimeout(this.settleAutoTimer); this.settleAutoTimer = null; }
    // 清除所有連環標記
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    if (this.round >= this.fieldCount) {
        const bi = this.currentBfIndex;
        for (let pi = 0; pi < this.numPlayers; pi++) {
            this.players[pi].fields[bi].forEach(c => {
                c.mod=0; c.burn=false; c.faceDown=false; c.silenced=false; c.activated=false;
                c.betrayed=false; c.betrayedFrom=null; c.lianhuan=false;
                c.preparing=false;
                this.archive.push(c);
            });
            this.players[pi].fields[bi] = [];
        }
    }
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.players[pi].passed = false;
        this.players[pi].mustFaceUp = false;
        this.players[pi].roundSpent = 0;
    }
    this.firstPasser = null;
    this.passOrder = [];
    this.expandedField = null;   // 換輪時收起手動展開
    this._handoffDoneThisTurn = false;
    const w = this.lastResult ? this.lastResult.winner : -1;
    if (w >= 0) this.current = (w + 1) % this.numPlayers;
    else this.current = (this.roundFirstPlayer + 1) % this.numPlayers;
    this.round++;
    this.roundFirstPlayer = this.current;
    this.phase = 'turn';
    this.cover = false;
    this.selected = null; this.selectedField = null;
    this.lastResult = null;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    for (let pi = 0; pi < this.numPlayers; pi++) this.logHand(pi, 'R'+this.round);
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1] ? this.players[1].hand.map(c => c.data.id) : [],
        blueFood: this.players[0].food, redFood: this.players[1] ? this.players[1].food : 0
    });
    this.render();
    this.maybeJianxiong();
}

render() {
    const app = document.getElementById('app');
    if (this.state === 'flip') { app.innerHTML = this.renderFlip(); return; }
    if (this.state === 'mulligan') { app.innerHTML = this.renderMulligan(); return; }
    if (this.state === 'gameover') { app.innerHTML = this.renderGameOver(); return; }
    app.innerHTML = this.renderBattle();
    setTimeout(() => {
        const el = document.querySelector('.log');
        if (el) el.scrollTop = el.scrollHeight;
        this.scheduleAI();
    }, 30);
}
_nextActorAfterCurrent() {
    for (let step = 1; step <= this.numPlayers; step++) {
        const nxt = (this.current + step) % this.numPlayers;
        if (!this.players[nxt].passed) return nxt;
    }
    return null;
}
scheduleAI() {
    if (this.netMode) return;
    if (this.state !== 'battle') return;
    if (this.countdown !== null) return;
    if (this.scry || this.jianxiong || this.quanheng || this.lianying || this.guanyu || this.xunyu || this.xunyou) return;
    if (this.phase === 'turn') {
        if (this.cover) {
            // Show handoff only if BOTH current and next actor are humans.
            // Otherwise auto-advance.
            const next = this._nextActorAfterCurrent();
            const humanHandoff = !this.isAI(this.current) && next !== null && !this.isAI(next);
            if (humanHandoff) return;  // wait for user to click
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.handoff(); }, 500);
            return;
        }
        if (this.isAI(this.current)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doTurnAI(); }, 900);
        }
    } else if (this.phase === 'preend') {
        if (this.cover) return;
        const pi = this.preEndOrder[this.preEndIdx];
        if (this.isAI(pi)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = this._sTO(() => { this.aiTimer = null; this.doPreEndAI(); }, 900);
        }
    }
}

cardHTML(inst, o = {}) {
    const d = inst.data;
    const fac = FACTION_INFO[d.faction];
    const cls = [];
    if (o.size === 'sm') cls.push('sm', 'mini');
    if (o.size === 'xs') cls.push('xs', 'mini');
    if (o.extra) cls.push(o.extra);
    if (inst.justDrawn && !o.noHighlight) cls.push('just-drawn');
    if (inst.faceDown && !o.forceReveal) {
        return `<div class="card ${cls.join(' ')}" ${o.attr || ''}><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`;
    }
    const isZhuge = (d.id === 'zhugeliang');
    const isSmall = (o.size === 'sm' || o.size === 'xs');
    let powerMain, modTxt = '', pcls = '#ffffff';
    if (isZhuge && o.power === undefined) powerMain = '3X';
    else {
        const totalPower = (o.power !== undefined) ? o.power : Math.max(0, d.power + (inst.mod || 0));
        const base = d.power;
        const bonus = totalPower - base;
        powerMain = totalPower;
        if (bonus !== 0) modTxt = `(${bonus > 0 ? '+' : ''}${bonus})`;
        const isMini = isSmall;
        const colUp   = isMini ? '#4a9c4a' : '#7cff7c';
        const colDown = isMini ? '#c94a4a' : '#ff6b6b';
        pcls = bonus > 0 ? colUp : (bonus < 0 ? colDown : '#ffffff');
    }
    const generalTag = d.isGeneral ? '<span class="c-gen">上將</span>' : '';
    const tag = inst.betrayed && !inst.faceDown
        ? '<span class="c-tag" style="background:rgba(200,40,40,.85);">倒戈</span>'
        : '';
    const sil = inst.silenced ? '<span class="c-tag" style="background:rgba(120,120,120,.8);left:auto;right:2px;bottom:20px;">沉默</span>' : '';
    const burn = inst.burn ? '<span class="c-tag" style="background:rgba(255,80,0,.85);left:auto;right:2px;bottom:36px;">燃</span>' : '';
	const guardOff = inst.guardUsed ? '<span class="c-tag" style="background:rgba(100,100,100,.85);left:auto;right:2px;bottom:52px;">護衛×</span>' : '';
    const prepTag = inst.preparing ? '<span class="c-tag" style="background:rgba(60,140,220,.85);left:auto;right:2px;bottom:36px;">準備</span>' : '';
    const skillNames = (d.skills || []).map(s => `<div>${s}</div>`).join('');
    return `<div class="card ${cls.join(' ')}" ${o.attr || ''}>
        <div class="card-front ${fac.cls}">
            <span class="c-cost">${d.cost}</span>
            <span class="c-fac">${fac.name}</span>
            <span class="c-skills">${skillNames}</span>
            <span class="c-name">${d.name}</span>
            ${d.title ? `<span class="c-title">${d.title}</span>` : ''}
            <span class="c-art">${d.emoji}</span>
            <span class="c-power" style="color:${pcls}">${powerMain}${modTxt ? `<span style="font-size:10px">${modTxt}</span>` : ''}</span>
            ${generalTag}${tag}${sil}${burn}${guardOff}${prepTag}
        </div>
    </div>`;
}

renderFlip() {
    const c0 = this.flipCards[0], c1 = this.flipCards[1];
    const r0 = this.flipRevealed[0], r1 = this.flipRevealed[1];
    const both = r0 && r1;
    const isAuto = this.cfg.mode === 'aiai';
    let html = this.renderBackBtn();
    html += this.renderSpeedPanel();
    html += `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">翻牌決定先後手 ${this.modeTag()}</div></div>
        <div style="text-align:center; padding:14px;">
        <div class="flip-stage">
            <div class="flip-slot">
                <div class="lbl" style="color:#6fb6ff;">藍方${this.aiIcon(0)}${this.diffTag(0)}</div>
                                <div class="flip-card-wrap ${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'flip-click' : ''}" onclick="${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'game.revealFlip(0)' : ''}">
                    ${r0 ? this.cardHTML(c0, { forceReveal: true, noHighlight: true })
                          : `<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`}
                </div>
                <div class="flip-power ${r0 ? '' : 'hidden'}" style="color:#6fb6ff;">戰力 ${c0.data.power}</div>
            </div>
            <div style="font-size:32px;color:#ffd700;font-weight:bold;">VS</div>
            <div class="flip-slot">
                <div class="lbl" style="color:#ff7b7b;">紅方${this.aiIcon(1)}${this.diffTag(1)}</div>
                               <div class="flip-card-wrap ${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'flip-click' : ''}" onclick="${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'game.revealFlip(1)' : ''}">
                    ${r1 ? this.cardHTML(c1, { forceReveal: true, noHighlight: true })
                          : `<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`}
                </div>
                <div class="flip-power ${r1 ? '' : 'hidden'}" style="color:#ff7b7b;">戰力 ${c1.data.power}</div>
            </div>
        </div>`;
    if (!both) html += `<p style="color:#a89070;font-size:15px;">請雙方各自點擊自己的牌以翻開${isAuto?'（AI 將自動翻牌）':''}</p>`;
    else if (this.firstPlayer === null) {
        html += `<p style="font-size:18px;color:#ff9c4a;margin-bottom:16px;font-weight:bold;">
            ⚖️ 平手！${c0.data.name}(${c0.data.power}) vs ${c1.data.name}(${c1.data.power}) — 重新翻牌…
        </p>
        <p style="color:#a89070;font-size:13px;">兩張牌已進入棄牌堆</p>`;
    }
    else {
        const fp = this.firstPlayer;
        const fc = fp === 0 ? '#6fb6ff' : '#ff7b7b';
        const fcg = fp === 0 ? 'linear-gradient(180deg,#3a7ac8,#1a4a8a)' : 'linear-gradient(180deg,#c83a3a,#8a1a1a)';
        const fbd = fp === 0 ? '#5aa0e8' : '#e85a5a';
        html += `<p style="font-size:16px;color:#e0c080;margin-bottom:16px;">${c0.data.name}（${c0.data.power}） vs ${c1.data.name}（${c1.data.power}）</p>
            <button class="btn btn-big" style="background:${fcg};border:1px solid ${fbd};color:#fff;" onclick="game.beginBattle()"><span style="color:${fc}">${this.players[fp].name}</span>先手！開始對戰</button>`;
    }
    html += `</div>`;
    html += `<div id="modal-slot"></div>`;
    return html;
}

renderMulligan() {
    const pi = this.mulliganPlayer, p = this.players[pi];
    const stage = this.mulliganStage;
    const color = pi === 0 ? '#6fb6ff' : '#ff7b7b';
    const isAIP = this.isAI(pi);
    const isRemote = this.netMode && pi !== this.localPlayerIdx;
    const showBacks = isAIP || isRemote;
    const canAct = !isAIP && !isRemote;
    let html = this.renderBackBtn();
    html += this.renderSpeedPanel();
    html += `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">開局重抽階段 — ${p.name}${this.aiIcon(pi)}${isAIP?this.diffTag(pi):''} ${this.modeTag()}</div></div>
        <div style="text-align:center;padding:8px;">
            <div class="phase-tag">${p.name} 的手牌（${p.hand.length} 張）</div>
            <div class="hand-row" style="justify-content:center;margin:16px 0;min-height:130px;">
                ${showBacks ? p.hand.map(()=>`<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`).join('') :
                  (p.hand.map(c => this.cardHTML(c, { extra:'clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('') || '<span style="color:#666;">無手牌</span>')}
            </div>
            ${isAIP ? `<p style="color:#c8a0ff;font-size:14px;margin-bottom:16px;">${p.personality==='kind'?'👑':(p.personality==='cold'?'❄️':'🤖')} 電腦正在決定是否重抽…</p>`
                    : `<p style="color:#a89070;font-size:14px;margin-bottom:16px;">可選擇重抽全部手牌，或直接開始。</p>`}
            <div class="ctrl-buttons">
                <button class="btn btn-purple" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganRedraw()">重抽</button>
                <button class="btn btn-red" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganSkip()">放棄重抽</button>
                <button class="btn btn-green" ${(stage !== 'confirm' || !canAct) ? 'disabled' : ''} onclick="game.mulliganConfirm()">確認</button>            </div>
        </div>`;
    if ((stage === 'hidden' || this.cover) && !this.netMode) {
        const other = this.opponentOf(pi);
        const otherIsHuman = !this.isAI(other);
        if (otherIsHuman) {
            html += `<div class="handoff-overlay">
                <div class="who" style="color:${color}">請將裝置交給 ${this.players[other].name}</div>
                <div class="note">${p.name} 的手牌已隱藏</div>
                <button class="btn btn-big btn-blue" onclick="game.mulliganHandoff()">轉換玩家</button>
            </div>`;
        } else {
            // Next is a bot — auto-advance
            setTimeout(() => { try { this.mulliganHandoff(); } catch (e) {} }, 300);
        }
    }
    html += this.renderInspect();
    html += `<div id="modal-slot"></div>`;
    return html;
}

voteRematch() {
    if (this.state !== 'gameover') return;
    // When the host is applying a remote action, the voter is the OTHER player.
    const pi = this.netMode
        ? (this._applyingRemote ? (this._remotePlayerIdx ?? 1) : this.localPlayerIdx)
        : 0;
    this._rematchVotes = this._rematchVotes || [false, false];
    if (this._rematchVotes[pi]) return;
    this._rematchVotes[pi] = true;
    this.addLog('sys', `${this.players[pi].name} 按下「再來一局」`);
    this.render();
    if (this.netMode && this.role === 'host' &&
        this._rematchVotes[0] && this._rematchVotes[1]) {
        this._doRematch();
    }
}
_doRematch() {
    if (this.role !== 'host') return;
    // Cancel any pending broadcast from the old game instance
    if (this._broadcastTimer) { clearTimeout(this._broadcastTimer); this._broadcastTimer = null; }
    const cfg = this.cfg;
    cfg.seed = '';
    cfg._rematchVotes = undefined;
    window.game = new Game(cfg);
}
_renderRematchButtons() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    if (v[me]) {
        return `<button class="btn btn-big btn-green" disabled>✅ 已同意（等待對手…）</button>`;
    }
    return `<button class="btn btn-big btn-green" onclick="game.voteRematch()">🔁 再來一局</button>`;
}
_renderRematchStatus() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    const myName = this.players[me].name;
    const opName = this.players[1 - me].name;
    return `${myName}：${v[me] ? '✅ 已同意' : '⏳ 未決定'}　｜　${opName}：${v[1 - me] ? '✅ 已同意' : '⏳ 未決定'}`;
}
renderGameOver() {
    const w = this.gameWinner;
    const color = w === 0 ? '#6fb6ff' : '#ff7b7b';
    const isAIvsAI = this.cfg.mode === 'aiai';
    return `<div id="modal-slot"></div>` + this.renderBackBtn() + this.renderSpeedPanel() + `<div class="overlay"><div class="modal" style="text-align:center;">        <div style="font-size:64px;">🏆</div>
        <h2 style="color:${color};font-size:28px;">${this.players[w].name}${this.aiIcon(w)} 勝利！</h2>
        <p>率先取得兩輪勝利，稱霸三國！</p>
        <p style="font-size:13px;color:#888;">總計進行 ${this.round} 輪</p>
        <div style="display:flex;justify-content:center;gap:30px;margin:18px 0;flex-wrap:wrap;">
            ${this.players.map((p, i) => {
                const col = PLAYER_COLORS[i];
                return `<div><div style="font-size:13px;color:${col.text};">${p.name}勝場</div>
                     <div style="font-size:26px;color:${col.text};font-weight:bold;">${p.wins}</div></div>`;
            }).join('')}
        </div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
            ${this.netMode
                ? this._renderRematchButtons()
                : `<button class="btn btn-big btn-green" onclick="showSetup()">再來一局</button>`}
            <button class="btn btn-big btn-gold" onclick="game.downloadReplay()">📥 匯出遊戲記錄</button>
            <button class="btn btn-big" style="background:linear-gradient(180deg,#2a6a4a,#153828);border-color:#44cc88;color:#c8ffe0;" onclick="copyCurrentSeed()">🌱 複製種子</button>
        </div>
        ${this.netMode ? `<p style="font-size:12px;color:#a89070;margin-top:10px;">${this._renderRematchStatus()}</p>` : ''}
        <p style="font-size:13px;color:#7cff7c;margin-top:10px;font-family:monospace;letter-spacing:2px;">🌱 種子：${this.seed}</p>
        <p style="font-size:12px;color:#a89070;margin-top:14px;">
            本場已存入本地快取。${isAIvsAI && this.cfg.autoExport ? '並已自動下載。' : ''}<br>
            ${isAIvsAI && this.cfg.autoRestart ? '<b style="color:#7cff7c;">2 秒後自動重新開局…</b><br>' : ''}
            回到主選單可用「📜 回放記錄」瀏覽所有對戰。
        </p>
    </div></div>`;
}

buildReplayExport() {
    return {
        version: this.replay.version,
        createdAt: this.replay.createdAt,
        exportedAt: new Date().toISOString(),
        seed: this.seed,
        mode: this.cfg.mode,
        config: this.replay.config,
        deckTopToBottom: this.replay.deckTopToBottom,
        winner: this.gameWinner,
        totalRounds: this.round,
        finalWins: this.players.map(p => p.wins),
        events: this.replay.events
    };
}
saveReplayToLocal() {
    try {
        const data = this.buildReplayExport();
        const arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
        arr.push(data);
        while (arr.length > 500) arr.shift();
        localStorage.setItem('sanguo_logs', JSON.stringify(arr));
    } catch(e) { console.warn('localStorage 失敗', e); }
}
downloadReplay(auto = false) {
    if (!this.replay) { alert('沒有可匯出的記錄'); return; }
    const json = JSON.stringify(this.buildReplayExport(), null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-replay-${ts}${auto?'-auto':''}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

renderBattle() {
    let h = this.renderBackBtn();
    h += this.renderHeader();
    h += `<div class="battle-layout"><div class="battle-main">
        ${this.renderHandBar()}
        ${this.renderPlayerRow()}
        ${this.renderBattlefields()}
        ${this.renderControls()}
        ${this.renderQuickChat()}
        ${this.renderHands()}
    </div><div class="battle-side">
        ${this.renderHistory()}
        ${this.renderArchive()}
    </div></div>`;
    h += this.renderLog();
    h += this.renderModals();
    h += this.renderInspect();
    h += this.renderCountdown();
    h += this.renderSpeedPanel();
    h += `<div id="modal-slot"></div>`;
    return h;
}
renderHeader() {
    const chips = this.players.map((p, i) => {
        const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
        return `<span style="color:${col.text};">${p.name} ${p.wins}勝${this.aiIcon(i)}</span>`;
    }).join(' ｜ ');
    return `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">
            第 ${this.round} 輪 ｜ 戰場：【${this.battlefields[this.currentBfIndex]}】
            ｜ 牌庫 ${this.deck.length} 張
            ｜ ${chips}
            ${this.modeTag()}
            ${this.netMode ? ` ｜ <span style="color:#7cff7c;">🌐 線上（${this.role === 'host' ? '房主' : '訪客'}）</span>` : ''}
        </div></div>`;
}
renderHandBar() {
    const cap = this.cfg.maxFood;
    const miniRow = n => n === 0 ? '<span class="hb-empty">無手牌</span>' : '<div class="mini-back"></div>'.repeat(n);
    const me = this.netMode ? this.localPlayerIdx : this.current;
    return `<div class="hand-bar multi">
        ${this.players.map((p, i) => {
            const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
            const isTurn = (this.phase === 'turn' && i === this.current);
            const isMe = (i === me);
            return `<div class="hb-side ${isTurn ? 'hb-turn' : ''} ${isMe ? 'hb-me' : ''}" style="border-left:3px solid ${col.border};">
                <span class="hb-lbl" style="color:${col.text};">${p.name}${this.aiIcon(i)}</span>
                <div class="hb-cards">${miniRow(p.hand.length)}</div>
                <span class="hb-food">🌾 ${p.food}/${cap}</span>
                <span class="hb-spent">（耗${p.roundSpent}）</span>
                <span class="hb-wins" style="color:${col.text};">🏆${p.wins}</span>
            </div>`;
        }).join('')}
    </div>`;
}
renderPlayerRow() {
    let h = `<div class="player-row">`;
    for (let pi = 0; pi < this.numPlayers; pi++) {
        const p = this.players[pi];
        const col = PLAYER_COLORS[pi % PLAYER_COLORS.length];
        const isCur = (this.phase === 'turn' && pi === this.current) ||
                      (this.phase === 'preend' && this.preEndOrder && this.preEndOrder[this.preEndIdx] === pi);
        h += `<div class="pr-chip ${isCur ? 'pr-cur' : ''}" style="border-color:${col.border};color:${col.text};">
            <span class="pr-name">${p.name}${this.aiIcon(pi)}</span>
            <span class="pr-wins">🏆 ${p.wins}</span>
            ${p.passed ? `<span class="pr-pass">放棄</span>` : ''}
        </div>`;
    }
    h += `</div>`;
    return h;
}
renderBattlefields() {
    const atSettle = (this.phase === 'settle');
    const activeBi = this.currentBfIndex;
    const roundActive = this.phase === 'turn' && !this.players.every(p => p.passed);
    let h = `<div class="bf-flex">`;
    for (let bi = 0; bi < this.fieldCount; bi++) {
        const isActive = (bi === activeBi);
        const isPast = (bi < activeBi);
        const isFuture = (bi > activeBi);
        const isExpanded = (this.expandedField === bi);
        // 大小判定：手動展開優先，否則當前戰場為大
        const showLarge = isExpanded || (isActive && this.expandedField === null);
        let wrapCls;
        if (isExpanded) {
            wrapCls = 'active manually-expanded expandable';
        } else if (this.expandedField !== null) {
            wrapCls = 'inactive expandable';
        } else {
            wrapCls = (isActive ? 'active' : (isPast ? 'inactive' : 'future')) + ' expandable';
        }

        // 戰場標題
        let headRes = '';
        if (isPast) {
            const hist = this.history.find(r => r.round === bi + 1);
            if (hist && hist.totals) headRes = `<span class="res">${hist.totals.join(' : ')}（已定）</span>`;
            else if (hist) headRes = `<span class="res">${hist.f0} vs ${hist.f1}（已定）</span>`;
            else headRes = `<span class="res">-</span>`;
        } else if (isActive) {
            const totals = [];
            for (let pi = 0; pi < this.numPlayers; pi++) totals.push(this.fieldPower(pi, bi, atSettle));
            headRes = `<span class="open">${totals.join(' : ')}</span>`;
        } else headRes = `<span class="res" style="color:#555;">尚未開啟</span>`;

        // 展開提示圖示（非當前戰場才顯示）
        const expandIcon = (!isActive)
            ? `<span class="bf-expand-icon">${isExpanded ? '▼ 收合' : '▷ 展開'}</span>`
            : '';

        // 卡牌大小
        const cardSize = showLarge ? undefined : (isPast ? 'xs' : 'sm');
        const cardExtra = isPast ? 'grey clickable' : (isFuture ? (isExpanded ? 'clickable' : 'grey') : 'clickable');
        // 可被檢視的條件：非未來、或已被展開
        const canInspect = !isFuture || isExpanded || this.expandedField === bi;
        const inspAttr = (c) => canInspect ? `onclick="event.stopPropagation();game.inspect('${c.uid}')"` : '';

        // 只允許非當前戰場展開
        const toggleHandler = isActive ? '' : `onclick="game.toggleFieldExpand(${bi})"`;

        h += `<div class="bf-wrap ${wrapCls}" ${toggleHandler}><div class="bfield">
            <div class="bf-head"><span>${this.battlefields[bi]}${isActive ? ' ★' : ''}${expandIcon}</span>${headRes}</div>`;

        for (let pi = 0; pi < this.numPlayers; pi++) {
            const p = this.players[pi];
            const col = PLAYER_COLORS[pi % PLAYER_COLORS.length];
            const field = p.fields[bi];
            const showPass = isActive && roundActive && p.passed;
            const tot = this.fieldPower(pi, bi, atSettle);
            h += `<div class="bf-row ${showPass ? 'passed' : ''}" style="background:${col.bg};">
                <div class="bf-player-lbl" style="color:${col.text};">${p.name}</div>
                <div class="bf-cards">
                    ${field.length === 0
                        ? `<span class="bf-ghost">—</span>`
                        : field.map(c => this.cardHTML(c, {
                            size: cardSize,
                            extra: c.fresh ? ('enter ' + cardExtra) : cardExtra,
                            power: this.getPower(c, pi, bi, atSettle),
                            attr: inspAttr(c)
                        })).join('')}
                </div>
                <div class="bf-total" style="color:${col.text};">${tot}</div>
            </div>`;
        }

        h += `</div></div>`;
    }
    h += `</div>`;
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            this.players[pi].fields[bi].forEach(c => c.fresh = false);
    return h;
}
toggleFieldExpand(bi) {
    if (bi === this.currentBfIndex) return;  // 當前戰場不可切換
    this.expandedField = (this.expandedField === bi) ? null : bi;
    this.render();
}

renderControls() {
    if (this.netMode) {
        if (this.phase === 'preend' && this.preEndOrder[this.preEndIdx] !== this.localPlayerIdx) {
            return `<div class="control-area">
                <div class="ctrl-info">等待對手結算前出牌…</div>
                <div style="margin:6px 0;"><span class="ai-badge" style="background:rgba(68,200,68,.2);color:#7cff7c;border-color:rgba(68,200,68,.5);">🌐 線上</span></div>
            </div>`;
        }
        if (this.phase === 'turn' && this.current !== this.localPlayerIdx) {
            return `<div class="control-area">
                <div class="ctrl-info">對手的回合…</div>
                <div style="margin:6px 0;"><span class="ai-badge" style="background:rgba(68,200,68,.2);color:#7cff7c;border-color:rgba(68,200,68,.5);">🌐 線上</span></div>
            </div>`;
        }
    }
    if (this.phase === 'settle') {
        let h = `<div class="control-area"><div style="font-size:20px;color:#ffd700;margin-bottom:8px;">⚔️ 結算完成</div>`;
        if (this.lastResult) {
            h += `<div class="result-line"><span class="b">藍方 ${this.lastResult.f0}</span><span style="color:#ffd700;"> vs </span><span class="r">紅方 ${this.lastResult.f1}</span><span style="color:#44ff44;font-size:15px;">（${this.players[this.lastResult.winner].name}勝）</span></div>`;
            h += `<div style="font-size:13px;color:#a89070;margin-bottom:10px;">戰場：【${this.lastResult.battlefield}】${this.lastResult.f0 === this.lastResult.f1 ? '（平局 → 先手勝）' : ''}</div>`;
        }
        if (this.round < this.fieldCount) h += `<button class="btn btn-big btn-green" onclick="game.nextRound()">進入下一輪（${BATTLEFIELDS[this.round]}）</button>`;
        else h += `<button class="btn btn-big btn-green" onclick="game.nextRound()">結束</button>`;
        if (this.players.every(p => p.botType) && this.round < this.fieldCount) h += `<div style="margin-top:10px;"><span class="ai-auto-hint">2 秒後自動進入下一輪</span></div>`;
        h += `</div>`;
        return h;
    }
    if (this.phase === 'preend') {
        const pi = this.preEndOrder[this.preEndIdx];
        const color = (PLAYER_COLORS[pi % PLAYER_COLORS.length] || PLAYER_COLORS[0]).text;
        const isAIP = this.isAI(pi);
        return `<div class="control-area">
            <div class="ctrl-info">請 <b style="color:${color}">${this.players[pi].name}${this.aiIcon(pi)}</b> 選擇在結算前可打出的牌</div>
                      ${isAIP && !this.cover ? `<div style="margin:6px 0;"><span class="ai-badge">${this.aiIcon(pi)} 電腦思考中…</span></div>` : ''}
            <div class="ctrl-buttons">
                <button class="btn btn-green" disabled>出牌</button>
                <button class="btn btn-red" ${(this.cover||isAIP) ? 'disabled' : ''} onclick="game.preEndAct()">放棄出牌</button>
            </div></div>`;
    }
    const pi = this.current, p = this.players[pi];
    const color = (PLAYER_COLORS[pi % PLAYER_COLORS.length] || PLAYER_COLORS[0]).text;
    const inst = this.selected ? p.hand.find(c => c.uid === this.selected) : null;
    const bfName = BATTLEFIELDS[this.currentBfIndex];
    const locked = this.cover || this.countdown !== null;
    const isAIP = this.isAI(pi);
    const opponentPassed = this.players[this.opponentOf(pi)].passed;
    let info = '';
    if (this.countdown !== null) info = `⏳ 請查看您新抽到的牌…`;
    else if (this.cover) {
        const nextPi = this.opponentOf(this.current);
        const nextP = this.players[nextPi];
        const nc = nextPi === 0 ? '#6fb6ff' : '#ff7b7b';
        info = `請將裝置交給 <b style="color:${nc}">${nextP.name}${this.aiIcon(nextPi)}</b>`;
    }
    else if (isAIP) info = `<b style="color:${color}">${p.name}${this.aiIcon(pi)}</b> 的回合`;
    else if (inst) info = `已選：<b>${inst.data.name}</b>（${inst.data.cost}糧 / ${inst.data.power}戰力）　→ 將出牌至【<b style="color:#ffd700">${bfName}</b>】`;
        else info = `<b style="color:${color}">${p.name}</b> 的回合　—　<span style="color:#7cff7c;font-weight:bold;">👆 點擊下方手牌</span> 選擇要出的牌（出牌至【${bfName}】）`;
    if (opponentPassed && !locked && !isAIP) info += `　<span style="color:#ff9c4a;">（對手已放棄跟牌，你可繼續出牌或放棄）</span>`;
    const hasQuanheng = !locked && !isAIP && p.fields.some(f => f.some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('權衡')));
    const hasLianying = !locked && !isAIP &&
        p.fields[this.currentBfIndex].some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('連營')) &&
        this.players[this.opponentOf(pi)].fields[this.currentBfIndex].some(c => !c.faceDown && !c.burn);
    const hasJiushi = !locked && !isAIP && !!this.findJiushiCard(pi);
    let skillBox = '';
    if (this.countdown !== null) {
        const newCard = p.hand.find(c => c.justDrawn);
        if (newCard) {
            skillBox = `<div class="sel-skill-box new-draw">
                <div class="skill-name">🆕 ${newCard.data.name}${newCard.data.title ? ` <span class="ttl">${newCard.data.title}</span>` : ''}
                    <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[newCard.data.faction].name}｜${newCard.data.cost}糧｜${newCard.data.power}戰力</span></div>
                <div class="skill-desc">${newCard.data.desc.replace(/\n/g,'<br>')}</div></div>`;
        }
    } else if (inst && !locked) {
        skillBox = `<div class="sel-skill-box">
            <div class="skill-name">${inst.data.name}${inst.data.title ? ` <span class="ttl">${inst.data.title}</span>` : ''}
                <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[inst.data.faction].name}｜${inst.data.cost}糧｜${inst.data.power}戰力</span></div>
            <div class="skill-desc">${inst.data.desc.replace(/\n/g,'<br>')}</div></div>`;
    }
    let fieldPicker = '';
    if (inst && !locked && !isAIP) {
        const allowed = this.getPlayableFields(inst, pi);
        if (allowed.length > 1) {
            const buttons = allowed.map(f => {
                const isCur = f === this.currentBfIndex;
                const on = (this.selectedField !== null) ? this.selectedField === f : isCur;
                const label = isCur ? `${BATTLEFIELDS[f]}（當前）` : BATTLEFIELDS[f];
                return `<button class="btn ${on ? 'btn-gold' : ''}" style="padding:6px 14px;font-size:13px;" onclick="game.selectField(${f})">${label}</button>`;
            }).join('');
            fieldPicker = `<div style="margin-top:8px;"><div style="font-size:12px;color:#c8a040;letter-spacing:1px;margin-bottom:5px;">選擇陣地</div><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">${buttons}</div></div>`;
        }
    }
    if (isAIP && !this.cover) {
        return `<div class="control-area"><div class="ctrl-info">${info}</div><div style="margin:6px 0;"><span class="ai-badge">${this.aiIcon(pi)} 電腦思考中…</span></div>${skillBox}</div>`;
    }
    return `<div class="control-area">
        <div class="ctrl-info">${info}</div>
