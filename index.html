<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國風雲 — 卡牌對戰 v3.7</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#140900;background-image:radial-gradient(ellipse at 50% 0%,rgba(120,60,0,.28) 0%,transparent 70%),radial-gradient(ellipse at 50% 100%,rgba(120,60,0,.28) 0%,transparent 70%);color:#f0e6d0;font-family:'Microsoft YaHei','PingFang TC','SimHei',sans-serif;min-height:100vh;padding:10px;user-select:none}
#app{max-width:1320px;margin:0 auto}
/* ============ 玩家配色 CSS 變數（隨主題變化） ============ */
:root {
    --card-power-neutral: #ffffff;
    --card-power-up: #7cff7c;
    --card-power-down: #ff6b6b;
}
body[data-theme="ink"],
body[data-theme="bamboo"],
body[data-theme="sand"] {
    --card-power-neutral: #2a1a08;
    --card-power-up: #1a6a1a;
    --card-power-down: #a02020;
}
:root {
    --pc0-bg: rgba(20,60,120,.18);
    --pc0-border: rgba(58,122,200,.55);
    --pc0-text: #6fb6ff;
    --pc1-bg: rgba(120,20,20,.18);
    --pc1-border: rgba(200,58,58,.55);
    --pc1-text: #ff7b7b;
    --pc2-bg: rgba(20,100,40,.18);
    --pc2-border: rgba(58,140,58,.55);
    --pc2-text: #7cff7c;
    --pc3-bg: rgba(100,20,100,.18);
    --pc3-border: rgba(160,58,200,.55);
    --pc3-text: #d090ff;
    --card-shadow: 0 2px 6px rgba(0,0,0,.4);
}

/* 墨韻（淺色） */
body[data-theme="ink"] {
    --pc0-bg: rgba(26,74,138,.10);
    --pc0-border: rgba(26,74,138,.45);
    --pc0-text: #1a4a8a;
    --pc1-bg: rgba(165,40,40,.10);
    --pc1-border: rgba(165,40,40,.45);
    --pc1-text: #a52828;
    --pc2-bg: rgba(45,106,45,.10);
    --pc2-border: rgba(45,106,45,.45);
    --pc2-text: #2d6a2d;
    --pc3-bg: rgba(106,40,160,.10);
    --pc3-border: rgba(106,40,160,.45);
    --pc3-text: #6a28a0;
    --card-shadow: 0 2px 6px rgba(80,50,20,.15);
}

/* 竹簡（淺色） */
body[data-theme="bamboo"] {
    --pc0-bg: rgba(26,74,138,.10);
    --pc0-border: rgba(26,74,138,.45);
    --pc0-text: #1a4a8a;
    --pc1-bg: rgba(150,50,30,.10);
    --pc1-border: rgba(150,50,30,.45);
    --pc1-text: #8a2a1a;
    --pc2-bg: rgba(45,90,25,.10);
    --pc2-border: rgba(45,90,25,.50);
    --pc2-text: #2d5a15;
    --pc3-bg: rgba(90,40,120,.10);
    --pc3-border: rgba(90,40,120,.45);
    --pc3-text: #5a2880;
    --card-shadow: 0 2px 6px rgba(60,80,40,.18);
}

/* 黃沙（淺色） */
body[data-theme="sand"] {
    --pc0-bg: rgba(40,70,120,.10);
    --pc0-border: rgba(40,70,120,.45);
    --pc0-text: #2a4a7a;
    --pc1-bg: rgba(140,40,20,.10);
    --pc1-border: rgba(140,40,20,.50);
    --pc1-text: #7a2a10;
    --pc2-bg: rgba(80,90,20,.10);
    --pc2-border: rgba(80,90,20,.50);
    --pc2-text: #5a5a10;
    --pc3-bg: rgba(90,40,90,.10);
    --pc3-border: rgba(90,40,90,.45);
    --pc3-text: #6a2860;
    --card-shadow: 0 2px 6px rgba(80,40,10,.20);
}

/* 月夜（深藍）— 微調亮度 */
body[data-theme="moon"] {
    --pc2-text: #a8ffb0;
    --pc3-text: #d8a0ff;
    --card-shadow: 0 2px 8px rgba(0,0,0,.55);
}

/* 赤壁（深紅）— 微調亮度 */
body[data-theme="red"] {
    --pc0-text: #90c8ff;
    --pc2-text: #9cff9c;
    --card-shadow: 0 2px 8px rgba(0,0,0,.6);
}
h1,h2,h3{color:#ffd700}
.btn{padding:9px 20px;font-size:15px;font-weight:bold;border:none;border-radius:6px;cursor:pointer;font-family:inherit;transition:.18s;background:linear-gradient(180deg,#8a6020,#5a3d10);color:#ffe9a0;border:1px solid #c8a040}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-green{background:linear-gradient(180deg,#4a8c2a,#2d5a1e);border-color:#6aac4a;color:#fff}
.btn-red{background:linear-gradient(180deg,#8b2500,#5a1800);border-color:#cc4400;color:#ffd9c0}
.btn-purple{background:linear-gradient(180deg,#6a0dad,#3d0066);border-color:#8a2dcd;color:#e8d0ff}
.btn-blue{background:linear-gradient(180deg,#1a4a8a,#0d2a52);border-color:#3a7ac8;color:#cfe6ff}
.btn-gold{background:linear-gradient(180deg,#c8a040,#8a6020);border-color:#ffd700;color:#fff}
.btn-big{font-size:19px;padding:13px 40px}
.card{width:96px;height:134px;border-radius:7px;flex-shrink:0;position:relative;transition:transform .18s,box-shadow .18s,filter .18s;cursor:default;box-shadow:var(--card-shadow)}
.card.sm{width:70px;height:98px;border-radius:5px}
.card.xs{width:52px;height:74px;border-radius:4px}
.card-back{width:100%;height:100%;border-radius:inherit;background:linear-gradient(135deg,#3a2a1a,#241408);border:2px solid #6a5a3a;display:flex;align-items:center;justify-content:center}
.card-back-pattern{width:72%;height:80%;border:1px solid #6a5a3a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8a7a5a;letter-spacing:2px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(106,90,58,.25) 5px,rgba(106,90,58,.25) 10px)}
.card.sm .card-back-pattern{font-size:12px}
.card.xs .card-back-pattern{font-size:9px}
.card-front{width:100%;height:100%;border-radius:inherit;position:relative;overflow:hidden;padding:2px}
.card-front.shu{background:linear-gradient(140deg,#8b2500,#4a1200);border:2px solid #cc4400}
.card-front.wei{background:linear-gradient(140deg,#1a3a6a,#0b1a33);border:2px solid #2a5aaa}
.card-front.wu{background:linear-gradient(140deg,#2d5a1e,#16300c);border:2px solid #4a8c2a}
.card-front.qun{background:linear-gradient(140deg,#4a3a2a,#241a10);border:2px solid #8a7a5a}
.c-cost{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.55);color:#ffd700;font-size:15px;font-weight:bold;padding:1px 6px;border-radius:4px;border:1px solid rgba(255,215,0,.4)}
.c-name{position:absolute;top:27px;left:3px;writing-mode:vertical-rl;text-orientation:upright;font-size:15px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;letter-spacing:1px;line-height:1}
.c-title{position:absolute;top:27px;left:23px;writing-mode:vertical-rl;text-orientation:upright;font-size:10px;color:#c9c0a8;letter-spacing:1px;line-height:1}
.c-skills{position:absolute;top:22px;right:4px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000,1px 1px 2px #000;letter-spacing:0.5px;line-height:1.15;max-width:72px;pointer-events:none}
.c-power{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.55);color:#ffffff;font-size:15px;font-weight:bold;padding:1px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.35)}
.c-art{position:absolute;right:4px;bottom:5px;font-size:32px;filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
.c-fac{position:absolute;top:2px;right:2px;font-size:11px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.5);color:#ddd}
/* ★ v3.7: 可背面進場的牌 — 上 1/6 灰色標記 */
.c-ambush-strip{position:absolute;top:0;left:0;right:0;height:16.67%;background:linear-gradient(180deg,rgba(70,70,70,.72),rgba(70,70,70,.28));pointer-events:none;border-top-left-radius:5px;border-top-right-radius:5px}
.card.sm .c-ambush-strip,.card.xs .c-ambush-strip{display:none}
.c-gen{position:absolute;left:2px;bottom:24px;background:linear-gradient(180deg,#b81818,#6a0808);color:#ffe066;font-size:9px;font-weight:bold;padding:1px 4px;border-radius:3px;border:1px solid #ff8080;box-shadow:0 0 6px rgba(255,80,80,.7);letter-spacing:0;line-height:1.3;white-space:nowrap}
.c-fanpan{position:absolute;left:2px;bottom:24px;background:linear-gradient(180deg,#d4a000,#8a6800);color:#000;font-size:9px;font-weight:bold;padding:1px 4px;border-radius:3px;border:1px solid #ffd700;box-shadow:0 0 6px rgba(255,215,0,.75);letter-spacing:0;line-height:1.3;white-space:nowrap}
.c-fanpan{position:absolute;left:2px;bottom:24px;background:linear-gradient(180deg,#d4a000,#8a6800);color:#fff;font-size:9px;font-weight:bold;padding:1px 4px;border-radius:3px;border:1px solid #ffd700;box-shadow:0 0 6px rgba(255,215,0,.75);letter-spacing:0;line-height:1.3;white-space:nowrap}
.c-lh{position:absolute;right:2px;bottom:68px;font-size:10px;font-weight:bold;padding:1px 5px;border-radius:3px;border:1px solid;letter-spacing:0;line-height:1.3;white-space:nowrap;color:#fff;z-index:3}
.c-lh.lh3{background:linear-gradient(180deg,#22cc44,#0e8028);border-color:#66ff88;box-shadow:0 0 6px rgba(68,255,136,.7)}
.c-lh.lh2{background:linear-gradient(180deg,#d4a000,#8a6800);border-color:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.7)}
.c-lh.lh1{background:linear-gradient(180deg,#e68a2e,#9a4a08);border-color:#ffb060;box-shadow:0 0 6px rgba(255,150,60,.7)}
.c-lh.lh0{background:linear-gradient(180deg,#555,#222);border-color:#888;color:#bbb}
.card.sm .c-lh,.card.xs .c-lh{font-size:8px;padding:0 3px;bottom:56px}
.card.sm .c-name{font-size:12px;top:22px;left:2px}
.card.sm .c-title{font-size:8px;top:22px;left:18px}
.card.sm .c-cost,.card.sm .c-power{font-size:11px;padding:0 4px}
.card.sm .c-art{font-size:24px}
.card.sm .c-fac{font-size:9px}
.card.sm .c-tag{display:none}
.card.sm .c-skills{font-size:10px;top:18px;max-width:50px;gap:1px}
.card.sm .c-gen,.card.sm .c-fanpan{font-size:7px;padding:0 3px;bottom:20px}
.card.xs .c-name{font-size:10px;top:17px;left:1px}
.card.xs .c-title{display:none}
.card.xs .c-cost,.card.xs .c-power{font-size:9px;padding:0 3px}
.card.xs .c-art{font-size:18px;right:2px;bottom:3px}
.card.xs .c-fac{font-size:8px;padding:0 3px}
.card.xs .c-tag{display:none}
.card.xs .c-skills{display:none}
.card.xs .c-gen{display:none}
.card.clickable{
    cursor:pointer;
    transition:transform .22s cubic-bezier(0.34,1.56,0.64,1),
               box-shadow .22s ease,
               filter .22s ease;
}
.card.clickable:hover{
    transform: translateY(-10px) scale(1.04) rotate(-1deg);
    box-shadow: 0 14px 30px rgba(255,215,0,.5),
                0 0 0 1px rgba(255,215,0,.6);
    z-index: 5;
}
.card.sel{
    transform:translateY(-10px) scale(1.04);
    z-index:6;
    animation:selPulse 1.25s ease-in-out infinite;
}
@keyframes selPulse{0%,100%{box-shadow:0 0 0 2px #ffd700,0 0 16px 4px rgba(255,215,0,.45)}50%{box-shadow:0 0 0 2px #ffd700,0 0 26px 10px rgba(255,215,0,.75)}}
.card.dim{opacity:.35;filter:grayscale(.6)}
.card.grey{opacity:.42;filter:grayscale(.85)}
.card.just-drawn{animation:justDrawnPulse 1.05s ease-in-out infinite}
@keyframes justDrawnPulse{0%,100%{box-shadow:0 0 0 3px #44ff88,0 0 24px 10px rgba(68,255,136,.7);transform:translateY(-6px)}50%{box-shadow:0 0 0 3px #44ff88,0 0 38px 18px rgba(68,255,136,1);transform:translateY(-11px)}}
.card.enter{animation:cardEnter .35s ease-out}
@keyframes cardEnter{from{opacity:0;transform:translateY(-22px) scale(.85)}to{opacity:1;transform:none}}
.back-menu-btn{position:fixed;top:12px;right:12px;z-index:960;padding:8px 16px;border-radius:6px;font-weight:bold;font-family:inherit;font-size:13px;cursor:pointer;transition:.25s;letter-spacing:1px;border:1px solid #888;background:linear-gradient(180deg,#444,#222);color:#ccc}
.back-menu-btn.red{background:linear-gradient(180deg,#c83030,#8a1010);border-color:#ff5050;color:#fff;animation:backPulse 1s infinite}
@keyframes backPulse{0%,100%{box-shadow:0 0 12px rgba(255,80,80,.5)}50%{box-shadow:0 0 22px rgba(255,80,80,.9)}}
/* ============ 遊戲選單按鈕 ============ */
.game-menu-btn{position:fixed;top:12px;right:12px;z-index:965;padding:8px 16px;border-radius:6px;font-weight:bold;font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;letter-spacing:1px;border:1px solid #c8a040;background:linear-gradient(180deg,#8a6020,#5a3d10);color:#ffe9a0}
.game-menu-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* ============ AI 速度控制 ============ */
.ai-speed-panel{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:970;padding:8px 14px;border-radius:24px;background:rgba(20,10,0,.92);border:1px solid #c8a040;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 0 24px rgba(255,215,0,.3)}
.ai-speed-panel .lbl{font-size:12px;color:#c8a040;letter-spacing:1px;margin-right:4px}
.ai-speed-panel .sp-btn{padding:5px 12px;font-size:12px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s}
.ai-speed-panel .sp-btn.on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700}
.ai-speed-panel .sp-btn:hover:not(.on){filter:brightness(1.2)}

/* ============ 戰場展開 ============ */
.bf-wrap.expandable{cursor:pointer}
.bf-wrap.expandable:hover{outline:1px dashed rgba(255,215,0,.45);outline-offset:2px}
.bf-wrap.manually-expanded{border:1px solid rgba(255,215,0,.75);box-shadow:0 0 22px rgba(255,215,0,.35);animation:manualExpPulse 2s ease-in-out infinite}
@keyframes manualExpPulse{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.3)}50%{box-shadow:0 0 28px rgba(255,215,0,.55)}}
.bf-wrap .bf-expand-icon{font-size:11px;color:#c8a040;margin-left:4px;opacity:.7}

/* ============ UI 縮放按鈕 ============ */
.ui-scale-btn{padding:6px 14px;font-size:13px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s;min-width:52px}
.ui-scale-btn.on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700}
.ui-scale-btn:hover:not(.on){filter:brightness(1.2)}

@media (max-width:640px){
    .game-menu-btn{padding:6px 12px;font-size:12px;top:8px;right:8px}
    .ai-speed-panel{bottom:8px;padding:6px 10px;max-width:calc(100vw - 16px)}
    .ai-speed-panel .sp-btn{padding:4px 8px;font-size:11px}
    .ai-speed-panel .lbl{font-size:11px}
    .ui-scale-btn{padding:5px 10px;font-size:12px;min-width:44px}
}
.ai-badge{display:inline-block;padding:4px 14px;border-radius:16px;background:linear-gradient(90deg,#6a0dad,#3d0066);color:#e8d0ff;font-weight:bold;font-size:13px;letter-spacing:2px;border:1px solid #8a2dcd;animation:aiPulse 1.2s ease-in-out infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 0 10px rgba(138,45,205,.5)}50%{box-shadow:0 0 22px rgba(138,45,205,.9)}}
.ai-mode-tag{display:inline-block;padding:2px 10px;border-radius:14px;font-size:11px;background:rgba(138,45,205,.2);color:#c8a0ff;border:1px solid rgba(138,45,205,.5);margin-left:8px}
.ai-diff-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;background:rgba(255,215,0,.15);color:#ffd700;border:1px solid rgba(255,215,0,.4);margin-left:6px}
.ai-diff-tag.hard{background:rgba(255,80,80,.18);color:#ff9c9c;border-color:rgba(255,120,120,.55)}
.ai-auto-hint{display:inline-block;margin-top:10px;padding:5px 16px;border-radius:16px;background:rgba(138,45,205,.25);color:#c8a0ff;font-size:13px;letter-spacing:2px;border:1px dashed rgba(138,45,205,.7)}
.countdown-overlay{position:fixed;inset:0;background:transparent;z-index:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;animation:cntFadeIn .3s ease-out}
@keyframes cntFadeIn{from{opacity:0}to{opacity:1}}
.countdown-num{font-size:130px;font-weight:bold;color:#ffd700;text-shadow:0 0 40px rgba(0,0,0,.95),0 0 40px rgba(255,215,0,.95),0 0 80px rgba(255,150,0,.55);line-height:1;animation:cntPulse .9s ease-in-out infinite}
@keyframes cntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.countdown-label{font-size:20px;color:#ffe066;letter-spacing:6px;font-weight:bold;text-shadow:0 0 6px #000,0 0 14px rgba(255,215,0,.8);background:rgba(0,0,0,.75);padding:6px 22px;border-radius:22px;border:1px solid rgba(255,215,0,.5)}
.countdown-hint{font-size:14px;letter-spacing:2px;background:rgba(0,0,0,.75);padding:4px 14px;border-radius:14px;border:1px solid rgba(68,255,136,.6);color:#7cff7c}
.handoff-overlay{position:fixed;inset:0;background:#000;z-index:870;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:handoffFadeIn .3s ease-out}
@keyframes handoffFadeIn{from{opacity:0}to{opacity:1}}
.handoff-overlay .who{font-size:30px;color:#ffd700;letter-spacing:6px}
.handoff-overlay .note{font-size:14px;color:#a89070}
.setup{max-width:820px;margin:24px auto;background:rgba(0,0,0,.4);border:1px solid #6a4a20;border-radius:14px;padding:26px}
.setup h1{text-align:center;letter-spacing:10px;font-size:34px;margin-bottom:6px;text-shadow:0 0 18px rgba(255,215,0,.5)}
.setup .sub{text-align:center;color:#b09a6a;font-size:13px;margin-bottom:22px}
.sec{margin-bottom:20px;padding:14px;background:rgba(255,255,255,.03);border:1px solid rgba(200,160,64,.2);border-radius:10px}
.sec h3{font-size:15px;margin-bottom:12px;color:#e8c060;letter-spacing:2px}
.chk-row{display:flex;flex-wrap:wrap;gap:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:15px;background:rgba(0,0,0,.3);padding:7px 14px;border-radius:8px;border:1px solid rgba(200,160,64,.25);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:#c8a040;cursor:pointer}
.chk-sm{padding:4px 10px;font-size:13px;gap:4px;}
.mode-btn{background:linear-gradient(180deg,#3a2a1a,#1a0f05);border:1px solid #6a4a20;color:#d8c090;padding:9px 18px;font-size:14px;}
.mode-btn.mode-btn-on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.5);}
.chk-sm input{width:14px;height:14px;}
.set-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.set-row:last-child{margin-bottom:0;}
.set-row-label{font-size:14px;color:#e8c060;letter-spacing:2px;min-width:60px;font-weight:bold;}.num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.num-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);padding:9px 14px;border-radius:8px;border:1px solid rgba(200,160,64,.2);font-size:14px}
.num-item input,.num-item select{width:100px;padding:5px 8px;border-radius:6px;text-align:center;background:#1a1008;color:#ffd700;border:1px solid #6a4a20;font-family:inherit;font-size:15px;font-weight:bold}
.num-item select{cursor:pointer}
.header{text-align:center;padding:8px;margin-bottom:10px;background:linear-gradient(180deg,rgba(80,40,0,.8),rgba(40,20,0,.55));border-bottom:2px solid #c8a040;border-radius:9px}
.header h1{font-size:23px;letter-spacing:9px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.header .info{font-size:13px;color:#e0c080;margin-top:3px}
.battle-layout{display:flex;gap:10px;align-items:flex-start}
.battle-main{flex:1;min-width:0}
.battle-side{width:240px;flex-shrink:0}
.hand-bar{display:flex;gap:12px;padding:8px 12px;margin-bottom:8px;background:linear-gradient(180deg,rgba(50,30,10,.55),rgba(20,10,0,.35));border:1px solid rgba(200,160,64,.25);border-radius:9px}
.hb-side{flex:1;display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.hb-lbl{font-size:15px;font-weight:bold;letter-spacing:2px;flex-shrink:0}
.hb-cards{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-height:22px;align-items:center}
.hb-food{font-size:15px;font-weight:bold;color:#ffd700;flex-shrink:0}
.hb-spent{font-size:12px;color:#a89070;flex-shrink:0}
.mini-back{width:13px;height:19px;border-radius:2px;background:linear-gradient(135deg,#3a2a1a,#241408);border:1px solid #6a5a3a;flex-shrink:0}
.hb-empty{font-size:11px;color:#555}
.hand-bar.multi{flex-wrap:wrap;gap:6px;padding:6px 8px;}
.hand-bar.multi .hb-side{flex:1 1 200px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.15);}
.hand-bar.multi .hb-side{gap:8px;}
.hand-bar.multi .hb-side.hb-turn{
    background:rgba(255,215,0,.16);
    box-shadow:0 0 12px rgba(255,215,0,.55), inset 0 0 8px rgba(255,215,0,.15);
    animation:hbTurnPulse 1.6s ease-in-out infinite;
}
@keyframes hbTurnPulse{
    0%,100%{box-shadow:0 0 8px rgba(255,215,0,.45), inset 0 0 6px rgba(255,215,0,.10);}
    50%{box-shadow:0 0 22px rgba(255,215,0,.85), inset 0 0 14px rgba(255,215,0,.28);}
}
.hand-bar.multi .hb-side.hb-me{outline:1px dashed rgba(255,215,0,.55);}
.hb-hand{font-size:14px;font-weight:bold;color:#d0c090;flex-shrink:0;display:inline-flex;align-items:center;gap:2px;}
.hb-wins{font-size:12px;font-weight:bold;}
.player-row{display:flex;gap:8px;padding:6px 10px;margin-bottom:8px;background:rgba(0,0,0,.28);border-radius:9px;border:1px solid rgba(200,160,64,.22);flex-wrap:wrap;}
.pr-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:16px;border:2px solid;background:rgba(0,0,0,.3);font-size:13px;font-weight:bold;flex:1 1 auto;justify-content:center;transition:.15s;position:relative;min-width:110px;}
.pr-chip.pr-cur{background:rgba(255,215,0,.15);box-shadow:0 0 12px rgba(255,215,0,.4);animation:prPulse 1.2s infinite;}
@keyframes prPulse{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.3)}50%{box-shadow:0 0 20px rgba(255,215,0,.75)}}
.pr-name{letter-spacing:1px;}
.pr-wins{font-size:12px;opacity:.9;}
.pr-pass{font-size:10px;color:#ff6b6b;background:rgba(120,20,20,.55);padding:1px 6px;border-radius:8px;}
.bf-player-lbl{font-size:11px;font-weight:bold;letter-spacing:1px;writing-mode:vertical-rl;text-orientation:upright;padding:2px;opacity:.85;min-width:16px;text-align:center;}
.bf-flex{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.bf-wrap{transition:flex .25s ease,opacity .25s;border-radius:9px;overflow:hidden}
.bf-wrap.active{flex:10 1 0;min-width:0;box-shadow:0 0 18px rgba(255,215,0,.15)}
.bf-wrap.inactive{flex:1 1 0;min-width:0;opacity:.72}
.bf-wrap.future{flex:1 1 0;min-width:0;opacity:.38}
.bf-wrap.inactive .bfield,
.bf-wrap.future .bfield{padding:3px}
.bf-wrap.inactive .bf-row,
.bf-wrap.future .bf-row{min-height:60px;padding:2px 1px;margin-bottom:2px}
.bf-wrap.inactive .bf-head,
.bf-wrap.future .bf-head{font-size:10px;margin-bottom:2px;letter-spacing:1px}
.bf-wrap.inactive .bf-cards,
.bf-wrap.future .bf-cards{gap:2px}
.bf-wrap.inactive .bf-total,
.bf-wrap.future .bf-total{font-size:12px;min-width:24px;padding:1px}
.bfield{background:rgba(0,0,0,.35);border:1px solid rgba(200,160,64,.25);border-radius:9px;padding:6px;height:100%;display:flex;flex-direction:column}
.bf-wrap.active .bfield{border-color:rgba(255,215,0,.55)}
.bf-head{display:flex;justify-content:space-between;font-size:12px;color:#c8a040;letter-spacing:2px;margin-bottom:4px;padding:0 2px}
.bf-wrap.active .bf-head{font-size:14px}
.bf-head .res{font-size:11px;color:#888;letter-spacing:0}
.bf-head .open{font-size:11px;color:#44ff88;letter-spacing:0}
.bf-row{display:flex;align-items:flex-start;gap:4px;padding:3px;border-radius:6px;margin-bottom:3px;flex:1;min-height:130px;position:relative}
.bf-wrap.active .bf-row{min-height:160px}
.bf-row.red{background:rgba(120,20,20,.18)}
.bf-row.blue{background:rgba(20,60,120,.18)}
.bf-row.passed::after{content:'已放棄跟牌';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-size:22px;font-weight:bold;color:#ff6b6b;text-shadow:0 0 6px #000,0 0 14px #000,0 0 24px rgba(255,60,60,.9);letter-spacing:4px;background:rgba(0,0,0,.68);padding:6px 22px;border-radius:9px;border:2px solid rgba(255,107,107,.85);box-shadow:0 0 18px rgba(255,80,80,.6);pointer-events:none;z-index:6;animation:passStamp .35s ease-out}
@keyframes passStamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.bf-cards{display:flex;gap:3px;flex-wrap:wrap;flex:1;align-items:center}
.bf-total{font-size:15px;font-weight:bold;min-width:34px;text-align:center;padding:2px;border-radius:5px;background:rgba(0,0,0,.4)}
.bf-total.red{color:#ff7b7b}
.bf-total.blue{color:#6fb6ff}
.bf-total.win{background:rgba(255,215,0,.25);color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.5)}
.bf-ghost{color:#555;font-size:11px;padding:14px 4px;text-align:center;width:100%;letter-spacing:1px}
.control-area{margin:10px 0;padding:10px;border-radius:10px;text-align:center;background:linear-gradient(180deg,rgba(60,40,20,.6),rgba(30,20,10,.4));border:1px solid rgba(200,160,64,.3)}
.ctrl-info{font-size:14px;color:#e0c080;margin-bottom:9px;min-height:20px}
.ctrl-info b{color:#ffd700}
.ctrl-buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.sel-skill-box{margin-top:11px;padding:10px 14px;background:linear-gradient(135deg,rgba(255,215,0,.10),rgba(200,160,64,.04));border:1px solid rgba(255,215,0,.40);border-radius:9px;text-align:left}
.sel-skill-box.new-draw{background:linear-gradient(135deg,rgba(68,255,136,.14),rgba(68,255,136,.04));border-color:rgba(68,255,136,.7);box-shadow:0 0 16px rgba(68,255,136,.35)}
.skill-name{font-size:15px;font-weight:bold;color:#ffd700;margin-bottom:5px}
.sel-skill-box.new-draw .skill-name{color:#7cff7c}
.skill-name .ttl{color:#c8a040;font-size:12px;font-weight:normal}
.skill-desc{font-size:12.5px;color:#d8c8a0;line-height:1.75}
.hand-wrap{background:rgba(0,0,0,.22);border-radius:9px;padding:8px}
.hand-title{font-size:16px;font-weight:bold;color:#999;margin-bottom:6px;letter-spacing:1px}
.hand-pending{font-size:13px;color:#c8a040;font-weight:normal;letter-spacing:.5px}
.hand-row{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;align-items:flex-start}
.side-panel{background:rgba(0,0,0,.35);border:1px solid rgba(200,160,64,.22);border-radius:9px;padding:8px;margin-bottom:9px}
.side-panel h4{font-size:12px;color:#c8a040;letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid rgba(200,160,64,.2);padding-bottom:4px}
.hist-item{font-size:11px;padding:5px 6px;margin-bottom:5px;border-radius:6px;background:rgba(255,255,255,.035);line-height:1.6}
.hist-item .rnd{color:#ffd700;font-weight:bold}
.hist-line{display:flex;justify-content:space-between}
.arch-scroll{max-height:330px;overflow-y:auto}
.arch-scroll::-webkit-scrollbar{width:5px}
.arch-scroll::-webkit-scrollbar-thumb{background:rgba(200,160,64,.4);border-radius:3px}
.arch-fac{font-size:11px;color:#c8a040;margin:6px 0 3px;letter-spacing:1px}
.arch-row{display:flex;flex-wrap:wrap;gap:3px}
.log{max-height:220px;overflow-y:auto;padding:7px;background:rgba(0,0,0,.45);border-radius:7px;margin-top:9px;font-size:12px;line-height:1.55}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:rgba(200,160,64,.4);border-radius:3px}
.log .e{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.045);white-space:pre-wrap}
.l-sys{color:#ffd700}.l-p0{color:#6fb6ff}.l-p1{color:#ff7b7b}.l-bat{color:#ff9c4a}.l-skill{color:#c8a0ff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(150deg,#3a2a1a,#180a00);border:2px solid #c8a040;border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{font-size:22px;margin-bottom:12px;text-align:center}
.modal p{font-size:14px;color:#d8c090;margin-bottom:10px;text-align:center}
.modal-cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.flip-stage{display:flex;justify-content:center;align-items:center;gap:56px;margin:32px 0 26px}
.flip-slot{display:flex;flex-direction:column;align-items:center;gap:22px}
.flip-slot .lbl{font-size:18px;font-weight:bold;letter-spacing:3px}
.flip-card-wrap{width:160px;height:200px;display:flex;align-items:center;justify-content:center}
.flip-slot .card{transform:scale(1.35);transform-origin:center center}
.flip-power{font-size:15px;font-weight:bold;letter-spacing:1px}
.flip-power.hidden{visibility:hidden}
.flip-click{cursor:pointer;transition:.18s}
.flip-click:hover{filter:brightness(1.25) drop-shadow(0 0 12px rgba(255,215,0,.5))}
.phase-tag{display:inline-block;padding:2px 12px;border-radius:20px;font-size:12px;background:rgba(200,160,64,.2);color:#e8c060;border:1px solid rgba(200,160,64,.4)}
.result-line{font-size:19px;margin:9px 0}
.result-line .b{color:#6fb6ff;font-weight:bold}
.result-line .r{color:#ff7b7b;font-weight:bold}
.inspect-modal{max-width:560px}
.inspect-layout{display:flex;gap:22px;align-items:flex-start}
.inspect-body{flex:1;min-width:0}
.inspect-body h2{text-align:left;font-size:24px;margin-bottom:4px;letter-spacing:3px}
.inspect-title{color:#c8a040;font-size:13px;letter-spacing:2px;margin-bottom:10px}
.inspect-stats{font-size:13px;color:#a89070;margin-bottom:14px}
.inspect-stats b{color:#ffd700}
.inspect-desc{font-size:14px;color:#e8d8b0;line-height:1.85;background:rgba(0,0,0,.3);padding:12px 14px;border-radius:8px;border-left:3px solid #c8a040}
.viewer-modal{max-width:1100px}
.viewer-toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.viewer-toolbar button{padding:6px 16px;font-size:13px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.18s}
.viewer-toolbar button.on{background:linear-gradient(180deg,#c8a040,#8a6020);color:#fff;border-color:#ffd700}
.viewer-toolbar button:hover{filter:brightness(1.2)}
.viewer-section{margin-bottom:16px}
.viewer-section h3{font-size:14px;color:#e8c060;letter-spacing:3px;margin-bottom:6px;border-bottom:1px solid rgba(200,160,64,.25);padding-bottom:4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;transition:color .15s}
.viewer-section h3:hover{color:#ffd700}
.viewer-section .vs-chevron{display:inline-block;font-size:11px;color:#c8a040;transition:transform .25s;width:12px;flex-shrink:0}
.viewer-section.collapsed .vs-chevron{transform:rotate(-90deg)}
.viewer-section.collapsed .viewer-grid{display:none}
.viewer-section .vs-count{font-size:12px;color:#a89070;font-weight:normal;letter-spacing:0}
.viewer-toggle-all-bar{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.viewer-toggle-all-bar button{padding:5px 14px;font-size:12px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s}
.viewer-toggle-all-bar button:hover{filter:brightness(1.2)}
.viewer-grid{display:flex;flex-wrap:wrap;gap:8px}
.viewer-card-wrap{cursor:pointer;transition:.15s;border-radius:8px;padding:2px;position:relative}
.viewer-card-wrap:hover{transform:translateY(-4px);filter:brightness(1.15);box-shadow:0 0 18px rgba(255,215,0,.45)}
.viewer-card-wrap.in-hand{box-shadow:0 0 0 2px #ffd700,0 0 14px rgba(255,215,0,.55);border-radius:8px}
.viewer-card-wrap.in-hand:hover{box-shadow:0 0 0 2px #ffd700,0 0 22px rgba(255,215,0,.85)}
.viewer-card-wrap.in-played{opacity:.45;filter:grayscale(.8)}
.viewer-card-wrap.in-played:hover{opacity:.75;filter:grayscale(.3)}
.viewer-badge{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.75);color:#ffd700;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,215,0,.4);font-weight:bold;letter-spacing:1px}
.def-list{font-size:14px;color:#e0d0b0;line-height:1.85}
.def-list li{margin-bottom:8px;list-style:none;border-left:2px solid rgba(200,160,64,.3);padding-left:10px}
.def-list li strong{color:#ffd700}
.log-viewer{max-width:900px}
.log-item{padding:8px 12px;margin-bottom:6px;border-radius:6px;background:rgba(255,255,255,.04);font-size:12.5px;line-height:1.6;cursor:pointer;transition:.15s}
.log-item:hover{background:rgba(255,215,0,.08)}
.log-item .li-time{color:#a89070;font-size:11px;margin-right:8px}
.log-item .li-mode{color:#c8a0ff;font-weight:bold;margin-right:8px}
.log-item .li-winner{color:#44ff44;font-weight:bold}
.ev{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;font-family:'Consolas','Courier New',monospace}
.ev .ev-i{color:#888;margin-right:6px}
.ev .ev-r{color:#c8a040;margin-right:6px}
.ev .ev-t{color:#7cff7c;font-weight:bold;margin-right:6px}
.ev .ev-d{color:#d8c090}
.hand-trace{font-size:11px;color:#888;font-family:monospace}
/* ============ 迷你卡版型（陣地/棄牌區/查看牌庫） ============ */
.card.mini .c-art,
.card.mini .c-fac,
.card.mini .c-skills,
.card.mini .c-title,
.card.mini .c-gen,
.card.mini .c-tag { display: none !important; }
.card.mini .c-cost {
    top: 4px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.72); font-size: 13px; padding: 0 6px;
}
.card.mini .c-name {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    writing-mode: vertical-rl; text-orientation: upright;
    font-size: 15px; letter-spacing: 1px;
}
.card.mini .c-power {
    bottom: 4px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.72); font-size: 13px; padding: 0 6px;
    text-align: center;
}
.card.mini.xs .c-name { font-size: 12px; }
.card.mini.xs .c-cost,
.card.mini.xs .c-power { font-size: 11px; }

/* ============ 手牌數量顏色（依數量變色） ============ */
.hb-hand.hand-high { color: #44ee44 !important; }
.hb-hand.hand-low  { color: #ff5555 !important; }
body[data-theme="ink"]    .hb-hand.hand-high,
body[data-theme="bamboo"] .hb-hand.hand-high,
body[data-theme="sand"]   .hb-hand.hand-high { color: #2d8a2d !important; }
body[data-theme="ink"]    .hb-hand.hand-low,
body[data-theme="bamboo"] .hb-hand.hand-low,
body[data-theme="sand"]   .hb-hand.hand-low  { color: #c52828 !important; }
/* 手牌與糧草間距 */
.hb-hand { margin-right: 10px !important; }
/* 戰場標題右側資訊區（先後手 + 領先） */
.bf-head .bf-meta { text-align: right; line-height: 1.35; }
.bf-head .bf-meta .bf-first-line { font-size: 10px; color: #a89070; letter-spacing: 0; }
.bf-head .bf-meta .bf-leader    { font-size: 10px; letter-spacing: 0; }
/* ================================================================ */
/* ===== 淺色主題（墨韻 / 竹簡 / 黃沙）可視性統一修正 ============ */
/* ================================================================ */

/* --- 選擇模式 / 玩家設定 等金黃色標題 --- */
body[data-theme="sand"]   [style*="color:#e8c060"] { color: #7a2a10 !important; }
body[data-theme="bamboo"] [style*="color:#e8c060"] { color: #3a5a1a !important; }
body[data-theme="ink"]    [style*="color:#e8c060"] { color: #a52a2a !important; }

/* --- 原版 / 拓展 label（.set-row-label） --- */
body[data-theme="sand"]   .set-row-label { color: #7a2a10; }
body[data-theme="bamboo"] .set-row-label { color: #3a5a1a; }
body[data-theme="ink"]    .set-row-label { color: #a52a2a; }

/* --- 引導文字 .ctrl-info（戰場下方、手牌上方那段） --- */
body[data-theme="sand"]   .ctrl-info { color: #3a2010; }
body[data-theme="bamboo"] .ctrl-info { color: #2a1a0a; }
body[data-theme="ink"]    .ctrl-info { color: #3a2010; }
/* 引導文字裡的綠色高亮（"點擊下方手牌"） */
body[data-theme="sand"]   .ctrl-info span[style*="#7cff7c"],
body[data-theme="bamboo"] .ctrl-info span[style*="#7cff7c"],
body[data-theme="ink"]    .ctrl-info span[style*="#7cff7c"] { color: #1a6a1a !important; }
/* 引導文字裡的橘色警示（"對手已放棄跟牌"） */
body[data-theme="sand"]   .ctrl-info span[style*="#ff9c4a"],
body[data-theme="bamboo"] .ctrl-info span[style*="#ff9c4a"],
body[data-theme="ink"]    .ctrl-info span[style*="#ff9c4a"] { color: #8a3a10 !important; }

/* --- 手牌數量 / 消耗糧草數 --- */
body[data-theme="sand"]   .hb-hand  { color: #3a2010; }
body[data-theme="bamboo"] .hb-hand  { color: #2a1a0a; }
body[data-theme="ink"]    .hb-hand  { color: #2a1a10; }
body[data-theme="sand"]   .hb-spent { color: #5a4028; }
body[data-theme="bamboo"] .hb-spent { color: #5a4a20; }
body[data-theme="ink"]    .hb-spent { color: #6a5040; }

/* --- 選牌技能框（.skill-name / .skill-desc） --- */
body[data-theme="sand"]   .skill-name { color: #7a2a10; }
body[data-theme="bamboo"] .skill-name { color: #3a5a1a; }
body[data-theme="ink"]    .skill-name { color: #a52a2a; }
body[data-theme="sand"]   .skill-desc { color: #3a2010; }
body[data-theme="bamboo"] .skill-desc { color: #2a1a0a; }
body[data-theme="ink"]    .skill-desc { color: #2a1a10; }

/* --- 迷你卡數值（深色底）→ 強制淺色 --- */
.card.mini .c-cost  { color: #ffd700 !important; }
.card.mini .c-power { color: #ffffff !important; }

/* --- 戰場「先：[名]」標籤 --- */
body[data-theme="sand"]   .bf-first-line { color: #5a4028 !important; }
body[data-theme="bamboo"] .bf-first-line { color: #4a5a30 !important; }
body[data-theme="ink"]    .bf-first-line { color: #6a5040 !important; }

/* --- 網路徽章 / 種子綠字 --- */
body[data-theme="sand"]   .header span[style*="#7cff7c"],
body[data-theme="bamboo"] .header span[style*="#7cff7c"],
body[data-theme="ink"]    .header span[style*="#7cff7c"] { color: #1a6a1a !important; }

/* --- 手牌標題硬編碼的淺藍/淺紅 → 一律改用玩家色 --- */
body[data-theme="sand"]   .hand-title[style*="#6fb6ff"] { color: #2a4a7a !important; }
body[data-theme="sand"]   .hand-title[style*="#ff7b7b"] { color: #7a2a10 !important; }
body[data-theme="bamboo"] .hand-title[style*="#6fb6ff"] { color: #1a4a8a !important; }
body[data-theme="bamboo"] .hand-title[style*="#ff7b7b"] { color: #8a2a1a !important; }
body[data-theme="ink"]    .hand-title[style*="#6fb6ff"] { color: #1a4a8a !important; }
body[data-theme="ink"]    .hand-title[style*="#ff7b7b"] { color: #a52828 !important; }
/* ============ 快速聊天 ============ */
.quick-chat.collapsed{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;}
.qc-toggle{padding:3px 10px !important;font-size:12px !important;}
.qc-header{font-size:12px;color:#c8a040;letter-spacing:2px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.qc-cooldown{font-size:12px;color:#ff9c4a;font-weight:bold;}
.qc-row{display:flex;gap:5px;flex-wrap:wrap;}
.qc-row+.qc-row{margin-top:5px;}
.qc-btn{padding:5px 12px;font-size:12px;border-radius:6px;border:1px solid #6a4a20;background:linear-gradient(180deg,#3a2a1a,#1a0f05);color:#d8c090;cursor:pointer;font-family:inherit;font-weight:bold;transition:.15s;white-space:nowrap;}
.qc-btn:hover:not(:disabled){filter:brightness(1.3);transform:translateY(-1px);}
.qc-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.qc-emoji{font-size:17px;padding:3px 8px;}
.chat-bubble{position:fixed;background:rgba(0,0,0,.9);border:2px solid #ffd700;padding:12px 22px;border-radius:24px;color:#fff;font-size:20px;font-weight:bold;z-index:1400;pointer-events:none;animation:bubblePop 4s ease-out forwards;max-width:340px;text-align:center;white-space:pre-line;}
.chat-bubble-blue{bottom:160px;left:30px;border-color:#6fb6ff;box-shadow:0 0 24px rgba(111,182,255,.6);}
.chat-bubble-red{bottom:160px;right:30px;border-color:#ff7b7b;box-shadow:0 0 24px rgba(255,123,123,.6);}
.chat-bubble-green{top:90px;left:30px;border-color:#7cff7c;box-shadow:0 0 24px rgba(124,255,124,.6);}
.chat-bubble-purple{top:90px;right:90px;border-color:#d090ff;box-shadow:0 0 24px rgba(208,144,255,.6);}
@keyframes bubblePop{
    0%{opacity:0;transform:translateY(30px) scale(.7);}
    15%{opacity:1;transform:translateY(0) scale(1.05);}
    25%{transform:translateY(0) scale(1);}
    75%{opacity:1;}
    100%{opacity:0;transform:translateY(-40px) scale(.9);}
}

/* ============ 移除飛向棄牌區動畫 ============ */
.removal-clone {
    position: fixed; left: 50%; top: 50%;
    pointer-events: none; z-index: 1500;
    animation: removalFly 0.9s cubic-bezier(0.35, 0, 0.55, 1) forwards;
}
@keyframes removalFly {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); filter: brightness(1); }
    18%  { opacity: 1; transform: translate(-50%, -58%) scale(1.1) rotate(4deg); filter: brightness(1.5) drop-shadow(0 0 14px rgba(255,80,80,.9)); }
    100% { opacity: 0; transform: translate(-50%, 55%) scale(0.3) rotate(48deg); filter: brightness(0.4); }
}
@media (max-width:980px){
.battle-layout{flex-direction:column}
.battle-side{width:100%}
.bf-flex{flex-direction:column}
.bf-wrap.inactive,
.bf-wrap.future {
    flex: 0 0 auto;
    max-height: 56px;
    overflow: hidden;
}
.bf-wrap.active {
    flex: 1 1 auto;
    min-height: 180px;
    max-height: none !important;
}
.bf-wrap.manually-expanded {
    flex: 1 1 auto;
    min-height: 180px;
    max-height: none !important;
    overflow: visible;
}
.card{width:78px;height:108px}
.card.sm{width:58px;height:82px}
.c-name{font-size:13px;top:24px}
.c-title{font-size:9px;top:24px;left:20px}
.c-cost,.c-power{font-size:13px;padding:1px 5px}
.c-skills{font-size:11px;max-width:58px;top:20px}
.c-fac{font-size:10px}
.c-gen,.c-tag{font-size:9px}
.c-art{font-size:26px}
.card.mini .c-name{font-size:13px}
.card.mini .c-cost,.card.mini .c-power{font-size:11px}
.card.mini.xs .c-name{font-size:10px}
.card.mini.xs .c-cost,.card.mini.xs .c-power{font-size:9px}

/* ============ 主題系統：📜 墨韻（淺色） ========================= */
/* ================================================================ */
body[data-theme="ink"] {
    background: #f5ecd8;
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(140,110,70,.12) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 100%, rgba(140,110,70,.10) 0%, transparent 65%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,90,50,.025) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 3px, rgba(120,90,50,.025) 3px 4px);
    color: #2a2018;
}
body[data-theme="ink"] h1,
body[data-theme="ink"] h2,
body[data-theme="ink"] h3 { color: #a52a2a; }

/* ---- 按鈕 ---- */
body[data-theme="ink"] .btn {
    background: linear-gradient(180deg,#f0e2c4,#d8c4a0);
    color: #5a2018;
    border: 1px solid #a08860;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(80,50,20,.15);
}
body[data-theme="ink"] .btn:hover:not(:disabled) {
    filter: brightness(1.06);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 4px 12px rgba(165,42,42,.28);
}
body[data-theme="ink"] .btn-green { background: linear-gradient(180deg,#b8d8a0,#8ab878); color: #1a3a10; border-color: #6a9a58; }
body[data-theme="ink"] .btn-red   { background: linear-gradient(180deg,#e0a090,#c87860); color: #4a0a08; border-color: #b85040; }

/* ================================================================ */
/* ============ 粒子效果 ========================================= */
/* ================================================================ */
/* 確保內容在所有粒子之上 */
#app { position: relative; z-index: 1; }

/* ============ 狀態指示文字（主題自適應） ============ */
.status-ok { color: #7cff7c; }
body[data-theme="ink"]    .status-ok { color: #2d6a2d; }
body[data-theme="bamboo"] .status-ok { color: #2d5a15; }
body[data-theme="sand"]   .status-ok { color: #6a3a10; }
body[data-theme="moon"]   .status-ok { color: #7cffae; }
body[data-theme="red"]    .status-ok { color: #ffcf7c; }
/* ================================================================ */
/* ================================================================ */
/* ============ 只有彈窗內部文字可選取（卡片圖示本身不可選）===== */
/* ================================================================ */

/* 彈窗（Modal）內的文字 → 可選取、iOS 可長按 */
.modal,
.modal * {
    -webkit-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default !important;
}

/* 但彈窗裡的按鈕、勾選框 → 保持不可選（避免誤觸） */
.modal button,
.modal .btn,
.modal .viewer-toolbar button,
.modal .chk,
.modal input[type="checkbox"],
.modal input[type="radio"] {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
}

/* ★ 關鍵：卡牌本身（縮圖、遊戲中的牌）一律不可選 */
.card,
.card *,
.card-front,
.card-front * {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
}

/* 卡牌庫的卡片外框：點擊是為了開彈窗，不要觸發選字或長按預覽 */
.viewer-card-wrap {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
}

/* 被選取的文字在深色主題下依然清楚可見 */
.modal ::selection { background: rgba(255,215,0,.45); color: #fff; }
.modal ::-moz-selection { background: rgba(255,215,0,.45); color: #fff; }

        const parsed = JSON.parse(raw);
        const out = { ai: {}, player: {} };
        // ★ v3.8: 遷移 — 舊格式（頂層是 cardId）→ 全部歸入「all」
        const MODE_KEYS = ['1v1','1v1v1','2v2','1v1v1v1','all'];
        const looksNewFormat = (bucket) => {
            if (!bucket || typeof bucket !== 'object') return true;
            const keys = Object.keys(bucket);
            if (keys.length === 0) return true;
            return keys.some(k => MODE_KEYS.includes(k));
        };
        for (const bucket of ['ai', 'player']) {
            const src = parsed[bucket] || {};
            out[bucket] = looksNewFormat(src) ? src : { all: src };
        }
        return out;
    } catch (e) { return { ai: {}, player: {} }; }

function mulberry32(a) {
    return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);

}

{ id:'diaochan', cardId:'302', name:'貂蟬', title:'閉月羞花', faction:'qun', cost:2, power:1, emoji:'🌸', set:'vanilla',
  skills:['離間'],
  desc:'離間：進場時，若對陣有至少2名男性角色，選擇一項：\n① 移除自己與其中戰力最小的角色。\n② 自己戰力+其中戰力最高角色目前戰力的一半（向上取整）。',
  onEnter(ctx){
      const game = ctx.game;
      const pi = ctx.owner, bi = ctx.field, oppPi = ctx.opponent;

      // ── 1. 收集所有對陣正面男性（含被保護的） ──
      const malesAll = ctx.enemyField.filter(c =>
          !c.faceDown && c.data.male !== false
      );
      if (malesAll.length < 2) return;   // 不足 2 名，不觸發

      // ── 2. 可移除的男性（排除被堅守 / 空城保護） ──
      const malesRemovable = malesAll.filter(c =>
          !game._isJianshouProtected(c, oppPi, bi)
      );

      // ── 3. 最弱者（從可移除的挑）／最強者（從全部挑） ──
      const weakest = malesRemovable.length > 0
          ? malesRemovable.reduce((a, c) =>
              ((c.data.power + (c.mod||0)) < (a.data.power + (a.mod||0)) ? c : a))
          : null;
      const highest = malesAll.reduce((a, c) =>
          ((c.data.power + (c.mod||0)) > (a.data.power + (a.mod||0)) ? c : a));
      const highestPower = highest.data.power + (highest.mod || 0);
      const gainB = Math.ceil(highestPower / 2);

      // ── 4. AI / 巢狀（奇策）自動決策 ──
      if (game.isAI(pi) || game._inExtraPlay) {
          let useRemove;
          if (!weakest) {
              // A 不可用（所有男性都被保護）→ 強制 B
              useRemove = false;
          } else {
              // ═══ 收集所有決策依據 ═══
              const weakPow = (weakest.data.power || 0) + (weakest.mod || 0);
              const threatA = game.cardThreatValue(weakest);
              const selfThreat = game.cardThreatValue(ctx.self);
              const myPow = game.fieldPower(pi, bi, false);
              const oppPow = game.fieldPower(oppPi, bi, false);
              const lead = myPow - oppPow;
              const oppWins = game.players[oppPi].wins;
              const mustWinRound = (oppWins === 1);           // 對手已 1 勝 → 這輪必勝
              const isFinalRound = (game.round >= game.fieldCount);
              const decisive = mustWinRound || isFinalRound;

              // ═══ 兩個選項的「戰力差」變化 ═══
              //   A：自己 -1，弱者 -weakPow → 淨變化 +(weakPow - 1)
              //   B：自己 +gainB → 淨變化 +gainB
              const swingA = weakPow - 1;
              const swingB = gainB;

              // ═══ 兩個選項的「威脅值」變化（僅 A 有效）═══
              //   A 移除弱者的威脅值，但失去自己（通常低威脅）
              const threatSwingA = threatA - selfThreat;

              // ═══ 決策核心 ═══
              if (decisive) {
                  // ── 決勝輪：追求最大即時戰力差 ──
                  // 直接比較兩個選項的淨戰力 swing
                  useRemove = swingA > swingB;
              } else if (lead >= 6) {
                  // ── 大幅領先 ──
                  // 用 A 減少對手資源（避免對手拖入長期戰）
                  // 若弱者威脅值高，A 更值；若弱者只是廢牌，B 保留自己更好
                  if (threatSwingA >= 5) useRemove = true;
                  else if (swingA >= swingB) useRemove = true;
                  else useRemove = false;
              } else if (lead <= -6) {
                  // ── 大幅落後 ──
                  // 需要立即補戰力，B 為首選
                  // 例外：若 A 能移除對手關鍵高威脅牌 + 戰力上也不虧
                  if (threatSwingA >= 8 && swingA >= 0) useRemove = true;
                  else useRemove = false;
              } else {
                  // ── 一般情境：綜合評估 ──
                  // 戰力 swing 為主，威脅 swing 為輔
                  const scoreA = swingA + threatSwingA * 0.5;
                  const scoreB = swingB;
                  useRemove = scoreA > scoreB;
              }
          }

          // ═══ 執行決策 ═══
          if (useRemove && weakest) {
              ctx.myField.splice(ctx.myField.indexOf(ctx.self), 1);
              game.archive.push(ctx.self);
              ctx.enemyField.splice(ctx.enemyField.indexOf(weakest), 1);
              game.archive.push(weakest);
              ctx.log(`${ctx.self.data.name}【離間】：與 ${weakest.data.name} 一同進入棄牌堆`);
          } else {
              ctx.self.mod = (ctx.self.mod || 0) + gainB;
              ctx.log(`${ctx.self.data.name}【離間】：吸收 ${highest.data.name} 的戰力，+${gainB}`);
          }
          return;
      }

      // ── 5. 人類玩家 → 開啟 modal ──
      game.diaochan = {
          pi, selfUid: ctx.self.uid, bi,
          weakestUid: weakest ? weakest.uid : null,
          highestUid: highest.uid,
          gainB,
          mode: null
      };
  }
},

/* FAQ 按鈕 HTML 產生器 */
function faqButtonHTML(cardId) {
    const entry = FAQ_DB[cardId];
    if (!entry) {
        return `<button class="btn" disabled style="opacity:.5;cursor:not-allowed;" title="此卡尚未收錄 FAQ">❓ FAQ（尚未提供）</button>`;
    }
    if (entry.noFaq) {
        return `<button class="btn" disabled style="opacity:.75;cursor:not-allowed;" title="${entry.reason || ''}">✅ 無 FAQ（技能明瞭）</button>`;
    }
    return `<button class="btn btn-gold" onclick="openFaqModal('${cardId}')">❓ FAQ</button>`;
}

/* 開啟 FAQ Modal */
function openFaqModal(cardId) {
    const entry = FAQ_DB[cardId];
    if (!entry || entry.noFaq) return;
    const slot = document.getElementById('modal-slot');
    if (!slot) return;
    const cardName = CARD_NAME_MAP[cardId] || cardId;
    const qaHtml = entry.qa.map(item => `
        <div style="margin-bottom:14px;padding:12px 14px;background:rgba(0,0,0,.28);border-left:3px solid #c8a040;border-radius:8px;">
            <div style="font-size:14px;font-weight:bold;color:#ffd700;margin-bottom:6px;">Q: ${item.q}</div>
            <div style="font-size:13px;color:#d8c8a0;line-height:1.85;">A: ${item.a}</div>
        </div>
    `).join('');
    const existing = slot.querySelector('.faq-modal-overlay');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'overlay faq-modal-overlay';
    div.style.zIndex = '1100';
    div.innerHTML = `<div class="modal" onclick="event.stopPropagation()" style="max-width:640px;">
        <h2>${entry.title || (cardName + ' · FAQ')}</h2>
        <p style="font-size:12px;color:#a89070;">常見問題</p>
        <div style="max-height:60vh;overflow-y:auto;padding:4px;">${qaHtml}</div>
        <div style="text-align:center;margin-top:16px;">
            <button class="btn btn-red" onclick="closeFaqModal()">關閉</button>
        </div>
    </div>`;
    div.addEventListener('click', e => { if (e.target === div) closeFaqModal(); });
    slot.appendChild(div);
}
function closeFaqModal() {
    const el = document.querySelector('.faq-modal-overlay');
    if (el) el.remove();
}

const THEME_DEFS = {
    xuanwu: { label: '玄武', emoji: '🌑', desc: '深色武俠 · 護眼' },
    ink:    { label: '墨韻', emoji: '📜', desc: '淺色水墨 · 白天' },
    red:    { label: '赤壁', emoji: '🔥', desc: '烈焰火光 · 史詩' },
    moon:   { label: '月夜', emoji: '🌙', desc: '霜銀月華 · 冷酷' },
    bamboo: { label: '竹簡', emoji: '🎋', desc: '古樸自然 · 山隱' },
    sand:   { label: '黃沙', emoji: '🏜️', desc: '大漠孤煙 · 粗獷' }
};
function getCurrentTheme() {
    return safeStore.get('sanguo_theme', 'xuanwu');
}
function setTheme(name) {
    if (!THEME_DEFS[name] || THEME_DEFS[name].disabled) return;
    if (name === 'xuanwu') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', name);
    safeStore.set('sanguo_theme', name);
    const m = document.querySelector('.game-menu-overlay');
    if (m) { const c = m.querySelector('.modal'); }
    if (typeof openVisualSettings === 'function') openVisualSettings();
}
function openVisualSettings() {
    const slot = document.getElementById('modal-slot');
    if (!slot) return;

class Game {
constructor(cfg) {

    const rawSeed = (cfg.seed && String(cfg.seed).trim()) ? String(cfg.seed).trim().toUpperCase() : makeSeed();
    this.seed = rawSeed;
    this.rng = mulberry32(seedToNumber(rawSeed));

    this.uid = 0;
    this.logs = [];
    this.archive = [];
    this.history = [];
    this.round = 1;
    this.state = 'flip';
    this.phase = '';

    this.selected = null;
    this.scry = null;
    this.quanheng = null;
    this.jianxiong = null;

    this.guanyu = null;

    this.firstPasser = null;
    this.backBtnState = 'grey';   // 已廢棄，保留相容
    this.backBtnTimer = null;      // 已廢棄，保留相容
    this.expandedField = null;     // 玩家手動展開的戰場索引
    this.aiSpeed = (() => {
        const v = parseFloat(safeStore.get('sanguo_aiSpeed', '1'));
        return (v && v > 0 && v <= 10) ? v : 1;
    })();    this.countdown = null;
    this.countdownTimer = null;
    this.aiTimer = null;
    this.flipAutoTimer = null;
    this.settleAutoTimer = null;
    this._handoffDoneThisTurn = false;
    this.cardsPlayedCount = 0;
    this._simaYiLastChanceUsed = false;
    this._yinrenUsedThisRound = false;   // ★ v3.12
    this._pendingFlips = {};          // ★ v3.9: { bi: { projected, totals } }
    this.preEndTurn = null;           // ★ v3.7: preend 目前行動者（seat index）
    this.preEndPassed = [];           // ★ v3.7: preend 各玩家是否已放棄
    this._paymentOrders = {};         // ★ v3.5: 結算支付順序
    this._gamePlays = {};             // ★ v4.0: 整場遊戲每個玩家出過的卡（Set<cardId>）
    this._gameStatsRecorded = false;  // ★ v4.0: 防止重複寫入
    for (let i = 0; i < this.numPlayers; i++) this._gamePlays[i] = new Set();
    this._autoRestartQueued = false;  // ★ 自動重開排程旗標
	this._fastAiDebug = !!cfg.fastAIDebug;
    this._backgroundMode = this._fastAiDebug;
    this._aiPaused = false;
    this._savedAiSpeedForView = null;   // ★ 查看模式暫存的速度
    if (this._fastAiDebug) {
        this.aiSpeed = 100;
		this.cfg.autoExport = false;              // 不下載 JSON
		this.cfg.autoRestart = true;              // ★ 連續自動重開
		this.cfg.autoRestartDelay = 500;          // ★ 只等 0.5 秒（而非預設 2 秒）
	}
    this._paymentState = null;        // ★ v3.5: 支付順序 UI 狀態
    this._paymentResolver = null;     // ★ v3.5: Promise resolver
    // v3.6: destroy flag & timer tracking (fix "quit doesn't stop AI")
    this._destroyed = false;
    this._allTimers = new Set();
	    // ★ v3.11: 停滯偵測
    this._lastActivityTime = Date.now();
    this._watchdogTimer = null;
    this._startWatchdog();
    this._rematchVotes = [false, false];   // Phase 3: [host, guest]
    this.sendToBottom = !!(cfg.sendToBottom); // true = flip cards & redraw discards go to bottom of draw pile
    this.aiTrashTalk  = cfg.aiTrashTalk  !== false;   // 預設開啟
    this.chatEnabled  = cfg.chatEnabled  !== false;   // 預設開啟
    this._chatExpanded = safeStore.get('sanguo_chatExpanded', '1') === '1';
	
    /* ============ 網路對戰欄位 (Phase 1) ============ */
    this.netMode = !!(cfg.netMode);
    this.localPlayerIdx = cfg.localPlayerIdx ?? 0;
    this.role = cfg.role || null;
    this._broadcast = cfg._broadcast || null;
    this._sendAction = cfg._sendAction || null;

    /* ============ Mode setup ============ */
    const modeKey = GAME_MODE_DEFS[cfg.gameMode] ? cfg.gameMode : '1v1';
    const modeDef = GAME_MODE_DEFS[modeKey];
    this.gameMode = modeKey;
    this.numPlayers = modeDef.numPlayers;
    this.fieldCount = modeDef.battlefields.length;
    this.battlefields = modeDef.battlefields.slice();
    BATTLEFIELDS = this.battlefields.slice();     // mutate global for card compatibility
    // Teams: array of arrays of seat indices, or null for FFA
    this.teams = modeDef.teams ? modeDef.teams.map(t => t.slice()) : null;
    // Map seat -> teamId
    this.seatTeam = new Array(this.numPlayers).fill(null);
    if (this.teams) {
        this.teams.forEach((t, tid) => t.forEach(seat => { this.seatTeam[seat] = tid; }));
    }

    /* ============ Player configs ============ */
    const pc = cfg.playerConfigs || [];
    const fallback = (i) => ({ type: 'hard' });
    const names = ['藍方', '紅方', '綠方', '紫方'];
    const seatCfg = [];
    for (let i = 0; i < this.numPlayers; i++) {
        const c = pc[i] || fallback(i);
        seatCfg.push(c);
    }
    this.playerConfigs = seatCfg;

    this.players = [];
    for (let i = 0; i < this.numPlayers; i++) {
        const t = seatCfg[i].type;
        const displayName = (cfg.playerNames && cfg.playerNames[i]) || names[i];
        const p = this.mkPlayer(displayName, i);
        p.botType = (t === 'human' || t === null || t === undefined) ? null : t;
        p.teamId = this.seatTeam[i];
        // 🎭 AI 個性指派（20% 友善 / 20% 冷酷 / 60% 惡毒）
        if (p.botType) {
            const r = this.rng();
            p.personality = r < 0.20 ? 'kind' : (r < 0.40 ? 'cold' : 'malignant');
        } else {
            p.personality = null;
        }		
        this.players.push(p);
    }

    this.buildDeck();
    this.initReplay();
    this.dealOpening();
    this.setupFlip();
    this.render();
}

get currentBfIndex() { return Math.max(0, Math.min(this.round - 1, this.fieldCount - 1)); }

initReplay() {
    this.replay = {
        version: 2,
        createdAt: new Date().toISOString(),
        seed: this.seed,
        config: JSON.parse(JSON.stringify(this.cfg)),
        deckTopToBottom: [...this.deck].reverse().map(c => c.data.id),
        events: []
    };
}
recordEvent(type, data = {}) {
    if (!this.replay) return;
    this.replay.events.push(Object.assign({ i: this.replay.events.length, type, round: this.round }, data));
}

isAI(pi) {
    const p = this.players[pi];
    if (!p) return false;
    // v3.6: 網模式下，bot 席位仍由 Host 自動控制（isAI = true）
    return !!(p.botType);
}
getAIDifficulty(pi) {
    if (!this.isAI(pi)) return null;
    return this.players[pi].botType;   // 'easy' | 'medium' | 'hard'
}
modeTag() {
    const label = {
        '1v1':     '👥 1 vs 1',
        '1v1v1':   '👥 1 vs 1 vs 1',
        '2v2':     '🤝 2 vs 2',
        '1v1v1v1': '👥 1 vs 1 vs 1 vs 1'
    }[this.gameMode] || '👥 對戰';
    return `<span class="ai-mode-tag">${label}</span>`;
}
diffTag(pi) {
    if (!this.isAI(pi)) return '';
    const d = this.getAIDifficulty(pi);
    const labelMap = { easy: '簡單', medium: '普通', hard: '困難' };
    const label = labelMap[d] || '普通';
    const cls = d === 'hard' ? 'ai-diff-tag hard' : 'ai-diff-tag';
    return `<span class="${cls}">${label}</span>`;
}
mkPlayer(name, idx) {
    // Fields array length must match this.fieldCount. Construct lazily after mode setup.
    const fields = [];
    for (let i = 0; i < (this.fieldCount || 3); i++) fields.push([]);
    const lfue = [];
    for (let i = 0; i < (this.fieldCount || 3); i++) lfue.push(null);
    return { idx, name, hand: [], fields, food: this.cfg.initialFood, wins: 0,
        passed: false, mustFaceUp: false, redrawn: false, mulliganDone: false, pendingBuffs: {},
        roundSpent: 0, lastFaceUpEnemy: lfue, botType: null, teamId: null };
}

/* ============ Player relationship helpers ============ */
opponentOf(pi) {
    // "對陣" = left neighbor (next in cycle).
    return (pi + 1) % this.numPlayers;
}
areAllies(a, b) {
    if (a === b) return true;
    if (!this.teams) return false;
    return this.seatTeam[a] !== null && this.seatTeam[a] === this.seatTeam[b];
}
enemiesOf(pi) {
    const out = [];
    for (let i = 0; i < this.numPlayers; i++) if (i !== pi && !this.areAllies(pi, i)) out.push(i);
    return out;
}
alliesOf(pi) {
    const out = [];
    for (let i = 0; i < this.numPlayers; i++) if (i !== pi && this.areAllies(pi, i)) out.push(i);
    return out;
}

buildDeck() {
    const list = [];
    const sets = this.cfg.cardSets || {
        vanilla:  { shu:true, wei:true, wu:true, qun:true },
        extended: { shu:true, wei:true, wu:true, qun:true }
    };
    CARD_DB.forEach(def => {
        const setCfg = sets[def.set];
        if (!setCfg || !setCfg[def.faction]) return;
        let n = def.count || 1;
        for (let i = 0; i < n; i++) list.push(def);
    });
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    this.deck = list.map(d => this.newInst(d));
}
newInst(def) {
    return { uid: 'u' + (this.uid++), data: def, mod: 0, faceDown: false, burn: false, silenced: false,
        activated: false, betrayed: false, betrayedFrom: null, usesLeft: undefined,
        pendingSilence: false, pendingBurnNext: false, pendingDamageNext: false, justDrawn: false,
        lianhuan: false, lianhuanArmed: false, preparing: false,
        grantedFubing: false, keepOnField: false, guardUsed: false, _oneShotBuff: undefined,
        enteredFaceUp: null, _jiushiUsed: false,
        playedBy: null };   // ★ v3.8
}
dealOpening() {
    for (let pi = 0; pi < this.numPlayers; pi++) {
        this.drawTo(pi, this.cfg.initialCards);
    }
}
drawTo(pi, n) {
    for (let i = 0; i < n; i++) {
        if (this.deck.length === 0) this.reshuffle();
        if (this.deck.length === 0) break;
        const c = this.deck.pop();
        c.justDrawn = true;
        this.players[pi].hand.push(c);
        this.recordEvent('draw', { player: pi, cardId: c.data.id, cardUid: c.uid });
    }
}
drawOne(pi) {
    if (this.deck.length === 0) this.reshuffle();
    if (this.deck.length === 0) return null;
    const c = this.deck.pop();
    c.justDrawn = true;
    this.players[pi].hand.push(c);
    this.recordEvent('draw', { player: pi, cardId: c.data.id, cardUid: c.uid });
    return c;
}
reshuffle() {
    if (this.archive.length === 0) return;
    const back = this.archive.splice(0, this.archive.length);
    back.forEach(c => {
        c.mod=0; c.faceDown=false; c.burn=false; c.silenced=false; c.activated=false;
        c.betrayed=false; c.betrayedFrom=null; c.usesLeft=undefined;
        c.pendingSilence=false; c.pendingBurnNext=false; c.pendingDamageNext=false;
        c.justDrawn=false; c.lianhuan=false; c.lianhuanArmed=false; c.lianhuanHp=0;
        c.grantedFubing=false; c.keepOnField=false; c.guardUsed=false; c._oneShotBuff=undefined;
        c.preparing=false; c._jiushiUsed=false;
        c.playedBy=null;             // ★ v3.8
    });
    for (let pi = 0; pi < this.numPlayers; pi++)
        for (let bi = 0; bi < this.fieldCount; bi++)
            if (this.players[pi].lastFaceUpEnemy[bi] && !this.players[this.opponentOf(pi)].fields[bi].includes(this.players[pi].lastFaceUpEnemy[bi]))
                this.players[pi].lastFaceUpEnemy[bi] = null;
    for (let i = back.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [back[i], back[j]] = [back[j], back[i]];
    }
    this.deck.push(...back);
    this.addLog('sys', '牌庫耗盡，棄牌區重新洗入牌庫');
}
addLog(type, msg) {
    if (this._backgroundMode) return;   // ★ bg 模式跳過（純顯示用）
    this.logs.push({ type, msg });
    if (this.logs.length > 400) this.logs.shift();
}
logHand(pi, tag) {
    const p = this.players[pi];
    const names = p.hand.map(c=>c.data.name).join(', ') || '(無)';
    this.addLog('sys', `📋 [${tag}] ${p.name}手牌(${p.hand.length})：${names}｜糧:${p.food}`);
}

getPower(inst, pi, bi, atSettle, skipLijie) {
    if (inst.faceDown) return 0;
    const d = inst.data;
    const hasKongcheng = d.skills && d.skills.includes('空城');
    const isZhuge = d.id === 'zhugeliang';
    const effectiveBase = isZhuge ? 3 : d.power;
    if (!effectiveBase && !hasKongcheng) return 0;

    let modVal = inst.mod || 0;
    if ((d.skills||[]).includes('不屈') && modVal < 0) modVal = -modVal;
    let p = effectiveBase + modVal;
    const myField = this.players[pi].fields[bi];
    const enemyField = this.players[this.opponentOf(pi)].fields[bi];

    if (true) {   // ★ v3.13: 移除 silenced 外層判斷，改為逐一檢查
        const sk = d.skills || [];
        if (sk.includes('力竭')) {  // 力竭是鎖定技，永遠生效
            // ★ v3.4.1: 力竭受【堅守】保護
            // 若本陣有曹仁【堅守】且己方劣勢，力竭的戰力減少被攔截。
            // skipLijie = true 時（判斷堅守自身時），不做遞迴檢查。
            let protectedByJianshou = false;
            if (!skipLijie) {
                const myFieldRef = this.players[pi].fields[bi];
                const hasJianshou = myFieldRef.some(c =>
                    !c.faceDown && (c.data.skills||[]).includes('堅守'));
                if (hasJianshou) {
                    const myTotal = this.fieldPower(pi, bi, false, true);
                    const oppTotal = this.fieldPower(this.opponentOf(pi), bi, false, true);
                    if (myTotal <= oppTotal) protectedByJianshou = true;
                }
            }
            if (!protectedByJianshou) {
                p -= enemyField.filter(c => !c.faceDown).length;
            }
        }
        if (sk.includes('涉獵')) {
            const base = effectiveBase + (inst.mod||0);
            p += enemyField.filter(c => !c.faceDown && (c.data.power+(c.mod||0)) > base).length;
        }
        if (sk.includes('謙遜')) {
            const base = effectiveBase + (inst.mod||0);
            p += enemyField.filter(c => !c.faceDown && (c.data.power+(c.mod||0)) > base).length;
        }
        const isFubing = (c) => (c.data.skills||[]).includes('伏兵') || c.grantedFubing;
        if (sk.includes('斷路')) p += myField.filter(c => c !== inst && isFubing(c)).length;
        if (sk.includes('伏兵') || inst.grantedFubing) p += myField.filter(c => c !== inst && (c.data.skills||[]).includes('斷路')).length;
        // 父魂 / 虎子
        if (sk.includes('父魂')) {
            const target = inst.data.id === 'guanxing' ? 'guanyu' : 'zhangfei';
            // 描述：同陣地「以外」己方有【關羽/張飛】才觸發
            const found = this.players[pi].fields.some((f,idx)=>idx!==bi && f.some(c=>c.data.id===target));
            if (found) p += 1;
        }
        if (sk.includes('虎子')) {
            const other = inst.data.id === 'guanxing' ? 'zhangbao' : 'guanxing';
            const found = this.players[pi].fields.some(f=>f.some(c=>c.data.id===other));
            if (found) p += 1;
        }
        // 巧計（龐統 / 馬謖）
        // ★ v3.6: 陣地結算時使用快照；其他時機（turn / preend）使用即時計數
        if (sk.includes('巧計')) {
            const snapHere = this._ybSnapshot && this._ybSnapshot[pi] && this._ybSnapshot[pi][bi];
            const snapArch = this._ybArchiveSnapshot && this._ybArchiveSnapshot[pi];
            const ybHere = (snapHere !== undefined) ? snapHere
                         : myField.filter(c=>c.data.skills&&c.data.skills.includes('疑兵')).length;
            const ybArchive = (snapArch !== undefined) ? snapArch
                            : this.archive.filter(c=>c.data.skills&&c.data.skills.includes('疑兵')&&c.originalOwner===pi).length;
            if (inst.data.id === 'pangtong') p += ybHere;
            if (inst.data.id === 'masu') p += ybHere + ybArchive;
        }
        // 腹鱗
        if (sk.includes('腹鱗')) {
            const bigOnes = myField.filter(c=>c.data.power>5).length;
            p -= bigOnes;
        }
        // 鶴翼: power at least 1
        if (sk.includes('鶴翼') && p < 2) p = 2;
        // 權謀 (鐘會) — own power +1 per card on same field
		// 權謀（鐘會）：自己 +1 per card
		if (sk.includes('權謀')) {
			p += myField.length;
		}
		// v3.2: 權謀 -1 光環，持續對其他友軍生效
		const zhCount = myField.filter(c =>
			c !== inst && !c.faceDown && !c.silenced &&
			(c.data.skills || []).includes('權謀')
		).length;
		if (zhCount > 0) p -= zhCount;
        if (sk.includes('自立')) {
            p += Math.floor(myField.length / 3);
        }
        // v3.2: 凌統【獨殿】：結算時每符合1項 +1
        if (sk.includes('獨殿') && atSettle) {
            let cnt = 0;
            // ① 自己是本陣最後進場的牌
            if (myField.length > 0 && myField[myField.length - 1] === inst) cnt++;
            // ② 己方本陣牌數少於4
            if (myField.length < 4) cnt++;
            // ③ 己方未佔優勢
            const myTot = this.fieldPower(pi, bi, false);
            const oppTot = this.fieldPower(this.opponentOf(pi), bi, false);
            if (myTot <= oppTot) cnt++;
            // ④ 己方劣勢
            if (myTot < oppTot) cnt++;
            p += cnt;
        }		
        // v3.2: 大喬 / 小喬 家族聯動
        if (d.id === 'daqiao') {
            const hasSunce = this.players[pi].fields.some(f =>
                f.some(c => c.data.id === 'sunce' && !c.faceDown));
            if (hasSunce) p += 1;
            const hasXiao = this.players[pi].fields.some(f =>
                f.some(c => c.data.id === 'xiaoqiao' && !c.faceDown));
            if (hasXiao) p += 1;
        }
        if (d.id === 'xiaoqiao') {
            const hasZhouyu = this.players[pi].fields.some(f =>
                f.some(c => c.data.id === 'zhouyu' && !c.faceDown));
            if (hasZhouyu) p += 1;
            const hasDa = this.players[pi].fields.some(f =>
                f.some(c => c.data.id === 'daqiao' && !c.faceDown));
            if (hasDa) p += 1;
        }		
        let baseBonus = 0;
        const buffs = this.players[pi].pendingBuffs?.[bi] || 0;
        if (buffs > 0) baseBonus += buffs;
        // 一次性 buff（忘隙）：只有該陣地最後進場的那張吃到
        const oneShot = this.players[pi].oneShotBuffs?.[bi];
        if (oneShot && oneShot.target === inst) baseBonus += oneShot.amount;
        myField.forEach(ally => {
            if (ally === inst || ally.faceDown || ally.silenced) return;
            const ask = ally.data.skills || [];
            if (ask.includes('蜀王') && d.faction === 'shu') baseBonus += 1;
            if (ask.includes('魏王') && d.faction === 'wei') baseBonus += 1;
            if (ask.includes('吳王') && d.faction === 'wu') baseBonus += 1;
        });
		// ★ 連理：同陣地有 2 張以上帶【連理】的牌 → 各 +1 戰力
        if (inst.wedded) {
            const weddingCount = myField.filter(c => c.wedded && !c.faceDown).length;
            if (weddingCount >= 2) p += 1;
        }
        // 詐降：對陣每有【魏王】/【吳王】/【蜀王】技能在場，自己 +1（不分陣營）
        if ((d.skills||[]).includes('詐降')) {
            enemyField.forEach(foe => {
                if (foe.faceDown || foe.silenced) return;
                const fsk = foe.data.skills || [];
                if (fsk.includes('魏王') || fsk.includes('吳王') || fsk.includes('蜀王')) baseBonus += 1;
            });
        }
        p += baseBonus;
        inst._kongchengBonus = baseBonus;   // 給空城用
    }

    if (atSettle && !inst.silenced && hasKongcheng) {
        // ★ v3.7: 使用「陣地結算前」快照；若無快照則回退即時計算
        const snap = this._ybSnapshot && this._ybSnapshot[pi] && this._ybSnapshot[pi][bi];
        const yb = (snap !== undefined) ? snap
                 : myField.filter(c => c.data.skills && c.data.skills.includes('疑兵')).length;
        const baseWithMods = 3 + (inst.mod || 0) + (inst._kongchengBonus || 0);
        // ★ v3.7: 公式改為「目前戰力 × max(1, 疑兵數)」
        //   0 疑兵 → ×1（仍是 3 戰力，不再是白板）
        //   1 疑兵 → ×1（第一張不計）
        //   N 疑兵 → ×N
        const mult = Math.max(1, yb);
        p = Math.max(0, baseWithMods) * mult;
    }

    if (!inst.silenced && (d.skills||[]).includes('驍勇')) p = Math.max(p, d.power);
    return Math.max(0, p);
}
/* ★ v3.7: 陸抗【繼承】用 — 計算一張牌目前享受的「額外戰力加成」
   （不含基本戰力、不含 mod 本身，排除空城/涉獵/謙遜/力竭/斷路/腹鱗/
    權謀/自立/獨殿/詐騙/詐降/伏兵/父魂/虎子等本身技能） */
_incomingBonus(inst, pi, bi) {
    const d = inst.data;
    const sk = d.skills || [];
    const myField = this.players[pi].fields[bi];
    let bonus = 0;
    // 王類光環
    myField.forEach(ally => {
        if (ally === inst || ally.faceDown || ally.silenced) return;
        const ask = ally.data.skills || [];
        if (ask.includes('蜀王') && d.faction === 'shu') bonus += 1;
        if (ask.includes('魏王') && d.faction === 'wei') bonus += 1;
        if (ask.includes('吳王') && d.faction === 'wu') bonus += 1;
    });
    // pendingBuffs（馬超鐵騎 / 郭嘉遺計）
    const buffs = this.players[pi].pendingBuffs?.[bi] || 0;
    if (buffs > 0) bonus += buffs;
    // 一次性 buff（龍吟 / 放權 / 忘隙）
    const oneShot = this.players[pi].oneShotBuffs?.[bi];
    if (oneShot && oneShot.target === inst) bonus += oneShot.amount;
    // 詐降：對陣每有一張王類光環，+1
    if (sk.includes('詐降')) {
        const enemyField = this.players[this.opponentOf(pi)].fields[bi];
        enemyField.forEach(foe => {
            if (foe.faceDown || foe.silenced) return;
            const fsk = foe.data.skills || [];
            if (fsk.includes('魏王') || fsk.includes('吳王') || fsk.includes('蜀王')) bonus += 1;
        });
    }
    return bonus;
}
fieldPower(pi, bi, atSettle, skipLijie) {
    return this.players[pi].fields[bi].reduce((s,c)=>s+this.getPower(c,pi,bi,atSettle,skipLijie), 0);
}
totalPower(pi, atSettle) { let t=0; for (let bi=0;bi<this.fieldCount;bi++) t+=this.fieldPower(pi,bi,atSettle); return t; }
roundLosing(pi) { return this.totalPower(pi, false) < this.totalPower(this.opponentOf(pi), false); }

clearAllTimers() {
    // v3.6: mark destroyed so any in-flight timer callbacks become no-ops
    this._destroyed = true;
    if (this._allTimers) {
        this._allTimers.forEach(id => { try { clearTimeout(id); } catch(e){} });
        this._allTimers.clear();
    }
    ['backBtnTimer','countdownTimer','aiTimer','flipAutoTimer','settleAutoTimer',
     '_autoRestartTick','_autoRestartFire'].forEach(k=>{
        if (this[k]) { try { clearTimeout(this[k]); } catch(e){} this[k]=null; }
    });
    // ★ v3.11: 停掉 watchdog
    if (this._watchdogTimer) { clearInterval(this._watchdogTimer); this._watchdogTimer = null; }
    this.countdown=null; this.cover=false;
}
_startWatchdog() {
    if (this._watchdogTimer) clearInterval(this._watchdogTimer);
    this._watchdogTimer = setInterval(() => {
        if (this._destroyed) return;
        if (this.state !== 'battle') return;
        if (this.netMode) return;
        if (this._aiPaused) return;              // ★ v3.9: 使用者主動暫停 → 不偵測
        if (!this.players.every(p => p.botType)) return;
        // 有 modal 開著 → 代表在等玩家/AI 處理，不算卡住
        if (this.scry || this.jianxiong || this.quanheng || this.lianying ||
            this.guanyu || this.xunyu || this.diaochan || this.xunyou || this._paymentState) return;
        if (this.countdown !== null) return;

        // 判斷「應該有人在動作，但沒有排程任何計時器」
        const idle = Date.now() - (this._lastActivityTime || 0);
        if (idle < 8000) return;   // 8 秒內有活動 → 正常

        const needsTurn    = this.phase === 'turn'   && this.isAI(this.current) && !this.players[this.current].passed;
        const needsPreEnd  = this.phase === 'preend' && this.preEndTurn !== null && this.preEndTurn !== undefined && this.isAI(this.preEndTurn) && !this.preEndPassed[this.preEndTurn];
        const needsHandoff = !!this.cover;

        if (needsTurn || needsPreEnd || needsHandoff) {
            console.warn('[watchdog] AI freeze detected',
                { phase: this.phase, current: this.current, idle: idle + 'ms' });
            this.addLog('sys', `⚠️ AI 停滯偵測（${(idle/1000).toFixed(1)}s）— 自動恢復中…`);
            this.aiTimer = null;
            try { this.scheduleAI(); } catch (e) { console.error('[watchdog]', e); }
        }
    }, 3000);
}
