            } else if (myF < oppF && projected < oppF) {
                // 打到輸的場地只會更輸，不鼓勵（除非是拖延型如法正在已結算場地）
                if (f >= bi) bestFlipBonus = Math.max(bestFlipBonus, -6);
            }
        }
        score += bestFlipBonus;
    }	
    if (diff === 'hard') {
        const projected = myPow + (d.power || 0);
        const wouldWin = projected > oppPow;
        if (opp.passed && myPow > oppPow + 5) score -= d.cost * 2;
        if (ctx.alreadyWonRound1 && myPow > oppPow + 5 && !ctx.mustWinThisRound) score -= d.cost * 3;
        if (ctx.mustWinThisRound) { if (wouldWin && !(myPow>oppPow)) score += 6; else if (wouldWin) score += 2; }
        if (opp.food >= 10 && !wouldWin && d.cost >= 3) score -= 4;
        if (ctx.myPendingFlipCost > 0 && p.food - d.cost < ctx.myPendingFlipCost) score -= 25;
        if (Math.abs(myPow - oppPow) <= 2 && d.power >= 4) score += 2;
        if (ctx.iAmBehindInMatch && ctx.mustWinThisRound) score += 3;
        if (ctx.oppWonRound1 && this.round === 2) score += 2;
        const hasWinSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => WIN_TRIGGER_SKILLS.includes(s)));
        const hasLoseSkill = myFieldNow.some(x => !x.faceDown && (x.data.skills || []).some(s => LOSE_TRIGGER_SKILLS.includes(s)));
        if (hasWinSkill && wouldWin && !(myPow>oppPow)) score += 3;
        if (hasLoseSkill && !wouldWin && p.wins === 0 && opp.wins === 0) score += 1;
    }
    return score + this.rng() * 3;
}
resolveAIScry() {
    if (!this.scry) return;
    const { cards } = this.scry;
    const sorted = [...cards].sort((a, b) => {
        const pa = a.data.id === 'zhugeliang' ? 3 : a.data.power;
        const pb = b.data.id === 'zhugeliang' ? 3 : b.data.power;
        return pb - pa;
    });
    this.scry.order = sorted.map(c => c.uid);
    this.scryConfirm();
}
resolveAIJianxiong() {
    if (!this.jianxiong) return;
    const diff = this.getAIDifficulty(this.jianxiong.pi);
    let guess;
    if (diff === 'hard') {
        const weights = {};
        CARD_DB.forEach(def => {
            if (!(def.isAmbush || def.forceFaceDown)) return;
            if (def.set === 'vanilla' && !this.cfg.vanillaCards) return;
            if (def.set === 'extended' && !this.cfg.extendedCards) return;
            if (!this.cfg.factions[def.faction]) return;
            const copies = def.count || 1;
            const pw = def.power || 0;
            weights[pw] = (weights[pw] || 0) + copies;
        });
        let best = 0, bestW = -1;
        Object.entries(weights).forEach(([v, w]) => { if (w > bestW) { bestW = w; best = parseInt(v); } });
        guess = best;
    } else guess = [0, 1, 2, 3, 4, 6][Math.floor(this.rng() * 6)];
    this.jianxiong.guess = guess;
    this.jxConfirm();
}

async settle() {
    this.phase = 'settle'; this.cover = false;
    const bi = this.currentBfIndex;
    this.addLog('bat', `═══ 【${BATTLEFIELDS[bi]}】陣地結算 ═══`);
    this.render();
    await sleep(450);

    const toDiscard = [];
    for (let pi = 0; pi < 2; pi++) {
        for (const c of this.players[pi].fields[bi]) {
            if (!c.faceDown) continue;
            c.faceDown = false; c.fresh = true;
            c.keepOnField = false;
            if (c.data.skills && c.data.skills.includes('疑兵') && !c.silenced) {
                if (c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
                if (!c.keepOnField) {
                    c.willRemove = true;
                    this.addLog(pi, `【疑兵】${c.data.name} 翻開，結算後移除`);
                }
            } else if (this.players[pi].food >= c.data.cost) {
                this.players[pi].food -= c.data.cost;
                this.addLog(pi, `【伏兵】${c.data.name}(${c.data.cost}糧/${c.data.power}戰力) 翻開`);
                if (!c.silenced && c.data.onFlip) c.data.onFlip(this._ctxFor(pi, c, bi, null));
            } else {
                c.willDiscard = true;
                toDiscard.push(c);
                this.addLog(pi, `【伏兵】糧草不足，棄置！`);
            }
        }
    }
    this.render();
    await sleep(800);

    if (toDiscard.length) {
        for (let pi = 0; pi < 2; pi++)
            this.players[pi].fields[bi] = this.players[pi].fields[bi].filter(c => !c.willDiscard);
        toDiscard.forEach(c => this.archive.push(c));
        this.render(); await sleep(400);
    }

    const order = [this.current, 1-this.current];
    for (const pi of order) {
        const f = [...this.players[pi].fields[bi]];
        for (const c of f) {
            if (c.faceDown || c.silenced) continue;
            if (c.data.onSettle) c.data.onSettle(this._ctxFor(pi, c, bi, null));
        }
    }
    this.render(); await sleep(400);

    const t0 = this.totalPower(0, false);
    const t1 = this.totalPower(1, false);
    for (let pi = 0; pi < 2; pi++) {
        const behind = pi === 0 ? (t0 < t1) : (t1 < t0);
        if (!behind) continue;
        for (let fb = 0; fb < FIELD_COUNT; fb++) {
            const own = this.players[pi].fields[fb];
            const foes = this.players[1-pi].fields[fb];
            const movers = own.filter(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('反骨') && !c.activated);
            movers.forEach(c => {
                own.splice(own.indexOf(c), 1);
                c.activated = true; c.betrayed = true; c.betrayedFrom = pi;
                foes.push(c);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【反骨】背叛！加入 ${this.players[1-pi].name} 陣營`);
            });
        }
    }
    if (this.players[0].fields[bi].some(c=>c.betrayed) || this.players[1].fields[bi].some(c=>c.betrayed))
        { this.render(); await sleep(500); }

    for (let pi = 0; pi < 2; pi++) {
        const f = this.players[pi].fields[bi];
        for (let i = f.length - 1; i >= 0; i--) {
            if (f[i].willRemove) {
                this.flashRemove(f[i]);
                f[i].originalOwner = pi;
                this.archive.push(f[i]); f.splice(i, 1);
            }
        }
    }

    const f0 = this.fieldPower(0, bi, true);
    const f1 = this.fieldPower(1, bi, true);
    let winner;
    if (f0 > f1) winner = 0;
    else if (f1 > f0) winner = 1;
    else winner = this.roundFirstPlayer;

    this.addLog('bat', `【${BATTLEFIELDS[bi]}】戰力：藍 ${f0} vs 紅 ${f1}`);
    if (f0 === f1) this.addLog('bat', `平局！由先手方 ${this.players[winner].name} 獲得本輪勝利`);
    else this.addLog('bat', `${this.players[winner].name} 贏得本輪！`);

    this.history.push({ round: this.round, battlefield: BATTLEFIELDS[bi], f0, f1, winner, firstPlayer: this.roundFirstPlayer });
    this.players[winner].wins++;

    for (let pi = 0; pi < 2; pi++) {
        this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + this.cfg.baseRefill);
        this.players[pi].fields[bi].forEach(c => {
            if (!c.faceDown && !c.silenced && (c.data.skills||[]).includes('締盟') && this.firstPasser === pi) {
                this.players[pi].food = Math.min(this.cfg.maxFood, this.players[pi].food + 1);
                this.addLog(pi, `[R${this.round}] ${c.data.name}【締盟】：先放棄 +1 糧`);
            }
        });
    }
    this.players[winner].food = Math.min(this.cfg.maxFood, this.players[winner].food + this.cfg.winBonus);
    this.addLog('sys', `補給 ${this.cfg.baseRefill} 糧，${this.players[winner].name} 額外 +${this.cfg.winBonus} 糧`);

    this.lastResult = { f0, f1, winner, battlefield: BATTLEFIELDS[bi] };
    this.recordEvent('settle', { battlefield: bi, f0, f1, winner,
        blueWins: this.players[0].wins, redWins: this.players[1].wins,
        blueFood: this.players[0].food, redFood: this.players[1].food });

    if (this.players[0].wins >= 2 || this.players[1].wins >= 2) {
        this.gameWinner = this.players[0].wins >= 2 ? 0 : 1;
        this.state = 'gameover';
        this.addLog('sys', `═══ ${this.players[this.gameWinner].name} 贏得最終勝利！═══`);
        this.recordEvent('game_over', { winner: this.gameWinner, blueWins: this.players[0].wins, redWins: this.players[1].wins, totalRounds: this.round });
        this.saveReplayToLocal();
        if (this.cfg.mode === 'aiai' && this.cfg.autoExport) setTimeout(() => this.downloadReplay(true), 400);
        if (this.cfg.mode === 'aiai' && this.cfg.autoRestart) {
            if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
            const savedCfg = JSON.parse(JSON.stringify(this.cfg));
            this.settleAutoTimer = setTimeout(() => {
                this.settleAutoTimer = null;
                try { window.game = new Game(savedCfg); }
                catch(e) { console.error(e); if (typeof showSetup === 'function') showSetup(); }
            }, this.cfg.autoRestartDelay || 2000);
        }
        this.render(); return;
    }
    this.render();
    if (this.cfg.mode === 'aiai' && this.round < FIELD_COUNT) {
        if (this.settleAutoTimer) clearTimeout(this.settleAutoTimer);
        this.settleAutoTimer = setTimeout(() => {
            if (this.state === 'battle' && this.phase === 'settle') {
                this.settleAutoTimer = null;
                this.nextRound();
            }
        }, 2000);
    }
}

nextRound() {
    if (this.settleAutoTimer) { clearTimeout(this.settleAutoTimer); this.settleAutoTimer = null; }
    // 清除所有連環標記
    for (let pi = 0; pi < 2; pi++)
        for (let bi = 0; bi < FIELD_COUNT; bi++)
            this.players[pi].fields[bi].forEach(c => c.lianhuan = false);
    if (this.round >= FIELD_COUNT) {
        const bi = this.currentBfIndex;
        for (let pi = 0; pi < 2; pi++) {
            this.players[pi].fields[bi].forEach(c => {
                c.mod=0; c.burn=false; c.faceDown=false; c.silenced=false; c.activated=false;
                c.betrayed=false; c.betrayedFrom=null; c.lianhuan=false;
                c.preparing=false;
                this.archive.push(c);
            });
            this.players[pi].fields[bi] = [];
        }
    }
    this.players[0].passed = false; this.players[1].passed = false;
    this.players[0].mustFaceUp = false; this.players[1].mustFaceUp = false;
    this.players[0].roundSpent = 0; this.players[1].roundSpent = 0;
    this.firstPasser = null;
    this._handoffDoneThisTurn = false;
    const w = this.lastResult ? this.lastResult.winner : -1;
    if (w === 0) this.current = 1;
    else if (w === 1) this.current = 0;
    else this.current = 1 - this.roundFirstPlayer;
    this.round++;
    this.roundFirstPlayer = this.current;
    this.phase = 'turn';
    this.cover = false;
    this.selected = null; this.selectedField = null;
    this.lastResult = null;
    this.addLog('sys', `═══ 第 ${this.round} 輪開始 ═══`);
    this.addLog('sys', `本輪戰場：【${BATTLEFIELDS[this.currentBfIndex]}】`);
    this.logHand(0, 'R'+this.round);
    this.logHand(1, 'R'+this.round);
    this.recordEvent('round_start', {
        battlefield: this.currentBfIndex, battlefieldName: BATTLEFIELDS[this.currentBfIndex],
        firstPlayer: this.current,
        blueHand: this.players[0].hand.map(c => c.data.id),
        redHand: this.players[1].hand.map(c => c.data.id),
        blueFood: this.players[0].food, redFood: this.players[1].food
    });
    this.render();
    this.maybeJianxiong();
}

render() {
    const app = document.getElementById('app');
    if (this.state === 'flip') { app.innerHTML = this.renderFlip(); return; }
    if (this.state === 'mulligan') { app.innerHTML = this.renderMulligan(); return; }
    if (this.state === 'gameover') { app.innerHTML = this.renderGameOver(); return; }
    app.innerHTML = this.renderBattle();
    setTimeout(() => {
        const el = document.querySelector('.log');
        if (el) el.scrollTop = el.scrollHeight;
        this.scheduleAI();
    }, 30);
}
scheduleAI() {
    if (this.cfg.mode === 'pvp') return;
    if (this.state !== 'battle') return;
    if (this.countdown !== null) return;
    if (this.scry || this.jianxiong || this.quanheng || this.lianying || this.guanyu || this.xunyu || this.xunyou) return;
    if (this.phase === 'turn') {
        if (this.cover) {
            if (this.cfg.mode === 'pvp') {
                // PVP：等玩家手動點轉換玩家
                return;
            }
            // PVAI / AIAI：自動推進
            if (this.cfg.mode === 'pvai') {
                if (this.aiTimer) clearTimeout(this.aiTimer);
                this.aiTimer = setTimeout(() => { this.aiTimer=null; this.handoff(); }, 700);
            } else {
                // aiai
                const next = 1 - this.current;
                if (!this.players[next].passed) {
                    if (this.aiTimer) clearTimeout(this.aiTimer);
                    this.aiTimer = setTimeout(() => { this.aiTimer=null; this.handoff(); }, 700);
                }
            }
            return;
        }
        if (this.isAI(this.current)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = setTimeout(() => { this.aiTimer=null; this.doTurnAI(); }, 900);
        }
    } else if (this.phase === 'preend') {
        if (this.cover) return;
        const pi = this.preEndOrder[this.preEndIdx];
        if (this.isAI(pi)) {
            if (this.aiTimer) clearTimeout(this.aiTimer);
            this.aiTimer = setTimeout(() => { this.aiTimer=null; this.doPreEndAI(); }, 900);
        }
    }
}

cardHTML(inst, o = {}) {
    const d = inst.data;
    const fac = FACTION_INFO[d.faction];
    const cls = [];
    if (o.size === 'sm') cls.push('sm', 'mini');
    if (o.size === 'xs') cls.push('xs', 'mini');
    if (o.extra) cls.push(o.extra);
    if (inst.justDrawn && !o.noHighlight) cls.push('just-drawn');
    if (inst.faceDown && !o.forceReveal) {
        return `<div class="card ${cls.join(' ')}" ${o.attr || ''}><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`;
    }
    const isZhuge = (d.id === 'zhugeliang');
    const isSmall = (o.size === 'sm' || o.size === 'xs');
    let powerMain, modTxt = '', pcls = '#ffffff';
    if (isZhuge && o.power === undefined) powerMain = '3X';
    else {
        const totalPower = (o.power !== undefined) ? o.power : Math.max(0, d.power + (inst.mod || 0));
        const base = d.power;
        const bonus = totalPower - base;
        powerMain = totalPower;
        if (bonus !== 0) modTxt = `(${bonus > 0 ? '+' : ''}${bonus})`;
        const isMini = isSmall;
        const colUp   = isMini ? '#4a9c4a' : '#7cff7c';
        const colDown = isMini ? '#c94a4a' : '#ff6b6b';
        pcls = bonus > 0 ? colUp : (bonus < 0 ? colDown : '#ffffff');
    }
    const generalTag = d.isGeneral ? '<span class="c-gen">上將</span>' : '';
    const tag = (d.skills||[]).includes('反骨') && !inst.activated && !inst.faceDown ? '<span class="c-tag">待命</span>' : '';
    const sil = inst.silenced ? '<span class="c-tag" style="background:rgba(120,120,120,.8);left:auto;right:2px;bottom:20px;">沉默</span>' : '';
    const burn = inst.burn ? '<span class="c-tag" style="background:rgba(255,80,0,.85);left:auto;right:2px;bottom:36px;">燃</span>' : '';
	const guardOff = inst.guardUsed ? '<span class="c-tag" style="background:rgba(100,100,100,.85);left:auto;right:2px;bottom:52px;">護衛×</span>' : '';
    const prepTag = inst.preparing ? '<span class="c-tag" style="background:rgba(60,140,220,.85);left:auto;right:2px;bottom:36px;">準備</span>' : '';
    const skillNames = (d.skills || []).map(s => `<div>${s}</div>`).join('');
    return `<div class="card ${cls.join(' ')}" ${o.attr || ''}>
        <div class="card-front ${fac.cls}">
            <span class="c-cost">${d.cost}</span>
            <span class="c-fac">${fac.name}</span>
            <span class="c-skills">${skillNames}</span>
            <span class="c-name">${d.name}</span>
            ${d.title ? `<span class="c-title">${d.title}</span>` : ''}
            <span class="c-art">${d.emoji}</span>
            <span class="c-power" style="color:${pcls}">${powerMain}${modTxt ? `<span style="font-size:9px">${modTxt}</span>` : ''}</span>
            ${generalTag}${tag}${sil}${burn}${guardOff}${prepTag}
        </div>
    </div>`;
}

        <div class="flip-stage">
            <div class="flip-slot">
                <div class="lbl" style="color:#6fb6ff;">藍方${this.isAI(0)?' 🤖':''}${this.diffTag(0)}</div>
                                <div class="flip-card-wrap ${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'flip-click' : ''}" onclick="${(!r0 && (!this.netMode || this.localPlayerIdx === 0)) ? 'game.revealFlip(0)' : ''}">
                    ${r0 ? this.cardHTML(c0, { forceReveal: true, noHighlight: true })

                               <div class="flip-card-wrap ${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'flip-click' : ''}" onclick="${(!r1 && (!this.netMode || this.localPlayerIdx === 1)) ? 'game.revealFlip(1)' : ''}">
                    ${r1 ? this.cardHTML(c1, { forceReveal: true, noHighlight: true })

            <button class="btn btn-big" style="background:${fcg};border:1px solid ${fbd};color:#fff;" onclick="game.beginBattle()"><span style="color:${fc}">${this.players[fp].name}</span>先手！開始對戰</button>`;

renderMulligan() {

                <button class="btn btn-red" ${(stage !== 'choose' || !canAct) ? 'disabled' : ''} onclick="game.mulliganSkip()">放棄重抽</button>

voteRematch() {
    if (this.state !== 'gameover') return;
    // When the host is applying a remote action, the voter is the OTHER player.
    const pi = this.netMode
        ? (this._applyingRemote ? (this._remotePlayerIdx ?? 1) : this.localPlayerIdx)
        : 0;
    this._rematchVotes = this._rematchVotes || [false, false];
    if (this._rematchVotes[pi]) return;
    this._rematchVotes[pi] = true;
    this.addLog('sys', `${this.players[pi].name} 按下「再來一局」`);
    this.render();
    if (this.netMode && this.role === 'host' &&
        this._rematchVotes[0] && this._rematchVotes[1]) {
        this._doRematch();
    }
}
_doRematch() {
    if (this.role !== 'host') return;
    // Cancel any pending broadcast from the old game instance
    if (this._broadcastTimer) { clearTimeout(this._broadcastTimer); this._broadcastTimer = null; }
    const cfg = this.cfg;
    cfg.seed = '';
    cfg._rematchVotes = undefined;
    window.game = new Game(cfg);
}
_renderRematchButtons() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    if (v[me]) {
        return `<button class="btn btn-big btn-green" disabled>✅ 已同意（等待對手…）</button>`;
    }
    return `<button class="btn btn-big btn-green" onclick="game.voteRematch()">🔁 再來一局</button>`;
}
_renderRematchStatus() {
    const v = this._rematchVotes || [false, false];
    const me = this.localPlayerIdx;
    const myName = this.players[me].name;
    const opName = this.players[1 - me].name;
    return `${myName}：${v[me] ? '✅ 已同意' : '⏳ 未決定'}　｜　${opName}：${v[1 - me] ? '✅ 已同意' : '⏳ 未決定'}`;
}
renderGameOver() {
    const w = this.gameWinner;
    const color = w === 0 ? '#6fb6ff' : '#ff7b7b';
    const isAIvsAI = this.cfg.mode === 'aiai';
    return `<div class="overlay"><div class="modal" style="text-align:center;">
        <div style="font-size:64px;">🏆</div>
        <h2 style="color:${color};font-size:28px;">${this.players[w].name}${this.isAI(w)?' 🤖':''} 勝利！</h2>
        <p>率先取得兩輪勝利，稱霸三國！</p>
        <p style="font-size:13px;color:#888;">總計進行 ${this.round} 輪</p>
        <div style="display:flex;justify-content:center;gap:30px;margin:18px 0;">
            <div><div style="font-size:13px;color:#6fb6ff;">藍方勝場</div>
                 <div style="font-size:26px;color:#6fb6ff;font-weight:bold;">${this.players[0].wins}</div></div>
            <div><div style="font-size:13px;color:#ff7b7b;">紅方勝場</div>
                 <div style="font-size:26px;color:#ff7b7b;font-weight:bold;">${this.players[1].wins}</div></div>
        </div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
            ${this.netMode
                ? this._renderRematchButtons()
                : `<button class="btn btn-big btn-green" onclick="showSetup()">再來一局</button>`}
            <button class="btn btn-big btn-gold" onclick="game.downloadReplay()">📥 匯出遊戲記錄</button>
            <button class="btn btn-big" style="background:linear-gradient(180deg,#2a6a4a,#153828);border-color:#44cc88;color:#c8ffe0;" onclick="copyCurrentSeed()">🌱 複製種子</button>
        </div>
        ${this.netMode ? `<p style="font-size:12px;color:#a89070;margin-top:10px;">${this._renderRematchStatus()}</p>` : ''}
        <p style="font-size:13px;color:#7cff7c;margin-top:10px;font-family:monospace;letter-spacing:2px;">🌱 種子：${this.seed}</p>
        <p style="font-size:12px;color:#a89070;margin-top:14px;">
            本場已存入本地快取。${isAIvsAI && this.cfg.autoExport ? '並已自動下載。' : ''}<br>
            ${isAIvsAI && this.cfg.autoRestart ? '<b style="color:#7cff7c;">2 秒後自動重新開局…</b><br>' : ''}
            回到主選單可用「📜 回放記錄」瀏覽所有對戰。
        </p>
    </div></div>`;
}

buildReplayExport() {
    return {
        version: this.replay.version,
        createdAt: this.replay.createdAt,
        exportedAt: new Date().toISOString(),
        seed: this.seed,
        mode: this.cfg.mode,
        config: this.replay.config,
        deckTopToBottom: this.replay.deckTopToBottom,
        winner: this.gameWinner,
        totalRounds: this.round,
        finalWins: [this.players[0].wins, this.players[1].wins],
        events: this.replay.events
    };
}
saveReplayToLocal() {
    try {
        const data = this.buildReplayExport();
        const arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
        arr.push(data);
        while (arr.length > 500) arr.shift();
        localStorage.setItem('sanguo_logs', JSON.stringify(arr));
    } catch(e) { console.warn('localStorage 失敗', e); }
}
downloadReplay(auto = false) {
    if (!this.replay) { alert('沒有可匯出的記錄'); return; }
    const json = JSON.stringify(this.buildReplayExport(), null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `sanguo-replay-${ts}${auto?'-auto':''}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

renderBattle() {
    let h = this.renderBackBtn();
    h += this.renderHeader();
    h += `<div class="battle-layout"><div class="battle-main">
        ${this.renderHandBar()}
        ${this.renderBattlefields()}
        ${this.renderControls()}
        ${this.renderQuickChat()}
        ${this.renderHands()}
    </div><div class="battle-side">
        ${this.renderHistory()}
        ${this.renderArchive()}
    </div></div>`;
    h += this.renderLog();
    h += this.renderModals();
    h += this.renderInspect();
    h += this.renderCountdown();
    h += `<div id="modal-slot"></div>`;
    return h;
}
renderHeader() {
    const p0 = this.players[0], p1 = this.players[1];
    return `<div class="header"><h1>三 國 風 雲</h1>
        <div class="info">
            第 ${this.round} 輪 ｜ 戰場：【${BATTLEFIELDS[this.currentBfIndex]}】
            ｜ 牌庫 ${this.deck.length} 張 ｜ 糧草上限 ${this.cfg.maxFood}
            ｜ <span style="color:#6fb6ff;">${p0.name} ${p0.wins}勝${this.isAI(0)?' 🤖':''}${this.diffTag(0)}</span>
            ｜ <span style="color:#ff7b7b;">${p1.name} ${p1.wins}勝${this.isAI(1)?' 🤖':''}${this.diffTag(1)}</span>            ${this.modeTag()}
            ${this.netMode ? ` ｜ <span style="color:#7cff7c;">🌐 線上（${this.role === 'host' ? '房主' : '訪客'}）</span>` : ''}
        </div></div>`;
}
renderHandBar() {
    const p0 = this.players[0], p1 = this.players[1];
    const cap = this.cfg.maxFood;
    const miniRow = n => n === 0 ? '<span class="hb-empty">無手牌</span>' : '<div class="mini-back"></div>'.repeat(n);
    const spent = p => `<span class="hb-spent">（本輪已消耗 ${p.roundSpent}）</span>`;
    return `<div class="hand-bar">
        <div class="hb-side"><span class="hb-lbl" style="color:#ff7b7b;">${p1.name}${this.isAI(1)?' 🤖':''}</span>
            <div class="hb-cards">${miniRow(p1.hand.length)}</div>
            <span class="hb-food">🌾 ${p1.food}/${cap}</span>${spent(p1)}</div>
        <div class="hb-side"><span class="hb-lbl" style="color:#6fb6ff;">${p0.name}${this.isAI(0)?' 🤖':''}</span>
            <div class="hb-cards">${miniRow(p0.hand.length)}</div>
            <span class="hb-food">🌾 ${p0.food}/${cap}</span>${spent(p0)}</div>
    </div>`;
}
renderBattlefields() {
    const atSettle = (this.phase === 'settle');
    const activeBi = this.currentBfIndex;
    const roundActive = this.phase === 'turn' && !(this.players[0].passed && this.players[1].passed);
    let h = `<div class="bf-flex">`;
    for (let bi = 0; bi < FIELD_COUNT; bi++) {
        const isActive = (bi === activeBi);
        const isPast = (bi < activeBi);
        const isFuture = (bi > activeBi);
        const wrapCls = isActive ? 'active' : (isPast ? 'inactive' : 'future');
        const t0 = this.fieldPower(0, bi, atSettle);
        const t1 = this.fieldPower(1, bi, atSettle);
        let headRes = '';
        if (isPast) {
            const hist = this.history.find(r => r.round === bi + 1);
            if (hist) headRes = `<span class="res">${hist.f0} vs ${hist.f1} ${hist.winner === 0 ? '藍勝' : '紅勝'}（已定）</span>`;
            else headRes = `<span class="res">${t0} vs ${t1}</span>`;
        } else if (isActive) headRes = `<span class="open">${t0} vs ${t1}</span>`;
        else headRes = `<span class="res" style="color:#555;">尚未開啟</span>`;
        const cardSize = isActive ? undefined : (isPast ? 'xs' : 'sm');
        const cardExtra = isPast ? 'grey clickable' : (isFuture ? 'grey' : 'clickable');
        const inspAttr = (c) => (isFuture ? '' : `onclick="event.stopPropagation();game.inspect('${c.uid}')"`);
        const showPassStamp = isActive && roundActive;
        const redPassedClass = (showPassStamp && this.players[1].passed) ? 'passed' : '';
        const bluePassedClass = (showPassStamp && this.players[0].passed) ? 'passed' : '';
        h += `<div class="bf-wrap ${wrapCls}"><div class="bfield">
            <div class="bf-head"><span>${BATTLEFIELDS[bi]}${isActive ? ' ★' : ''}</span>${headRes}</div>
            <div class="bf-row red ${redPassedClass}"><div class="bf-cards">
                ${this.players[1].fields[bi].length === 0 ? `<span class="bf-ghost">— 紅方 —</span>`
                    : this.players[1].fields[bi].map(c => this.cardHTML(c, { size: cardSize,
                        extra: c.fresh ? ('enter ' + cardExtra) : cardExtra,
                        power: this.getPower(c, 1, bi, atSettle), attr: inspAttr(c) })).join('')}
            </div><div class="bf-total red ${isActive && t1 > t0 && atSettle ? 'win' : ''}">${t1}</div></div>
            <div class="bf-row blue ${bluePassedClass}"><div class="bf-cards">
                ${this.players[0].fields[bi].length === 0 ? `<span class="bf-ghost">— 藍方 —</span>`
                    : this.players[0].fields[bi].map(c => this.cardHTML(c, { size: cardSize,
                        extra: c.fresh ? ('enter ' + cardExtra) : cardExtra,
                        power: this.getPower(c, 0, bi, atSettle), attr: inspAttr(c) })).join('')}
            </div><div class="bf-total blue ${isActive && t0 > t1 && atSettle ? 'win' : ''}">${t0}</div></div>
        </div></div>`;
    }
    h += `</div>`;
    for (let pi = 0; pi < 2; pi++)
        for (let bi = 0; bi < FIELD_COUNT; bi++)
            this.players[pi].fields[bi].forEach(c => c.fresh = false);
    return h;
}

renderControls() {
    if (this.netMode) {
        if (this.phase === 'preend' && this.preEndOrder[this.preEndIdx] !== this.localPlayerIdx) {
            return `<div class="control-area">
                <div class="ctrl-info">等待對手結算前出牌…</div>
                <div style="margin:6px 0;"><span class="ai-badge" style="background:rgba(68,200,68,.2);color:#7cff7c;border-color:rgba(68,200,68,.5);">🌐 線上</span></div>
            </div>`;
        }
        if (this.phase === 'turn' && this.current !== this.localPlayerIdx) {
            return `<div class="control-area">
                <div class="ctrl-info">對手的回合…</div>
                <div style="margin:6px 0;"><span class="ai-badge" style="background:rgba(68,200,68,.2);color:#7cff7c;border-color:rgba(68,200,68,.5);">🌐 線上</span></div>
            </div>`;
        }
    }
    if (this.phase === 'settle') {
        let h = `<div class="control-area"><div style="font-size:20px;color:#ffd700;margin-bottom:8px;">⚔️ 結算完成</div>`;
        if (this.lastResult) {
            h += `<div class="result-line"><span class="b">藍方 ${this.lastResult.f0}</span><span style="color:#ffd700;"> vs </span><span class="r">紅方 ${this.lastResult.f1}</span><span style="color:#44ff44;font-size:15px;">（${this.players[this.lastResult.winner].name}勝）</span></div>`;
            h += `<div style="font-size:13px;color:#a89070;margin-bottom:10px;">戰場：【${this.lastResult.battlefield}】${this.lastResult.f0 === this.lastResult.f1 ? '（平局 → 先手勝）' : ''}</div>`;
        }
        if (this.round < FIELD_COUNT) h += `<button class="btn btn-big btn-green" onclick="game.nextRound()">進入下一輪（${BATTLEFIELDS[this.round]}）</button>`;
        else h += `<button class="btn btn-big btn-green" onclick="game.nextRound()">結束</button>`;
        if (this.cfg.mode === 'aiai' && this.round < FIELD_COUNT) h += `<div style="margin-top:10px;"><span class="ai-auto-hint">2 秒後自動進入下一輪</span></div>`;
        h += `</div>`;
        return h;
    }
    if (this.phase === 'preend') {
        const pi = this.preEndOrder[this.preEndIdx];
        const color = pi === 0 ? '#6fb6ff' : '#ff7b7b';
        const isAIP = this.isAI(pi);
        return `<div class="control-area">
            <div class="ctrl-info">請 <b style="color:${color}">${this.players[pi].name}${isAIP?' 🤖':''}</b> 選擇在結算前可打出的牌</div>
            ${isAIP && !this.cover ? `<div style="margin:6px 0;"><span class="ai-badge">🤖 電腦思考中…</span></div>` : ''}
            <div class="ctrl-buttons">
                <button class="btn btn-green" disabled>出牌</button>
                <button class="btn btn-red" ${(this.cover||isAIP) ? 'disabled' : ''} onclick="game.preEndAct()">放棄出牌</button>
            </div></div>`;
    }
    const pi = this.current, p = this.players[pi];
    const color = pi === 0 ? '#6fb6ff' : '#ff7b7b';
    const inst = this.selected ? p.hand.find(c => c.uid === this.selected) : null;
    const bfName = BATTLEFIELDS[this.currentBfIndex];
    const locked = this.cover || this.countdown !== null;
    const isAIP = this.isAI(pi);
    const opponentPassed = this.players[1 - pi].passed;
    let info = '';
    if (this.countdown !== null) info = `⏳ 請查看您新抽到的牌…`;
    else if (this.cover) {
        const nextPi = 1 - this.current;
        const nextP = this.players[nextPi];
        const nc = nextPi === 0 ? '#6fb6ff' : '#ff7b7b';
        info = `請將裝置交給 <b style="color:${nc}">${nextP.name}${this.isAI(nextPi)?' 🤖':''}</b>`;
    }
    else if (isAIP) info = `<b style="color:${color}">${p.name} 🤖</b> 的回合`;
    else if (inst) info = `已選：<b>${inst.data.name}</b>（${inst.data.cost}糧 / ${inst.data.power}戰力）　→ 將出牌至【<b style="color:#ffd700">${bfName}</b>】`;
        else info = `<b style="color:${color}">${p.name}</b> 的回合　—　<span style="color:#7cff7c;font-weight:bold;">👆 點擊下方手牌</span> 選擇要出的牌（出牌至【${bfName}】）`;
    if (opponentPassed && !locked && !isAIP) info += `　<span style="color:#ff9c4a;">（對手已放棄跟牌，你可繼續出牌或放棄）</span>`;
    const hasQuanheng = !locked && !isAIP && p.fields.some(f => f.some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('權衡')));
    const hasLianying = !locked && !isAIP &&
        p.fields[this.currentBfIndex].some(c => !c.faceDown && !c.silenced && (c.data.skills||[]).includes('連營')) &&
        this.players[1-pi].fields[this.currentBfIndex].some(c => !c.faceDown && !c.burn);
    const hasJiushi = !locked && !isAIP && !!this.findJiushiCard(pi);
    let skillBox = '';
    if (this.countdown !== null) {
        const newCard = p.hand.find(c => c.justDrawn);
        if (newCard) {
            skillBox = `<div class="sel-skill-box new-draw">
                <div class="skill-name">🆕 ${newCard.data.name}${newCard.data.title ? ` <span class="ttl">${newCard.data.title}</span>` : ''}
                    <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[newCard.data.faction].name}｜${newCard.data.cost}糧｜${newCard.data.power}戰力</span></div>
                <div class="skill-desc">${newCard.data.desc.replace(/\n/g,'<br>')}</div></div>`;
        }
    } else if (inst && !locked) {
        skillBox = `<div class="sel-skill-box">
            <div class="skill-name">${inst.data.name}${inst.data.title ? ` <span class="ttl">${inst.data.title}</span>` : ''}
                <span style="float:right;font-size:11px;color:#a89070;font-weight:normal;">${FACTION_INFO[inst.data.faction].name}｜${inst.data.cost}糧｜${inst.data.power}戰力</span></div>
            <div class="skill-desc">${inst.data.desc.replace(/\n/g,'<br>')}</div></div>`;
    }
    let fieldPicker = '';
    if (inst && !locked && !isAIP) {
        const allowed = this.getPlayableFields(inst, pi);
        if (allowed.length > 1) {
            const buttons = allowed.map(f => {
                const isCur = f === this.currentBfIndex;
                const on = (this.selectedField !== null) ? this.selectedField === f : isCur;
                const label = isCur ? `${BATTLEFIELDS[f]}（當前）` : BATTLEFIELDS[f];
                return `<button class="btn ${on ? 'btn-gold' : ''}" style="padding:6px 14px;font-size:13px;" onclick="game.selectField(${f})">${label}</button>`;
            }).join('');
            fieldPicker = `<div style="margin-top:8px;"><div style="font-size:12px;color:#c8a040;letter-spacing:1px;margin-bottom:5px;">選擇陣地</div><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">${buttons}</div></div>`;
        }
    }
    if (isAIP && !this.cover) {
        return `<div class="control-area"><div class="ctrl-info">${info}</div><div style="margin:6px 0;"><span class="ai-badge">🤖 電腦思考中…</span></div>${skillBox}</div>`;
    }
    return `<div class="control-area">
        <div class="ctrl-info">${info}</div>
        <div class="ctrl-buttons">
            <button class="btn btn-green" ${(!inst || locked || !this.canPlayNormally(inst, pi)) ? 'disabled' : ''} onclick="game.doPlay(false)">出牌</button>
            ${(inst && this.canPlayAmbush(inst, pi)) ? `<button class="btn btn-purple" ${locked ? 'disabled' : ''} onclick="game.doPlay(true)">埋伏出牌</button>` : ''}
            <button class="btn btn-red" ${(locked || p.passed) ? 'disabled' : ''} onclick="game.doPass()">放棄跟牌</button>
            ${hasQuanheng ? `<button class="btn btn-purple" onclick="game.openQuanheng()">權衡</button>` : ''}
            ${hasLianying ? `<button class="btn btn-purple" onclick="game.openLianying()">連營</button>` : ''}
            ${hasJiushi ? `<button class="btn btn-gold" onclick="game.activateJiushi()">酒詩（返回手牌）</button>` : ''}
        </div>${fieldPicker}${skillBox}</div>`;
}
renderQuickChat() {
    if (!this.netMode) return '';
    const me = this.localPlayerIdx;
    const opp = 1 - me;
    const meName = this.players[me] ? this.players[me].name : '我';
    const PRESET = ['你好！', '打得不錯！', 'GG', '等我一下', '太快了吧', '再來一局！'];
    const EMOJI = ['😀','😂','😎','🤔','😱','👍','🎉','🔥','⚔️','🎲'];
    const presetBtns = PRESET.map(t =>
        `<button class="qc-btn" data-qc onclick="sendChat('${t}')">${t}</button>`).join('');
    const emojiBtns = EMOJI.map(e =>
        `<button class="qc-btn qc-emoji" data-qc onclick="sendChat('${e}')">${e}</button>`).join('');
    return `<div class="quick-chat">
        <div class="qc-header"><span>💬 快速聊天</span><span class="qc-cooldown" id="qc-cooldown"></span></div>
        <div class="qc-row">${presetBtns}</div>
        <div class="qc-row">${emojiBtns}</div>
    </div>`;
}
renderHands() {
    const pi = this.netMode ? this.localPlayerIdx : this.current;
    const p = this.players[pi];
    const color = pi === 0 ? '#6fb6ff' : '#ff7b7b';
    const cap = this.cfg.maxFood;
    const opponentIsHuman = !this.isAI(1 - pi);
    const hideHand = !this.netMode && this.isAI(pi) && opponentIsHuman;
    if (this.phase === 'preend') {
        const pep = this.preEndOrder[this.preEndIdx], pp = this.players[pep];
        const hidePep = this.isAI(pep) && !this.isAI(1 - pep);
        const pendingFood = pp.fields[this.currentBfIndex].filter(c => c.faceDown).reduce((s,c) => s + c.data.cost, 0);
        const pendingTxt = pendingFood > 0 ? `　<span class="hand-pending">（背面牌將消耗 ${pendingFood} 糧）</span>` : '';
        return `<div class="hand-wrap"><div class="hand-title" style="color:${pep === 0 ? '#6fb6ff' : '#ff7b7b'}">${pp.name}${this.isAI(pep)?' 🤖':''} 的手牌（${pp.hand.length}）　糧草：${pp.food}/${cap}${pendingTxt}</div>
            <div class="hand-row">${(this.cover || hidePep) ? `<span style="color:#666;font-size:13px;padding:20px;">${hidePep?'🤖 AI 的手牌已隱藏':'手牌已隱藏'}</span>` :
                (pp.hand.map(c => this.cardHTML(c, { extra:'dim clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('') || '<span style="color:#666;">無手牌</span>')}</div></div>`;
    }
    if (this.phase === 'settle')
        return `<div class="hand-wrap"><div class="hand-title">手牌</div><div class="hand-row"><span style="color:#666;font-size:13px;padding:20px;">結算中…</span></div></div>`;
    if (this.cover)
        return `<div class="hand-wrap"><div class="hand-title" style="color:${color}">${p.name}${this.isAI(pi)?' 🤖':''} 的手牌（${p.hand.length}）　糧草：${p.food}/${cap}</div><div class="hand-row">${p.hand.map(c => this.cardHTML(c, { noHighlight: true })).join('') || '<span style="color:#666;">無手牌</span>'}</div></div>`;

        return `<div class="hand-wrap"><div class="hand-title" style="color:${color}">${p.name} 🤖 的手牌（${p.hand.length}）　糧草：${p.food}/${cap}</div><div class="hand-row">${p.hand.map(()=>`<div class="card"><div class="card-back"><div class="card-back-pattern">三國</div></div></div>`).join('')}</div></div>`;

    const pendingTxt = pendingFood > 0 ? `　<span class="hand-pending">（背面牌將消耗 ${pendingFood} 糧）</span>` : '';
    const cards = p.hand.map(c => {
        const playable = this.canPlayNormally(c, pi) || this.canPlayAmbush(c, pi);
        const sel = this.selected === c.uid ? 'sel' : '';
        const dim = (!playable || this.countdown !== null) ? 'dim' : '';
        return this.cardHTML(c, { extra: `${sel} ${dim} clickable`, attr: `onclick="game.selectCard('${c.uid}')"` });
    }).join('');
    const drawnHint = p.hand.some(c => c.justDrawn) ? `<span style="color:#7cff7c;font-size:12px;margin-left:6px;">● 綠框為新抽到的牌</span>` : '';

renderHistory() {

}
renderArchive() {
    const groups = {};
    FACTION_ORDER.forEach(f => groups[f] = []);
    this.archive.forEach(c => { if (groups[c.data.faction]) groups[c.data.faction].push(c); });
    FACTION_ORDER.forEach(f => groups[f].sort((a,b) => (a.data.cost-b.data.cost) || (a.data.power-b.data.power)));
    let h = `<div class="side-panel"><h4 style="display:flex;justify-content:space-between;align-items:center;">
        <span>棄 牌 區 (${this.archive.length})</span>
        <button class="btn" style="padding:2px 8px;font-size:11px;" onclick="game.openDeckViewer()">👁 查看牌庫</button>
    </h4><div class="arch-scroll">`;
    let any = false;
    FACTION_ORDER.forEach(f => {
        if (!groups[f].length) return;
        any = true;
        h += `<div class="arch-fac">${FACTION_INFO[f].name}</div><div class="arch-row">`;
        h += groups[f].map(c => this.cardHTML(c, { size:'sm', extra:'grey clickable', noHighlight: true, attr:`onclick="game.inspect('${c.uid}')"` })).join('');
        h += `</div>`;
    });

}
renderLog() {
    return `<div class="log">${this.logs.map(l => {
        let c = 'l-sys';
        if (l.type === 0) c = 'l-p0';
        if (l.type === 1) c = 'l-p1';
        if (l.type === 'bat') c = 'l-bat';
        if (l.type === 'skill') c = 'l-skill';
        return `<div class="e ${c}">${l.msg}</div>`;
    }).join('')}</div>`;
}
calcInspectPower(c) {
    for (let pi = 0; pi < 2; pi++)
        for (let bi = 0; bi < FIELD_COUNT; bi++)
            if (this.players[pi].fields[bi].includes(c))
                return this.getPower(c, pi, bi, false);
    return Math.max(0, c.data.power + (c.mod || 0));
}
renderInspect() {
    if (!this.inspectCard) return '';
    const c = this.inspectCard, d = c.data, fac = FACTION_INFO[d.faction];
    const actualPower = this.calcInspectPower(c);
    const isZhuge = d.id === 'zhugeliang';
    const base = d.power;
    const bonus = actualPower - base;
    let bonusDisplay = '';
    if (!isZhuge && bonus !== 0) {
        const col = bonus > 0 ? '#7cff7c' : '#ff6b6b';
        bonusDisplay = ` ｜ 現時戰力 <b style="color:${col}">${actualPower} (${bonus > 0 ? '+' : ''}${bonus})</b>`;
    } else if (isZhuge) bonusDisplay = ` ｜ 空城戰力 <b style="color:#ffd700">3×疑兵數</b>`;
    return `<div class="overlay" onclick="game.closeInspect()">
        <div class="modal inspect-modal" onclick="event.stopPropagation()">
            <div class="inspect-layout">
                <div>${this.cardHTML(c, { forceReveal: true, noHighlight: true, power: actualPower })}</div>
                <div class="inspect-body">
                    <h2>${d.name}</h2>
                    ${d.title ? `<div class="inspect-title">${d.title}</div>` : ''}
                    <div class="inspect-stats"><b>${fac.name}</b> ｜ 糧草 <b>${d.cost}</b> ｜ 基礎戰力 <b>${d.power}</b>${bonusDisplay}</div>
                    <div class="inspect-desc">${d.desc.replace(/\n/g,'<br>')}</div>
                </div>
            </div>
            <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="game.closeInspect()">關閉</button></div>
        </div></div>`;
}
renderModals() {

            const color = next === 0 ? '#6fb6ff' : '#ff7b7b';
            h += `<div class="handoff-overlay"><div class="who" style="color:${color}">請將裝置交給 ${this.players[next].name}</div><div class="note">手牌與戰場已隱藏</div><button class="btn btn-big btn-blue" onclick="game.handoff()">轉換玩家</button></div>`;
        }
    }

                const color = nextPi === 0 ? '#6fb6ff' : '#ff7b7b';

            <div style="text-align:center;font-size:13px;color:#a89070;margin-bottom:14px;">順序：${order.length ? order.map(u => cards.find(c => c.uid === u).data.name).join(' → ') : '（未選擇）'}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">

        </div></div>`;
    }
    if (this.quanheng) {
        const pi = this.current, p = this.players[pi];
        h += `<div class="overlay"><div class="modal">
            <h2>孫權 · 權衡</h2>
            <p>選擇最多 2 張手牌棄置，並抽取同等數量（已選 ${this.quanheng.sel.length} 張）</p>
            <div class="modal-cards">${p.hand.map(c => {
                const on = this.quanheng.sel.includes(c.uid);
                return this.cardHTML(c, { extra: (on ? 'sel' : '') + ' clickable', noHighlight: true, attr: `onclick="game.qhToggle('${c.uid}')"` });
            }).join('')}</div>
            <div style="text-align:center;display:flex;gap:10px;justify-content:center;">

        </div></div>`;

        const targets = opp.fields[bi].filter(c => !c.faceDown);
        h += `<div class="overlay"><div class="modal">
            <h2>陸遜 · 連營</h2>

                targets.map(c => {

                <button class="btn btn-red" onclick="game.lyCancel()">取消</button></div>
        </div></div>`;
    }
    if (this.jianxiong && !this.isAI(this.jianxiong.pi)) {
        const g = this.jianxiong.guess;
        h += `<div class="overlay"><div class="modal">
            <h2>曹操 · 奸雄</h2>

/* ============ 回放檢視器 ============ */
function importLogFromFile() {
    let input = document.getElementById('import-log-file');
    if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'import-log-file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        input.onchange = e => handleImportLog(e);
        document.body.appendChild(input);
    }
    input.click();
}
function handleImportLog(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            const logs = Array.isArray(data) ? data : [data];
            const valid = logs.filter(l => l && (l.events || l.config || l.deckTopToBottom));
            if (valid.length === 0) { alert('檔案中沒有有效的對戰記錄'); return; }
            const existing = JSON.parse(localStorage.getItem('sanguo_logs') || '[]');
            valid.forEach(l => existing.push(l));
            localStorage.setItem('sanguo_logs', JSON.stringify(existing));
            alert(`✅ 已匯入 ${valid.length} 份記錄（目前共 ${existing.length} 份）`);
            const el = document.getElementById('local-log-count');
            if (el) el.textContent = `（目前快取 ${existing.length} 份）`;
            const viewer = document.getElementById('modal-slot');
            if (viewer && viewer.querySelector('.log-viewer')) openLogViewer();
        } catch(err) {
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    ev.target.value = '';
}
function openLogViewer() {
    const slot = document.getElementById('modal-slot');
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}

    if (arr.length === 0) {
        slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>回放記錄</h2><p>目前沒有已儲存的對戰記錄。</p><div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div></div></div>`;
        return;
    }
    const modeLabel = m => m === 'aiai' ? '🤖 AI vs AI' : (m === 'pvai' ? '🧑 PVAI' : '👥 PVP');
    const listHtml = arr.map((log, i) => {
        const w = log.winner;
        const wName = w === 0 ? '藍方' : (w === 1 ? '紅方' : '未知');
        return `<div class="log-item" onclick="viewLogDetail(${arr.length - 1 - i})">
            <span class="li-time">${(log.createdAt||'').slice(0,19).replace('T',' ')}</span>
            <span class="li-mode">${modeLabel(log.mode||log.config?.mode)}</span>

            ｜ 事件 ${log.events ? log.events.length : 0}
        </div>`;
    }).join('');
    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal log-viewer" onclick="event.stopPropagation()">
        <h2>回放記錄 (${arr.length})</h2>

            <button class="btn btn-gold" onclick="importLogFromFile()">📂 匯入 JSON</button>
            <button class="btn btn-red" onclick="closeModal()">關閉</button>
        </div>
    </div></div>`;

function viewLogDetail(idx) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}
    const log = arr[idx];
    if (!log) return;
    const slot = document.getElementById('modal-slot');
    const events = log.events || [];
    const fmt = ev => {
        const i = `<span class="ev-i">#${ev.i||0}</span>`;
        const r = `<span class="ev-r">R${ev.round||'?'}</span>`;
        const t = `<span class="ev-t">${ev.type}</span>`;
        let d = '';
        switch (ev.type) {
            case 'flip_result': d = `藍 ${cardName(ev.blueCard)}(${ev.bluePower}) vs 紅 ${cardName(ev.redCard)}(${ev.redPower}) → P${ev.firstPlayer} 先手`; break;
            case 'mulligan_redraw': d = `P${ev.player} 重抽 ${(ev.discarded||[]).map(cardName).join(', ')}`; break;
            case 'mulligan_skip': case 'mulligan_confirm': d = `P${ev.player}`; break;
            case 'round_start': d = `戰場 ${ev.battlefieldName}｜藍手 [${(ev.blueHand||[]).map(cardName).join(', ')}]｜紅手 [${(ev.redHand||[]).map(cardName).join(', ')}]｜糧 ${ev.blueFood}/${ev.redFood}`; break;
            case 'play': d = `P${ev.player} 出 ${cardName(ev.cardId)}${ev.faceDown?'(背)':''} 至 ${BATTLEFIELDS[ev.field]}｜花費 ${ev.foodCost}｜餘糧 ${ev.foodAfter}｜餘手 ${ev.handAfter}` + (ev.handAfterNames ? ` [${ev.handAfterNames.map(cardName).join(', ')}]` : ''); break;
            case 'pass': d = `P${ev.player} 放棄`; break;
            case 'general_pass': d = `P${ev.player} 上將 ${cardName(ev.cardId)} 自動放棄`; break;
            case 'settle': d = `戰場 ${BATTLEFIELDS[ev.battlefield]}｜${ev.f0} vs ${ev.f1} → P${ev.winner} 勝｜比分 ${ev.blueWins}:${ev.redWins}`; break;
            case 'game_over': d = `勝者 P${ev.winner}｜總輪數 ${ev.totalRounds}`; break;
            case 'zhanjiang': d = `P${ev.player} 斬將 ${cardName(ev.targetId)}`; break;
            case 'lianying': d = `P${ev.player} 連營 ${cardName(ev.targetId)}`; break;
            case 'jianxiong': d = `P${ev.player} 猜 ${ev.guess} ${ev.hit?'命中':'未中'}`; break;
            case 'benxi_swap': d = `P${ev.player} 奔襲 ${cardName(ev.movedId)} ${BATTLEFIELDS[ev.from]}→${BATTLEFIELDS[ev.to]}`; break;
            case 'scry': d = `P${ev.player} 觀星 頂部: ${(ev.top3||[]).map(cardName).join(', ')}`; break;
            case 'quanheng': d = `P${ev.player} 權衡 棄 [${(ev.discarded||[]).map(cardName).join(', ')}]`; break;
            case 'quhu': d = `P${ev.player} 荀彧驅虎 ${cardName(ev.targetId)} → ${BATTLEFIELDS[ev.dest]}`; break;
            case 'qice_play': d = `P${ev.player} 荀攸奇策追加 ${cardName(ev.cardId)} 至 ${BATTLEFIELDS[ev.field]}｜餘糧 ${ev.foodAfter}`; break;
            case 'draw': d = `P${ev.player} 抽 ${cardName(ev.cardId)}`; break;
            default: d = JSON.stringify(ev).slice(0, 200);
        }
        return `<div class="ev">${i}${r}${t}<span class="ev-d">${d}</span></div>`;
    };
    const header = `<div style="font-size:12px;color:#a89070;margin-bottom:12px;">
        建立：${(log.createdAt||'').slice(0,19).replace('T',' ')}
        ｜ 模式：${log.mode||log.config?.mode}
        ｜ 種子：<span style="color:#7cff7c;font-family:monospace;letter-spacing:1px;">${log.seed || log.config?.seed || '(無)'}</span>
        ${log.seed ? `
            <button class="btn" style="padding:2px 8px;font-size:11px;margin-left:6px;" onclick="copySeedStr('${log.seed}')">複製</button>
            <button class="btn btn-green" style="padding:2px 8px;font-size:11px;margin-left:4px;" onclick="applySeedAndReturn('${log.seed}')">套用此種子</button>
        ` : ''}
        ｜ 賽果：${log.finalWins ? log.finalWins.join(' : ') : '?'}
        ｜ 牌庫頂(前10)：${(log.deckTopToBottom||[]).slice(0,10).map(cardName).join(', ')}
    </div>`;
    const eventsHtml = events.map(fmt).join('');
    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal log-viewer" onclick="event.stopPropagation()">
        <h2>對戰時間軸</h2>
        ${header}
        <div style="max-height:60vh;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;">${eventsHtml}</div>
        <div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center;">
            <button class="btn btn-gold" onclick="downloadLogByIndex(${idx})">📥 匯出此份</button>
            <button class="btn btn-red" onclick="openLogViewer()">返回</button>
        </div>
    </div></div>`;
}
function downloadLogByIndex(idx) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem('sanguo_logs') || '[]'); } catch(e) {}
    const log = arr[idx];
    if (!log) return;
    const blob = new Blob([JSON.stringify(log, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = (log.createdAt||'').slice(0,19).replace(/[:.]/g,'-');
    a.href = url; a.download = `sanguo-replay-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openViewer() {
    const slot = document.getElementById('modal-slot');
    const facShu = document.getElementById('fac-shu').checked;
    const facWei = document.getElementById('fac-wei').checked;
    const facWu  = document.getElementById('fac-wu').checked;
    const facQun = document.getElementById('fac-qun').checked;
    const setVan = document.getElementById('set-vanilla').checked;
    const setExt = document.getElementById('set-extended').checked;

    const pool = [];
    CARD_DB.forEach(d => {
        if (d.faction === 'shu' && !facShu) return;
        if (d.faction === 'wei' && !facWei) return;
        if (d.faction === 'wu'  && !facWu ) return;
        if (d.faction === 'qun' && !facQun) return;
        if (d.set === 'vanilla' && !setVan) return;
        if (d.set === 'extended' && !setExt) return;
        const n = d.count || 1;
        for (let i = 0; i < n; i++) pool.push({ def: d, idx: i, total: n });
    });

    if (viewerMode === 'id') {
        pool.sort((a, b) => {
            const ai = a.def.cardId || '';
            const bi = b.def.cardId || '';
            if (ai !== bi) return ai.localeCompare(bi);
            return a.idx - b.idx;
        });
    } else {
        pool.sort((a, b) => {
            const ac = a.def.cost - b.def.cost;
            if (ac !== 0) return ac;
            const ap = a.def.power - b.def.power;
            if (ap !== 0) return ap;
            return a.idx - b.idx;
        });
    }

    const byFac = { shu: [], wei: [], wu: [], qun: [] };
    pool.forEach(item => byFac[item.def.faction]?.push(item));

    let content = '';
    FACTION_ORDER.forEach(f => {
        if (!byFac[f] || !byFac[f].length) return;
        content += `<div class="viewer-section"><h3>${FACTION_INFO[f].name}（${byFac[f].length} 張）</h3><div class="viewer-grid">`;
        content += byFac[f].map(item => {
            const d = item.def;
            const badge = item.total > 1 ? `<div class="viewer-badge">${item.idx + 1}/${item.total}</div>` : '';
            return `<div class="viewer-card-wrap" onclick="inspectDefFromViewer('${d.id}')">${cardHTMLStatic(d)}${badge}</div>`;
        }).join('');
        content += `</div></div>`;
    });

    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal viewer-modal" onclick="event.stopPropagation()">
        <h2>所有卡牌（合計 ${pool.length} 張）</h2>
        <div class="viewer-toolbar">
            <button class="${viewerMode === 'id' ? 'on' : ''}" onclick="setViewerMode('id')">依編號順序</button>
            <button class="${viewerMode === 'sort' ? 'on' : ''}" onclick="setViewerMode('sort')">依糧草 + 戰力</button>
        </div>
        <div>${content}</div>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div>
    </div></div>`;
}
function setViewerMode(m) { viewerMode = m; openViewer(); }

function cardHTMLStatic(d) {
    const fac = FACTION_INFO[d.faction];
    const powerMain = d.id === 'zhugeliang' ? '3X' : d.power;
    const generalTag = d.isGeneral ? '<span class="c-gen">上將</span>' : '';
    const skillNames = (d.skills || []).map(s => `<div>${s}</div>`).join('');
    return `<div class="card"><div class="card-front ${fac.cls}">
        <span class="c-cost">${d.cost}</span>
        <span class="c-fac">${fac.name}</span>
        <span class="c-skills">${skillNames}</span>
        <span class="c-name">${d.name}</span>
        ${d.title ? `<span class="c-title">${d.title}</span>` : ''}
        <span class="c-art">${d.emoji}</span>
        <span class="c-power">${powerMain}</span>
        ${generalTag}
    </div></div>`;
}

            <div class="inspect-body">
                <h2>${def.name}</h2>
                ${def.title ? `<div class="inspect-title">${def.title}</div>` : ''}
                <div class="inspect-stats"><b>${FACTION_INFO[def.faction].name}</b> ｜ 糧草 <b>${def.cost}</b> ｜ 基礎戰力 <b>${def.power}</b>${def.count ? ` ｜ 共 <b>${def.count}</b> 張` : ''}</div>
                <div class="inspect-desc">${def.desc.replace(/\n/g,'<br>')}</div>
            </div>
        </div>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeViewerInspect()">關閉</button></div>
    </div>`;
    div.addEventListener('click', e => { if (e.target === div) closeViewerInspect(); });
    slot.appendChild(div);
}
function closeViewerInspect() { const el = document.querySelector('.viewer-inspect-overlay'); if (el) el.remove(); }

function openDefs() {
    const slot = document.getElementById('modal-slot');
    slot.innerHTML = `<div class="overlay" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
        <h2>關鍵詞定義</h2>
        <ul class="def-list">${DEFINITIONS.map(d => `<li><strong>${d.term}</strong>：${d.def}</li>`).join('')}</ul>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-red" onclick="closeModal()">關閉</button></div>
    </div></div>`;
}
function closeModal(ev) {
    if (ev && ev.target && ev.target.className === 'modal') return;
    const slot = document.getElementById('modal-slot');
    if (slot) slot.innerHTML = '';
}
function startGame(mode) {
    const num = (id, dft) => { const v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? dft : v; };
    const seedInput = document.getElementById('cfg-seed');
    const seed = seedInput ? seedInput.value.trim() : '';
    const cfg = {
        mode: mode || 'pvp',
        seed: seed,
        vanillaCards: document.getElementById('set-vanilla').checked,
        extendedCards: document.getElementById('set-extended').checked,
        factions: {
            shu: document.getElementById('fac-shu').checked,
            wei: document.getElementById('fac-wei').checked,
            wu : document.getElementById('fac-wu').checked,
            qun: document.getElementById('fac-qun').checked
        },
        initialFood : num('cfg-initialFood', 7),
        winBonus    : num('cfg-winBonus', 1),
        baseRefill  : num('cfg-baseRefill', 6),
        initialCards: num('cfg-initialCards', 4),
        maxFood     : num('cfg-maxFood', 12),
        ai1Diff     : document.getElementById('cfg-ai1Diff').value,
        ai2Diff     : document.getElementById('cfg-ai2Diff').value,
        autoExport  : document.getElementById('cfg-autoExport').checked,
        autoRestart : document.getElementById('cfg-autoRestart').checked,
        autoRestartDelay: 2000
    };
    if (!cfg.vanillaCards && !cfg.extendedCards) { alert('至少勾選一個卡牌版本'); return; }
    if (!cfg.factions.shu && !cfg.factions.wei && !cfg.factions.wu && !cfg.factions.qun) { alert('至少勾選一個陣營'); return; }
    window.game = new Game(cfg);
}

/* ==================================================================== */
/* ============ Phase 2: Network wrappers (action forwarding) ========= */
/* ==================================================================== */
const NET_ACTION_METHODS = [
    'selectCard','selectField','doPlay','doPass','preEndAct','handoff','nextRound',
    'revealFlip','beginBattle',
    'mulliganRedraw','mulliganSkip','mulliganConfirm',
    'scryToggle','scryConfirm','scrySkip',
    'qhToggle','qhConfirm','qhCancel',
    'lySelect','lyConfirm','lyCancel',
    'jxGuess','jxConfirm','jxSkip',
    'guanyuSelect','guanyuConfirm','guanyuSkip',
    'xunyuSelect','xunyuSelectDest','xunyuConfirm','xunyuSkip',
    'xunyouSelect','xunyouConfirm','xunyouSkip',
    'activateJiushi',
    'voteRematch'
];
NET_ACTION_METHODS.forEach(name => {
    const orig = Game.prototype[name];
    if (typeof orig !== 'function') return;
    Game.prototype[name] = function (...args) {
        if (this.netMode && this.role === 'guest' && !this._applyingRemote) {
            if (this._sendAction) this._sendAction({ action: name, args });
            return;
        }
        return orig.apply(this, args);
    };
});

/* ============ Auto-advance turn in net mode ============ */
const _origStartCountdown = Game.prototype.startCountdown;
Game.prototype.startCountdown = function (onDone) {
    if (this.netMode) {
        const wrapped = () => {
            try { onDone(); } catch (e) { console.error(e); }
            if (this.phase === 'turn' && this.state === 'battle') {
                this.advanceTurn();
            }
        };
        _origStartCountdown.call(this, wrapped);
        return;
    }
    return _origStartCountdown.apply(this, arguments);
};

/* ============ Render override: broadcast (host) + wait screen (guest) ============ */
const _origRender = Game.prototype.render;
Game.prototype.render = function () {
    // In net mode, "cover" (device handoff) is never needed.
    if (this.netMode) this.cover = false;
    if (this.netMode && this.role === 'guest' && !this._hasReceivedState && this.state !== 'gameover') {
        document.getElementById('app').innerHTML = `
            <div class="setup" style="text-align:center;max-width:600px;">
                <h1>三 國 風 雲</h1>
                <div class="sub">線上對戰 — 連線中</div>
                <div style="padding:30px 20px;font-size:16px;line-height:2;color:#e0c080;">
                    正在等待房主開始遊戲…<br>
                    <span style="color:#7cff7c;">● 已連線</span>
                </div>
                <button class="btn btn-red" onclick="cancelNet()">取消</button>
            </div>`;
        return;
    }
    const r = _origRender.apply(this, arguments);
    if (this.netMode && this.role === 'host' && this._broadcast) {
        if (this._broadcastTimer) clearTimeout(this._broadcastTimer);
        this._broadcastTimer = setTimeout(() => {
            this._broadcastTimer = null;
            try { this._broadcast(this.serializeForPlayer(1)); } catch (e) { console.error(e); }
        }, 40);
    }
    return r;
};

/* ==================================================================== */
/* ============ Phase 2: PeerJS networking module ===================== */
/* ==================================================================== */
let peer = null;
let conn = null;

function makeRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
}

function confirmMyName() {
    const input = document.getElementById('cfg-myName');
    const name = (input.value || '').trim();
    if (!name) { alert('請先輸入名稱'); input.focus(); return; }
    window.__myName = name;
    try { localStorage.setItem('sanguo_myname', name); } catch (e) {}
    const status = document.getElementById('cfg-myName-status');
    if (status) status.innerHTML = `<span style="color:#7cff7c;">✅ 已設定名稱為「${name}」</span>`;
}

function copyRoomCode(code) {
    const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); alert('✅ 已複製房間代碼：' + code); }
        catch (e) { alert('複製失敗，請手動複製：' + code); }
        document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => alert('✅ 已複製房間代碼：' + code)).catch(fallback);
    } else fallback();
}

function readCfgFromSetup() {
    const num = (id, dft) => { const v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? dft : v; };
    const seed = (document.getElementById('cfg-seed').value || '').trim();
    const cfg = {
        mode: 'pvp', seed,
        vanillaCards: document.getElementById('set-vanilla').checked,
        extendedCards: document.getElementById('set-extended').checked,
        factions: {
            shu: document.getElementById('fac-shu').checked,
            wei: document.getElementById('fac-wei').checked,
            wu : document.getElementById('fac-wu').checked,
            qun: document.getElementById('fac-qun').checked
        },
        initialFood : num('cfg-initialFood', 7),
        winBonus    : num('cfg-winBonus', 1),
        baseRefill  : num('cfg-baseRefill', 6),
        initialCards: num('cfg-initialCards', 4),
        maxFood     : num('cfg-maxFood', 12),
        ai1Diff: 'hard', ai2Diff: 'hard',
        autoExport: false, autoRestart: false
    };
    if (!cfg.vanillaCards && !cfg.extendedCards) { alert('至少勾選一個卡牌版本'); return null; }
    if (!cfg.factions.shu && !cfg.factions.wei && !cfg.factions.wu && !cfg.factions.qun) { alert('至少勾選一個陣營'); return null; }
    return cfg;
}

function showNetStatus(html) {
    document.getElementById('app').innerHTML = `
        <div class="setup" style="text-align:center;max-width:640px;">
            <h1>三 國 風 雲</h1>
            <div class="sub">線上對戰</div>
            <div style="padding:30px 20px;font-size:15px;line-height:2;color:#e0c080;">${html}</div>
            <button class="btn btn-red" onclick="cancelNet()">取消</button>
        </div>`;
}

function cancelNet() {
    window.__netState = null;
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    window.game = null;
    showSetup();
}

function rejoinRoom() {
    let info = null;
    try { info = JSON.parse(sessionStorage.getItem('sanguo_rejoin') || 'null'); } catch (e) {}
    if (!info || !info.roomCode) { alert('沒有可重新加入的對戰'); return; }
    const code = info.roomCode;
    window.__netState = { roomCode: code, role: 'guest' };
    showNetStatus(`正在重新連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);
    peer = new Peer({ debug: 1 });
    peer.on('open', () => { connectToHost(code); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', (err) => {
        console.error(err);
        alert('重新連線失敗：' + err.message + '\n\n（房主可能已經離開，或房間已關閉）');
        cancelNet();
    });
}

function clearRejoinInfo() {
    try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
    showSetup();
}

function createOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const cfg = readCfgFromSetup();
    if (!cfg) return;
    cfg.playerNames = [window.__myName, '對手'];
    const code = makeRoomCode();
    const peerId = 'sanguo-flash-' + code;
    window.__netState = { roomCode: code, role: 'host' };

    showNetStatus(`正在建立房間…`);
    peer = new Peer(peerId, { debug: 1 });

    peer.on('open', () => {
        showNetStatus(`
            房間已建立！<br>
            <div style="font-size:34px;letter-spacing:8px;color:#ffd700;font-family:monospace;margin:14px 0;">${code}</div>
            <button class="btn btn-gold" onclick="copyRoomCode('${code}')" style="margin-bottom:10px;">📋 複製房間代碼</button><br>
            <span style="color:#a89070;">請將此代碼分享給對手</span><br>
            <span style="color:#7cff7c;">● 等待對手加入…</span>
        `);
    });
    peer.on('error', (err) => {
        console.error(err);
        alert('建立房間失敗：' + err.message + '\n（房間代碼可能已被使用，請重試）');
        cancelNet();
    });
    peer.on('connection', (c) => {
        if (conn && conn.open) { try { c.close(); } catch (e) {} }
        conn = c;
        attachHostHandlers(c, cfg);
    });
    peer.on('disconnected', () => {
        console.log('[net] peerjs server disconnected, reconnecting...');
        try { peer.reconnect(); } catch (e) {}
    });
}

function attachHostHandlers(c, cfg) {
    c.on('open', () => {
        c.send({ type: 'START' });
        if (!window.game) {
            // First connection — boot up the game
            setTimeout(() => {
                const names = cfg.playerNames || ['藍方', '紅方'];
                const hostCfg = Object.assign({}, cfg, {
                    netMode: true, role: 'host', localPlayerIdx: 0, mode: 'pvp',
                    playerNames: names
                });
                hostCfg._broadcast = (state) => {
                    if (conn && conn.open) {
                        try { conn.send({ type: 'STATE', state }); } catch (e) { console.error(e); }
                    }
                };
                window.game = new Game(hostCfg);
            }, 300);
        } else {
            // Reconnection — push current state to the guest
            try {
                if (window.game._broadcast) {
                    window.game._broadcast(window.game.serializeForPlayer(1));
                }
                window.game.addLog('sys', '✅ 對手已重新連線');
                window.game.render();
            } catch (e) { console.error(e); }
        }
    });
    c.on('data', handleGuestToHost);
    c.on('close', () => {
        conn = null;
        console.log('[net] guest disconnected — waiting for reconnect');
        if (window.game && window.game.netMode) {
            window.game.addLog('sys', '⚠️ 對手連線中斷，等待重新連線…');
            window.game.render();
        }
    });
    c.on('error', (err) => console.error('Conn error:', err));
}

function joinOnlineRoom() {
    if (!window.__myName) { alert('請先在「玩家名稱」欄位輸入並點擊「✅ 確認名稱」'); return; }
    const raw = prompt('請輸入房間代碼：');
    if (!raw) return;
    const code = raw.trim().toUpperCase();
    if (!code) return;
    window.__netState = { roomCode: code, role: 'guest' };
    showNetStatus(`正在連線至房間 <b style="color:#ffd700;font-family:monospace;letter-spacing:3px;">${code}</b> …`);
    peer = new Peer({ debug: 1 });
    peer.on('open', () => { connectToHost(code); });
    peer.on('disconnected', () => {
        console.log('[net] peerjs server disconnected, reconnecting...');
        try { peer.reconnect(); } catch (e) {}
    });
    peer.on('error', (err) => {
        console.error(err);
        alert('連線失敗：' + err.message + '\n（找不到房間？請確認代碼）');
        cancelNet();
    });
}

function connectToHost(code) {
    if (!peer || peer.destroyed) return;
    conn = peer.connect('sanguo-flash-' + code, { reliable: true });
    conn.on('open', () => {
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            showNetStatus(`已連線！<br><span style="color:#7cff7c;">● 正在等待房主開始遊戲…</span>`);
        } else {
            try {
                window.game.addLog('sys', '✅ 已重新連線');
                window.game.render();
            } catch (e) {}
        }
        conn.send({ type: 'HELLO', name: window.__myName || null });
    });
    conn.on('data', handleHostToGuest);
    conn.on('close', () => {
        conn = null;
        console.log('[net] connection lost, retrying in 2s...');
        if (window.game && window.game.netMode) {
            try {
                window.game.addLog('sys', '⚠️ 連線中斷，嘗試重新連線…');
                window.game.render();
            } catch (e) {}
        }
        setTimeout(() => {
            if (!conn && peer && !peer.destroyed && window.__netState && window.__netState.role === 'guest') {
                connectToHost(window.__netState.roomCode);
            }
        }, 2000);
    });
    conn.on('error', (err) => console.error('Conn error:', err));
}

function handleGuestToHost(data) {
    if (!window.game || !window.game.netMode || window.game.role !== 'host') return;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'HELLO') {
        // Guest just (re)connected — update their name if supplied
        if (data.name && window.game && window.game.players[1]) {
            window.game.players[1].name = String(data.name).slice(0, 12);
        }
        // Force sync
        try {
            if (window.game._broadcast) window.game._broadcast(window.game.serializeForPlayer(1));
        } catch (e) { console.error(e); }
        return;
    }
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'ACTION') {
        const g = window.game;
        g._applyingRemote = true;
        g._remotePlayerIdx = 1 - g.localPlayerIdx;   // 1v1: the other side
        try {
            const fn = g[data.action];
            if (typeof fn === 'function') fn.apply(g, data.args || []);
            else console.warn('Unknown action:', data.action);
        } catch (e) { console.error('Action error:', e); }
        finally { g._applyingRemote = false; g._remotePlayerIdx = undefined; }
    }
}

function handleHostToGuest(data) {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'START') return;
    if (data.type === 'CHAT') {
        if (window.game && window.game.netMode) {
            const from = 1 - window.game.localPlayerIdx;
            showChatBubble(from, data.text);
        }
        return;
    }
    if (data.type === 'STATE') {
        if (data.state && data.state.state === 'gameover') {
            // Game finished — clear rejoin shortcut
            try { sessionStorage.removeItem('sanguo_rejoin'); } catch (e) {}
        }
        if (!window.game || !window.game.netMode || window.game.role !== 'guest') {
            const shell = {
                mode: 'pvp', netMode: true, role: 'guest', localPlayerIdx: 1,
                vanillaCards: true, extendedCards: true,
                factions: { shu:true, wei:true, wu:true, qun:true },
                initialFood: 7, winBonus: 1, baseRefill: 6, initialCards: 4, maxFood: 12,
                seed: data.state.seed || '',
                ai1Diff: 'hard', ai2Diff: 'hard',
                autoExport: false, autoRestart: false
            };
            shell._sendAction = (action) => {
                if (conn && conn.open) {
                    try { conn.send({ type: 'ACTION', ...action }); } catch (e) { console.error(e); }
                }
            };
            window.game = new Game(shell);
        }
        window.game.applyState(data.state);
    }
}
/* ==================================================================== */
/* ============ Quick Chat module ===================================== */
/* ==================================================================== */
let chatCooldownUntil = 0;
let chatCooldownTimer = null;

function sendChat(text) {
    if (!window.game || !window.game.netMode) return;
    if (Date.now() < chatCooldownUntil) return;
    if (!conn || !conn.open) return;
    const me = window.game.localPlayerIdx;
    try { conn.send({ type: 'CHAT', text }); } catch (e) { console.error(e); }
    showChatBubble(me, text);
    chatCooldownUntil = Date.now() + 5000;
    updateChatCooldownUI();
}

function showChatBubble(pi, text) {
    const el = document.createElement('div');
    el.className = 'chat-bubble ' + (pi === 0 ? 'chat-bubble-blue' : 'chat-bubble-red');
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => { try { el.remove(); } catch (e) {} }, 4200);
}

function updateChatCooldownUI() {
    const btns = document.querySelectorAll('[data-qc]');
    const rem = Math.max(0, Math.ceil((chatCooldownUntil - Date.now()) / 1000));
    const indicator = document.getElementById('qc-cooldown');
    if (rem > 0) {
        btns.forEach(b => { b.disabled = true; });
        if (indicator) indicator.textContent = `⏳ ${rem}s`;
        if (chatCooldownTimer) clearTimeout(chatCooldownTimer);
        chatCooldownTimer = setTimeout(updateChatCooldownUI, 250);
    } else {
        btns.forEach(b => { b.disabled = false; });
        if (indicator) indicator.textContent = '';
        chatCooldownTimer = null;
    }
}

/* Reset cooldown on rematch */
const _origDoRematch = Game.prototype._doRematch;
Game.prototype._doRematch = function () {
    chatCooldownUntil = 0;
    if (chatCooldownTimer) { clearTimeout(chatCooldownTimer); chatCooldownTimer = null; }
    return _origDoRematch.apply(this, arguments);
};

/* Refresh cooldown UI after every render */
const _origRenderForChat = Game.prototype.render;
Game.prototype.render = function () {
    const r = _origRenderForChat.apply(this, arguments);
    setTimeout(() => { try { updateChatCooldownUI(); } catch (e) {} }, 0);
    return r;
};

showSetup();
</script>
